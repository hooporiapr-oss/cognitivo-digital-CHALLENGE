<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El tablero — Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ── El look nuevo: crema, navy y naranja ─────────────────────────
   El mismo del resto del sitio. */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(760px,calc(100% - 40px));margin:0 auto}
.hide{display:none !important}

header{flex:0 0 auto;background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
@media(max-width:380px){ .mark{font-size:.92rem} }
.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.langb:hover{border-color:var(--orange);color:var(--orange)}

main{flex:1 1 auto}
main .wrap{padding:38px 0 46px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 10px}
h2{font-size:1.1rem;letter-spacing:-.02em;margin:34px 0 12px;
  font-weight:800;color:var(--muted);text-transform:uppercase;font-size:.78rem;letter-spacing:.12em}
.lede{color:var(--muted);margin:0 0 26px;max-width:56ch}
.help{color:var(--muted);font-size:.88rem}

/* ── El estado, arriba y de un vistazo ────────────────────────────
   Lo primero que mira quien abre esto es si el juego ya pasó. */
.estado{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;
  background:#fff;border:1px solid var(--linea);border-radius:999px;
  padding:7px 14px;font-size:.74rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);box-shadow:0 8px 25px #17243806}
.punto{width:8px;height:8px;border-radius:999px;background:var(--muted);flex:0 0 auto}
.estado.vivo{color:var(--good);border-color:rgba(11,122,90,.4)}
.estado.vivo .punto{background:var(--good);animation:latir 1.6s ease-in-out infinite}
.estado.listo{color:var(--navy)}
.estado.listo .punto{background:var(--navy)}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.estado.vivo .punto{animation:none}}

/* ── El contador ──────────────────────────────────────────────── */
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 8px}
.tal{background:#fff;border:1px solid var(--linea);border-radius:13px;
  padding:14px 12px;text-align:center;box-shadow:0 8px 25px #17243806}
.tal b{display:block;font-size:1.6rem;font-weight:900;letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.tal span{display:block;color:var(--muted);font-size:.68rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
@media(max-width:420px){ .tal b{font-size:1.35rem} .tal span{font-size:.62rem} }

/* Lo que el tablero NO dice, dicho antes de que lo busque. */
.nota{margin:12px 0 0;color:var(--muted);font-size:.84rem;max-width:58ch}

/* ── El juego que viene ───────────────────────────────────────── */
.juego{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--orange);
  border-radius:16px;padding:20px 22px;margin:0 0 14px;box-shadow:0 8px 25px #17243808}
.juego .vs{font-size:1.3rem;font-weight:900;letter-spacing:-.03em;margin:0 0 4px}
.juego .cuando{color:var(--muted);font-size:.92rem;margin:0}
.juego .cuenta{margin:12px 0 0;font-size:.88rem;font-weight:700;color:var(--orange)}
.juego .acc{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.juego .acc .btn{margin-top:0;width:auto;padding:11px 16px;font-size:.9rem}

/* ── Los resultados ──────────────────────────────────────────── */
.rlist{background:#fff;border:1px solid var(--linea);border-radius:16px;
  overflow:hidden;box-shadow:0 8px 25px #17243808}
.r{display:flex;align-items:center;gap:12px;padding:15px 18px;border-top:1px solid var(--linea)}
.r:first-child{border-top:none}
.r .nm{flex:1 1 auto;min-width:0;font-weight:700}
.r .nm small{display:block;color:var(--muted);font-weight:500;font-size:.82rem;margin-top:2px}
.r .sc{flex:0 0 auto;font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.r .sc.gano{color:var(--good)}
.r .sc.perdio{color:var(--muted)}
.r .go{flex:0 0 auto;border:1px solid var(--linea);background:var(--cream);color:var(--muted);
  border-radius:8px;padding:8px 11px;font:inherit;font-size:.78rem;font-weight:700;
  text-decoration:none;white-space:nowrap}
.r .go:hover{border-color:var(--navy);color:var(--navy)}
@media(max-width:480px){
  .r{flex-wrap:wrap}
  .r .nm{flex:1 1 100%}
  .r .go{margin-left:auto}
}

/* ── Botones ──────────────────────────────────────────────────── */
.btn{display:inline-block;border:0;border-radius:9px;padding:14px 22px;
  background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;text-decoration:none;text-align:center}
.btn.go{background:var(--orange);color:#111a24}
.btn.line{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn.line:hover{background:var(--navy);color:#fff}
.btn:hover{opacity:.92}
.vuelta{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 0}
.vuelta .btn{flex:1 1 180px}

.vacio{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:26px 22px;text-align:center;color:var(--muted);box-shadow:0 8px 25px #17243806}
.vacio b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}

footer{flex:0 0 auto;background:#0a1420;color:#aeb9c6;
  padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
footer .f-dot{padding:0 8px;opacity:.45}
.f-what{margin:12px 0 0;font-size:.74rem;line-height:1.5;opacity:.72;max-width:56ch;
  margin-left:auto;margin-right:auto}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="index.html">cada&nbsp;<em>punto</em>&nbsp;<i>cuenta</i></a>
    <button class="langb" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</header>

<main>
  <div class="wrap" id="app"><p class="lede">…</p></div>
</main>

<footer>
  <div class="wrap">
    <a href="ayuda.html" id="fAyuda">Ayuda</a><span class="f-dot">·</span><a href="index.html">Cada Punto</a><span class="f-dot">·</span><a href="terms.html" id="fTerms">Términos</a><span class="f-dot">·</span><a href="custodia.html" id="fDinero">Dinero</a>
    <p class="f-what" id="fWhat"></p>
  </div>
</footer>

<script>
var SB='https://sdaphocueugzfvjovuxd.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

function rpc(name,args){
  return fetch(SB+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  }).then(function(r){ if(!r.ok) throw new Error('rpc '+r.status); return r.json() });
}

var S = {
  es:{
    h1:'El tablero',
    lede:'Cómo va la campaña del equipo: quién está en la plantilla, cuántas promesas hay, y el juego.',

    stNada:'Sin juego puesto',
    stPorJugar:'Por jugar',
    stVivo:'Jugando ahora',
    stJugado:'Ya se jugó',

    tPlantilla:'en la plantilla',
    tPromesas:'promesas',
    tPuntos:'puntos del equipo',

    /* El tablero cuenta promesas, no dinero. El dinero está en el
       reporte, que pide el código, y de todas formas es lo prometido
       — nunca lo cobrado, que no pasa por aquí. */
    notaNoDinero:'El tablero cuenta promesas, no dinero. Los totales en dólares están en el reporte del evento, al final. Lo prometido no es lo recaudado: el dinero lo recibe el programa directo.',

    jH:'El juego',
    vs:'contra {O}',
    enCasa:'en casa',
    fuera:'fuera',
    sinFecha:'sin fecha todavía',
    nPromesas:'1 promesa hecha',
    nPromesasN:'{N} promesas hechas',
    sinPromesas:'Todavía no hay promesas en este juego.',
    verMarcador:'Ver el marcador',
    compartir:'Copiar el enlace',
    copiado:'Copiado',

    rH:'Resultados',
    final:'final · {P} del equipo',
    verReporte:'El reporte',

    plantillaH:'La plantilla',
    nadie:'Todavía no hay nadie en la plantilla.',
    nadieP:'Escribe los nombres en la plantilla y el equipo queda listo para recibir promesas.',
    aPlantilla:'Abrir la plantilla',

    sinJuego:'Todavía no hay juego puesto.',
    sinJuegoP:'Un juego con fecha es lo que hace que una promesa tenga sentido: el padrino promete por punto de ese juego.',

    noCamp:'No encuentro esa campaña.',
    noCampP:'Entra por mi equipo y abre el tablero desde ahí.',
    err:'No se pudo cargar el tablero.',
    recargar:'Volver a cargar',
    aMiEquipo:'← Mi equipo',
    auto:'Se actualiza solo mientras el juego está en marcha.',
    fWhat:'Cada Punto es un sistema de manejo de promesas de Gostar Digital LLC, una empresa con fines de lucro. El programa recibe su dinero directo; nosotros cobramos por el uso de la herramienta.',
    fAyuda:'Ayuda', fTerms:'Términos', fDinero:'Dinero'
  },
  en:{
    h1:'The board',
    lede:"How the team's campaign is going: who is on the roster, how many pledges there are, and the game.",

    stNada:'No game set',
    stPorJugar:'Still to play',
    stVivo:'Playing now',
    stJugado:'Played',

    tPlantilla:'on the roster',
    tPromesas:'pledges',
    tPuntos:'team points',

    notaNoDinero:'The board counts pledges, not money. Dollar totals are in the event report, at the end. Pledged is not collected: the program receives its money directly.',

    jH:'The game',
    vs:'against {O}',
    enCasa:'at home',
    fuera:'away',
    sinFecha:'no date yet',
    nPromesas:'1 pledge made',
    nPromesasN:'{N} pledges made',
    sinPromesas:'No pledges on this game yet.',
    verMarcador:'See the scoreboard',
    compartir:'Copy the link',
    copiado:'Copied',

    rH:'Results',
    final:'final · {P} by the team',
    verReporte:'The report',

    plantillaH:'The roster',
    nadie:'Nobody on the roster yet.',
    nadieP:'Write the names on the roster and the team is ready to take pledges.',
    aPlantilla:'Open the roster',

    sinJuego:'No game set yet.',
    sinJuegoP:'A game with a date is what makes a pledge mean something: the padrino pledges per point of that game.',

    noCamp:"I can't find that campaign.",
    noCampP:'Go in through my team and open the board from there.',
    err:'The board could not load.',
    recargar:'Load it again',
    aMiEquipo:'← My team',
    auto:'Refreshes on its own while the game is under way.',
    fWhat:'Cada Punto is a pledge management system from Gostar Digital LLC, a for-profit company. The program receives its money directly; we charge for use of the tool.',
    fAyuda:'Help', fTerms:'Terms', fDinero:'Money'
  }
};

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
            localStorage.getItem('fc-lang') ||
            ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function T(k,v){
  var s = (S[LANG] && S[LANG][k]) || S.es[k] || '';
  if (v) Object.keys(v).forEach(function(x){ s = s.split('{'+x+'}').join(v[x]); });
  return s;
}
function toggleLang(){
  LANG = LANG==='es' ? 'en':'es';
  try{ localStorage.setItem('cfh_lang', LANG);
       localStorage.setItem('cp-lang', LANG);
       localStorage.setItem('fc-lang', LANG); }catch(e){}
  pintar();
}

var PARAMS = new URLSearchParams(location.search);
/* mi-equipo.html manda ?camp=<campaña>. Se acepta ?c= también porque
   es lo que escribe quien copia el enlace del marcador a mano. */
var CAMP = PARAMS.get('camp') || PARAMS.get('c');

var BOARD = null;      // lo último que contestó game_board
var ROSTER = [];
var ERR = null;
var timer = null;
var app = document.getElementById('app');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]});
}

/* plays_on viene como fecha sola (YYYY-MM-DD). Pasarla por new Date()
   la lee como medianoche UTC, y en Puerto Rico eso enseña el día
   anterior. Se arma a mano. */
function cuando(s){
  if (!s) return '';
  try{
    var d;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (m) d = new Date(+m[1], +m[2]-1, +m[3]);
    else   d = new Date(s);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(LANG==='es' ? 'es-PR':'en-US',
      { weekday:'long', day:'numeric', month:'long' });
  }catch(e){ return '' }
}

function juegos(){ return (BOARD && BOARD.games) || []; }
function jugados(){ return juegos().filter(function(g){ return g.status==='played' }); }
function porJugar(){
  return juegos().filter(function(g){
    return g.status !== 'played' && g.status !== 'cancelled';
  });
}
/* El que toca: el primero sin jugar, por fecha. Si no queda ninguno,
   no hay juego que enseñar arriba. */
function elJuego(){
  var p = porJugar().slice().sort(function(a,b){
    return String(a.plays_on||'9999').localeCompare(String(b.plays_on||'9999'));
  });
  return p[0] || null;
}
function enMarcha(){
  return porJugar().some(function(g){ return !!g.started });
}

function estado(){
  if (enMarcha()) return { k:'stVivo',    c:'vivo'  };
  if (elJuego())  return { k:'stPorJugar',c:''      };
  if (jugados().length) return { k:'stJugado', c:'listo' };
  return { k:'stNada', c:'' };
}

function pintarPie(){
  document.getElementById('langBtn').textContent = LANG==='es' ? 'EN':'ES';
  var f = document.getElementById('fWhat');  if (f) f.textContent = T('fWhat');
  var a = document.getElementById('fAyuda'); if (a) a.textContent = T('fAyuda');
  var t = document.getElementById('fTerms'); if (t) t.textContent = T('fTerms');
  var d = document.getElementById('fDinero');if (d) d.textContent = T('fDinero');
}

function tarjetaJuego(g){
  var donde = g.home ? T('enCasa') : T('fuera');
  var fecha = cuando(g.plays_on) || T('sinFecha');
  var n = g.pledges || 0;
  return '<div class="juego">' +
    '<p class="vs">' + esc(T('vs', { O: g.opponent || '—' })) + '</p>' +
    '<p class="cuando">' + esc(fecha) + ' · ' + esc(donde) + '</p>' +
    '<p class="cuenta">' +
      esc(n ? T(n===1 ? 'nPromesas':'nPromesasN', { N:n }) : T('sinPromesas')) +
    '</p>' +
    '<div class="acc">' +
      '<a class="btn go" href="scoreboard.html?c=' + encodeURIComponent(CAMP) + '">' +
        esc(T('verMarcador')) + '</a>' +
      '<button class="btn line" onclick="copiar(this)">' + esc(T('compartir')) + '</button>' +
    '</div>' +
  '</div>';
}

function copiar(b){
  var url = location.origin + '/scoreboard.html?c=' + encodeURIComponent(CAMP);
  var ok = function(){ b.textContent = T('copiado'); };
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(ok, function(){ fallback() });
    } else fallback();
  }catch(e){ fallback() }
  function fallback(){
    try{
      var i = document.createElement('input');
      i.value = url; document.body.appendChild(i);
      i.select(); document.execCommand('copy');
      document.body.removeChild(i); ok();
    }catch(e2){ b.textContent = url }
  }
}

function filaResultado(g){
  var p = g.team_points == null ? 0 : g.team_points;
  var o = g.opp_points  == null ? null : g.opp_points;
  var marca = (o == null) ? String(p) : (p + '–' + o);
  var cl = (o == null) ? '' : (p > o ? ' gano' : p < o ? ' perdio' : '');
  var sub = cuando(g.plays_on);
  var n = g.pledges || 0;
  if (n) sub += (sub ? ' · ' : '') + T(n===1 ? 'nPromesas':'nPromesasN', { N:n });
  return '<div class="r">' +
    '<span class="nm">' + esc(T('vs', { O: g.opponent || '—' })) +
      '<small>' + esc(sub) + '</small></span>' +
    '<span class="sc' + cl + '">' + esc(marca) + '</span>' +
    '<a class="go" href="reporte.html">' + esc(T('verReporte')) + '</a>' +
  '</div>';
}

function pintar(){
  pintarPie();

  if (ERR){
    app.innerHTML =
      '<h1>' + esc(T('h1')) + '</h1>' +
      '<div class="vacio"><b>' + esc(ERR.t) + '</b>' + esc(ERR.p || '') + '</div>' +
      '<div class="vuelta">' +
        '<button class="btn" onclick="cargar()">' + esc(T('recargar')) + '</button>' +
        '<a class="btn line" href="mi-equipo.html">' + esc(T('aMiEquipo')) + '</a>' +
      '</div>';
    return;
  }
  if (!BOARD){ app.innerHTML = '<p class="lede">…</p>'; return; }

  var st = estado();
  var g  = elJuego();
  var res = jugados().slice().sort(function(a,b){
    return String(b.plays_on||'').localeCompare(String(a.plays_on||''));
  });
  var promesas = juegos().reduce(function(a,x){ return a + (x.pledges||0) }, 0);

  app.innerHTML =
    '<h1>' + esc(BOARD.campaign || T('h1')) + '</h1>' +
    '<p class="lede">' + esc(T('lede')) + '</p>' +

    '<div class="estado ' + st.c + '"><span class="punto"></span>' +
      esc(T(st.k)) + '</div>' +

    '<div class="tally">' +
      '<div class="tal"><b>' + ROSTER.length + '</b><span>' + esc(T('tPlantilla')) + '</span></div>' +
      '<div class="tal"><b>' + promesas + '</b><span>' + esc(T('tPromesas')) + '</span></div>' +
      '<div class="tal"><b>' + (BOARD.points || 0) + '</b><span>' + esc(T('tPuntos')) + '</span></div>' +
    '</div>' +
    '<p class="nota">' + esc(T('notaNoDinero')) + '</p>' +

    '<h2>' + esc(T('jH')) + '</h2>' +
    (g ? tarjetaJuego(g)
       : '<div class="vacio"><b>' + esc(T('sinJuego')) + '</b>' + esc(T('sinJuegoP')) + '</div>') +

    (res.length
      ? '<h2>' + esc(T('rH')) + '</h2><div class="rlist">' +
          res.map(filaResultado).join('') + '</div>'
      : '') +

    (ROSTER.length
      ? ''
      : '<h2>' + esc(T('plantillaH')) + '</h2>' +
        '<div class="vacio"><b>' + esc(T('nadie')) + '</b>' + esc(T('nadieP')) + '</div>') +

    '<div class="vuelta">' +
      '<a class="btn" href="plantilla.html">' + esc(T('aPlantilla')) + '</a>' +
      '<a class="btn line" href="mi-equipo.html">' + esc(T('aMiEquipo')) + '</a>' +
    '</div>' +
    (enMarcha() ? '<p class="help" style="margin-top:14px">' + esc(T('auto')) + '</p>' : '');
}

function cargar(){
  if (!CAMP){
    ERR = { t:T('noCamp'), p:T('noCampP') };
    pintar(); return;
  }
  return Promise.all([
    rpc('game_board',  { p_campaign: CAMP }),
    rpc('game_roster', { p_campaign: CAMP })
  ])
  .then(function(r){
    if (!r[0] || r[0].ok === false){
      ERR = { t:T('noCamp'), p:T('noCampP') };
      pintar(); return;
    }
    ERR = null;
    BOARD = r[0];
    ROSTER = r[1] || [];
    pintar();
    marcarPaso();
  })
  .catch(function(e){
    console.error(e);
    /* Un fallo de red no borra lo que ya se estaba enseñando: en una
       cancha con mala señal eso sería la pantalla parpadeando cada
       treinta segundos. */
    if (!BOARD){ ERR = { t:T('err'), p:'' }; pintar(); }
  });
}

/* Sólo se repregunta mientras hay un juego en marcha. Antes y después
   el número no cambia, y un tablero cerrado no tiene por qué estar
   pegándole a la base para siempre. */
function marcarPaso(){
  if (timer){ clearInterval(timer); timer = null; }
  if (enMarcha()) timer = setInterval(cargar, 30000);
}

/* Con el teléfono en el bolsillo no hace falta preguntar nada; al
   volver a mirarlo, sí, y enseguida. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && enMarcha()) cargar();
});

cargar();
</script>
