  --ball:#FF8A2B; --edge:#2E5570; --teal:#4FD3F0;
}
html, body{background:#07141E;color:#EAF2F7}

/* La cabecera y el pie ya eran oscuros, pero de otro azul. */

/* Cajas, paneles y cualquier cosa que antes era un rectángulo claro

/* Lo que se escribe. Un campo blanco en una página oscura es un
   agujero de luz, y en un teléfono de noche duele. */
input, select, textarea{
  background:#07141E;border-color:#2E5570;color:#EAF2F7}
input::placeholder, textarea::placeholder{color:#5F7C91}
input:focus, select:focus, textarea:focus{

/* Los botones. Aquí es donde un cambio de variables a ciegas dejaba
   blanco sobre blanco: el relleno era var(--ink), que ahora es la
   tinta. Se dicen los dos colores, y ya. */
.btn, button.btn, a.btn{
  background:#4FD3F0;border:2px solid #4FD3F0;color:#07141E}
.btn:hover{background:#07141E;color:#4FD3F0}

.btn.line:hover{background:#EAF2F7;color:#07141E}
.btn.go, .btn.hot, .btn.naranja{background:#FF8A2B;border-color:#FF8A2B;color:#07141E}
[style*="#FF8A2B"], .btn[class*="go"]{color:#07141E}
.btn:disabled{opacity:.45}

/* Separadores y reglas */
hr, .sep, .div{border-color:#1B3A4F;background:#1B3A4F}
table, th, td{border-color:#1B3A4F}

/* Enlaces dentro del texto */
/* Cada :not() suma fuerza, asi que esta regla le ganaba a cosas
   como a.wa. Lo que es un boton se excluye por nombre. */
main a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go), .wrap a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go){color:#4FD3F0}
a.pedir{color:inherit}

/* Lo que estaba escrito a mano en blanco y ahora es un agujero */
[style*="background:#07141E"], [style*="background: #07141E"]{background:#0E2232 !important}


/* Los que estaban puestos a mano con otro blanco: #FFF8F3, #FFFFFF.
   No son var() de nadie, así que hay que nombrarlos. */
[class]{--ff8:#0E2232}
.ojo, .env-nota, .nota-ojo, .aviso, .warn, .tip{background:#0E2232 !important;color:#EAF2F7}
.ttl, .env-nota b{color:#EAF2F7}
.cta{background:#4FD3F0 !important;border-color:#4FD3F0 !important;color:#07141E !important}
.cta:hover{background:#07141E !important;color:#4FD3F0 !important}
h1,h2,h3,h4{color:#EAF2F7}


/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
.mark em, .wm em{font-style:normal;color:#FF8A2B !important}
.mark i,  .wm i {font-style:normal;color:#4FD3F0 !important}
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}

function T(k, v){
  var out = (S[LANG] && S[LANG][k]) || S.en[k] || k;
  if (v) Object.keys(v).forEach(function(x){ out = out.split('{'+x+'}').join(v[x]); });
  return out;
}
function flip(){
  LANG = LANG === 'en' ? 'es' : 'en';
  try { localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG), localStorage.setItem('fc-lang', LANG); } catch(e){}
  try { paintChrome(); } catch(e){ console.error('chrome', e); }
  if (DATA) render(DATA); 
}
function paintChrome(){
  document.documentElement.lang = LANG;
  document.getElementById('lang').textContent = LANG === 'en' ? 'ES' : 'EN';
  // Lo que no esté, no revienta la página: pintar el pie no puede
  // impedir que se vea una promesa.
  var n = document.querySelectorAll('[data-t]');
  for (var i = 0; i < n.length; i++){
    var v = T(n[i].getAttribute('data-t'));
    if (v) n[i].textContent = v;
  }
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

// The chosen amount goes to the server, which makes the checkout —
// the browser never decides what anything costs on its own.
var PAY_API = 'https://basketball-money-payments.onrender.com';

function payNow(pledgeId){
  var el = document.getElementById('payAmt');
  var btn = document.getElementById('payBtn');
  var msg = document.getElementById('payMsg');
  var amt = parseFloat(el.value);

  if (!(amt >= 1)){
    msg.textContent = T('payMin');
    el.focus();
    return;
  }

  btn.disabled = true;
  msg.textContent = T('paySending');

  fetch(PAY_API + '/pay-pledge', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pledge_id: pledgeId, amount: amt })
  })
  .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || 'failed'); return j; }); })
  .then(function(j){ window.location.href = j.url; })
  .catch(function(e){
    console.error('Pay:', e);
    btn.disabled = false;
    msg.textContent = T('payFailed');
  });
}

        '<h1>' + T('gThanksH') + '</h1>' +
        '<p class="mute">' + T('gThanksP', { P: esc(d.program || ''), V: vs, N: d.points }) + '</p>' +
        '<p class="mute" style="margin-top:14px">' + T('gGoes', { A: money(d.pledged) }) + '</p>' +
      '</div>';
    return;
  }

  card.innerHTML =
    '<div class="kick">' + T('gKick') + '</div>' +
    '<h1 style="margin:0 0 2px">' + esc(d.program || '') + '</h1>' +
    '<p class="mute" style="margin:0 0 16px">' + vs +
      (d.plays_on ? ' · ' + esc(d.plays_on) : '') + '</p>' +

    '<div class="scored">' +
      '<div class="scored-n">' + d.points + '</div>' +
      '<div class="scored-l">' + T('gPoints') + '</div>' +
    '</div>' +

    '<table class="bits">' +
      '<tr><td>' + T('gYourPledge', { R: money(d.rate) }) + '</td>' +
          '<td>' + money(d.pledged) + '</td></tr>' +
      '<tr><td class="mute">' + T('lFee') + '</td>' +
          '<td class="mute">' + money(d.fee) + '</td></tr>' +
      '<tr class="sum"><td>' + T('lTotal') + '</td><td>' + money(d.total) + '</td></tr>' +
    '</table>' +

    (d.url
      ? '<a class="pay" href="' + d.url + '">' + T('pay', { T: money(d.total) }) + '</a>'
      : '<p class="mute">' + T('gNoLink') + '</p>') +

    '<p class="note mute">' + T('gFull', { A: money(d.pledged) }) + '</p>';
}

function money(n){ return '$' + Number(n || 0).toFixed(2); }

var card = document.getElementById('card');
var DATA = null;

paintChrome();

if (GAME_PLEDGE){
  // Promesa por juego: el marcador ya cerró el juego, así que aquí
  // sólo queda pagar o confirmar que ya se pagó.
  fetch(SB_URL + '/rest/v1/rpc/game_pledge_for_payment', {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_id: GAME_PLEDGE })
  })
  .then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); })
  .then(function(d){ renderGame(d); })
  .catch(function(e){
    console.error('Game pledge:', e);
    card.innerHTML = '<div class="state"><div class="icon">⚠️</div>' +
      '<h1>' + T('failH') + '</h1><p class="mute">' + T('failP') + '</p></div>';
  });
} else if (!PLEDGE){
  card.innerHTML = '<div class="state"><div class="icon">🔍</div>' +
    '<h1>' + T('goneH') + '</h1><p class="mute">' + T('goneP') + '</p></div>';
} else {
  fetch(SB_URL + '/rest/v1/rpc/pledge_for_payment', {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_pledge: PLEDGE })
  })
  .then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); })
  .then(function(d){
    if (!d || !d.ok){
      card.innerHTML = '<div class="state"><div class="icon">🔍</div>' +
        '<h1>' + T('goneH') + '</h1><p class="mute">' + T('goneP') + '</p></div>';
      return;
    }
    // The language they pledged in wins, unless they have since asked
    // for the other one on this device.
    try { if (!localStorage.getItem('cfh_lang') && d.lang) { LANG = d.lang; paintChrome(); } } catch(e){}
    DATA = d;
    render(d);
  })
  .catch(function(e){
    console.error('Pledge load:', e);
    card.innerHTML = '<div class="state"><div class="icon">⚠️</div>' +
      '<h1>' + T('failH') + '</h1><p class="mute">' + T('failP') + '</p></div>';
  });
}

function render(d){
  // Someone arriving straight back from Stripe may beat the webhook by
  // a second, so trust the redirect as well as the stored status.
  var status = (JUST_PAID && d.status === 'open') ? 'paid' : d.status;

  if (status === 'paid'){
    card.className = 'card paid';
    card.innerHTML =
      '<div class="state paid"><div class="icon">✓</div>' +
        '<div class="kick">' + T('paidKick') + '</div>' +
        '<h1>' + T('paidH', { N: esc(d.participant) }) + '</h1>' +
        '<p class="mute">' + T('paidP', { A: money(d.pledged), G: esc(d.program) }) + '</p>' +
      '</div>';
    return;
  }

  if (status === 'closed'){
    card.className = 'card';
    card.innerHTML =
      '<div class="state"><div class="icon">🕔</div>' +
        '<div class="kick">' + T('closedKick') + '</div>' +
        '<h1>' + T('closedH') + '</h1>' +
        '<p class="mute">' + T('closedP') + '</p>' +
      '</div>';
    return;
  }

  card.className = 'card open';
  card.innerHTML =
    '<div class="kick">' + T('kick') + '</div>' +
    '<h1>' + T('scored', { N: esc(d.participant), P: esc(d.points) }) + '</h1>' +
    '<p>' + T('youPledged', { R: money(d.rate) }) + '</p>' +

    '<div class="sums">' +
      '<div class="sum"><span>' + T('lPledge') + '</span><b>' + money(d.pledged) + '</b></div>' +
      '<div class="sum"><span>' + T('lFee') + '</span><b>' + money(d.fee) + '</b></div>' +
      '<div class="sum total"><span>' + T('lTotal') + '</span><b>' + money(d.total) + '</b></div>' +
    '</div>' +

    // A padrino may want to round up, or may be having a hard month.
    // The pledged total is filled in and one tap pays it; the figure
    // is theirs to change.
    '<div class="payline">' +
      '<span class="cur">$</span>' +
      '<input id="payAmt" type="number" step="0.01" min="1" value="' + Number(d.total || 0).toFixed(2) + '">' +
    '</div>' +
    '<button class="pay" id="payBtn" onclick="payNow(\'' + PLEDGE + '\')">' +
      T('pay', { T: money(d.total) }) + '</button>' +
    '<p class="note mute" id="payMsg"></p>' +

    '<p class="note">' + T('payFree') + '</p>' +
    '<p class="note">' + T('goes', { A: money(d.pledged), G: esc(d.program) }) + '</p>' +
    '<p class="note mute">' + T('window') + '</p>';
}
</script>
</body>
</html>
