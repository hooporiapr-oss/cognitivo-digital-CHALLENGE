<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoja del entrenador — Cada Punto</title>
<!-- Esta página lleva códigos escritos a mano antes de imprimir. No
     tiene por qué salir en una búsqueda. -->
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Una hoja por entrenador: su código, los tres pasos, y cuándo se le paga al programa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;--good:#0B7A5A}
*{box-sizing:border-box}
html{background:#12202E}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#fff;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(760px,93vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:1px solid #0B1724;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{flex:1 1 auto}
main .wrap{padding:clamp(20px,5vw,34px) 0 32px}

.kick{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(1.5rem,4.6vw,2rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 10px;font-weight:900}
.lede{color:var(--mute);margin:0 0 22px}

label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}
input{width:100%;padding:12px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:1rem}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
.hint{font-size:.82rem;color:var(--mute);margin:4px 0 0}

/* Una fila por entrenador. En el teléfono se apilan. */
.row{display:grid;grid-template-columns:1.1fr 1fr 1.4fr auto;gap:8px;align-items:end;
  padding:10px 0;border-bottom:1px solid var(--line)}
.row label{margin:0 0 4px}
.row .x{border:2px solid var(--line);background:#fff;color:var(--mute);border-radius:4px;
  padding:11px 13px;font:inherit;font-weight:800;cursor:pointer;line-height:1}
.row .x:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:700px){
  .row{grid-template-columns:1fr auto;gap:8px 10px}
  .row .f-code,.row .f-link{grid-column:1/2}
  .row .x{grid-row:1/2;grid-column:2/3}
}

.btn{display:block;width:100%;padding:16px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;
  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.line{background:#fff;color:var(--ink);margin-top:10px}
.ok{display:flex;gap:10px;align-items:flex-start;margin-top:18px;
  font-size:.88rem;font-weight:400;color:var(--mute)}
.ok span{cursor:pointer}
.ok input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}

.fine{border-left:4px solid var(--accent);background:var(--tint);padding:14px 16px;margin:22px 0 0}
.fine b{display:block;margin-bottom:3px}
.fine p{margin:0;color:var(--mute);font-size:.93rem}

/* ---- las hojas ---- */
#sheets{margin-top:26px}
.sheet{border:1.5px solid var(--line);border-radius:6px;padding:26px 28px;margin:0 0 18px}
.sheet .top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:18px}
.sheet .logo{font-weight:900;font-size:.95rem}
.sheet .logo em{font-style:normal;color:#C85A00}
.sheet .logo i{font-style:normal;color:#2E8B10}
.sheet .prog{font-size:.84rem;color:var(--mute);text-align:right}
.sheet .div{font-size:1.9rem;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:0}
.sheet .sub{color:var(--mute);margin:3px 0 18px;font-size:.92rem}

.code{border:2px solid var(--ink);border-radius:5px;padding:12px 15px;margin:0 0 20px;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.code b{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.code .v{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:1.5rem;font-weight:700;letter-spacing:.04em;word-break:break-all}
.code .blank{flex:1 1 180px;border-bottom:2px solid var(--ink);min-height:1.6rem}

.steps{counter-reset:s;margin:0 0 18px;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 13px 34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;
  width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:.78rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-size:1rem}
.steps .lnk{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:.86rem;color:var(--accent);word-break:break-all;display:block;margin:1px 0}
.steps span{color:var(--mute);font-size:.92rem;display:block}

.once{border:1.5px solid var(--good);border-radius:5px;padding:13px 15px;margin:0 0 16px}
.once b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--good);margin-bottom:4px}
.once .lnk{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:.9rem;color:var(--accent);word-break:break-all}
.once span{color:var(--mute);font-size:.92rem;display:block;margin-top:2px}

.money{border-top:1.5px solid var(--line);padding-top:13px;font-size:.88rem;color:var(--mute)}
.money b{color:var(--ink)}
.money p{margin:0 0 5px}
.money .mail{margin-top:9px;font-size:.84rem}

/* ---- mandárselo al teléfono ----
   El papel explica; el teléfono es donde se empieza. Un enlace de
   sesenta caracteres copiado a mano desde una hoja no lo teclea nadie,
   y el que no lo abre no arranca. Esto arma el mensaje con lo que ya
   está escrito arriba y lo manda por donde el entrenador ya habla. */
.enviar{border-top:1px solid var(--line);margin:34px 0 0;padding:26px 0 0}
.enviar h2{font-size:1.25rem;font-weight:900;margin:0 0 6px}
.enviar .lede{color:var(--mute);font-size:.94rem;margin:0 0 20px;max-width:62ch}
.env-row{border:1px solid var(--line);border-radius:7px;padding:14px;margin:0 0 13px}
.env-row .ttl{font-weight:900;font-size:1rem;margin:0 0 9px}
.env-row textarea{width:100%;min-height:148px;font:inherit;font-size:.84rem;
  line-height:1.5;color:var(--ink);border:1px solid var(--line);border-radius:5px;
  padding:10px;background:#FAFCFD;resize:vertical}
.env-bts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.env-bts a,.env-bts button{display:inline-block;border:1px solid var(--line);
  background:#fff;color:var(--ink);border-radius:5px;padding:9px 15px;font:inherit;
  font-size:.86rem;font-weight:800;text-decoration:none;cursor:pointer}
.env-bts a.wa{background:#25D366;border-color:#25D366;color:#06301A}
.env-nota{color:var(--mute);font-size:.8rem;margin:9px 0 0}
.env-nota.ojo{color:var(--accent);font-weight:800}
.env-falta{color:var(--mute);font-size:.88rem;margin:0}
.paso{border:2px solid var(--accent);border-radius:7px;padding:15px;margin:20px 0 0;
  background:#FFF8F3}
.paso .ttl{font-weight:900;font-size:1.05rem;margin:0 0 6px}
.paso .dice{color:var(--mute);font-size:.88rem;margin:0 0 11px;max-width:60ch}
.paso input{width:100%;font:inherit;font-size:.78rem;color:var(--mute);
  border:1px solid var(--line);border-radius:5px;padding:9px;background:#fff}
.llego{color:#1C7A3A;font-weight:800;font-size:.9rem;margin:0 0 14px}

/* ---- impresión: una hoja por entrenador, nada de la pantalla ---- */
@media print{
  @page{size:letter;margin:14mm}
  html,body{background:#fff}
  header,main .setup,footer,.btn,.no-print{display:none !important}
  main .wrap,.wrap{width:100%;max-width:none;padding:0}
  #sheets{margin:0}
  .sheet{border:none;border-radius:0;padding:0;margin:0;
    break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .steps li,.code,.once,.money{break-inside:avoid;page-break-inside:avoid}
  a{color:var(--accent);text-decoration:none}
}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
footer p{margin:0 0 7px}
footer .f-co{color:#fff;font-weight:700}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-legal{margin:7px 0 0;font-size:.78rem}
footer .f-dot{padding:0 7px;opacity:.5}
.f-what{margin:7px 0 0;font-size:.74rem;line-height:1.5;opacity:.72;max-width:52ch;
  margin-left:auto;margin-right:auto}
</style>
</head>

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') || localStorage.getItem('fc-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function T(k){ return (S[LANG] && S[LANG][k]) || S.es[k] || ''; }

function toggleLang(){
  read();
  LANG = LANG==='es' ? 'en':'es';
  try{ localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG), localStorage.setItem('fc-lang', LANG); }catch(e){}
  document.getElementById('langBtn').textContent = LANG==='es' ? 'EN':'ES';
  paintWhat();
  drawSetup(); drawSheets();
}

/* Las cinco divisiones de Canóvanas, que son las del jueves. Se
   cambian escribiendo encima. */
var PROG = '';
var ROWS = [
  { div:'Infantil', code:'', link:'', join:'' },
  { div:'Mini',     code:'', link:'', join:'' },
  { div:'Juvenil',  code:'', link:'', join:'' },
  { div:'Junior A', code:'', link:'', join:'' },
  { div:'Junior B', code:'', link:'', join:'' }
];
var SHOWCODE = false;

/* El programa y las divisiones se recuerdan; los códigos y los
   enlaces NO. Un código guardado en el navegador es un código que
   sobrevive a quien lo escribió. */
try{
  var raw = localStorage.getItem('cp-hoja');
  if (raw){
    var v = JSON.parse(raw);
    if (v && typeof v.prog === 'string') PROG = v.prog;
    if (v && Array.isArray(v.divs) && v.divs.length)
      ROWS = v.divs.map(function(d){ return { div:String(d||''), code:'', link:'', join:'' }; });
  }
}catch(e){}

function save(){
  try{
    localStorage.setItem('cp-hoja', JSON.stringify({
      prog: PROG, divs: ROWS.map(function(r){ return r.div; })
    }));
  }catch(e){}
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"\']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function paintWhat(){
  var el = document.getElementById('fWhat');
  if (el) el.textContent = (LANG === 'es')
    ? 'Cada Punto es una plataforma de Gostar Digital LLC, una empresa con fines de lucro. El programa recauda y recibe lo suyo completo; nosotros cobramos por el uso de la herramienta.'
    : 'Cada Punto is a platform from Gostar Digital LLC, a for-profit company. The program raises the money and receives all of it; we charge for use of the tool.';
}

/* Lo que está escrito en pantalla, de vuelta al modelo. */
function read(){
  var p = document.getElementById('pg');
  if (p) PROG = p.value;
  ROWS.forEach(function(r, i){
    var d = document.getElementById('d' + i);
    var c = document.getElementById('c' + i);
    var l = document.getElementById('l' + i);
    if (d) r.div  = d.value;
    if (c) r.code = c.value;
    if (l) r.link = l.value;
    var j = document.getElementById('j' + i);
    if (j) r.join = j.value;
  });
  var s = document.getElementById('sc');
  if (s) SHOWCODE = s.checked;
  save();
}

function sync(){ read(); drawSheets(); drawEnviar(); }

function addRow(){ read(); ROWS.push({ div:'', code:'', link:'', join:'' }); drawSetup(); drawSheets(); drawEnviar(); }
function rmRow(i){ read(); ROWS.splice(i, 1); if (!ROWS.length) ROWS.push({ div:'', code:'', link:'', join:'' }); drawSetup(); drawSheets(); drawEnviar(); }

/* Un enlace sin https:// delante no es un enlace: pegado en el grupo de
   WhatsApp sale como texto pelado, sin vista previa y en algunas apps
   ni se puede tocar. Y el de apuntarse es justo el que queremos que
   toquen las familias.

   Asi que lo que se imprime siempre lleva https://, lo haya escrito
   quien lo haya escrito. Si ya viene con http:// se sube a https. */
function conHttps(u){
  var t = String(u==null?'':u).trim();
  if(!t) return '';
  if(/^https:\/\//i.test(t)) return t;
  if(/^http:\/\//i.test(t))  return t.replace(/^http:\/\//i,'https://');
  /* Pegado desde la barra del navegador a veces viene sólo la ruta:
     /jugador.html?c=... Ahí hay que ponerle el dominio entero, porque
     si no sale un enlace que parece bueno en el papel y no lleva a
     ningún sitio. */
  if(t.charAt(0)==='/') return 'https://cadapunto.com' + t;
  return 'https://' + t;
}


/* ══════════════════════════════════════════════════════════════════
   MANDÁRSELO AL TELÉFONO

   La hoja de papel explica bien, pero termina con tres enlaces que hay
   que teclear a mano en un teléfono. Eso no lo hace nadie, y el que no
   los abre no empieza — así que la hoja sola deja el trabajo a medias.

   Esto arma el mismo mensaje con lo que ya está escrito arriba y lo
   manda por donde el entrenador ya habla: WhatsApp, un texto o un
   correo. El mensaje se puede editar antes de mandarlo.

   Sobre el código: va dentro SÓLO si está marcada la casilla de
   imprimirlo. La misma decisión vale para el papel y para el teléfono
   — y lo dice en cada tarjeta, porque un mensaje se reenvía más fácil
   que una hoja.
   ══════════════════════════════════════════════════════════════════ */

function mensajeDe(r){
  var L=[];
  L.push(T('mPara')+': '+(r.div||'').trim()+' — '+PROG);
  L.push('');
  L.push(T('mEntra'));
  L.push('https://cadapunto.com/mi-equipo.html');
  if(SHOWCODE && (r.code||'').trim()) L.push(T('mCod')+' '+(r.code||'').trim());
  L.push('');
  if((r.join||'').trim()){
    L.push(T('mGrupo'));
    L.push(conHttps(r.join));
    L.push('');
  }
  if((r.link||'').trim()){
    L.push(T('mTab'));
    L.push(conHttps(r.link));
    L.push('');
  }
  L.push(T('mPon'));
  L.push('');
  L.push(T('mAyuda')+' https://cadapunto.com/ayuda.html');
  return L.join('\n');
}

/* iPhone y Android no se ponen de acuerdo en cómo lleva el texto un
   enlace de SMS. Uno quiere &body y el otro ?body, y el que se
   equivoca abre el mensaje vacío. */
function enlaceSms(txt){
  var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent||'');
  return 'sms:'+(iOS?'&':'?')+'body='+encodeURIComponent(txt);
}

function copiar(i){
  var ta=document.getElementById('m'+i);
  if(!ta) return;
  try{
    ta.focus(); ta.select(); ta.setSelectionRange(0,999999);
    var ok=false;
    try{ ok=document.execCommand('copy') }catch(e){}
    if(!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
    var b=document.getElementById('cp'+i);
    if(b){ var antes=b.textContent; b.textContent=T('envCopiado');
           setTimeout(function(){ b.textContent=antes },1400) }
  }catch(e){}
}

/* Los botones se rearman con lo que haya en el cuadro de texto en ese
   momento, no con lo que se generó: si el entrenador le añade una
   línea, se manda lo que ve. */
function refrescarEnlaces(i){
  var ta=document.getElementById('m'+i);
  if(!ta) return;
  var t=ta.value;
  var wa=document.getElementById('wa'+i), sm=document.getElementById('sm'+i),
      ml=document.getElementById('ml'+i);
  if(wa) wa.href='https://wa.me/?text='+encodeURIComponent(t);
  if(sm) sm.href=enlaceSms(t);
  if(ml) ml.href='mailto:?subject='+encodeURIComponent('Cada Punto — '+PROG)+
                 '&body='+encodeURIComponent(t);
}


/* ══════════════════════════════════════════════════════════════════
   DE LA COMPUTADORA A LA MANO

   Esto se llena sentado, en la computadora. Pero WhatsApp está en el
   teléfono, y lo escrito vive sólo en esa pestaña: abrir la página en
   el teléfono daba un formulario en blanco y había que escribirlo todo
   otra vez.

   Un enlace lo lleva. Todo lo escrito va dentro del propio enlace,
   detrás del #, que es la parte que el navegador NO manda a ningún
   servidor: no pasa por nosotros ni queda en ningún registro. Se abre
   en el teléfono y sale puesto.

   Y al abrirlo, lo primero que hace la página es quitarlo de la barra
   de direcciones. Lleva códigos dentro; que no se quede ahí a la vista
   ni en el historial más de lo necesario. Tampoco se guarda — la regla
   de arriba sigue en pie: un código guardado en el navegador es un
   código que sobrevive a quien lo escribió.
   ══════════════════════════════════════════════════════════════════ */

function aBase64(txt){
  // btoa no traga acentos; esto los pasa a bytes antes.
  return btoa(unescape(encodeURIComponent(txt))).replace(/\+/g,'-').replace(/\//g,'_');
}
function deBase64(b64){
  var t=String(b64||'').replace(/-/g,'+').replace(/_/g,'/');
  return decodeURIComponent(escape(atob(t)));
}

function enlaceParaElTelefono(){
  var datos={ p:PROG, s:SHOWCODE?1:0,
    r:ROWS.map(function(r){ return [r.div||'', r.code||'', r.link||'', r.join||'']; }) };
  var base=location.href.split('#')[0];
  return base+'#d='+aBase64(JSON.stringify(datos));
}

/* Al cargar: si viene con datos, se ponen y se limpia la barra. */
var LLEGO_DE_OTRO=false;
(function leerDelEnlace(){
  try{
    var h=location.hash||'';
    if(h.indexOf('#d=')!==0) return;
    var d=JSON.parse(deBase64(h.slice(3)));
    if(d && typeof d.p==='string') PROG=d.p;
    if(d) SHOWCODE = !!d.s;
    if(d && Array.isArray(d.r) && d.r.length){
      ROWS=d.r.map(function(a){
        return { div:String(a[0]||''), code:String(a[1]||''),
                 link:String(a[2]||''), join:String(a[3]||'') };
      });
    }
    LLEGO_DE_OTRO=true;
    // Fuera de la barra de direcciones en cuanto esté leído.
    try{ history.replaceState(null,'',location.pathname+location.search) }catch(e){ location.hash='' }
  }catch(e){}
})();

function copiarEnlace(){
  var inp=document.getElementById('pasoInp');
  if(!inp) return;
  try{
    inp.focus(); inp.select(); inp.setSelectionRange(0,999999);
    var ok=false;
    try{ ok=document.execCommand('copy') }catch(e){}
    if(!ok && navigator.clipboard) navigator.clipboard.writeText(inp.value);
    var b=document.getElementById('pasoCp');
    if(b){ var antes=b.textContent; b.textContent=T('envCopiado');
           setTimeout(function(){ b.textContent=antes },1400) }
  }catch(e){}
}

function bloquePaso(){
  var url=enlaceParaElTelefono();
  var asunto=encodeURIComponent('Cada Punto — '+(PROG||''));
  return '<div class="paso">'+
    '<p class="ttl">'+T('pasoH')+'</p>'+
    '<p class="dice">'+T('pasoP')+'</p>'+
    '<input id="pasoInp" type="text" readonly value="'+esc(url)+'">'+
    '<div class="env-bts">'+
      '<button id="pasoCp" onclick="copiarEnlace()">'+T('pasoCopiar')+'</button>'+
      '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+
        encodeURIComponent(url)+'">'+T('pasoWa')+'</a>'+
      '<a href="mailto:?subject='+asunto+'&body='+encodeURIComponent(url)+'">'+
        T('pasoMail')+'</a>'+
    '</div>'+
    '<p class="env-nota ojo">'+T('pasoOjo')+'</p>'+
  '</div>';
}

function drawEnviar(){
  var cajas = ROWS.map(function(r,i){
    var hayAlgo = (r.join||'').trim() || (r.link||'').trim();
    var titulo = esc((r.div||'').trim() || '—');
    if(!hayAlgo){
      return '<div class="env-row"><p class="ttl">'+titulo+'</p>'+
             '<p class="env-falta">'+T('envFalta')+'</p></div>';
    }
    var txt = mensajeDe(r);
    var conCod = SHOWCODE && (r.code||'').trim();
    return '<div class="env-row">'+
      '<p class="ttl">'+titulo+'</p>'+
      '<textarea id="m'+i+'" oninput="refrescarEnlaces('+i+')">'+esc(txt)+'</textarea>'+
      '<div class="env-bts">'+
        '<a class="wa" id="wa'+i+'" target="_blank" rel="noopener" href="#">'+T('envWa')+'</a>'+
        '<a id="sm'+i+'" href="#">'+T('envSms')+'</a>'+
        '<a id="ml'+i+'" href="#">'+T('envMail')+'</a>'+
        '<button id="cp'+i+'" onclick="copiar('+i+')">'+T('envCopy')+'</button>'+
      '</div>'+
      '<p class="env-nota'+(conCod?' ojo':'')+'">'+
        (conCod ? T('envConCod') : T('envSinCod'))+'</p>'+
    '</div>';
  }).join('');

  document.getElementById('enviar').innerHTML =
    '<h2>'+T('envH')+'</h2>'+
    '<p class="lede">'+T('envP')+'</p>'+
    (LLEGO_DE_OTRO ? '<p class="llego">'+T('pasoListo')+'</p>' : '')+
    cajas+
    bloquePaso();

  for(var i=0;i<ROWS.length;i++) refrescarEnlaces(i);
}

    var board = (r.link||'').trim()
      ? '<span class="lnk">' + esc(conHttps(r.link)) + '</span>'
      : '<span class="lnk">' + T('s2blank') + '</span>';

    // El que de verdad mueve el dinero. Sin esto el entrenador se va
    // con una hoja completa y sin la dirección que hace que alguien
    // prometa algo.

    return '<div class="sheet">' +
      '<div class="top">' +
        '<span class="logo">cada <em>punto</em> <i>cuenta</i></span>' +
        '<span class="prog">' + esc(PROG) + '</span>' +
      '</div>' +
      '<p class="div">' + esc(r.div) + '</p>' +
      '<p class="sub">' + esc(PROG) + '</p>' +

      '<div class="code"><b>' + T('sTag') + '</b>' + codeBox + '</div>' +

      '<ol class="steps">' +
        '<li><b>' + T('s1b') + '</b>' +
          '<span class="lnk">https://cadapunto.com/mi-equipo.html</span>' +
          '<span>' + T('s1') + '</span></li>' +
        /* El enlace del paso 2 lleva a la plantilla, que es donde el
           entrenador escribe los nombres. El de apuntarse queda
           debajo, en pequeño, para el que prefiera que cada familia
           lo haga sola. */
        '<li><b>' + T('sJb') + '</b>' +
          /* Una sola línea de enlace. Dos empujaban cada hoja a una
             segunda página, y la hoja tiene que ser UNA por división:
             diez páginas para cinco entrenadores es el doble de papel
             y la mitad de claridad. */
          '<span class="lnk">https://cadapunto.com/plantilla.html</span>' +
          '<span>' + T('sJ') + '</span></li>' +
        '<li><b>' + T('s2b') + '</b>' + board +
          '<span>' + T('s2') + '</span></li>' +
        '<li><b>' + T('s3b') + '</b>' +
          '<span>' + T('s3') + '</span></li>' +
      '</ol>' +

      '<div class="once"><b>' + T('onceB') + '</b>' +
        '<span class="lnk">https://cadapunto.com/cobro.html</span>' +
        '<span>' + T('once') + '</span></div>' +

      '<div class="money">' +
        '<p>' + T('mUno') + '</p>' +
        '<p>' + T('mDos') + '</p>' +
        '<p>' + T('mTres') + '</p>' +
        '<p>' + T('mHelp') + '</p>' +
        '<p class="mail">' + T('mMail') + '</p>' +
      '</div>' +
    '</div>';
  }).join('');
}
