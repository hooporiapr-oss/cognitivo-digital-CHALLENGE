<title>Casa Contra Casa — Cada Punto</title>

     un enlace pelado en un grupo de WhatsApp, sale el cartel. -->

<meta name="twitter:title" content="Inscribe tu equipo — Cada Punto">

<meta name="description" content="Tu equipo recauda con sus propios juegos. Los padrinos prometen por punto, tú pones el marcador, y cada dólar cobrado va al programa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;
      --good:#0B7A5A;--bad:#A8323F}
*{box-sizing:border-box}
html{background:#12202E}
/* El teclado del teléfono no achica la página, achica lo que se ve de
   ella. Con el alto clavado en 100dvh y el scroll metido en <main>, el
   campo enfocado se iba debajo del teclado y el navegador no podía
   subirlo. Rodando la página entera, sí puede. */
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#fff;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(600px,93vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:1px solid #0B1724;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:clamp(20px,5vw,34px) 0 32px}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
footer p{margin:0 0 7px}
footer .f-co{color:#fff;font-weight:700}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-legal{margin:7px 0 0;font-size:.78rem}
footer .f-dot{padding:0 7px;opacity:.5}

.kick{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(1.5rem,4.6vw,2rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 10px;font-weight:900}
.lede{color:var(--mute);margin:0 0 22px}
h2{font-size:1.02rem;margin:26px 0 8px;font-weight:900;letter-spacing:-.02em}

.how{display:grid;gap:10px;margin:0 0 24px}
.how .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px}
.how .s b{display:block;font-size:.98rem}
.how .s span{color:var(--mute);font-size:.92rem}

label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}
input{width:100%;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
/* Cuando el navegador sube el campo enfocado, que no quede pegado al
   borde: se ve su etiqueta y el campo de antes. */
label,input{scroll-margin-top:64px;scroll-margin-bottom:24px}
.hint{font-size:.82rem;color:var(--mute);margin:4px 0 0}
.btn{display:block;width:100%;padding:16px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;
  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.line{background:#fff;color:var(--ink);margin-top:10px}
.ok{display:flex;gap:10px;align-items:flex-start;margin-top:18px;
  font-size:.88rem;font-weight:400;color:var(--mute)}
.ok span{cursor:pointer}
.ok input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.ok a{color:var(--accent)}
.msg{margin-top:12px;font-weight:700;font-size:.92rem;min-height:1.2em}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--good)}

/* En el teléfono el pie es lo último que hace falta mientras se llena
   un formulario: que ocupe lo justo. */
@media(max-width:560px){
  footer{padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));font-size:.76rem}
  footer p{margin:0 0 4px}
  footer .f-legal{margin:4px 0 0}
  main .wrap{padding-bottom:20px}
}

.fine{border-left:4px solid var(--accent);background:var(--tint);padding:14px 16px;margin:22px 0 0}
.fine b{display:block;margin-bottom:3px}
.fine p{margin:0;color:var(--mute);font-size:.93rem}

.done{text-align:center}
.done .tick{font-size:2.8rem;line-height:1;margin-bottom:10px}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="index.html">cada&nbsp;<em>punto</em>&nbsp;<i>cuenta</i></a>
    <button class="langb" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</header>

<main>
  <div class="wrap" id="app"></div>
</main>

<footer>
  <div class="wrap">
    <p class="f-co">© 2026 Gostar Digital LLC · Puerto Rico</p>

</footer>

<style>
/* La marca, en grande, una vez. */
.ccc{font-weight:900;letter-spacing:-.03em;line-height:.95;
  font-size:clamp(2rem,9vw,3.4rem);margin:0 0 4px}
.ccc em{font-style:normal;color:var(--accent)}
.why{display:grid;gap:10px;margin:0 0 26px}
.why .w{border-left:4px solid var(--accent);background:var(--tint);padding:13px 15px}
.why .w b{display:block;font-size:.98rem}
.why .w span{color:var(--mute);font-size:.92rem}
.num{display:grid;gap:10px;margin:0 0 26px;counter-reset:paso}
.num .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px 13px 46px;position:relative}
.num .s::before{counter-increment:paso;content:counter(paso);position:absolute;left:14px;top:13px;
  width:21px;height:21px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.num .s b{display:block;font-size:.98rem}
.num .s span{color:var(--mute);font-size:.92rem}
.big2{border:3px solid var(--good);border-radius:6px;padding:16px 18px;margin:0 0 26px}
.big2 b{display:block;font-size:1.1rem;margin-bottom:4px}
.big2 span{color:var(--mute);font-size:.95rem;line-height:1.6}
</style>

<script>
var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') || localStorage.getItem('fc-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

var S = {
  es:{
    kick:'Casa Contra Casa',
    h1a:'Casa', h1b:'Contra', h1c:'Casa',
    lede:'Tu propio equipo partido en dos escuadras, una noche, en tu propia cancha. Las dos recaudan. No hace falta rival, ni liga, ni que alguien te dé fecha.',
    whyH:'Por qué recauda más que un juego de verdad',
    w1b:'Todos los puntos de la cancha son del programa.',
    w1:'En un juego de verdad la mitad de los puntos son de la otra escuela. Aquí las dos escuadras son tuyas, así que el programa cobra por los 103 puntos de la noche, no por 55.',
    w2b:'No esperas a que alguien te dé juego.',
    w2:'Un coach lo monta para el martes. Sin rival que conseguir, sin cancha que pedir, sin liga que apruebe. Si el equipo necesita dinero en dos semanas, no hace falta que haya temporada.',
    w3b:'Juegan todos, recaudan todos.',
    w3:'Cada jugador escoge su escuadra y saca su propio enlace. Su familia ve sólo el juego de su escuadra y promete ahí. Nadie se queda fuera del juego de su propio equipo.',
    w4b:'Gana uno, cobran los dos.',
    w4:'Hay ganador y perdedor, pero nadie deja de recaudar: los 48 puntos del que perdió valen exactamente lo mismo por punto que los 55 del que ganó.',
    howH:'Cómo se monta',
    s1b:'Lo creas en el calendario.',
    s1:'Fecha, hora y el nombre de las dos escuadras. Un botón y quedan los dos juegos, uno por escuadra.',
    s2b:'Cada jugador manda su enlace.',
    s2:'Saca el suyo, escoge su escuadra, y lo manda por WhatsApp. Los padrinos prometen unos centavos por cada punto que anote su escuadra.',
    s3b:'Se juega.',
    s3:'Tu cancha, tu gente, una noche. Los papás ya estaban ahí.',
    s4b:'Pones los dos marcadores.',
    s4:'Desde el mismo tablero, con tu código. Cada escuadra cobra por los suyos.',
    costH:'Y no cuesta nada montarlo.',
    costP:'Sin cuota, sin mensualidad, sin contrato. Nuestro 20% se le suma al pago del padrino, nunca se te descuenta a ti: una promesa de $25 es un pago de $25.00 más $5.00, y el programa recibe los $25 completos.',
    ctaH:'¿Lo montamos para tu equipo?',
    ctaP:'Si tu programa ya está en Cada Punto, lo creas tú mismo en el calendario. Si todavía no, inscribe tu equipo y te lo dejamos listo.',
    go:'Inscribe tu equipo',
    go2:'Ver un tablero',
    back:'← Cómo funciona Cada Punto'
  },
  en:{
    kick:'Casa Contra Casa',
    h1a:'Casa', h1b:'Contra', h1c:'Casa',
    lede:'House against house: your own team split into two squads, one night, in your own gym. Both sides raise. No opponent to find, no league to ask, nobody else deciding your date.',
    whyH:'Why it raises more than a real game',
    w1b:'Every point on the floor belongs to the program.',
    w1:'In a real game half the points belong to the other school. Here both squads are yours, so the program collects on all 103 points of the night, not 55.',
    w2b:'You are not waiting for a fixture.',
    w2:'A coach calls one for Tuesday. No opponent to arrange, no gym to book, no league to approve it. If the team needs money in two weeks, there does not have to be a season.',
    w3b:'Everyone plays, everyone raises.',
    w3:'Each player picks their squad and takes their own link. Their family sees only their squad\u2019s game and pledges there. Nobody is left out of their own team\u2019s game.',
    w4b:'One side wins, both sides collect.',
    w4:'There is a winner and a loser, but nobody stops raising: the 48 points the losing squad scored are worth exactly the same per point as the winner\u2019s 55.',
    howH:'How you set one up',
    s1b:'You create it in the scheduler.',
    s1:'Date, time, and the names of the two squads. One button and both games exist, one per squad.',
    s2b:'Every player sends their link.',
    s2:'They take their own, pick their squad, and send it on WhatsApp. Padrinos pledge a few cents for every point their squad scores.',
    s3b:'You play it.',
    s3:'Your gym, your people, one night. The parents were already there.',
    s4b:'You post both scores.',
    s4:'From the same board, with your code. Each squad collects on its own.',
    costH:'And it costs nothing to run.',
    costP:'No setup fee, no monthly fee, no contract. Our 20% is added to the padrino\u2019s payment, never taken out of yours: a $25 pledge is a $25.00 payment plus $5.00, and the program receives the full $25.',
    ctaH:'Want one for your team?',
    ctaP:'If your program is already on Cada Punto, you create it yourself in the scheduler. If not, sign your team up and we will set it up for you.',
    go:'Sign up my team',
    go2:'See a board',
    back:'\u2190 How Cada Punto works'
  }
};

function T(k){ return (S[LANG] && S[LANG][k]) || S.en[k] || ''; }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleLang(){
  LANG = (LANG === 'es') ? 'en' : 'es';
  try{ localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG),
       localStorage.setItem('fc-lang', LANG); }catch(e){}
  paint();
}

function paint(){
  document.documentElement.lang = LANG;
  document.getElementById('langBtn').textContent = (LANG === 'es') ? 'EN' : 'ES';
  document.title = 'Casa Contra Casa \u2014 Cada Punto';

  document.getElementById('app').innerHTML =
    '<p class="kick">' + T('kick') + '</p>' +
    '<h1 class="ccc">' + T('h1a') + ' <em>' + T('h1b') + '</em> ' + T('h1c') + '</h1>' +
    '<p class="lede">' + T('lede') + '</p>' +

    '<div class="big2">' +
      '<b>' + T('w1b') + '</b>' +
      '<span>' + T('w1') + '</span>' +
    '</div>' +

    '<h2>' + T('whyH') + '</h2>' +
    '<div class="why">' +
      '<div class="w"><b>' + T('w2b') + '</b><span>' + T('w2') + '</span></div>' +
      '<div class="w"><b>' + T('w3b') + '</b><span>' + T('w3') + '</span></div>' +
      '<div class="w"><b>' + T('w4b') + '</b><span>' + T('w4') + '</span></div>' +
    '</div>' +

    '<h2>' + T('howH') + '</h2>' +
    '<div class="num">' +
      '<div class="s"><b>' + T('s1b') + '</b><span>' + T('s1') + '</span></div>' +
      '<div class="s"><b>' + T('s2b') + '</b><span>' + T('s2') + '</span></div>' +
      '<div class="s"><b>' + T('s3b') + '</b><span>' + T('s3') + '</span></div>' +
      '<div class="s"><b>' + T('s4b') + '</b><span>' + T('s4') + '</span></div>' +
    '</div>' +

    '<div class="fine">' +
      '<b>' + T('costH') + '</b><br>' + T('costP') +
    '</div>' +

    '<h2 style="margin-top:28px">' + T('ctaH') + '</h2>' +
    '<p class="lede">' + T('ctaP') + '</p>' +
    '<a class="btn" href="equipo.html">' + T('go') + '</a>' +
    '<a class="btn line" href="scoreboard.html?c=8d0d1f66-29a8-4406-90f2-3c3cf9479d55">' +
      T('go2') + '</a>' +
    '<p style="margin-top:22px"><a href="index.html" style="color:var(--accent);font-weight:800;' +
      'text-decoration:none">' + T('back') + '</a></p>';
}

paint();
</script>
</body>
</html>
