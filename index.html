<style>
/* ── La cancha de noche ───────────────────────────────────────────
   El color sale del juego, no de una paleta: una cancha oscura y la
   luz en las bolas. El cian y el naranja ya son de la casa. */
:root{
  --noche:#07141E; --cancha:#0E2232; --linea:#1B3A4F;
  --viva:#4FD3F0;  --brasa:#FF8A2B;
  --hueso:#EAF2F7; --humo:#7A96A9;
  --ancho:min(680px,90vw);
}
*{box-sizing:border-box}
html{background:var(--noche)}
body{margin:0;background:var(--noche);color:var(--hueso);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:var(--ancho);margin:0 auto}

/* ── Cabecera, la misma del sitio ─────────────────────────────── */
.top{background:var(--noche);border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top,0px)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:var(--viva)}
.mark i{font-style:normal;color:var(--humo)}
.langb{border:1px solid var(--linea);background:none;color:var(--humo);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}
.langb:hover{color:var(--hueso);border-color:var(--humo)}

/* ── La cancha viva ───────────────────────────────────────────── */
.ruedo{background:
  radial-gradient(120% 90% at 50% 18%, #13304a 0%, var(--cancha) 48%, var(--noche) 100%);
  border-bottom:1px solid var(--linea);overflow:hidden}
.ruedo .wrap{padding:clamp(16px,4vw,30px) 0 clamp(22px,5vw,38px)}
.pista{display:block;width:100%;height:auto}
.piso{stroke:var(--linea);fill:none;stroke-width:2}

/* ── El titular ───────────────────────────────────────────────── */
.titular{font-size:clamp(2.6rem,12vw,5.4rem);line-height:.92;font-weight:900;
  letter-spacing:-.045em;margin:0;text-transform:uppercase}
.bajo{color:var(--humo);font-size:clamp(1rem,2.6vw,1.18rem);
  max-width:34ch;margin:16px 0 0}

/* ── Cuerpo ───────────────────────────────────────────────────── */
main .wrap{padding:clamp(34px,7vw,58px) 0}
h2{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:900;letter-spacing:-.035em;
  line-height:1.05;margin:0 0 14px}
p{margin:0 0 14px;max-width:62ch}
.sec{padding:clamp(30px,6vw,52px) 0;border-top:1px solid var(--linea)}
.sec:first-child{border-top:none;padding-top:0}

/* ── La escalera: lo que de verdad convence ───────────────────── */
.escalera{margin:22px 0 0;display:grid;gap:11px}
.peldano{display:grid;grid-template-columns:5rem 1fr auto;align-items:center;gap:12px}
.ronda{font-weight:900;font-size:.9rem;color:var(--humo);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
.barra{height:13px;background:var(--cancha);border:1px solid var(--linea);position:relative}
.barra span{position:absolute;inset:0 auto 0 0;background:var(--viva);display:block}
.pts{font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;min-width:3.2rem;text-align:right}
.peldano.cima .barra span{background:var(--brasa)}
.peldano.cima .pts{color:var(--brasa)}
.pie-esc{color:var(--humo);font-size:.95rem;margin:16px 0 0;max-width:46ch}

/* ── Cómo funciona ────────────────────────────────────────────────
   Numerados porque de verdad son una secuencia: cada paso depende
   del anterior y van en ese orden. */
.pasos{list-style:none;counter-reset:paso;margin:22px 0 0;padding:0;display:grid;gap:0}
.pasos li{counter-increment:paso;position:relative;padding:16px 0 16px 46px;
  border-top:1px solid var(--linea)}
.pasos li:last-child{border-bottom:1px solid var(--linea)}
.pasos li::before{content:counter(paso);position:absolute;left:0;top:17px;
  width:26px;height:26px;border:1.5px solid var(--viva);border-radius:50%;
  color:var(--viva);font-size:.78rem;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.pasos b{display:block;font-size:1.06rem;font-weight:800;margin-bottom:3px}
.pasos span{color:var(--humo);font-size:.97rem}

/* Las tres cosas que la gente pregunta antes de prometer. */
.claves{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:9px}
.claves li{padding-left:20px;position:relative;color:var(--humo);font-size:.96rem}
.claves li::before{content:"";position:absolute;left:0;top:.62em;
  width:8px;height:8px;background:var(--brasa)}
.claves b{color:var(--hueso);font-weight:800}

/* Cuanto dura. Una linea seca debajo de los pasos: es la suma de los
   cinco, y es el numero por el que un programa pregunta primero. */
.dura{margin:20px 0 0;font-size:.97rem;line-height:1.55;color:var(--humo)}
.dura b{color:var(--hueso);font-weight:800}
.dura span b{color:var(--brasa)}

/* Lo que nadie tiene que hacer. Va en caja y no en lista porque no es
   un paso mas: es el resumen de por que lo anterior importa. */
.nadie{margin:26px 0 0;padding:16px 18px;background:rgba(255,138,43,.08);
  border:1px solid rgba(255,138,43,.3);border-radius:10px}
.nadie b{display:block;font-size:.6rem;font-weight:900;letter-spacing:.13em;
  color:var(--brasa);text-transform:uppercase;margin-bottom:7px}
.nadie p{margin:0;color:var(--hueso);font-size:1rem;line-height:1.5}

/* El remate de la seccion. Mas grande que el texto de
   alrededor porque no explica nada: es la frase que se queda. La
   marca va en sus propios colores, los mismos de la cabecera. */
.remate{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--linea);
  font-size:1.18rem;font-weight:800;letter-spacing:-.015em;line-height:1.35;
  color:var(--hueso);text-align:center}
/* La raya cruza entera — cierra la seccion — pero la frase va corta y
   al medio. Centrada de borde a borde se leeria como un parrafo mal
   puesto; asi parte por donde tiene sentido. */
.remate span{display:block;max-width:24ch;margin:0 auto}
.remate em{font-style:normal;color:var(--brasa)}
.remate i{font-style:normal;color:var(--viva)}
@media(max-width:380px){ .remate{font-size:1.06rem} }

/* La línea del jugador, separada de los pasos pero sin ser otra
   sección: es una salida, no un tema. Centrada, para que el botón
   no se confunda con el principio de otro párrafo. */
.soyjug{margin:26px auto 14px;color:var(--humo);max-width:52ch;text-align:center}
#btnJug{display:block;width:max-content;margin:0 auto}

/* ── Como clavar ──────────────────────────────────────────────── */
.beats{margin:20px 0 0;display:grid;gap:0}
.beat{padding:15px 0;border-top:1px solid var(--linea)}
.beat:last-child{border-bottom:1px solid var(--linea)}
.beat b{display:block;font-size:1.08rem;font-weight:800;margin-bottom:3px}
.beat span{color:var(--humo);font-size:.97rem}

/* ── Llamada ──────────────────────────────────────────────────── */
.jugar{display:inline-block;background:var(--brasa);color:#0A1118;font-weight:900;
  font-size:1.12rem;text-decoration:none;padding:17px 34px;border:2px solid var(--brasa)}
.jugar:hover{background:var(--noche);color:var(--brasa)}
.jugar:focus-visible,.langb:focus-visible,a:focus-visible{outline:3px solid var(--viva);outline-offset:3px}
.gratis{color:var(--humo);font-size:.92rem;margin:13px 0 0}

/* Quien llega aquí casi nunca trae código, así que la puerta que
   enseña la portada es la que sí es suya. */
.pedir{display:inline-block;border:2px solid var(--hueso);color:var(--hueso);
  text-decoration:none;font-weight:800;padding:12px 22px}
.pedir:hover{background:var(--hueso);color:var(--noche)}

/* ── Pie ──────────────────────────────────────────────────────── */
footer{border-top:1px solid var(--linea);padding:30px 0 calc(26px + env(safe-area-inset-bottom,0px));
  color:var(--humo);font-size:.84rem}
footer a{color:var(--viva);text-decoration:none}
footer a:hover{text-decoration:underline}
.rutas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:22px 18px;margin:0 0 26px;text-align:left}
.rutas b{display:block;color:var(--hueso);font-size:.86rem;margin:0 0 7px}
.rutas a{display:block;padding:3px 0;font-size:.9rem}
.abajo{text-align:center}
.abajo p{margin:0 auto 7px;max-width:54ch}
.legal a{color:var(--humo)}
.legal span{padding:0 7px;opacity:.5}

/* Si el sistema pide menos movimiento, la pelota se queda en el piso.
   Quieta, no escondida: sigue siendo una pelota de baloncesto. */
@media (prefers-reduced-motion:reduce){
  .salta,.achata,.rueda,.onda{animation:none !important}
  .salta{transform:translateY(0)}
  .onda{opacity:0}
}

/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
.mark em, .wm em{font-style:normal;color:#FF8A2B !important}
.mark i,  .wm i {font-style:normal;color:#4FD3F0 !important}
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}


/* Los cuatro golpes del ruedo. Cuatro frases cortas hacen el trabajo
   que no hace un parrafo: decir lo que ESTO no es. */
.golpes{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;
  gap:9px;justify-content:center}
.golpes li{font-size:.84rem;font-weight:800;letter-spacing:-.01em;color:var(--hueso);
  background:rgba(79,211,240,.09);border:1px solid rgba(79,211,240,.26);
  border-radius:999px;padding:8px 15px}
@media(max-width:380px){ .golpes li{font-size:.78rem;padding:7px 12px} }

/* La tarjeta del Fortress. Entera es el enlace: en un telefono, un
   "ver mas" de dos palabras es un blanco diminuto, y aqui el area de
   toque es toda la caja. */
.tarjeta{display:block;text-decoration:none;padding:20px 22px;
  background:var(--cancha);border:1px solid var(--linea);
  border-left:4px solid var(--viva);border-radius:12px;
  transition:border-color .16s,background .16s,transform .16s}
.tarjeta:hover{background:#12293B;border-color:var(--humo);
  border-left-color:var(--viva);transform:translateY(-2px)}
.tarjeta:focus-visible{outline:3px solid var(--viva);outline-offset:3px}
.t-kick{display:block;font-size:.6rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--viva);margin-bottom:8px}
.t-tit{display:block;font-size:1.3rem;font-weight:900;letter-spacing:-.02em;
  color:var(--hueso);line-height:1.15}
.t-txt{display:block;margin:9px 0 0;color:var(--humo);font-size:.97rem;line-height:1.55}
.t-ir{display:block;margin:13px 0 0;color:var(--viva);font-size:.9rem;font-weight:800}
.tarjeta:hover .t-ir{color:var(--hueso)}
@media(prefers-reduced-motion:reduce){ .tarjeta{transition:none}
  .tarjeta:hover{transform:none} }

/* La pelota del ruedo. Bota, se achata cuando toca el piso, y gira
   despacio. Tres animaciones en tres grupos anidados a proposito: una
   sola transform no puede llevar el salto, el achatamiento y el giro a
   la vez sin que se peleen. */
.bola{fill:var(--brasa)}
.costura{fill:none;stroke:#7A2E00;stroke-width:3.2;stroke-linecap:round;opacity:.55}

.salta{animation:salta 1.25s infinite}
@keyframes salta{
  /* Cayendo acelera y subiendo frena, que es lo que hace una pelota.
     Con un easing simetrico parece colgada de un hilo. */
  0%   {transform:translateY(-172px); animation-timing-function:cubic-bezier(.38,0,.9,.46)}
  44%  {transform:translateY(0)}
  54%  {transform:translateY(0);      animation-timing-function:cubic-bezier(.1,.62,.55,1)}
  100% {transform:translateY(-172px)}
}

/* El achatamiento, desde abajo: una pelota se deforma contra el piso,
   no alrededor de su centro. */
.achata{transform-box:fill-box;transform-origin:center bottom;
  animation:achata 1.25s infinite}
@keyframes achata{
  0%,40%   {transform:scale(1,1)}
  47%      {transform:scale(1.15,.85)}
  56%,100% {transform:scale(1,1)}
}

/* El giro, lento. Rapido, las costuras se vuelven un borron. */
.rueda{transform-box:fill-box;transform-origin:center;
  animation:rueda 7s linear infinite}
@keyframes rueda{ to{transform:rotate(360deg)} }

/* La onda, sincronizada con el golpe. */
.onda{fill:none;stroke:var(--viva);stroke-width:2;opacity:0;
  transform-box:fill-box;transform-origin:center;
  animation:onda 1.25s infinite}
@keyframes onda{
  0%,40%   {opacity:0;   transform:scale(.35)}
  50%      {opacity:.45; transform:scale(1)}
  72%,100% {opacity:0;   transform:scale(1.6)}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="mark" href="/">cada&nbsp;<em>punto</em>&nbsp;<i>cuenta</i></a>
    <button class="langb" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</header>

<!-- La cancha, sin nada encima. El juego es baloncesto de verdad: no
     hay nada que explicar con un dibujo, y un titular sobre una cancha
     vacía dice lo que hace falta. -->
<section class="ruedo">
  <div class="wrap">
    <svg class="pista" viewBox="0 58 800 420" role="img" aria-labelledby="pistaT">
      <title id="pistaT">Una cancha de baloncesto vista de lado, con el círculo central</title>
      <ellipse class="piso" cx="400" cy="430" rx="330" ry="54"></ellipse>
      <ellipse class="piso" cx="400" cy="430" rx="190" ry="31" opacity=".6"></ellipse>

      <!-- La onda del bote, debajo de la pelota. Va antes para que la
           pelota le caiga encima y no al revés. -->
      <ellipse class="onda" cx="400" cy="430" rx="62" ry="11"></ellipse>

      <!-- Una pelota de baloncesto, no un punto naranja: las cuatro
           costuras de siempre. Todo cuelga de un translate al centro,
           asi que los giros y el achatamiento pasan alrededor de ella
           y no de la esquina del lienzo. -->
      <g transform="translate(400,378)">
        <g class="salta">
          <g class="achata">
            <g class="rueda">
              <circle class="bola" r="52"></circle>
              <g class="costura">
                <path d="M-52 0 H 52"></path>
                <path d="M0 -52 V 52"></path>
                <path d="M0 -52 Q -62 0 0 52"></path>
                <path d="M0 -52 Q  62 0 0 52"></path>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
    <h1 class="titular" id="h1"></h1>
    <p class="bajo" id="bajo"></p>
    <ul class="golpes" id="golpes"></ul>
  </div>
</section>

<main>
  <div class="wrap">

    <section class="sec">
      <h2 id="h2como"></h2>
      <p id="pComo"></p>
      <ol class="pasos" id="pasos"></ol>
      <ul class="claves" id="claves"></ul>
      <p class="remate"><span id="remate"></span></p>
    </section>

    <!-- El cobro. Es lo que un programa no puede hacer por su cuenta,
         y por eso va entero y no resumido: juntar promesas es fácil,
         cobrarlas es el trabajo. -->
    <section class="sec">
      <h2 id="h2cob"></h2>
      <p id="pCob"></p>
      <ol class="pasos" id="cobpasos"></ol>
      <p class="dura"><b id="duraL"></b> <span id="duraP"></span></p>
      <div class="nadie" id="nadie">
        <b id="nadieH"></b>
        <p id="nadieP"></p>
      </div>
    </section>

    <!-- El Fortress, como lo que es ahora: el otro camino, para un
         programa sin temporada o para un segundo evento. Tarjeta y no
         seccion a proposito — una seccion lo pondria al nivel del
         modelo principal, y no lo esta. -->
    <section class="sec">
      <a class="tarjeta" href="the-fortress.html">
        <b class="t-kick" id="fKick"></b>
        <span class="t-tit" id="fTit"></span>
        <span class="t-txt" id="fTxt"></span>
        <span class="t-ir" id="fIr"></span>
      </a>
    </section>

    <section class="sec">
      <h2 id="h2prog"></h2>
      <p id="pProg"></p>
      <a class="jugar" href="equipo.html" id="btnProg"></a>
    </section>

    <section class="sec">
      <h2 id="h2coach"></h2>
      <p id="pCoach"></p>
      <a class="pedir" href="ayuda.html" id="btnCoach"></a>
    </section>

    <section class="sec">
      <h2 id="h2ya"></h2>
      <p id="pYa"></p>
      <a class="jugar" href="contact.html" id="btnYa"></a>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <nav class="rutas" id="rutas"></nav>
    <div class="abajo">
      <p id="fWhat"></p>
      <p>© 2026 Gostar Digital LLC · Puerto Rico ·
         <a href="mailto:gostardigital@gmail.com">gostardigital@gmail.com</a></p>
      <p class="legal" id="legal"></p>
    </div>
  </div>
</footer>

    remate:'Lo que anota tu equipo es lo que prometieron sus padrinos. Cada <em>Punto</em> <i>Cuenta</i>.',

    h2cob:'Prometer es fácil. Cobrar es el trabajo.',
    pCob:'Juntar promesas lo hace cualquiera. Lo que mata estas recaudaciones viene después: doscientas personas que deben doscientas cantidades distintas — $16.20, $6.45, $42.75 — cada una sacada de un marcador distinto. Nadie quiere ese trabajo, y el que lo intenta a mano lo deja a medias. Por eso el cobro no se lo dejamos a nadie.',
    cobpasos:[

    nadieH:'Lo que nadie tiene que hacer',
    nadieP:'Pedirle dinero a nadie. Ni el entrenador a las abuelas de sus jugadores, ni un nene a su tío, ni tú a ninguno de los dos. Nadie cuenta efectivo, nadie manda un sobre a la escuela y nadie lleva una lista de quién debe qué. Es un pago con tarjeta y un recibo, como cualquier cosa que se paga por internet.',

  en:{
    titulo:'Cada Punto — your team scores, your program gets paid',

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  localStorage.getItem('fc-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'); }catch(e){}

function T(k){ var v=(S[LANG]&&S[LANG][k]); return v===undefined?S.es[k]:v }
function $(id){ return document.getElementById(id) }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
/* Los textos con <b> o <em> van por innerHTML; el resto por
   textContent. Mezclarlos es como se cuela una etiqueta a la vista. */
function pon(id,t){ var e=$(id); if(e) e.textContent=t }

function toggleLang(){
  LANG = LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG); localStorage.setItem('cp-lang',LANG);
       localStorage.setItem('fc-lang',LANG); }catch(e){}
  $('langBtn').textContent = LANG==='es'?'EN':'ES';
  pintar();
}

function pintar(){
  document.documentElement.lang=LANG;
  document.title=T('titulo');

  pon('h1',T('h1'));  pon('bajo',T('bajo'));
  $('golpes').innerHTML=T('golpes').map(function(g){
    return '<li>'+esc(g)+'</li>';
  }).join('');

  pon('h2como',T('h2como'));  pon('pComo',T('pComo'));
  $('pasos').innerHTML=T('pasos').map(function(p){
    return '<li><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></li>';
  }).join('');
  $('claves').innerHTML=T('claves').map(function(c){
    return '<li>'+c+'</li>';
  }).join('');
  $('remate').innerHTML=T('remate');

  pon('h2cob',T('h2cob'));  pon('pCob',T('pCob'));
  $('cobpasos').innerHTML=T('cobpasos').map(function(p){
    return '<li><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></li>';
  }).join('');
  pon('duraL',T('duraL'));
  $('duraP').innerHTML=T('duraP');
  pon('nadieH',T('nadieH'));  pon('nadieP',T('nadieP'));

  pon('fKick',T('fKick'));  pon('fTit',T('fTit'));
  pon('fTxt',T('fTxt'));    pon('fIr',T('fIr'));

  pon('h2prog',T('h2prog'));   pon('pProg',T('pProg'));   pon('btnProg',T('btnProg'));
  pon('h2coach',T('h2coach')); pon('pCoach',T('pCoach')); pon('btnCoach',T('btnCoach'));
  pon('h2ya',T('h2ya'));       pon('pYa',T('pYa'));       pon('btnYa',T('btnYa'));

  pon('fWhat',T('fWhat'));
  $('rutas').innerHTML=T('rutas').map(function(g){
    return '<div class="ruta"><b>'+esc(g[0])+'</b>'+
      g[1].map(function(l){
        return '<a href="'+esc(l[0])+'">'+esc(l[1])+'</a>';
      }).join('')+'</div>';
  }).join('');
  $('legal').innerHTML=T('legal').map(function(l){
    return '<a href="'+esc(l[0])+'">'+esc(l[1])+'</a>';
  }).join('<span class="punto">·</span>');
}

$('langBtn').textContent = LANG==='es'?'EN':'ES';
pintar();
</script>
