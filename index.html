<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every Point — a fundraiser that sharpens memory</title>
<style>
:root{
  --ink:#0a0a0f;
  --panel:#150f1b;
  --line:#2e2140;
  --purple:#a855f7;
  --purple-deep:#7c3aed;
  --gold:#ffd35a;
  --paper:#f3eef7;
  --mute:#8e84a0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--ink);color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{width:min(620px,92vw);margin:0 auto;padding:26px 0 60px}

h1{font-size:clamp(2rem,6vw,2.9rem);font-weight:900;font-style:italic;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
h1 span{color:var(--purple)}
h2{font-size:1.15rem;font-weight:900;letter-spacing:-.01em;margin:0 0 .5em}
.kick{font-size:.68rem;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--purple);margin-bottom:8px}
p{margin:0 0 1em;color:#ded5e8}
.mute{color:var(--mute);font-size:.9rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stat{background:#0e0a14;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center}
.stat-label{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.stat-val{font-size:1.7rem;font-weight:900;line-height:1}
.stat.gold .stat-val{color:var(--gold)}
.stat.purple .stat-val{color:var(--purple)}

label{display:block;font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
input{
  width:100%;padding:13px 14px;border-radius:10px;
  border:1px solid #ffffff1f;background:#0e0a14;color:#fff;
  font-family:inherit;font-size:1rem;
}
input:focus{outline:none;border-color:var(--purple)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:100%;padding:15px;border:none;border-radius:12px;
  font-family:inherit;font-size:1rem;font-weight:900;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,var(--purple-deep),var(--purple));color:#fff;
}
.btn:active{transform:scale(.99)}
.btn.gold{background:linear-gradient(135deg,#ffd35a,#ff8c42);color:#2a1a00}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--paper)}

.pledge-preview{
  margin-top:12px;padding:12px 14px;border-radius:10px;
  background:rgba(255,211,90,.07);border:1px solid rgba(255,211,90,.25);
  font-size:.9rem;color:var(--gold);min-height:44px;display:flex;align-items:center;
}

.roster a{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 14px;background:#0e0a14;border:1px solid var(--line);
  border-radius:10px;margin:7px 0;text-decoration:none;color:var(--paper);
}
.roster .pts{color:var(--gold);font-weight:900;flex-shrink:0}

.steps{counter-reset:s;margin-top:10px}
.step{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.step::before{content:counter(s);font-size:1.5rem;font-weight:900;color:var(--line);line-height:.9}
.step b{display:block;margin-bottom:2px}
.step span{color:var(--mute);font-size:.92rem}

.msg{margin-top:14px;font-size:.9rem;font-weight:700;min-height:20px}
/* One card per game. Each keeps its own colour so the three read as
   genuinely different things rather than three of the same. */
.games{display:grid;gap:10px;margin-top:14px}
.game-card{
  display:block;padding:16px 18px;border-radius:14px;text-decoration:none;
  border:1.5px solid var(--line);background:#0e0a14;color:var(--paper);
  transition:transform .08s,background .12s;
}
.game-card:active{transform:scale(.985)}
.game-name{display:block;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.01em;font-size:1.05rem}
.game-desc{display:block;margin-top:4px;font-size:.85rem;color:var(--mute)}
.game-card.fortress{border-color:rgba(168,85,247,.45);background:rgba(168,85,247,.07)}
.game-card.fortress .game-name{color:#c9a3fa}
.game-card.recall{border-color:rgba(255,107,53,.45);background:rgba(255,107,53,.07)}
.game-card.recall .game-name{color:#ffb38a}
.game-card.recognition{border-color:rgba(255,149,0,.45);background:rgba(255,149,0,.07)}
.game-card.recognition .game-name{color:#ffc074}

/* The landing page's own masthead — everything above the pitch is
   centred on the logo, which is the one place a first-time visitor
   should be looking. */
.brandhead{text-align:center;margin-bottom:22px}
.brandhead .kick{display:block;margin-bottom:14px}
/* The wordmark stands in until the new logo arrives — sized so the
   masthead keeps its weight rather than collapsing. */
.brandhead h1{font-size:clamp(2.4rem,9vw,4rem)}
.brandhead h1{margin:0}

.tryout-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:#0e0a14;border:1px solid var(--line);margin:7px 0}
.tryout-row.lead{border-color:rgba(255,211,90,.5);background:rgba(255,211,90,.08)}
.tryout-row b{color:var(--gold);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-left:6px}
.tryout-row .pts{color:var(--gold);font-weight:900;text-align:right}
.tryout-row .pts .sub{display:block;color:var(--mute);font-weight:700;font-size:.68rem}

.tryout-play{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:12px;text-decoration:none;margin:7px 0;border:1.5px solid var(--line);background:#0e0a14;color:var(--paper)}
.tryout-play:active{transform:scale(.99)}
.tryout-play .tp-name{font-weight:900;font-style:italic;text-transform:uppercase;font-size:.98rem}
.tryout-play .tp-score{color:var(--mute);font-size:.85rem;flex-shrink:0}
.tryout-play.fortress{border-color:rgba(168,85,247,.4)} .tryout-play.fortress .tp-name{color:#c9a3fa}
.tryout-play.recall{border-color:rgba(255,107,53,.4)} .tryout-play.recall .tp-name{color:#ffb38a}
.tryout-play.recognition{border-color:rgba(255,149,0,.4)} .tryout-play.recognition .tp-name{color:#ffc074}

.coach-card{
  display:block;margin-top:18px;padding:18px;border-radius:16px;text-decoration:none;
  border:1.5px solid rgba(255,211,90,.4);background:rgba(255,211,90,.07);color:var(--paper);
  transition:transform .08s,background .12s;
}
.coach-card:active{transform:scale(.99)}
.coach-kick{display:block;font-size:.62rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.coach-name{display:block;font-weight:900;font-style:italic;text-transform:uppercase;font-size:1.15rem}
.coach-desc{display:block;margin-top:5px;font-size:.9rem;color:var(--mute)}

.try-link{
  display:block;margin-top:10px;text-align:center;font-size:.85rem;
  color:var(--gold);text-decoration:none;border:1px dashed rgba(255,211,90,.35);
  border-radius:10px;padding:10px;
}
.try-link:active{background:rgba(255,211,90,.08)}

footer{border-top:1px solid var(--line);margin-top:34px;padding-top:20px;text-align:center;color:var(--mute);font-size:.8rem}
</style>
</head>

}

  LANG = LANG === 'en' ? 'es' : 'en';

    if (!r.ok) throw new Error('request failed');
    return r.json();

        '<div class="step"><div><b>' + T('s2h') + '</b><span>' + T('s2p') + '</span></div></div>' +
        '<div class="step"><div><b>' + T('s3h') + '</b><span>' + T('s3p') + '</span></div></div>' +
        '<div class="step"><div><b>' + T('s4h') + '</b><span>' + T('s4p') + '</span></div></div>' +
      '</div>' +
    '</div>' +

    // Free practice, straight from the browser. No code, no link, no
    // account — a kid can get good at any of these before a challenge
    // ever exists, which is the whole point of practice being free.
    '<div class="panel">' +
      '<h2>' + T('practiceTitle') + '</h2>' +
      '<p class="mute">' + T('practiceNote') + '</p>' +
      '<div class="games">' +
        '<a class="game-card fortress" href="fortress.html">' +
          '<span class="game-name">' + T('gFortress') + '</span>' +
          '<span class="game-desc">' + T('gFortressDesc') + '</span>' +
        '</a>' +
        '<a class="game-card recall" href="recall.html">' +
          '<span class="game-name">' + T('gRecall') + '</span>' +
          '<span class="game-desc">' + T('gRecallDesc') + '</span>' +
        '</a>' +
        '<a class="game-card recognition" href="recognition.html">' +
          '<span class="game-name">' + T('gRecognition') + '</span>' +
          '<span class="game-desc">' + T('gRecognitionDesc') + '</span>' +
        '</a>' +
      '</div>' +
      '<p class="mute" style="margin:14px 0 0;font-size:.85rem;">' + T('freeNote') + '</p>' +
    '</div>' +

    // A coach who types the domain rather than following a player's
    // link lands here, so the way through to the pitch and the
    // sign-up form has to be on this page.
    '<a class="coach-card" href="teams.html">' +
      '<span class="coach-kick">' + T('coachKick') + '</span>' +
      '<span class="coach-name">' + T('coachTitle') + '</span>' +
      '<span class="coach-desc">' + T('coachDesc') + '</span>' +
    '</a>' +

    '<p class="mute" style="margin-top:26px;">' + T('haveLink') + '</p>' +
    footerHtml();
}

function footerHtml(){
  return '<footer>' + T('footer') + '<br>' +
         '<a href="mailto:cashflowhoops@gmail.com" style="color:var(--mute)">cashflowhoops@gmail.com</a></footer>';
}

// ---------- team page ----------
function renderTeam(ch, campaign, players, runs, practice){
  PLEDGE_CH = ch;
  var byPlayer = {};
  runs.forEach(function(r){ byPlayer[r.player_id] = r; });
  var practiceBy = {};
  practice.forEach(function(p){ practiceBy[p.player_id] = p; });

  var teamPoints = runs.reduce(function(sum, r){ return sum + (r.points || 0); }, 0);
  var done = runs.length;

  var roster = players.map(function(p){
    var run = byPlayer[p.id];
    var prac = practiceBy[p.id];
    var right = run
      ? esc(run.points) + ' ' + T('pts')
      : (prac ? T('practisingL') + esc(prac.best_level) : T('notYet'));
    return '<a href="?c=' + encodeURIComponent(CHALLENGE) + '&p=' + encodeURIComponent(p.id) + '">' +
             '<span>' + esc(p.name) + '</span>' +
             '<span class="pts">' + right + '</span>' +
           '</a>';
  }).join('');

  app.innerHTML =
    langBtnHtml() +
    '<div class="kick">' + gameLabel(ch) + ' · ' + T('kick') + '</div>' +
    '<h1>' + esc(campaign ? campaign.name : ch.name) + '</h1>' +
    (ch.name ? '<p class="mute" style="margin-top:8px;">' + esc(ch.name) + '</p>' : '') +

    '<div class="stat-row">' +
      '<div class="stat gold"><div class="stat-label">' + T('teamPoints') + '</div><div class="stat-val">' + teamPoints + '</div></div>' +
      '<div class="stat purple"><div class="stat-label">' + T('runsDone') + '</div><div class="stat-val">' + done + ' / ' + players.length + '</div></div>' +
    '</div>' +

    deadlineHtml(ch) +

    '<div class="panel">' +
      '<h2>' + T('pledgeTeam') + '</h2>' +
      '<p class="mute">' + T('pledgeTeamNote') + '</p>' +
      pledgeFormHtml(null) +
    '</div>' +

    '<div class="panel">' +
      '<h2>' + T('rosterTitle') + '</h2>' +
      '<p class="mute">' + T('rosterNote') + '</p>' +
      '<div class="roster">' + (roster || '<p class="mute">' + T('noPlayers') + '</p>') + '</div>' +
    '</div>' +

    footerHtml();

  wirePledgeForm(null);
}

// ---------- player page ----------
function renderPlayer(ch, campaign, player, run, prac){
  PLEDGE_CH = ch;
  var isMe = false;
  try { isMe = localStorage.getItem('fc-me') === player.id; } catch(e){}

  app.innerHTML =
    langBtnHtml() +
    '<div class="kick">' + gameLabel(ch) + ' · ' + T('kick') + '</div>' +
    '<h1>' + esc(player.name) + '</h1>' +
    '<p class="mute" style="margin-top:8px;">' + esc(campaign ? campaign.name : '') + '</p>' +

    '<div class="stat-row">' +
      (run
        ? '<div class="stat gold"><div class="stat-label">' + T('officialPoints') + '</div><div class="stat-val">' + esc(run.points) + '</div></div>' +
          '<div class="stat"><div class="stat-label">' + T('levelHeld') + '</div><div class="stat-val">' + esc(run.level_reached) + '</div></div>'
        : '<div class="stat purple"><div class="stat-label">' + T('practiceBest') + '</div><div class="stat-val">' + (prac ? 'L' + esc(prac.best_level) : '—') + '</div></div>' +
          '<div class="stat gold"><div class="stat-label">' + T('wouldScore') + '</div><div class="stat-val">' + (prac ? pointsFor(prac.best_level) : '—') + '</div></div>') +
    '</div>' +

    (run
      ? '<p class="mute">' + T('runDone', { L: esc(run.level_reached), P: esc(run.points) }) + '</p>'
      : (prac
          ? '<p class="mute">' + T('practisingNow', { N: esc(player.name), L: esc(prac.best_level), P: pointsFor(prac.best_level) }) + '</p>'
          : '<p class="mute">' + T('notPractised', { N: esc(player.name) }) + '</p>')) +

    deadlineHtml(ch) +

    // A sponsor never sees a button that could end this player's one
    // official run, and a player is not shown a pledge form for
    // themselves. Which half appears depends on the run key.
    (RUN_KEY

      ? '<div class="panel">' +
          '<h2>' + (run ? T('yourRunDone') : T('yourRunTitle')) + '</h2>' +
          (run
            ? '<p class="mute">' + T('runDoneNote', { L: esc(run.level_reached), P: esc(run.points) }) + '</p>' +
              '<a class="btn line" href="' + gameFile(ch) + '">' + T('practiceOnlyBtn') + '</a>'
            : '<p class="mute">' + T('practiceNote') + '</p>' +
              '<a class="btn line" href="' + gameFile(ch) + '?c=' + encodeURIComponent(CHALLENGE) +
                '&p=' + encodeURIComponent(player.id) + '" style="margin-bottom:10px;">' + T('practiceBtn') + '</a>' +
              '<a class="btn gold" href="' + gameFile(ch) + '?c=' + encodeURIComponent(CHALLENGE) +
                '&p=' + encodeURIComponent(player.id) + '&k=' + encodeURIComponent(RUN_KEY) +
                '&official=1">' + T('officialBtn') + '</a>') +
          '</div>' +
          '<p class="mute" style="font-size:.82rem;">' + T('ownPage') + '</p>' +
          '<a class="btn line" onclick="copyShare(event)" href="#" style="margin-bottom:6px;">' + T('copyShare') + '</a>'

      : (run
          ? '<div class="panel"><h2>' + T('closedTitle') + '</h2>' +
            '<p class="mute">' + T('closedNote') + '</p>' +
            '<a class="btn line" href="?c=' + encodeURIComponent(CHALLENGE) + '">' + T('seeTeam') + '</a></div>'
          : '<div class="panel"><h2>' + T('pledgeTo', { N: esc(player.name) }) + '</h2>' +
            '<p class="mute">' + T('pledgeNote') + '</p>' +
            pledgeFormHtml(player) + '</div>')) +

    '<a class="btn line" href="?c=' + encodeURIComponent(CHALLENGE) + '" style="margin-top:6px;">← ' +
      esc(campaign ? campaign.name : T('wordTeam')) + '</a>' +

    footerHtml();

  if (!run && !RUN_KEY) wirePledgeForm(player);
}

// The sponsor link is this page without the run key.
function copyShare(e){
  if (e) e.preventDefault();
  var link = window.location.origin + window.location.pathname +
             '?c=' + encodeURIComponent(CHALLENGE) + '&p=' + encodeURIComponent(PLAYER);
  if (navigator.share){
    navigator.share({ url: link }).catch(function(){});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link)
      .then(function(){ alert(T('shareCopied') + '\n\n' + link); })
      .catch(function(){ prompt(T('copyPrompt'), link); });
  } else {
    prompt(T('copyPrompt'), link);
  }
}

function deadlineHtml(ch){
  if (!ch.pledge_deadline && !ch.run_deadline) return '';
  var bits = [];
  if (ch.pledge_deadline) bits.push(T('pledgesClose') + ' ' + esc(ch.pledge_deadline));
  if (ch.run_deadline) bits.push(T('runsBy') + ' ' + esc(ch.run_deadline));
  return '<p class="mute" style="margin-top:-4px;">' + bits.join(' · ') + '</p>';
}

// Set just before a pledge form is drawn, so the try-it link opens
// the game this challenge actually runs.
var PLEDGE_CH = null;

function pledgeFormHtml(player){
  return '' +
    '<label>' + T('yourName') + '</label>' +
    '<input type="text" id="spName" maxlength="60" autocomplete="name">' +
    '<label>' + T('yourEmail') + '</label>' +
    '<input type="email" id="spEmail" maxlength="120" autocomplete="email">' +
    '<label>' + T('perPoint') + '</label>' +
    '<input type="number" id="spRate" step="0.01" min="0.01" placeholder="0.25">' +
    '<div class="pledge-preview" id="spPreview">' + T('previewEmpty') + '</div>' +
    '<p class="mute" style="font-size:.82rem;margin:8px 0 0;">' + T('feeNote') + '</p>' +
    // A sponsor cannot judge what a point is worth until they have
    // played. Two minutes on the game is the best possible answer to
    // "how much should I pledge".
    '<a class="try-link" href="' + gameFile(PLEDGE_CH) + '" target="_blank" rel="noopener">' +
      T('tryYourself') + '</a>' +
    '<button class="btn" id="spSubmit" style="margin-top:14px;">' + T('makePledge') + '</button>' +
    '<div class="msg" id="spMsg"></div>';
}

function wirePledgeForm(player){
  var rate = document.getElementById('spRate');
  var preview = document.getElementById('spPreview');
  var submit = document.getElementById('spSubmit');
  var msg = document.getElementById('spMsg');
  if (!rate || !submit) return;

  // Shows what the pledge would come to at a few realistic scores, so
  // nobody pledges a rate without seeing where it lands.
  rate.addEventListener('input', function(){
    var r = parseFloat(rate.value);
    if (!r || r <= 0){
      preview.textContent = T('previewEmpty');
      return;
    }
    preview.innerHTML = T('previewLine', {
      A: money(55 * r), B: money(120 * r), C: money(210 * r)
    });
  });

  submit.addEventListener('click', function(){
    var name = (document.getElementById('spName').value || '').trim();
    var email = (document.getElementById('spEmail').value || '').trim();
    var r = parseFloat(rate.value);

    if (!name){ return fail(msg, T('needName')); }
    if (!email || email.indexOf('@') === -1){ return fail(msg, T('needEmail')); }
    if (!r || r <= 0){ return fail(msg, T('needRate')); }

    submit.disabled = true;
    msg.style.color = 'var(--mute)';
    msg.textContent = T('saving');

    fetch(SB_URL + '/rest/v1/pledges', {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        challenge_id: CHALLENGE,
        player_id: player ? player.id : null,
        sponsor_name: name,
        sponsor_email: email,
        rate_per_point: r
      })
    })
    .then(function(res){
      if (!res.ok) throw new Error('save failed');
      msg.style.color = '#00D9A5';
      msg.innerHTML = T('pledgeOk', { R: money(r) });
      document.getElementById('spName').value = '';
      document.getElementById('spEmail').value = '';
      rate.value = '';
      preview.textContent = T('thankYou');
      submit.disabled = false;
    })
    .catch(function(e){
      console.error('Pledge failed:', e);
      submit.disabled = false;
      fail(msg, T('pledgeFail'));
    });
  });
}

function fail(msg, text){
  msg.style.color = '#ff8888';
  msg.textContent = text;
}

function notFound(what){
  app.innerHTML = '<div class="panel"><h2>' + T('notFound', { W: what }) + '</h2>' +
    '<p class="mute">' + T('notFoundNote') + '</p>' +
    '<a class="btn line" href="index.html">' + T('backHome') + '</a></div>' + footerHtml();
}


// ══════════════════════════════════════════════════════
//  TRYOUTS — a team plays all three games and sees which one they
//  are collectively strongest at, before committing a fundraiser to
//  it. No run keys and no official runs: nothing here is worth
//  protecting, and the friction would defeat the point.
// ══════════════════════════════════════════════════════
function loadTryout(campaignId){
  Promise.all([
    get('campaigns?id=eq.' + encodeURIComponent(campaignId) + '&select=name,logo_url'),
    get('players?campaign_id=eq.' + encodeURIComponent(campaignId) + '&select=id,name&order=name.asc'),
    get('campaign_tryouts?campaign_id=eq.' + encodeURIComponent(campaignId) + '&select=player_id,game,best_level,runs')
  ])
  .then(function(res){
    var campaign = res[0] && res[0][0];
    if (!campaign) { notFound(T('wordTeam')); return; }
    renderTryout(campaignId, campaign, res[1] || [], res[2] || []);
  })
  .catch(function(e){
    console.error(e);
    app.innerHTML = '<div class="panel"><p style="color:#ff8888">' + T('loadFail') + '</p></div>';
  });
}

function renderTryout(campaignId, campaign, players, scores){
  var picked = null;
  try { picked = localStorage.getItem('fc-tryout-' + campaignId); } catch(e){}

  // Which game is the team actually best at. Totalling points rather
  // than levels, since points are what a sponsor pays against.
  var totals = { fortress:0, recall:0, recognition:0 };
  var counts = { fortress:0, recall:0, recognition:0 };
  scores.forEach(function(r){
    if (totals[r.game] === undefined) return;
    totals[r.game] += pointsFor(r.best_level);
    counts[r.game] += 1;
  });

  var order = ['fortress','recall','recognition'];
  var leader = order.slice().sort(function(a,b){ return totals[b]-totals[a]; })[0];
  var anyScores = order.some(function(g){ return counts[g] > 0; });

  var me = picked ? players.filter(function(p){ return p.id === picked; })[0] : null;

  var myScores = {};
  if (me) scores.forEach(function(r){ if (r.player_id === me.id) myScores[r.game] = r; });

  app.innerHTML =
    langBtnHtml() +
    '<div class="kick">' + T('tryoutKick') + '</div>' +
    '<h1>' + esc(campaign.name) + '</h1>' +
    '<p class="mute" style="margin-top:8px;">' + T('tryoutLede') + '</p>' +

    (anyScores
      ? '<div class="panel">' +
          '<h2>' + T('teamStanding') + '</h2>' +
          '<p class="mute">' + T('teamStandingNote') + '</p>' +
          order.map(function(g){
            var lead = g === leader && totals[g] > 0;
            return '<div class="tryout-row' + (lead ? ' lead' : '') + '">' +
                     '<span>' + gameLabelKey(g) + (lead ? ' <b>' + T('bestFit') + '</b>' : '') + '</span>' +
                     '<span class="pts">' + totals[g] + ' ' + T('pts') +
                       '<span class="sub">' + counts[g] + ' ' + T('playersWord') + '</span></span>' +
                   '</div>';
          }).join('') +
        '</div>'
      : '') +

    (me
      ? '<div class="panel">' +
          '<h2>' + esc(me.name) + '</h2>' +
          '<p class="mute">' + T('yourTryout') + '</p>' +
          order.map(function(g){
            var r = myScores[g];
            return '<a class="tryout-play ' + g + '" href="' + GAMES[g].file +
                     '?tryout=' + encodeURIComponent(campaignId) + '&p=' + encodeURIComponent(me.id) + '">' +
                     '<span class="tp-name">' + gameLabelKey(g) + '</span>' +
                     '<span class="tp-score">' + (r ? 'L' + r.best_level + ' · ' + pointsFor(r.best_level) + ' ' + T('pts') : T('notPlayed')) + '</span>' +
                   '</a>';
          }).join('') +
          '<a class="btn line" onclick="forgetMe(\'' + campaignId + '\')" href="#" style="margin-top:12px;">' + T('notMe') + '</a>' +
        '</div>'
      : '<div class="panel">' +
          '<h2>' + T('whoAreYou') + '</h2>' +
          '<p class="mute">' + T('whoAreYouNote') + '</p>' +
          '<div class="roster">' +
            (players.length
              ? players.map(function(p){
                  return '<a href="#" onclick="pickMe(\'' + campaignId + '\',\'' + p.id + '\');return false;">' +
                           '<span>' + esc(p.name) + '</span><span class="pts">→</span></a>';
                }).join('')
              : '<p class="mute">' + T('noPlayers') + '</p>') +
          '</div>' +
        '</div>') +

    footerHtml();
}

function gameLabelKey(g){
  return T(g === 'fortress' ? 'gFortress' : g === 'recall' ? 'gRecall' : 'gRecognition');
}

function pickMe(campaignId, playerId){
  try { localStorage.setItem('fc-tryout-' + campaignId, playerId); } catch(e){}
  loadTryout(campaignId);
}

function forgetMe(campaignId){
  try { localStorage.removeItem('fc-tryout-' + campaignId); } catch(e){}
  loadTryout(campaignId);
  return false;
}

// ---------- routing ----------
if (TRYOUT){
  loadTryout(TRYOUT);
} else if (!CHALLENGE){
  renderLanding();
} else {
  get('challenges?id=eq.' + encodeURIComponent(CHALLENGE) + '&select=*')
    .then(function(rows){
      if (!rows || !rows.length) { notFound(T('wordChallenge')); return; }
      var ch = rows[0];

      return Promise.all([
        get('campaigns?id=eq.' + encodeURIComponent(ch.campaign_id) + '&select=name,logo_url'),
        get('players?campaign_id=eq.' + encodeURIComponent(ch.campaign_id) + '&select=id,name&order=name.asc'),
        get('challenge_runs?challenge_id=eq.' + encodeURIComponent(ch.id) + '&select=player_id,level_reached,points'),
        get('challenge_practice?challenge_id=eq.' + encodeURIComponent(ch.id) + '&select=player_id,best_level,runs')
      ]).then(function(res){
        var campaign = res[0] && res[0][0];
        var players = res[1] || [];
        var runs = res[2] || [];
        var practice = res[3] || [];

        if (!PLAYER){
          renderTeam(ch, campaign, players, runs, practice);
          return;
        }

        var player = players.filter(function(p){ return p.id === PLAYER; })[0];
        if (!player) { notFound(T('wordPlayer')); return; }

        var run = runs.filter(function(r){ return r.player_id === PLAYER; })[0];
        var prac = practice.filter(function(r){ return r.player_id === PLAYER; })[0];
        renderPlayer(ch, campaign, player, run, prac);
      });
    })
    .catch(function(e){
      console.error(e);
      app.innerHTML = '<div class="panel"><p style="color:#ff8888">' + T('loadFail') + '</p></div>';
    });
}
</script>
