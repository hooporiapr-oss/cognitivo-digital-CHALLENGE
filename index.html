<style>
:root{
  --ink:#0a0a0f;
  --panel:#150f1b;
  --line:#2e2140;
  --purple:#a855f7;
  --purple-deep:#7c3aed;
  --gold:#ffd35a;
  --paper:#f3eef7;
  --mute:#8e84a0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--ink);color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{width:min(620px,92vw);margin:0 auto;padding:26px 0 60px}

h1{font-size:clamp(2rem,6vw,2.9rem);font-weight:900;font-style:italic;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
h1 span{color:var(--purple)}
h2{font-size:1.15rem;font-weight:900;letter-spacing:-.01em;margin:0 0 .5em}
.kick{font-size:.68rem;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--purple);margin-bottom:8px}
p{margin:0 0 1em;color:#ded5e8}
.mute{color:var(--mute);font-size:.9rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stat{background:#0e0a14;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center}
.stat-label{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.stat-val{font-size:1.7rem;font-weight:900;line-height:1}
.stat.gold .stat-val{color:var(--gold)}
.stat.purple .stat-val{color:var(--purple)}

label{display:block;font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
input{
  width:100%;padding:13px 14px;border-radius:10px;
  border:1px solid #ffffff1f;background:#0e0a14;color:#fff;
  font-family:inherit;font-size:1rem;
}
input:focus{outline:none;border-color:var(--purple)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:100%;padding:15px;border:none;border-radius:12px;
  font-family:inherit;font-size:1rem;font-weight:900;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,var(--purple-deep),var(--purple));color:#fff;
}
.btn:active{transform:scale(.99)}
.btn.gold{background:linear-gradient(135deg,#ffd35a,#ff8c42);color:#2a1a00}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--paper)}

.pledge-preview{
  margin-top:12px;padding:12px 14px;border-radius:10px;
  background:rgba(255,211,90,.07);border:1px solid rgba(255,211,90,.25);
  font-size:.9rem;color:var(--gold);min-height:44px;display:flex;align-items:center;
}

.roster a{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 14px;background:#0e0a14;border:1px solid var(--line);
  border-radius:10px;margin:7px 0;text-decoration:none;color:var(--paper);
}
.roster .pts{color:var(--gold);font-weight:900;flex-shrink:0}

.steps{counter-reset:s;margin-top:10px}
.step{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.step::before{content:counter(s);font-size:1.5rem;font-weight:900;color:var(--line);line-height:.9}
.step b{display:block;margin-bottom:2px}
.step span{color:var(--mute);font-size:.92rem}

.msg{margin-top:14px;font-size:.9rem;font-weight:700;min-height:20px}
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:20px;text-align:center;color:var(--mute);font-size:.8rem}
</style>

var LANG = 'en';
try { LANG = localStorage.getItem('fc-lang') || ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es' : 'en'); } catch(e){}

function T(key, vals){
  var out = (STR[LANG] && STR[LANG][key]) || STR.en[key] || key;
  if (vals) Object.keys(vals).forEach(function(k){ out = out.split('{'+k+'}').join(vals[k]); });
  return out;
}

function toggleLang(){
  LANG = LANG === 'en' ? 'es' : 'en';
  try { localStorage.setItem('fc-lang', LANG); } catch(e){}
  location.reload();
}

function langBtnHtml(){
  return '<button onclick="toggleLang()" style="position:fixed;top:14px;right:14px;z-index:60;' +
         'padding:7px 13px;border:1px solid var(--line);background:var(--panel);color:var(--mute);' +
         'border-radius:999px;font-family:inherit;font-size:.72rem;font-weight:800;cursor:pointer;">' +
         (LANG === 'en' ? 'ES' : 'EN') + '</button>';
}

var params = new URLSearchParams(window.location.search);
var CHALLENGE = params.get('c');
var PLAYER = params.get('p');

// The run key is what separates a player from a sponsor. It only
// appears in the private link a coach hands to the player, and it is
// verified by the database — adding it to a public link by hand gets
// nowhere, because the key itself cannot be guessed or read.
var RUN_KEY = params.get('k');

function pointsFor(level){ return level > 0 ? (level * (level + 1)) / 2 : 0; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
function money(n){ return '$' + Number(n || 0).toFixed(2); }

function get(path){
  return fetch(SB_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  }).then(function(r){
    if (!r.ok) throw new Error('request failed');
    return r.json();
  });
}

var app = document.getElementById('app');

// ---------- landing ----------
function renderLanding(){
  app.innerHTML =
    langBtnHtml() +
    '<div class="kick">' + T('brand') + '</div>' +
    '<h1>' + T('title1') + '<span>' + T('title2') + '</span></h1>' +

      '<h2>' + T('howTitle') + '</h2>' +
      '<div class="steps">' +
        '<div class="step"><div><b>' + T('s1h') + '</b><span>' + T('s1p') + '</span></div></div>' +
        '<div class="step"><div><b>' + T('s2h') + '</b><span>' + T('s2p') + '</span></div></div>' +
        '<div class="step"><div><b>' + T('s3h') + '</b><span>' + T('s3p') + '</span></div></div>' +
        '<div class="step"><div><b>' + T('s4h') + '</b><span>' + T('s4p') + '</span></div></div>' +
      '</div>' +
    '</div>' +

    '<a class="btn" href="fortress.html">' + T('tryIt') + '</a>' +
    '<p class="mute" style="margin-top:12px;text-align:center;">' + T('freeNote') + '</p>' +

    '<p class="mute" style="margin-top:26px;">' + T('haveLink') + '</p>' +
    footerHtml();
}

function footerHtml(){
  return '<footer>' + T('footer') + '<br>' +
         '<a href="mailto:cashflowhoops@gmail.com" style="color:var(--mute)">cashflowhoops@gmail.com</a></footer>';
}

// ---------- team page ----------
function renderTeam(ch, campaign, players, runs, practice){
  var byPlayer = {};
  runs.forEach(function(r){ byPlayer[r.player_id] = r; });
  var practiceBy = {};
  practice.forEach(function(p){ practiceBy[p.player_id] = p; });

  var teamPoints = runs.reduce(function(sum, r){ return sum + (r.points || 0); }, 0);
  var done = runs.length;

  var roster = players.map(function(p){
    var run = byPlayer[p.id];
    var prac = practiceBy[p.id];
    var right = run
      ? esc(run.points) + ' ' + T('pts')
      : (prac ? T('practisingL') + esc(prac.best_level) : T('notYet'));
    return '<a href="?c=' + encodeURIComponent(CHALLENGE) + '&p=' + encodeURIComponent(p.id) + '">' +
             '<span>' + esc(p.name) + '</span>' +
             '<span class="pts">' + right + '</span>' +
           '</a>';
  }).join('');

  app.innerHTML =
    langBtnHtml() +
    '<div class="kick">' + T('kick') + '</div>' +
    '<h1>' + esc(campaign ? campaign.name : ch.name) + '</h1>' +
    (ch.name ? '<p class="mute" style="margin-top:8px;">' + esc(ch.name) + '</p>' : '') +

    '<div class="stat-row">' +
      '<div class="stat gold"><div class="stat-label">' + T('teamPoints') + '</div><div class="stat-val">' + teamPoints + '</div></div>' +
      '<div class="stat purple"><div class="stat-label">' + T('runsDone') + '</div><div class="stat-val">' + done + ' / ' + players.length + '</div></div>' +
    '</div>' +

    deadlineHtml(ch) +

    '<div class="panel">' +
      '<h2>' + T('pledgeTeam') + '</h2>' +
      '<p class="mute">' + T('pledgeTeamNote') + '</p>' +
      pledgeFormHtml(null) +
    '</div>' +

    '<div class="panel">' +
      '<h2>' + T('rosterTitle') + '</h2>' +
      '<p class="mute">' + T('rosterNote') + '</p>' +
      '<div class="roster">' + (roster || '<p class="mute">' + T('noPlayers') + '</p>') + '</div>' +
    '</div>' +

    footerHtml();

  wirePledgeForm(null);
}

// ---------- player page ----------
function renderPlayer(ch, campaign, player, run, prac){
  var isMe = false;
  try { isMe = localStorage.getItem('fc-me') === player.id; } catch(e){}

  app.innerHTML =
    langBtnHtml() +
    '<div class="kick">' + T('kick') + '</div>' +
    '<h1>' + esc(player.name) + '</h1>' +
    '<p class="mute" style="margin-top:8px;">' + esc(campaign ? campaign.name : '') + '</p>' +

    '<div class="stat-row">' +
      (run
        ? '<div class="stat gold"><div class="stat-label">' + T('officialPoints') + '</div><div class="stat-val">' + esc(run.points) + '</div></div>' +
          '<div class="stat"><div class="stat-label">' + T('levelHeld') + '</div><div class="stat-val">' + esc(run.level_reached) + '</div></div>'
        : '<div class="stat purple"><div class="stat-label">' + T('practiceBest') + '</div><div class="stat-val">' + (prac ? 'L' + esc(prac.best_level) : '—') + '</div></div>' +
          '<div class="stat gold"><div class="stat-label">' + T('wouldScore') + '</div><div class="stat-val">' + (prac ? pointsFor(prac.best_level) : '—') + '</div></div>') +
    '</div>' +

    (run
      ? '<p class="mute">' + T('runDone', { L: esc(run.level_reached), P: esc(run.points) }) + '</p>'
      : (prac
          ? '<p class="mute">' + T('practisingNow', { N: esc(player.name), L: esc(prac.best_level), P: pointsFor(prac.best_level) }) + '</p>'
          : '<p class="mute">' + T('notPractised', { N: esc(player.name) }) + '</p>')) +

    deadlineHtml(ch) +

    // A sponsor never sees a button that could end this player's one
    // official run, and a player is not shown a pledge form for
    // themselves. Which half appears depends on the run key.
    (RUN_KEY

      ? '<div class="panel">' +
          '<h2>' + (run ? T('yourRunDone') : T('yourRunTitle')) + '</h2>' +
          (run
            ? '<p class="mute">' + T('runDoneNote', { L: esc(run.level_reached), P: esc(run.points) }) + '</p>' +
              '<a class="btn line" href="fortress.html">' + T('practiceOnlyBtn') + '</a>'
            : '<p class="mute">' + T('practiceNote') + '</p>' +
              '<a class="btn line" href="fortress.html?c=' + encodeURIComponent(CHALLENGE) +
                '&p=' + encodeURIComponent(player.id) + '" style="margin-bottom:10px;">' + T('practiceBtn') + '</a>' +
              '<a class="btn gold" href="fortress.html?c=' + encodeURIComponent(CHALLENGE) +
                '&p=' + encodeURIComponent(player.id) + '&k=' + encodeURIComponent(RUN_KEY) +
                '&official=1">' + T('officialBtn') + '</a>') +
        '</div>' +
        '<p class="mute" style="font-size:.82rem;">' + T('ownPage') + '</p>' +
        '<a class="btn line" onclick="copyShare(event)" href="#" style="margin-bottom:6px;">' + T('copyShare') + '</a>'

      : (run
          ? '<div class="panel"><h2>' + T('closedTitle') + '</h2>' +
            '<p class="mute">' + T('closedNote') + '</p>' +
            '<a class="btn line" href="?c=' + encodeURIComponent(CHALLENGE) + '">' + T('seeTeam') + '</a></div>'
          : '<div class="panel"><h2>' + T('pledgeTo', { N: esc(player.name) }) + '</h2>' +
            '<p class="mute">' + T('pledgeNote') + '</p>' +
            pledgeFormHtml(player) + '</div>')) +

    '<a class="btn line" href="?c=' + encodeURIComponent(CHALLENGE) + '" style="margin-top:6px;">← ' +
      esc(campaign ? campaign.name : T('wordTeam')) + '</a>' +

    footerHtml();

  if (!run && !RUN_KEY) wirePledgeForm(player);
}

// The sponsor link is this page without the run key.
function copyShare(e){
  if (e) e.preventDefault();
  var link = window.location.origin + window.location.pathname +
             '?c=' + encodeURIComponent(CHALLENGE) + '&p=' + encodeURIComponent(PLAYER);
  if (navigator.share){
    navigator.share({ url: link }).catch(function(){});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link)
      .then(function(){ alert(T('shareCopied') + '\n\n' + link); })
      .catch(function(){ prompt(T('copyPrompt'), link); });
  } else {
    prompt(T('copyPrompt'), link);
  }
}

function deadlineHtml(ch){
  if (!ch.pledge_deadline && !ch.run_deadline) return '';
  var bits = [];
  if (ch.pledge_deadline) bits.push(T('pledgesClose') + ' ' + esc(ch.pledge_deadline));
  if (ch.run_deadline) bits.push(T('runsBy') + ' ' + esc(ch.run_deadline));
  return '<p class="mute" style="margin-top:-4px;">' + bits.join(' · ') + '</p>';
}

function pledgeFormHtml(player){
  return '' +
    '<label>' + T('yourName') + '</label>' +
    '<input type="text" id="spName" maxlength="60" autocomplete="name">' +
    '<label>' + T('yourEmail') + '</label>' +
    '<input type="email" id="spEmail" maxlength="120" autocomplete="email">' +
    '<label>' + T('perPoint') + '</label>' +
    '<input type="number" id="spRate" step="0.01" min="0.01" placeholder="0.25">' +
    '<div class="pledge-preview" id="spPreview">' + T('previewEmpty') + '</div>' +
    '<button class="btn" id="spSubmit" style="margin-top:14px;">' + T('makePledge') + '</button>' +
    '<div class="msg" id="spMsg"></div>';
}

function wirePledgeForm(player){
  var rate = document.getElementById('spRate');
  var preview = document.getElementById('spPreview');
  var submit = document.getElementById('spSubmit');
  var msg = document.getElementById('spMsg');
  if (!rate || !submit) return;

  // Shows what the pledge would come to at a few realistic scores, so
  // nobody pledges a rate without seeing where it lands.
  rate.addEventListener('input', function(){
    var r = parseFloat(rate.value);
    if (!r || r <= 0){
      preview.textContent = T('previewEmpty');
      return;
    }
    preview.innerHTML = T('previewLine', {
      A: money(55 * r), B: money(120 * r), C: money(210 * r)
    });
  });

  submit.addEventListener('click', function(){
    var name = (document.getElementById('spName').value || '').trim();
    var email = (document.getElementById('spEmail').value || '').trim();
    var r = parseFloat(rate.value);

    if (!name){ return fail(msg, T('needName')); }
    if (!email || email.indexOf('@') === -1){ return fail(msg, T('needEmail')); }
    if (!r || r <= 0){ return fail(msg, T('needRate')); }

    submit.disabled = true;
    msg.style.color = 'var(--mute)';
    msg.textContent = T('saving');

    fetch(SB_URL + '/rest/v1/pledges', {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        challenge_id: CHALLENGE,
        player_id: player ? player.id : null,
        sponsor_name: name,
        sponsor_email: email,
        rate_per_point: r
      })
    })
    .then(function(res){
      if (!res.ok) throw new Error('save failed');
      msg.style.color = '#00D9A5';
      msg.innerHTML = T('pledgeOk', { R: money(r) });
      document.getElementById('spName').value = '';
      document.getElementById('spEmail').value = '';
      rate.value = '';
      preview.textContent = T('thankYou');
      submit.disabled = false;
    })
    .catch(function(e){
      console.error('Pledge failed:', e);
      submit.disabled = false;
      fail(msg, T('pledgeFail'));
    });
  });
}

function fail(msg, text){
  msg.style.color = '#ff8888';
  msg.textContent = text;
}

function notFound(what){
  app.innerHTML = '<div class="panel"><h2>' + T('notFound', { W: what }) + '</h2>' +
    '<p class="mute">' + T('notFoundNote') + '</p>' +
    '<a class="btn line" href="index.html">' + T('backHome') + '</a></div>' + footerHtml();
}

// ---------- routing ----------
if (!CHALLENGE){
  renderLanding();
} else {
  get('challenges?id=eq.' + encodeURIComponent(CHALLENGE) + '&select=*')
    .then(function(rows){
      if (!rows || !rows.length) { notFound(T('wordChallenge')); return; }
      var ch = rows[0];

      return Promise.all([
        get('campaigns?id=eq.' + encodeURIComponent(ch.campaign_id) + '&select=name,logo_url'),
        get('players?campaign_id=eq.' + encodeURIComponent(ch.campaign_id) + '&select=id,name&order=name.asc'),
        get('challenge_runs?challenge_id=eq.' + encodeURIComponent(ch.id) + '&select=player_id,level_reached,points'),
        get('challenge_practice?challenge_id=eq.' + encodeURIComponent(ch.id) + '&select=player_id,best_level,runs')
      ]).then(function(res){
        var campaign = res[0] && res[0][0];
        var players = res[1] || [];
        var runs = res[2] || [];
        var practice = res[3] || [];

        if (!PLAYER){
          renderTeam(ch, campaign, players, runs, practice);
          return;
        }

        var player = players.filter(function(p){ return p.id === PLAYER; })[0];
        if (!player) { notFound(T('wordPlayer')); return; }

        var run = runs.filter(function(r){ return r.player_id === PLAYER; })[0];
        var prac = practice.filter(function(r){ return r.player_id === PLAYER; })[0];
        renderPlayer(ch, campaign, player, run, prac);
      });
    })
    .catch(function(e){
      console.error(e);
      app.innerHTML = '<div class="panel"><p style="color:#ff8888">' + T('loadFail') + '</p></div>';
    });
}
</script>
