<style>
/* ── La cancha de noche ───────────────────────────────────────────
   El color sale del juego, no de una paleta: una cancha oscura y la
   luz en las bolas. El cian y el naranja ya son de la casa. */
:root{
  --noche:#07141E; --cancha:#0E2232; --linea:#1B3A4F;
  --viva:#4FD3F0;  --brasa:#FF8A2B;
  --hueso:#EAF2F7; --humo:#7A96A9;
  --ancho:min(680px,90vw);
}
*{box-sizing:border-box}
html{background:var(--noche)}
body{margin:0;background:var(--noche);color:var(--hueso);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:var(--ancho);margin:0 auto}

/* ── Cabecera ─────────────────────────────────────────────────── */
.top{background:var(--noche);border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top,0px)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{color:#EAF2F7;text-decoration:none;font-size:23px;font-weight:800;
  letter-spacing:-.035em;line-height:1.1}
.mark em{font-style:normal;color:var(--brasa)}
.mark i{font-style:normal;color:var(--viva)}
@media(max-width:380px){ .mark{font-size:20px} }
.langb{border:1px solid var(--linea);background:none;color:var(--humo);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}
.langb:hover{color:var(--hueso);border-color:var(--humo)}

/* ── La cancha viva ───────────────────────────────────────────── */
.ruedo{background:
  radial-gradient(120% 90% at 50% 18%, #13304a 0%, var(--cancha) 48%, var(--noche) 100%);
  border-bottom:1px solid var(--linea);overflow:hidden}
.ruedo .wrap{padding:clamp(16px,4vw,30px) 0 clamp(22px,5vw,38px)}
.pista{display:block;width:100%;height:auto}
.piso{stroke:var(--linea);fill:none;stroke-width:2}

.titular{font-size:clamp(2.2rem,9.5vw,4.2rem);line-height:.95;font-weight:900;
  letter-spacing:-.045em;margin:0;text-transform:uppercase}
/* El lema, debajo del titular. Va en dos lineas a proposito: son dos
   frases y dos duenos, y partirlas es la mitad del mensaje. */
.lema{margin:18px 0 0;font-size:clamp(1.05rem,3vw,1.3rem);font-weight:800;
  letter-spacing:-.02em;line-height:1.3;color:var(--hueso);max-width:30ch}
.lema em{font-style:normal;color:var(--brasa)}
.lema i{font-style:normal;color:var(--viva)}
.lema span{display:block}

/* Las tres del lema: catorce dias, un juego, resultados solos. */
.golpes{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;
  gap:9px;justify-content:center}
.golpes li{font-size:.84rem;font-weight:800;letter-spacing:-.01em;color:var(--hueso);
  background:rgba(79,211,240,.09);border:1px solid rgba(79,211,240,.26);
  border-radius:999px;padding:8px 15px}
@media(max-width:380px){ .golpes li{font-size:.78rem;padding:7px 12px} }

/* ── Cuerpo ───────────────────────────────────────────────────── */
main .wrap{padding:clamp(34px,7vw,58px) 0}
h2{font-size:clamp(1.4rem,4.2vw,1.95rem);font-weight:900;letter-spacing:-.035em;
  line-height:1.08;margin:0 0 12px}
p{margin:0 0 14px;max-width:62ch}
.sec{padding:clamp(30px,6vw,52px) 0;border-top:1px solid var(--linea)}
.sec:first-child{border-top:none;padding-top:0}
.sub{color:var(--humo);margin:0 0 4px}

/* ── Las cinco fases ──────────────────────────────────────────────
   Numeradas porque son una secuencia de verdad: cada una depende de
   la anterior, y el dia que cae va en la propia linea. */
.fases{list-style:none;counter-reset:fase;margin:22px 0 0;padding:0}
.fases li{counter-increment:fase;position:relative;padding:18px 0 18px 48px;
  border-top:1px solid var(--linea)}
.fases li:last-child{border-bottom:1px solid var(--linea)}
.fases li::before{content:counter(fase);position:absolute;left:0;top:19px;
  width:28px;height:28px;border:1.5px solid var(--viva);border-radius:50%;
  color:var(--viva);font-size:.8rem;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.fases .cuando{display:block;font-size:.62rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brasa);margin-bottom:5px}
.fases b{display:block;font-size:1.08rem;font-weight:800;margin-bottom:4px;letter-spacing:-.015em}
.fases span.q{color:var(--humo);font-size:.97rem}

/* ── Quien hace que. Dos columnas, y la raya del medio es el punto
   entero de la pagina: de un lado nosotros, del otro el programa. */
.reparto{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:22px 0 0;
  border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.lado{padding:18px 20px}
.lado+.lado{border-left:1px solid var(--linea)}
.lado.nos{background:rgba(79,211,240,.06)}
.lado.tu{background:rgba(255,138,43,.06)}
.lado h3{margin:0 0 10px;font-size:.62rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase}
.lado.nos h3{color:var(--viva)}
.lado.tu h3{color:var(--brasa)}
.lado ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.lado li{font-size:.95rem;padding-left:15px;position:relative;line-height:1.45}
.lado li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px}
.lado.nos li::before{background:var(--viva)}
.lado.tu li::before{background:var(--brasa)}
@media(max-width:540px){
  .reparto{grid-template-columns:1fr}
  .lado+.lado{border-left:none;border-top:1px solid var(--linea)}
}
.nunca{margin:16px 0 0;color:var(--humo);font-size:.95rem;max-width:58ch}

/* ── La licencia, en tabla: son datos, no argumentos. */
.tabla{width:100%;border-collapse:collapse;margin:20px 0 0;font-size:.96rem}
.tabla th,.tabla td{text-align:left;padding:11px 0;border-bottom:1px solid var(--linea);
  vertical-align:top}
.tabla th{color:var(--humo);font-weight:500;width:46%}
.tabla td{font-weight:800;text-align:right}
.tabla td.no{color:var(--humo);font-weight:500}
.tabla tr:last-child th,.tabla tr:last-child td{border-bottom:none}

/* ── La tarjeta del Fortress ──────────────────────────────────── */
.tarjeta{display:block;text-decoration:none;padding:20px 22px;
  background:var(--cancha);border:1px solid var(--linea);
  border-left:4px solid var(--viva);border-radius:12px;
  transition:border-color .16s,background .16s,transform .16s}
.tarjeta:hover{background:#12293B;border-color:var(--humo);transform:translateY(-2px)}
.tarjeta:focus-visible{outline:3px solid var(--viva);outline-offset:3px}
.t-kick{display:block;font-size:.6rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--viva);margin-bottom:8px}
.t-tit{display:block;font-size:1.3rem;font-weight:900;letter-spacing:-.02em;
  color:var(--hueso);line-height:1.15}
.t-txt{display:block;margin:9px 0 0;color:var(--humo);font-size:.97rem;line-height:1.55}
.t-ir{display:block;margin:13px 0 0;color:var(--viva);font-size:.9rem;font-weight:800}
@media(prefers-reduced-motion:reduce){ .tarjeta{transition:none}
  .tarjeta:hover{transform:none} }

/* ── Llamada ──────────────────────────────────────────────────── */
.jugar{display:inline-block;background:var(--brasa);color:#0A1118;font-weight:900;
  font-size:1.12rem;text-decoration:none;padding:17px 34px;border:2px solid var(--brasa)}
.jugar:hover{background:var(--noche);color:var(--brasa)}
.jugar:focus-visible,.langb:focus-visible,a:focus-visible{outline:3px solid var(--viva);outline-offset:3px}

/* ── El remate: la frase que se queda, y nada mas. */
.remate{margin:0;padding:clamp(30px,6vw,46px) 0 0;border-top:1px solid var(--linea);
  font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.35;text-align:center}
.remate span{display:block;max-width:26ch;margin:0 auto}
.remate em{font-style:normal;color:var(--brasa)}
.remate i{font-style:normal;color:var(--viva)}
@media(max-width:380px){ .remate{font-size:1.08rem} }

/* ── Pie ──────────────────────────────────────────────────────── */
footer{border-top:1px solid var(--linea);padding:30px 0 calc(26px + env(safe-area-inset-bottom,0px));
  color:var(--humo);font-size:.84rem}
footer a{color:var(--viva);text-decoration:none}
footer a:hover{text-decoration:underline}
.rutas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:22px 18px;margin:0 0 26px;text-align:left}
.rutas b{display:block;color:var(--hueso);font-size:.86rem;margin:0 0 7px}
.rutas a{display:block;padding:3px 0;font-size:.9rem}
.abajo{text-align:center}
.abajo p{margin:0 auto 7px;max-width:54ch}
.legal a{color:var(--humo)}
.legal span{padding:0 7px;opacity:.5}

/* ── La pelota. Bota, se achata al tocar el piso y gira despacio.
   Tres animaciones en tres grupos anidados a proposito: una sola
   transform no puede llevar las tres sin que se peleen. */
.bola{fill:var(--brasa)}
.costura{fill:none;stroke:#7A2E00;stroke-width:3.2;stroke-linecap:round;opacity:.55}
.salta{animation:salta 1.25s infinite}
@keyframes salta{
  /* Cayendo acelera y subiendo frena, que es lo que hace una pelota.
     Con un easing simetrico parece colgada de un hilo. */
  0%   {transform:translateY(-172px); animation-timing-function:cubic-bezier(.38,0,.9,.46)}
  44%  {transform:translateY(0)}
  54%  {transform:translateY(0);      animation-timing-function:cubic-bezier(.1,.62,.55,1)}
  100% {transform:translateY(-172px)}
}
.achata{transform-box:fill-box;transform-origin:center bottom;
  animation:achata 1.25s infinite}
@keyframes achata{
  0%,40%   {transform:scale(1,1)}
  47%      {transform:scale(1.15,.85)}
  56%,100% {transform:scale(1,1)}
}
.rueda{transform-box:fill-box;transform-origin:center;animation:rueda 7s linear infinite}
@keyframes rueda{ to{transform:rotate(360deg)} }
.onda{fill:none;stroke:var(--viva);stroke-width:2;opacity:0;
  transform-box:fill-box;transform-origin:center;animation:onda 1.25s infinite}
@keyframes onda{
  0%,40%   {opacity:0;   transform:scale(.35)}
  50%      {opacity:.45; transform:scale(1)}
  72%,100% {opacity:0;   transform:scale(1.6)}
}
@media (prefers-reduced-motion:reduce){
  .salta,.achata,.rueda,.onda{animation:none !important}
  .salta{transform:translateY(0)}
  .onda{opacity:0}
}
</style>

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  localStorage.getItem('fc-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'); }catch(e){}

function T(k){ return (S[LANG]&&S[LANG][k]!==undefined)?S[LANG][k]:S.es[k] }
function $(id){ return document.getElementById(id) }
function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function pon(id,html){ var e=$(id); if(e) e.innerHTML=html }

function toggleLang(){
  LANG = (LANG==='es') ? 'en' : 'es';
  try{ localStorage.setItem('cfh_lang',LANG); localStorage.setItem('cp-lang',LANG);
       localStorage.setItem('fc-lang',LANG); }catch(e){}
  pintar();
}

function pintar(){
  document.documentElement.lang = LANG;
  document.title = T('titulo');
  $('langBtn').textContent = (LANG==='es') ? 'EN' : 'ES';

  pon('h1', esc(T('h1')));
  pon('lema', T('lema'));
  pon('golpes', T('golpes').map(function(g){ return '<li>'+esc(g)+'</li>' }).join(''));

  pon('h2fases', esc(T('h2fases')));
  pon('pFases', esc(T('pFases')));
  pon('fases', T('fases').map(function(f){
    return '<li><span class="cuando">'+esc(f[0])+'</span>'+
           '<b>'+esc(f[1])+'</b><span class="q">'+esc(f[2])+'</span></li>';
  }).join(''));

  pon('h2rep', esc(T('h2rep')));
  pon('repNosH', esc(T('repNosH')));
  pon('repNos', T('repNos').map(function(x){ return '<li>'+esc(x)+'</li>' }).join(''));
  pon('repTuH', esc(T('repTuH')));
  pon('repTu', T('repTu').map(function(x){ return '<li>'+esc(x)+'</li>' }).join(''));
  pon('nunca', esc(T('nunca')));

  pon('h2lic', esc(T('h2lic')));
  pon('lic', T('lic').map(function(r){
    var no = /^(No|Not provided)$/.test(r[1]);
    return '<tr><th>'+esc(r[0])+'</th><td'+(no?' class="no"':'')+'>'+esc(r[1])+'</td></tr>';
  }).join(''));

  pon('fKick', esc(T('fKick')));
  pon('fTit',  esc(T('fTit')));
  pon('fTxt',  esc(T('fTxt')));
  pon('fIr',   esc(T('fIr')));

  pon('h2ya', esc(T('h2ya')));
  pon('pYa',  esc(T('pYa')));
  $('btnYa').textContent = T('btnYa');

  pon('remate', T('remate'));
  pon('fWhat', esc(T('fWhat')));

  pon('rutas', T('rutas').map(function(g){
    return '<div><b>'+esc(g[0])+'</b>'+
      g[1].map(function(l){ return '<a href="'+l[0]+'">'+esc(l[1])+'</a>' }).join('')+'</div>';
  }).join(''));
  pon('legal', T('legal').map(function(l){
    return '<a href="'+l[0]+'">'+esc(l[1])+'</a>';
  }).join('<span>·</span>'));
}

pintar();
</script>
