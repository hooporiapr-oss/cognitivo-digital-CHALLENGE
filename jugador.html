<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi enlace — Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ── El look nuevo: crema, navy y naranja ───────────────────────── */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
/* El teclado del teléfono no achica la página, achica lo que se ve de
   ella. Con el alto clavado y el scroll metido en <main>, el campo
   enfocado se iba debajo del teclado. Rodando la página entera, el
   navegador sí puede subirlo. */
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(560px,calc(100% - 40px));margin:0 auto}

header{flex:0 0 auto;background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
@media(max-width:380px){ .mark{font-size:.92rem} }
.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.langb:hover{border-color:var(--orange);color:var(--orange)}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:34px 0 44px}

.crest{display:block;max-height:72px;max-width:160px;margin:0 auto 14px;object-fit:contain}
.team{text-align:center;color:var(--muted);font-weight:700;font-size:.82rem;
  letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px}
h1{font-size:clamp(1.6rem,4.8vw,2.2rem);line-height:1.15;letter-spacing:-.035em;
  margin:0 0 10px;text-align:center}
.lede{color:var(--muted);margin:0 0 22px;text-align:center}

/* ── La tarjeta donde se pide el nombre ─────────────────────────── */
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:clamp(20px,5vw,28px);box-shadow:0 8px 25px #17243808}
label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 6px}
label:first-of-type{margin-top:0}
input[type=text],select{width:100%;padding:13px 14px;border:1px solid #d6d9d6;
  border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus,select:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,122,24,.18)}

.btn{display:block;width:100%;border:0;border-radius:9px;padding:14px 20px;
  background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.go{background:var(--orange);color:#111a24}
.btn.line{background:transparent;color:var(--navy);border:1px solid var(--navy);margin-top:10px}
.btn.line:hover{background:var(--navy);color:#fff}
.btn:hover{opacity:.92}
.msg{margin:12px 0 0;font-weight:700;font-size:.9rem;min-height:1.2em;text-align:center}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--good)}

/* ── Hecho: el enlace ───────────────────────────────────────────── */
.tick{font-size:2.4rem;text-align:center;line-height:1;margin:0 0 6px;color:var(--orange)}
.linkbox{border:1px solid var(--linea);border-left:5px solid var(--orange);
  border-radius:12px;background:#fff;padding:14px 16px;margin:18px 0 0;
  word-break:break-all;font-size:.84rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  box-shadow:0 8px 25px #17243806}
.cierra{margin:14px 0 0;text-align:center;color:var(--muted);font-size:.9rem}

/* ── Las dos cosas que hay que decirle antes de que lo mande ───── */
.how{background:#fff;border:1px solid var(--linea);border-radius:14px;
  padding:16px 18px;margin:18px 0 0;box-shadow:0 8px 25px #17243806}
.how b{display:block;color:var(--orange);font-size:.72rem;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px}
.how p{margin:0;font-size:.93rem;color:var(--muted)}

footer{flex:0 0 auto;background:#0a1420;color:#aeb9c6;
  padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
footer .f-dot{padding:0 8px;opacity:.45}
.f-what{margin:12px 0 0;font-size:.74rem;line-height:1.5;opacity:.72;max-width:56ch;
  margin-left:auto;margin-right:auto}
</style>

  <div class="wrap bar">

<script>

var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

function rpc(name, args){
  return fetch(SB_URL + '/rest/v1/rpc/' + name, {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args || {})
  }).then(function(r){ if(!r.ok) throw new Error('rpc'); return r.json(); });
}

var S = {
  es:{
    h1:'Tu enlace de padrinos',
    lede:'Pon tu nombre. Te damos un enlace para mandarle a tu familia — lo que prometan queda apuntado a tu nombre.',
    nameL:'Tu nombre', namePh:'Nombre y apellido',

  },
  en:{

    squadPick:'Pick your squad', squadOther:'Other — let me type it',
    go:'Give me my link',
    errName:'Write your full name.',

    doneH:'Done, {N}',

    sinJuegoH:'You’re on the roster, {N}',
    sinJuegoP:'No game has a date yet. The moment your coach sets one, your link shows up right here to send your family — keep this page.',
    cerradoH:'Pledging has closed, {N}',
    cerradoP:'The game has started, so no new pledges can come in. The ones already made still stand.',

    cierra:'Pledging is open until the game — {D}.',
    cierraSinFecha:'Pledging is open until the game starts.',

    share:'Send on WhatsApp',
    copy:'Copy the link',
    copied:'✓ Copied',

    howH:'How it works',
    howP:'Whoever opens your link pledges a few cents for every point your TEAM scores in that game. They pledge before it starts. When it ends, the system calculates what their pledge comes to from the final score and sends them one email with the number. They pay the program directly — the money does not pass through us.',

    quienH:'Who to send it to',
    quienP:'The adults who will actually pay afterwards: mom, dad, grandma, your aunts and uncles, the neighbours, the shop on the corner. This is not a contest to see how many people you send it to. One pledge from someone who will keep it is worth more than twenty from people who will not.',

    noCampH:'You need your team’s link',
    noCampP:'This page gives you your own padrino link, but it has to come from the link your coach sends to the team group. Ask them for it.',
    backHome:'← Back',

    msg:'Back me in Cada Punto! You pledge a few cents for every point my team scores, and you pay the program directly after the game.',
    fWhat:'Cada Punto is a pledge management system from Gostar Digital LLC, a for-profit company. The program receives its money directly; we charge for use of the tool.',
    fAyuda:'Help', fDinero:'Money'
  }
};

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
            localStorage.getItem('fc-lang') ||
            ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function T(k,v){
  var s = (S[LANG] && S[LANG][k]) || S.es[k] || '';
  if (v) Object.keys(v).forEach(function(x){ s = s.split('{'+x+'}').join(v[x]); });
  return s;
}
function toggleLang(){
  LANG = LANG==='es' ? 'en':'es';
  try{ localStorage.setItem('cfh_lang', LANG);
       localStorage.setItem('cp-lang', LANG);
       localStorage.setItem('fc-lang', LANG); }catch(e){}
  draw();
}

var PARAMS = new URLSearchParams(location.search);
var CAMPAIGN = PARAMS.get('c');
var WANT_SQUAD = PARAMS.get('d') || null;   // la categoría que venía en el enlace
var BOARD = null, ME = null;
/* Los nombres de escuadra que ya existen en la campaña. Antes esto
   salía sólo de las notas de los juegos, así que un programa recién
   montado — sin juegos todavía — no ofrecía ninguna y cada familia
   escribía la suya. De ahí salen "Mini", "mini" y "MINI" como tres
   escuadras distintas. */
var SQUADS = [];
var app = document.getElementById('app');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"\']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

// Las escuadras que de verdad existen, sacadas de la lista de la
// campaña y de la nota de cada juego, igual que en el tablero.
function divs(){
  var out = [];
  function add(d){
    d = String(d || '').trim();
    if (!d) return;
    for (var i = 0; i < out.length; i++){
      if (out[i].toLowerCase() === d.toLowerCase()) return;
    }
    out.push(d);
  }
  SQUADS.forEach(add);
  if (BOARD && BOARD.games){
    BOARD.games.forEach(function(g){
      if (g.status === 'cancelled') return;
      add(String(g.note || '').split('·')[0]);
    });
  }
  return out;
}

// Los dos idiomas en el mismo mensaje: el español primero, porque es
// donde está el equipo, y el inglés para la familia de afuera.
function bothLangs(){
  return S.es.msg + '\n\n' + S.en.msg;
}

/* ── El juego al que se le puede prometer ─────────────────────────
   Ya no hay retos con ventana: hay juegos. Se promete al primero sin
   jugar que todavía no haya empezado. Si el único que queda ya
   empezó, no hay enlace que dar — y eso es un caso distinto de no
   tener juego puesto. */
function juegos(){ return (BOARD && BOARD.games) || []; }
function porJugar(){
  return juegos().filter(function(g){
    return g.status !== 'played' && g.status !== 'cancelled';
  }).sort(function(a,b){
    return String(a.plays_on||'9999').localeCompare(String(b.plays_on||'9999'));
  });
}
function elJuego(){
  var abiertos = porJugar().filter(function(g){ return !g.started });
  return abiertos[0] || null;
}
// Hay juego, pero ya empezó: las promesas cerraron.
function yaEmpezo(){
  return !elJuego() && porJugar().length > 0;
}

/* El enlace del padrino: el marcador de la campaña, con el nene
   dentro para que la promesa quede apuntada a su nombre.

   Antes era prometer.html con un challenge_id — el camino del
   Fortress, que ya no existe. Un nene que sacara su enlace de aquí
   le estaba mandando a su familia un enlace a una página muerta.

   Devuelve null cuando no hay juego al que prometer. Eso importa:
   armado a ciegas, el enlace saldría con "undefined" dentro y el
   nene lo repartiría igual. */
function myLink(){
  if (!ME || !ME.id) return null;
  if (!BOARD || !elJuego()) return null;
  return location.origin + '/scoreboard.html?c=' +
         encodeURIComponent(CAMPAIGN) + '&p=' + encodeURIComponent(ME.id);
}

/* plays_on viene como fecha sola (YYYY-MM-DD). Pasarla por new Date()
   la lee como medianoche UTC, y en Puerto Rico eso enseña el día
   anterior. Se arma a mano. */
function cuando(s){
  if (!s) return '';
  try{
    var d;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (m) d = new Date(+m[1], +m[2]-1, +m[3]);
    else   d = new Date(s);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(LANG==='es' ? 'es-PR':'en-US',
      { weekday:'long', day:'numeric', month:'long' });
  }catch(e){ return '' }
}

function pintarPie(){
  document.getElementById('langBtn').textContent = LANG==='es' ? 'EN':'ES';
  var f = document.getElementById('fWhat');  if (f) f.textContent = T('fWhat');
  var a = document.getElementById('fAyuda'); if (a) a.textContent = T('fAyuda');
  var d = document.getElementById('fDinero');if (d) d.textContent = T('fDinero');
}

function comoFunciona(){
  return '<div class="how"><b>' + T('howH') + '</b><p>' + T('howP') + '</p></div>';
}

function draw(){
  pintarPie();

  if (!CAMPAIGN){
    app.innerHTML =
      '<h1>' + T('noCampH') + '</h1>' +
      '<p class="lede">' + T('noCampP') + '</p>' +
      comoFunciona() +
      '<a class="btn line" href="index.html">' + T('backHome') + '</a>';
    return;
  }

  var crest = (BOARD && BOARD.logo)
    ? '<img class="crest" src="' + esc(BOARD.logo) + '" alt="" onerror="this.style.display=\'none\'">'
    : '';
  var team = (BOARD && BOARD.campaign)
    ? '<p class="team">' + esc(BOARD.campaign) + '</p>' : '';

  if (ME){
    var link = myLink();

    if (!link){
      var cerrado = yaEmpezo();
      app.innerHTML =
        crest + team +
        '<div class="tick">…</div>' +
        '<h1>' + T(cerrado ? 'cerradoH' : 'sinJuegoH', { N: esc(ME.name) }) + '</h1>' +
        '<p class="lede">' + T(cerrado ? 'cerradoP' : 'sinJuegoP') + '</p>' +
        comoFunciona();
      return;
    }

    var g = elJuego();
    var fecha = cuando(g.plays_on);

    app.innerHTML =
      crest + team +
      '<div class="tick">' + (ME.waiting ? '…' : '✓') + '</div>' +
      '<h1>' + T(ME.waiting ? 'waitH' : ME.existing ? 'backH' : 'doneH',
                 { N: esc(ME.name) }) + '</h1>' +
      '<p class="lede">' + T(ME.waiting ? 'waitP' : 'doneP') + '</p>' +
      '<div class="linkbox">' + esc(link) + '</div>' +
      '<a class="btn go" href="https://wa.me/?text=' +
        encodeURIComponent(bothLangs() + '\n\n' + link) + '">' + T('share') + '</a>' +
      '<button class="btn line" onclick="copyLink()">' + T('copy') + '</button>' +
      '<p class="cierra">' +
        esc(fecha ? T('cierra', { D: fecha }) : T('cierraSinFecha')) + '</p>' +
      '<p class="msg" id="msg"></p>' +
      '<div class="how"><b>' + T('quienH') + '</b><p>' + T('quienP') + '</p></div>' +
      comoFunciona();
    return;
  }

  app.innerHTML =
    crest + team +
    '<h1>' + T('h1') + '</h1>' +
    '<p class="lede">' + T('lede') + '</p>' +
    '<div class="card">' +
      '<label for="nm">' + T('nameL') + '</label>' +
      '<input id="nm" type="text" maxlength="60" placeholder="' + T('namePh') + '" autocomplete="name">' +
      /* La escuadra sólo se pregunta si el programa tiene escuadras:
         ahí es un toque en una lista y la familia sabe cuál es. Cuando
         no las hay, antes salía un cuadro en blanco pidiendo que se la
         inventaran — una pregunta que un papá no puede contestar y que
         frena el único paso que hay. join() ya aguanta que el campo
         no exista. */
      (divs().length
        ? '<label for="sq">' + T('squadL') + '</label>' +
          '<select id="sq" onchange="otra()">' +
            '<option value="">' + T('squadPick') + '</option>' +
            divs().map(function(d){
              var on = WANT_SQUAD && d.toLowerCase() === WANT_SQUAD.trim().toLowerCase();
              return '<option value="' + esc(d) + '"' + (on ? ' selected' : '') + '>' +
                     esc(d) + '</option>';
            }).join('') +
            '<option value="__otra">' + T('squadOther') + '</option>' +
          '</select>' +
          '<input id="sqx" type="text" maxlength="30" style="display:none;margin-top:8px" ' +
            'placeholder="' + T('squadPh') + '">'
        : '') +
      '<button class="btn go" onclick="join()">' + T('go') + '</button>' +
      '<p class="msg" id="msg"></p>' +
    '</div>' +
    comoFunciona();
}

function say(t,c){
  var el = document.getElementById('msg');
  if (el){ el.textContent = t; el.className = 'msg ' + (c||''); }
}

function join(){
  var name = (document.getElementById('nm').value || '').trim();
  var sel = document.getElementById('sq');
  var squad = ((sel && sel.value) || '').trim();
  if (squad === '__otra'){
    var x = document.getElementById('sqx');
    squad = ((x && x.value) || '').trim();
  }
  if (name.length < 2) return say(T('errName'), 'bad');

  say('…');
  rpc('join_roster', { p_campaign: CAMPAIGN, p_name: name, p_squad: squad })
    .then(function(r){
      if (!r || !r.ok) return say(T('errGen'), 'bad');
      ME = r;
      ME.squad = squad;
      try { localStorage.setItem('cp-me-' + CAMPAIGN, JSON.stringify(ME)); } catch(e){}
      draw();
    })
    .catch(function(e){ console.error(e); say(T('errGen'), 'bad'); });
}

/* "Otra" enseña el cuadrito para escribirla. Hace falta: un programa
   que monta una escuadra nueva a mitad de temporada no puede quedarse
   fuera por no estar en la lista. */
function otra(){
  var sel = document.getElementById('sq'), x = document.getElementById('sqx');
  if (!sel || !x) return;
  var on = sel.value === '__otra';
  x.style.display = on ? 'block' : 'none';
  if (on) x.focus();
}

function copyLink(){
  var link = myLink();
  if (!link) return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(function(){ say(T('copied'), 'ok'); })
      .catch(function(){ say(link); });
    return;
  }
  say(link);
}

// Si ya se añadió en este teléfono, no hace falta otra vez.
//
// Pero lo guardado dice cómo estaba el día que se apuntó, no cómo está
// hoy. Si se guarda "esperando" y nunca se vuelve a mirar, el papá ve
// "falta que tu entrenador lo apruebe" para siempre — también después
// de que el entrenador lo aprobó. Así que al abrir se pregunta.
try {
  var saved = JSON.parse(localStorage.getItem('cp-me-' + CAMPAIGN) || 'null');
  if (saved && saved.id) { ME = saved; ME.existing = true; }
} catch(e){}

function refrescar(){
  if (!ME || !ME.id) return;
  rpc('player_state', { p_id: ME.id })
    .then(function(r){
      if (!r || !r.ok){
        // Lo rechazaron, o ya no está. Que vuelva a empezar.
        ME = null;
        try { localStorage.removeItem('cp-me-' + CAMPAIGN); } catch(e){}
        draw();
        return;
      }
      ME.name    = r.name || ME.name;
      ME.waiting = (r.state === 'pending');
      try { localStorage.setItem('cp-me-' + CAMPAIGN, JSON.stringify(ME)); } catch(e){}
      draw();
    })
    .catch(function(){ /* sin red se queda con lo guardado */ });
}
refrescar();

if (CAMPAIGN){
  rpc('campaign_squads', { p_campaign: CAMPAIGN })
    .then(function(r){ SQUADS = Array.isArray(r) ? r : []; })
    .catch(function(){ SQUADS = []; })
    .then(function(){ return rpc('game_board', { p_campaign: CAMPAIGN }); })
    /* Que falle esto no deja al nene sin página: se queda sin enlace,
       que es exactamente lo que hay que enseñar cuando no se sabe. */
    .then(function(b){ BOARD = (b && b.ok !== false) ? b : null; draw(); })
    .catch(function(e){ console.error(e); draw(); });
} else {
  draw();
}
</script>
