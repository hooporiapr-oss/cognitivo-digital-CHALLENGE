<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Recognition Challenge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:Arial,sans-serif;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}

#screen-intro{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;
  /* Starting at the top rather than centring. With the demo and the
     instructions the intro is now taller than a phone screen, and a
     centred flex column pushes its own top out past the padding —
     which is what put the title under the pinned buttons. */
  justify-content:flex-start;
  background:radial-gradient(ellipse at center,#041A18 0%,#000 70%);z-index:100;
  overflow-y:auto;overflow-x:hidden;
  /* The Back and language buttons are pinned to the top corners, so
     the content starts below them rather than under them. */
  padding:84px 16px 34px;
}
.vrr-sub{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:#2DD4BF;margin-bottom:8px;text-align:center}
.vrr-title{font-size:clamp(1.7rem,6.5vw,2.2rem);font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 40px rgba(45,212,191,.7);margin-bottom:16px;text-align:center}
.vrr-title span{color:#2DD4BF}
.rule-t{font-size:.9rem;color:#c9c0a8;line-height:1.55;max-width:440px;margin-bottom:22px;text-align:center}
.rule-t b{color:#fff}
.big-btn{width:100%;max-width:420px;height:68px;border:none;border-radius:20px;background:linear-gradient(135deg,#2DD4BF,#5EEAD4);color:#04121A;font-size:1.2rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 40px rgba(45,212,191,.7);margin-bottom:14px}
.big-btn:hover{transform:scale(1.03)}
.big-btn.official{background:linear-gradient(135deg,#22D3EE,#0C7FC4);color:#04121A;box-shadow:0 0 40px rgba(34,211,238,.6)}
/* ---- the demonstration and the instructions, intro screen only ---- */
/* The label sits above the grid in its own space rather than
   overlapping the top edge — it is being read, not decorating. */
.demo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px 0 20px}
.demo-label{
  font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  background:#050A12;border:1px solid rgba(34,211,238,.35);color:#22D3EE;
  padding:7px 16px;border-radius:999px;white-space:nowrap;transition:color .2s,border-color .2s;
}
.demo-label.echo{color:#5EEAD4;border-color:rgba(45,212,191,.5)}
.demo-label.good{color:#00D9A5;border-color:rgba(0,217,165,.5)}
.demo-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;
  width:190px;height:190px;margin:0 auto;
  background:#0D1826;border:1px solid rgba(34,211,238,.25);border-radius:14px;
}
.demo-cell{
  border-radius:5px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.8rem;color:transparent;transition:all .15s;
}
/* the two states the whole game turns on */
.demo-cell.lit{background:#22D3EE;border-color:#67E8F9;box-shadow:0 0 14px rgba(34,211,238,.6);transform:scale(1.06)}
.demo-cell.echo{background:#2DD4BF;border-color:#5EEAD4;box-shadow:0 0 14px rgba(45,212,191,.6);transform:scale(1.06)}
.demo-cell.found{background:#00D9A5;border-color:#5EEAD4;color:#04211A;box-shadow:0 0 16px rgba(0,217,165,.7)}
.demo-cell.was{border:2px dashed #22D3EE;background:rgba(34,211,238,.14)}
.demo-grid.pulse{animation:demoPulse .5s ease-out}
@keyframes demoPulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.55)}60%{box-shadow:0 0 22px 7px rgba(45,212,191,.25)}100%{box-shadow:none}}

.htp{width:100%;max-width:420px;margin:0 0 16px}
.htp-toggle{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:12px 16px;border-radius:12px;cursor:pointer;font-family:inherit;
  background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.25);
}
.htp-toggle-text{font-size:.82rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#5EEAD4}
.htp-arrow{color:#5EEAD4;font-size:.7rem;transition:transform .3s}
.htp-toggle.open .htp-arrow{transform:rotate(180deg)}
.htp-body{max-height:0;overflow:hidden;transition:max-height .45s ease-out}
.htp-body.open{max-height:900px}
.htp-card{background:#0D1826;border:1px solid #1E3550;border-radius:12px;padding:15px;margin-top:10px;text-align:left}
.htp-card-title{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#2DD4BF;margin-bottom:11px}
.htp-step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.htp-step:last-child{margin-bottom:0}
.htp-step .n{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:#2DD4BF;color:#04121A;font-size:.72rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.htp-step .tx{font-size:.8rem;color:#CFE3F2;line-height:1.5}
.htp-step .tx b{color:#5EEAD4}
.htp-tip{background:rgba(34,211,238,.07);border-left:3px solid #22D3EE;padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px}
.htp-tip-title{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#22D3EE;margin-bottom:4px}
.htp-tip-text{font-size:.75rem;color:#8AA4BD;line-height:1.45}

.name-input{width:100%;max-width:420px;padding:14px;border-radius:14px;border:2px solid rgba(45,212,191,.4);background:rgba(255,255,255,.05);color:#fff;font-family:Arial,sans-serif;font-size:1rem;text-align:center;margin-bottom:14px}
.name-input:focus{outline:none;border-color:#2DD4BF;box-shadow:0 0 20px rgba(45,212,191,.35)}
.box-open-btn{width:100%;max-width:420px;height:52px;border:2px solid rgba(45,212,191,.5);background:rgba(45,212,191,.1);border-radius:14px;color:#5EEAD4;font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.best-line{margin-top:16px;font-size:.85rem;color:#a7adba}
.best-line b{color:#2DD4BF}
.intro-back{position:fixed;top:16px;left:16px;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;z-index:60}
.lang-btn{position:fixed;top:16px;right:16px;padding:8px 14px;border:2px solid rgba(45,212,191,.45);background:rgba(0,0,0,.5);color:#5EEAD4;font-size:.72rem;font-weight:900;letter-spacing:.08em;border-radius:999px;cursor:pointer;z-index:60}

.official-banner{
  max-width:420px;width:100%;padding:14px 16px;border-radius:14px;
  border:2px solid rgba(34,211,238,.45);background:rgba(34,211,238,.08);
  margin-bottom:18px;text-align:center;
}
.official-banner .ob-kick{font-size:.6rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#22D3EE;margin-bottom:5px}
.official-banner .ob-name{font-size:1.05rem;font-weight:900;color:#fff}
.official-banner .ob-note{font-size:.78rem;color:#c9c0a8;margin-top:6px;line-height:1.45}

#countdown{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
#bigCount{font-size:7rem;font-weight:900;color:#2DD4BF;text-shadow:0 0 40px #2DD4BF,0 0 80px #22D3EE}

#screen-end{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#041A18 0%,#000 70%);text-align:center;padding:20px;overflow-y:auto}
.final-num{font-size:6rem;font-weight:900;color:#2DD4BF;line-height:1;text-shadow:0 0 60px rgba(45,212,191,.9)}
.final-label{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#a7adba;margin-top:10px}
.final-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;margin:18px auto}
.final-stat-cell{border-radius:12px;border:2px solid rgba(45,212,191,.35);background:rgba(45,212,191,.06);padding:12px 4px;text-align:center}
.final-stat-label{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#5EEAD4;margin-bottom:4px}
.final-stat-val{font-size:1.3rem;font-weight:900;color:#fff}
.points-cell{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.08)}
.points-cell .final-stat-label{color:#22D3EE}
.save-status{font-size:.78rem;font-weight:700;margin-top:14px;min-height:18px}
.next-player-btn{margin-top:24px;height:64px;padding:0 40px;border:none;border-radius:16px;background:linear-gradient(120deg,#2DD4BF,#5EEAD4);color:#04121A;font-size:1.15rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(45,212,191,.6)}

#screen-game{position:fixed;inset:0;display:none;flex-direction:column;background:#000;overflow:hidden}
.topbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:10px 10px 4px;flex-shrink:0}
.top-box{background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:5px 14px;text-align:center;min-width:72px}
.top-box.official{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
.top-label{font-size:.55rem;color:#a7adba;text-transform:uppercase;letter-spacing:.06em}
.top-val{font-size:1.3rem;font-weight:900}
#hLevel{color:#fff}#hPoints{color:#22D3EE}#hTime{color:#22D3EE}

#msg{text-align:center;padding:6px;font-size:1.05rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;min-height:32px}
#msg.watch{color:#22D3EE}#msg.echo{color:#2DD4BF}#msg.go{color:#00D9A5}#msg.miss{color:#FF1493}

.court-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.court{
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
  gap:2.2%;padding:2.2%;
  border:2px solid rgba(45,212,191,.4);border-radius:16px;background:#0D1826;
  box-shadow:0 0 60px rgba(45,212,191,.22),inset 0 0 40px rgba(45,212,191,.05),0 20px 60px rgba(0,0,0,.8);
}
.cell{
  border-radius:10px;background:rgba(45,212,191,.05);border:2px solid rgba(45,212,191,.28);
  display:flex;align-items:center;justify-content:center;font-weight:900;
  color:transparent;cursor:pointer;transition:all .08s;touch-action:manipulation;
}
/* Gold is the original pattern, orange is the echo — two clearly
   different colours, because the whole game is telling them apart. */
.cell.lit{background:#22D3EE!important;border-color:#22D3EE!important;box-shadow:0 0 26px rgba(255,215,0,.9)!important;transform:scale(1.05)}
.cell.echo{background:#2DD4BF!important;border-color:#5EEAD4!important;box-shadow:0 0 26px rgba(45,212,191,.9)!important;transform:scale(1.05)}
.cell.correct{background:#00D9A5!important;border-color:#00D9A5!important;box-shadow:0 0 20px rgba(0,217,165,.8)!important}
.cell.wrong{background:rgba(255,20,147,.35)!important;border-color:#FF1493!important;animation:shake .3s}
.cell.answer{border:3px solid #00D9A5!important;background:rgba(0,217,165,.22)!important}
.cell.was{border:3px dashed #22D3EE!important;background:rgba(255,215,0,.16)!important}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

#controls{display:flex;justify-content:center;gap:10px;padding:8px 16px 14px;flex-shrink:0}
.ctrl-btn{height:46px;flex:0 1 170px;max-width:200px;border:2px solid rgba(45,212,191,.5);background:rgba(0,0,0,.4);border-radius:12px;color:#fff;font-size:.92rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div id="screen-intro">
  <a class="intro-back" href="challenges.html" id="introBack">← Back</a>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">ES</button>
  <div class="vrr-title">THE <span>RECOGNITION</span></div>

  <div class="official-banner" id="officialBanner" style="display:none;">
    <div class="ob-kick" id="obKick">Official Run</div>
    <div class="ob-name" id="obPlayer">—</div>
    <div class="ob-note" id="obNote">This run counts. Your sponsors pay on the points you score, and you only get one.</div>
  </div>

  <!-- A running demonstration, so a student who has never seen this
       understands it before reading a word. It loops until they start
       a run, and stops the moment they do. -->
  <div class="demo-wrap">
    <div class="demo-label" id="demoLabel">👀 Watch…</div>
    <div class="demo-grid" id="demoGrid"></div>
  </div>

  <div class="htp">
    <button class="htp-toggle" id="htpToggle" onclick="toggleHtp()">
      <span>📖</span>
      <span class="htp-toggle-text" id="htpText">How to play</span>
      <span class="htp-arrow" id="htpArrow">▼</span>
    </button>
    <div class="htp-body" id="htpBody">
      <div class="htp-card">
        <div class="htp-card-title" id="cObjective">🎯 What to do</div>
        <div class="htp-step"><span class="n">1</span><span class="tx" id="cs1"></span></div>
        <div class="htp-step"><span class="n">2</span><span class="tx" id="cs2"></span></div>
        <div class="htp-step"><span class="n">3</span><span class="tx" id="cs3"></span></div>
      </div>
      <div class="htp-card">
        <div class="htp-card-title" id="cScoring">⭐ Chain scoring</div>
        <div class="htp-step"><span class="n">→</span><span class="tx" id="cp1"></span></div>
        <div class="htp-step"><span class="n">→</span><span class="tx" id="cp2"></span></div>
        <div class="htp-step"><span class="n">→</span><span class="tx" id="cp3"></span></div>
        <div class="htp-tip">
          <div class="htp-tip-title" id="cTipTitle">💡 Tip</div>
          <div class="htp-tip-text" id="cTip"></div>
        </div>
      </div>
    </div>
  </div>
  <button class="big-btn" id="bigStart" onclick="handleStartClick()">▶ START</button>
  <div class="best-line" id="bestLine"></div>
</div>

<div id="countdown"><div id="bigCount">3</div></div>

<div id="screen-game">
  <div class="topbar">
    <div class="top-box"><div class="top-label" id="lblLevel">Pattern</div><div class="top-val" id="hLevel">0</div></div>
    <div class="top-box official"><div class="top-label" id="lblPoints">Points</div><div class="top-val" id="hPoints">0</div></div>
    <div class="top-box"><div class="top-label" id="lblTime">Time</div><div class="top-val" id="hTime">0.0</div></div>
  </div>
  <div id="msg" class="watch"></div>
  <div class="court-area"><div class="court" id="court"></div></div>
  <div id="controls">
    <a class="ctrl-btn" href="challenges.html" id="homeBtn">← Home</a>
  </div>
</div>

<div id="screen-end">
  <div class="final-num" id="endNum">0</div>
  <div class="final-label" id="endLabel">Longest Pattern Recognized</div>

  <div class="final-stats">
    <div class="final-stat-cell points-cell"><div class="final-stat-label" id="statPointsLbl">Points</div><div class="final-stat-val" id="endPoints">0</div></div>
    <div class="final-stat-cell"><div class="final-stat-label" id="statTimeLbl">Time</div><div class="final-stat-val" id="endTime">0.0s</div></div>
  </div>

  <div class="save-status" id="saveStatus"></div>

  <button class="next-player-btn" id="againBtn">▶ PLAY AGAIN</button>
  <a class="box-open-btn" id="backToPledge" href="challenges.html" style="max-width:300px;margin:14px auto 0;">← Back</a>
</div>

<script>
function $(id){return document.getElementById(id)}

var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

// ══════════════════════════════════════════════════════
//  THE RECOGNITION — Challenge edition.
//
//  A pattern is shown, then shown again with exactly one cell moved.
//  The player taps the cell that moved. Each round keeps every
//  earlier position and adds one more, so the pattern grows and the
//  change gets harder to find.
//
//  Escalating by one per round means the points formula is the same
//  as every other game here: reaching pattern length n is n(n+1)/2.
//
//  Practice is free and unrecorded. An official run needs the
//  player's own run key and the database allows only one.
// ══════════════════════════════════════════════════════
var params = new URLSearchParams(window.location.search);
var CHALLENGE_ID = params.get('c') || null;
var PLAYER_ID = params.get('p') || null;
var RUN_KEY = params.get('k');

// A tryout run: the team is deciding which game to use, so the score
// is kept per player per game on the campaign rather than on any
// challenge. Nothing official, no run key.
var TRYOUT = params.get('tryout');
// A one-run competition: the first score stands, and the game says so
// rather than quietly keeping the better of two.
var TRYOUT_ONCE = params.get('once') === '1';
// A warm-up inside a competition: counted, but never scored.
var TRYOUT_PRACTICE = params.get('practice') === '1';

// The page a student came from holds their session for this tab and
// lets it go stale if nothing happens. Playing is something
// happening, so the clock is kept fresh while they are here.
if (TRYOUT) {
  (function keepWarm(){
    var touch = function(){
      try {
        var k = 'fc-sess-' + TRYOUT;
        var raw = sessionStorage.getItem(k);
        if (!raw) return;
        var sess = JSON.parse(raw);
        sess.t = Date.now();
        sessionStorage.setItem(k, JSON.stringify(sess));
      } catch(e){}
    };
    touch();
    setInterval(touch, 30000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) touch();
    });
  })();
}
var IS_OFFICIAL = !TRYOUT && !!(CHALLENGE_ID && PLAYER_ID && RUN_KEY && params.get('official') === '1');

// ══════════════════════════════════════════════════════
//  THE DEMO LIMIT
//
//  Anyone can try this from the site, but a visitor is not a student.
//  A few rounds is enough to understand it; the programme itself is
//  what a school licenses, and students in a campaign play without any
//  limit at all.
// ══════════════════════════════════════════════════════
var DEMO_RUNS = 3;
var DEMO_KEY = 'cp-demo-' + GAME;

function isDemoPlay(){ return !TRYOUT && !CHALLENGE_ID; }

function demoRunsUsed(){
  try { return parseInt(localStorage.getItem(DEMO_KEY) || '0', 10) || 0; }
  catch(e){ return 0; }
}
function noteDemoRun(){
  try { localStorage.setItem(DEMO_KEY, String(demoRunsUsed() + 1)); } catch(e){}
}
function demoRunsLeft(){ return Math.max(0, DEMO_RUNS - demoRunsUsed()); }

// Shown in place of the start button once the tries are gone.
function showDemoEnd(){
  var box = $('screen-intro');
  if (!box) return;

  // Whoever hits this could be a student whose school runs a campaign,
  // or a director deciding whether to. The first needs their own link;
  // the second needs us. Say both, and send nobody to a sales page by
  // surprise.
  var btn = $('bigStart');
  if (btn){
    btn.textContent = T('demoOver');
    btn.dataset.locked = '1';
    btn.onclick = function(e){ if (e) e.preventDefault(); };
    btn.style.opacity = '.45';
    btn.style.cursor = 'default';
  }

  var line = $('bestLine');
  if (line){
    line.innerHTML =
      '<span style="display:block;margin-bottom:10px;">' + T('demoOverNote') + '</span>' +
      '<a href="contact.html" style="display:inline-block;padding:11px 20px;border-radius:11px;' +
        'border:1px solid var(--line);color:var(--paper);text-decoration:none;font-weight:800;">' +
        T('demoTalk') + '</a>';
  }
}

var GAME = 'recognition';

function pointsFor(level){ return level > 0 ? (level * (level + 1)) / 2 : 0; }

var STR = {
  en:{
    demoWatch:'👀 Watch the pattern…', demoSpot:'One moved — find it', demoFound:'✅ Found it!',
    htpText:'How to play',
    cObjective:'🎯 What to do',
    cs1:'<b>Watch</b> the pattern light up, and hold it in your head.',
    cs2:'It comes back in a <b>different colour</b> — with exactly one cell somewhere else.',
    cs3:'<b>Tap the one that moved.</b> Not where it was — where it went.',
    cScoring:'⭐ Chain scoring',
    cp1:'The moved cell <b>stays in its new place</b>, and one more cell is added.',
    cp2:'One wrong tap <b>ends the run</b> — your score is the longest pattern you held.',
    cp3:'Each round is worth its own number — round 9 banks 9 points. So every round is worth more than the last.',
    cTipTitle:'💡 Tip',
    cTip:'Do not try to memorize every cell. Most people do better by noticing the shape the pattern makes, then seeing what breaks it.',
    namePh:'Your name',
    start:'▶ START', startOfficial:'▶ START OFFICIAL RUN', startPractice:'▶ PRACTICE RUN',
    officialKick:'Official Run',
    officialNote:'This run counts. Your sponsors pay on the points you score, and you only get one.',
    alreadyRun:'Your official run is already in: <b>pattern {L}, {P} points</b>. You can keep practising, but this score is final.',
    confirmOfficial:'This is your official run. Your sponsors pay on the points you score, and you only get one. Ready?',

// ══════════════════════════════════════════════════════
//  THE DEMONSTRATION
//
//  Runs on the intro screen only and shares nothing with the game.
//  It shows the one thing the whole game turns on: a pattern, the
//  same pattern again with a single cell somewhere else, and the
//  catch. It stops the moment a run starts.
// ══════════════════════════════════════════════════════
var demoCells=[], demoTimers=[], demoOn=false;

function demoClearTimers(){ demoTimers.forEach(clearTimeout); demoTimers=[]; }
function demoLater(fn, ms){ demoTimers.push(setTimeout(fn, ms)); }

function buildDemo(){
  var g = $('demoGrid');
  if (!g) return;
  g.innerHTML=''; demoCells=[];
  for (var i=0;i<25;i++){
    var c=document.createElement('div');
    c.className='demo-cell';
    g.appendChild(c); demoCells.push(c);
  }
}

function demoPick(n, exclude){
  var pool=[];
  for(var i=0;i<25;i++) if((exclude||[]).indexOf(i)===-1) pool.push(i);
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var t=pool[j]; pool[j]=pool[k]; pool[k]=t;
  }
  return pool.slice(0,n);
}

function demoRound(){
  if (!demoOn) return;

  var pat = demoPick(4);
  var movedFrom = pat[Math.floor(Math.random()*pat.length)];
  var movedTo = demoPick(1, pat)[0];
  var lbl = $('demoLabel');

  demoCells.forEach(function(c){ c.className='demo-cell'; c.textContent=''; });
  lbl.textContent = T('demoWatch'); lbl.className='demo-label';

  // the original
  demoLater(function(){
    if (!demoOn) return;
    pat.forEach(function(i){ demoCells[i].classList.add('lit'); });
  }, 500);

  demoLater(function(){
    if (!demoOn) return;
    demoCells.forEach(function(c){ c.className='demo-cell'; });
  }, 2300);

  // the echo, with one cell somewhere else
  demoLater(function(){
    if (!demoOn) return;
    lbl.textContent = T('demoSpot'); lbl.className='demo-label echo';
    pat.forEach(function(i){
      demoCells[i === movedFrom ? movedTo : i].classList.add('echo');
    });
  }, 2900);

  // the catch, with the old position marked so the change is obvious
  demoLater(function(){
    if (!demoOn) return;
    demoCells[movedTo].className='demo-cell found';
    demoCells[movedTo].textContent='✓';
    demoCells[movedFrom].className='demo-cell was';
    lbl.textContent = T('demoFound'); lbl.className='demo-label good';
    $('demoGrid').classList.add('pulse');
    setTimeout(function(){ var g=$('demoGrid'); if(g) g.classList.remove('pulse'); }, 500);
  }, 4900);

  demoLater(demoRound, 7200);
}

function startDemo(){
  if (demoOn) return;
  demoOn = true;
  buildDemo();
  demoRound();
}
function stopDemo(){
  demoOn = false;
  demoClearTimers();
}

function toggleHtp(){
  $('htpToggle').classList.toggle('open');
  $('htpBody').classList.toggle('open');
}

// ---- the game ----
var GRID = 25;
var START_LENGTH = 2;
var SHOW_MS = 1900;      // the gold pattern
var GAP_MS = 550;        // blank between gold and orange
var BETWEEN_MS = 850;

var phase='idle';
var pattern=[];          // the gold positions
var movedFrom=-1;        // which position left
var movedTo=-1;          // where it went — the answer
var level=0;
var best=0;
var timers=[];
var cells=[];
var runStartTime=0;
var canTap=false;

function clrT(){timers.forEach(clearTimeout);timers=[]}
function msg(t,c){var e=$('msg');e.textContent=t;e.className=c||'watch'}

function resizeCourt(){
  var area=document.querySelector('.court-area');
  var court=$('court');
  if(!area||!court)return;
  var size=Math.min(area.clientWidth, area.clientHeight);
  if(size<80){ requestAnimationFrame(resizeCourt); return; }
  court.style.width=size+'px';
  court.style.height=size+'px';
}
window.addEventListener('resize',resizeCourt);
window.addEventListener('orientationchange',function(){setTimeout(resizeCourt,220)});
document.addEventListener('fullscreenchange',function(){setTimeout(resizeCourt,220)});

function buildCourt(){
  var court=$('court');
  court.innerHTML='';cells=[];
  for(var i=0;i<GRID;i++){
    var c=document.createElement('div');
    c.className='cell';
    (function(idx){
      c.addEventListener('pointerdown',function(e){e.preventDefault();handleTap(idx)});
    })(i);
    court.appendChild(c);
    cells.push(c);
  }
  resizeCourt();
}

function clearCells(){ cells.forEach(function(c){ c.className='cell'; }); }

var audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){} } }
function blip(freq){
  if(!audioCtx)return;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq||440;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.16,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.12);
    o.start(); o.stop(audioCtx.currentTime+.13);
  }catch(e){}
}

function startRun(){
  if(phase==='running')return;
  stopDemo();
  ensureAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } }catch(e){}

  $('screen-intro').style.display='none';
  $('screen-end').style.display='none';
  $('screen-game').style.display='flex';
  buildCourt();

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      resizeCourt();
      countdownThen(function(){ resizeCourt(); beginRun(); });
    });
  });
}

function countdownThen(cb){
  $('countdown').style.display='flex';
  var n=3;$('bigCount').textContent=n;
  var iv=setInterval(function(){
    n--;
    if(n<=0){clearInterval(iv);$('countdown').style.display='none';cb()}
    else{$('bigCount').textContent=n}
  },800);
}

function beginRun(){
  phase='running';
  pattern=[];
  level=0;
  runStartTime=performance.now();
  $('hLevel').textContent='0';$('hPoints').textContent='0';$('hTime').textContent='0.0';
  msg(T('getReady'),'go');
  timers.push(setTimeout(nextLevel,900));
  requestAnimationFrame(tickTimer);
}

function tickTimer(){
  if(phase!=='running')return;
  $('hTime').textContent=((performance.now()-runStartTime)/1000).toFixed(1);
  requestAnimationFrame(tickTimer);
}

function freeCell(exclude){
  var c;
  var guard=0;
  do { c=Math.floor(Math.random()*GRID); guard++; }
  while (exclude.indexOf(c)!==-1 && guard<400);
  return c;
}

function nextLevel(){
  if(phase!=='running')return;

  // The pattern keeps everything from earlier rounds and gains one
  // more cell — that growth is what makes spotting the change harder
  // as the run goes on. The first round adds two, since a
  // single-cell pattern would give the answer away.
  var add = pattern.length===0 ? START_LENGTH : 1;
  for(var i=0;i<add;i++){
    if(pattern.length >= GRID-1) break;   // leave room for the move
    pattern.push(freeCell(pattern));
  }

  level = pattern.length;
  $('hLevel').textContent=level;

  // One cell leaves its position for a cell that is not in use.
  var idx = Math.floor(Math.random()*pattern.length);
  movedFrom = pattern[idx];
  movedTo = freeCell(pattern);

  canTap=false;
  clearCells();
  msg(T('watchGold'),'watch');
  pattern.forEach(function(p){ cells[p].classList.add('lit'); });
  blip(760);

  timers.push(setTimeout(function(){
    if(phase!=='running')return;
    clearCells();
  }, SHOW_MS));

  timers.push(setTimeout(function(){
    if(phase!=='running')return;
    msg(T('nowOrange'),'echo');
    pattern.forEach(function(p){
      cells[p === movedFrom ? movedTo : p].classList.add('echo');
    });
    blip(560);
    canTap=true;
  }, SHOW_MS + GAP_MS));
}

function handleTap(idx){
  if(phase!=='running' || !canTap)return;

  if(idx===movedTo){
    canTap=false;
    cells[idx].classList.add('correct');
    blip(980);
    $('hPoints').textContent=pointsFor(level);
    msg(T('nice'),'go');

    // The moved cell keeps its new home, so the pattern the player
    // has to hold in mind genuinely changes as the run goes on.
    pattern[pattern.indexOf(movedFrom)] = movedTo;

    timers.push(setTimeout(nextLevel,BETWEEN_MS));
  }else{
    canTap=false;
    cells[idx].classList.add('wrong');
    cells[movedTo].classList.add('answer');
    if(movedFrom>=0) cells[movedFrom].classList.add('was');
    endRun();
  }
}

function endRun(){
  if(phase==='done')return;
  phase='done';clrT();

  // The pattern being shown when the run ended was not solved, so the
  // score is the last pattern actually recognized.
  var finalLevel=Math.max(0, level-1);
  var finalTime=(performance.now()-runStartTime)/1000;

  msg(T('wrong'),'miss');
  timers.push(setTimeout(function(){ showFinal(finalLevel,finalTime); },1400));
}

function showFinal(finalLevel,finalTime){
  var points=pointsFor(finalLevel);

  if(finalLevel>best){best=finalLevel;saveBest()}

  $('endNum').textContent=finalLevel;
  $('endPoints').textContent=points;
  $('endTime').textContent=finalTime.toFixed(1)+'s';
  $('screen-game').style.display='none';
  $('screen-end').style.display='flex';

  var status=$('saveStatus');

  if(TRYOUT && PLAYER_ID){
    $('endLabel').textContent=T('labelPractice');
    status.style.color='#a7adba';
    recordTryout(finalLevel, status);
    return;
  }

  if(!IS_OFFICIAL){
    $('endLabel').textContent=T('labelPractice');
    status.style.color='#7d8ba3';
    status.textContent=T('practiceOnly');
    if(CHALLENGE_ID && PLAYER_ID) recordPractice(finalLevel);
    return;
  }

  $('endLabel').textContent=T('labelOfficial');
  status.style.color='#a7adba';
  status.textContent=T('recording');

  fetch(SB_URL+'/rest/v1/rpc/record_official_run',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({
      p_challenge:CHALLENGE_ID, p_player:PLAYER_ID, p_key:RUN_KEY,
      p_level:finalLevel, p_points:points, p_time:Number(finalTime.toFixed(2)),
      p_game:GAME
    })
  })
  .then(function(r){ if(!r.ok) throw new Error('failed'); return r.json(); })
  .then(function(out){
    if(out && out.ok){
      status.style.color='#00D9A5';
      status.textContent=T('recorded',{P:points});
      IS_OFFICIAL=false;
      return;
    }
    if(out && out.reason==='already'){
      status.style.color='#22D3EE';
      status.textContent=T('wasAlready');
      IS_OFFICIAL=false;
      return;
    }
    status.style.color='#ff6b35';
    status.textContent=T('wrongLink');
  })
  .catch(function(e){
    status.style.color='#ff6b35';
    status.textContent=T('noServer');
    console.error('Challenge run write:',e);
  });
}

function recordPractice(finalLevel){
  var base=SB_URL+'/rest/v1/challenge_practice';
  var headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
  var filter='?challenge_id=eq.'+encodeURIComponent(CHALLENGE_ID)
           +'&player_id=eq.'+encodeURIComponent(PLAYER_ID);

  fetch(base+filter+'&select=best_level,runs',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
  .then(function(r){return r.json()})
  .then(function(rows){
    if(rows && rows.length){
      var row=rows[0];
      return fetch(base+filter,{method:'PATCH',headers:headers,body:JSON.stringify({
        best_level:Math.max(row.best_level||0,finalLevel),
        runs:(row.runs||0)+1,
        updated_at:new Date().toISOString()
      })});
    }
    return fetch(base,{method:'POST',headers:headers,body:JSON.stringify({
      challenge_id:CHALLENGE_ID, player_id:PLAYER_ID, game:GAME,
      best_level:finalLevel, runs:1
    })});
  })
  .catch(function(e){console.error('Practice record:',e)});
}

// Keeps this player's best for this game in this campaign. Only ever
// moves upward, so a bad run never lowers what the team is judged on.
// Warming up. The database counts it and says whether the official
// run has unlocked yet, so the player is told where they stand.
function recordCompetitionPractice(finalLevel, status){
  fetch(SB_URL + '/rest/v1/rpc/record_practice', {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      p_campaign: TRYOUT, p_player: PLAYER_ID, p_game: GAME, p_level: finalLevel
    })
  })
  .then(function(r){ if (!r.ok) throw new Error('practice'); return r.json(); })
  .then(function(){
    // The run is counted; the score above already says how it went,
    // so there is nothing worth adding underneath it.
    status.textContent = '';
  })
  .catch(function(e){
    console.error('Practice:', e);
    status.style.color = '#ff6b35';
    status.textContent = T('tryoutFailed');
  });
}

function recordTryout(finalLevel, status){
  if (TRYOUT_PRACTICE) return recordCompetitionPractice(finalLevel, status);
  var base = SB_URL + '/rest/v1/campaign_tryouts';
  var headers = {
    'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json', 'Prefer': 'return=representation'
  };
  var filter = '?campaign_id=eq.' + encodeURIComponent(TRYOUT)
             + '&player_id=eq.' + encodeURIComponent(PLAYER_ID)
             + '&game=eq.' + GAME;

  fetch(base + filter + '&select=best_level,runs', {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    if (rows && rows.length){
      var row = rows[0];
      if (TRYOUT_ONCE){
        // A score already exists and only one attempt is allowed, so
        // nothing is written — the first run is the result.
        status.style.color = '#ffd35a';
        status.textContent = T('tryoutAlready');
        return;
      }
      return fetch(base + filter, { method:'PATCH', headers:headers, body:JSON.stringify({
        best_level: Math.max(row.best_level || 0, finalLevel),
        runs: (row.runs || 0) + 1,
        updated_at: new Date().toISOString()
      })});
    }
    return fetch(base, { method:'POST', headers:headers, body:JSON.stringify({
      campaign_id: TRYOUT, player_id: PLAYER_ID, game: GAME,
      best_level: finalLevel, runs: 1
    })});
  })
  .then(function(){
    status.style.color = '#00D9A5';
    status.innerHTML = T('tryoutSaved') +
      '<span style="display:block;margin-top:6px;color:#8AA4BD;font-weight:700;">' +
      T('worthLine').split('{P}').join(pointsFor(finalLevel))
                   .split('{M}').join('$' + (pointsFor(finalLevel) * 0.25).toFixed(2)) +
      '</span>';
  })
  .catch(function(e){
    console.error('Tryout record:', e);
    status.style.color = '#ff6b35';
    status.textContent = T('tryoutFailed');
  });
}

var BEST_KEY='fc-recognition-best';
function loadBest(){
  best=0;
  try{best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0}catch(e){}
  $('bestLine').innerHTML = best>0 ? T('bestLine',{L:best,P:pointsFor(best)}) : '';
}
function saveBest(){try{localStorage.setItem(BEST_KEY,String(best))}catch(e){}}


function handleStartClick(){
  if (TRYOUT_ONCE && !confirm(T('confirmOnce'))) return;
  if(IS_OFFICIAL){
    if(!confirm(T('confirmOfficial'))) return;
    startRun();
    return;
  }
  if (isDemoPlay()){
    if (demoRunsLeft() <= 0){ showDemoEnd(); return; }
    noteDemoRun();
  }
  // The name comes from the student's own page when they arrive
  // from it, and is simply not needed for free play.
  startRun();
}


$('againBtn').addEventListener('click',function(){
  phase='idle';
  $('screen-end').style.display='none';
  $('screen-intro').style.display='flex';
  loadBest();
  startDemo();
});

applyLang();
loadBest();
startDemo();
</script>
