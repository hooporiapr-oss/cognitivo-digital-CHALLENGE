<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi equipo — Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── El look nuevo: crema, navy y naranja ─────────────────────────
   El mismo de la portada. Antes esta pagina era la cancha de noche;
   lo que cambia es la piel, no lo que hace: el marcado y el guion se
   quedaron como estaban. */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(720px,calc(100% - 40px));margin:0 auto}

/* ── Cabecera ─────────────────────────────────────────────────── */
header{background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
@media(max-width:380px){ .mark{font-size:.92rem} }
.hright{display:flex;align-items:center;gap:9px}
.who{color:#c8d2dd;font-size:.8rem;font-weight:600;max-width:11ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out,.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.out:hover,.langb:hover{border-color:var(--orange);color:var(--orange)}

/* ── Cuerpo ───────────────────────────────────────────────────── */
main .wrap{padding:38px 0 44px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px}
h2{font-size:1.3rem;letter-spacing:-.025em;margin:34px 0 14px}
.lede{color:var(--muted);margin:0 0 24px;max-width:52ch}
.help{color:var(--muted);font-size:.86rem;margin:7px 0 0}
.hide{display:none !important}

/* ── La puerta: tarjeta blanca, como todo lo demas ─────────────── */
.gate{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:clamp(22px,5vw,32px);box-shadow:0 8px 25px #17243808}
label{display:block;font-weight:700;font-size:.9rem;margin:18px 0 6px}
input[type=text]{width:100%;padding:14px 15px;border:1px solid #d6d9d6;border-radius:10px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.05rem;letter-spacing:.04em}
input[type=text]:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,122,24,.18)}
.cert{display:flex;gap:11px;align-items:flex-start;margin:20px 0 0;
  font-weight:400;font-size:.9rem;color:var(--muted);line-height:1.45}
.cert input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--orange)}
.btn{display:inline-block;border:0;border-radius:9px;padding:14px 22px;
  background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;text-decoration:none;text-align:center}
.btn.go{background:var(--orange);color:#111a24;width:100%;margin-top:20px}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:13px 0 0;font-weight:700;font-size:.9rem;min-height:1.2em}
.msg.bad{color:var(--bad)}

/* ── Lo que falta por hacer. Es lo unico de la pagina que cuesta
   dinero si se olvida, asi que es la unica caja naranja. ───────── */
.todo{background:#fff;border:1px solid rgba(255,122,24,.45);border-left:5px solid var(--orange);
  border-radius:16px;padding:22px 24px;margin:0 0 10px;box-shadow:0 8px 25px #17243808}
.todo b{display:block;color:var(--orange);font-size:.72rem;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase}
.todo .big{font-size:1.45rem;font-weight:900;letter-spacing:-.03em;margin:7px 0 4px}
.todo p{color:var(--muted);margin:0;font-size:.95rem}
.todo .btn{width:auto;margin-top:16px}

/* ── Las tarjetas de equipo ───────────────────────────────────── */
.team{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:22px 24px;margin:0 0 14px;box-shadow:0 8px 25px #17243808}
.team .nm{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin:0 0 18px}
.nums.uno{grid-template-columns:max-content}
.num{background:var(--cream);border:1px solid var(--linea);border-radius:11px;
  padding:12px 16px;text-align:center}
.num b{display:block;font-size:1.5rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.num span{display:block;color:var(--muted);font-size:.74rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.num.hot b{color:var(--orange)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts a{flex:1 1 150px;text-decoration:none;text-align:center;font-weight:800;font-size:.95rem;
  padding:13px 16px;border-radius:9px;border:1px solid var(--navy);color:var(--navy)}
.acts a:hover{background:var(--navy);color:#fff}
.acts a.fill{background:var(--navy);color:#fff}
.acts a.fill:hover{background:var(--navy2);border-color:var(--navy2)}
.acts a.wide{background:transparent}

.stuck{color:var(--muted);font-size:.88rem;margin:30px 0 0;text-align:center}
.stuck a{color:var(--navy);font-weight:700}

/* ── Pie ──────────────────────────────────────────────────────── */
footer{background:#0a1420;color:#aeb9c6;padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
.f-dot{padding:0 8px;opacity:.45}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="index.html">cada&nbsp;<em>punto</em>&nbsp;<i>cuenta</i></a>
    <div class="hright">
      <span class="who hide" id="hwho"></span>
      <button class="langb" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="out hide" id="hout" onclick="salir()">Salir</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="gate" id="gate">
      <h1 id="tH1"></h1>
      <p class="lede" id="tLede"></p>
      <label for="code" id="tCodeL"></label>
      <input id="code" type="text" autocapitalize="characters" autocorrect="off"
             spellcheck="false" enterkeyhint="go">
      <p class="help" id="tCodeH"></p>
      <label class="cert"><input type="checkbox" id="cert"><span id="tCert"></span></label>
      <button class="btn go" id="tGo" onclick="entrar(false)"></button>
      <p class="msg" id="gm"></p>
    </div>

    <div id="app" class="hide">
      <div id="todo"></div>
      <h2 id="tTeams"></h2>
      <div id="teams"></div>
    </div>

    <p class="stuck" id="tStuck"></p>

  </div>
</main>

<footer>
  <div class="wrap">
    <a href="ayuda.html" id="fAyuda">Ayuda</a><span class="f-dot">·</span><a href="index.html">Cada Punto</a><span class="f-dot">·</span><a href="terms.html">Términos</a><span class="f-dot">·</span><a href="custodia.html">Dinero</a>
  </div>
</footer>

<script>
var SB='https://sdaphocueugzfvjovuxd.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

function rpc(name,args){
  return fetch(SB+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  }).then(function(r){ if(!r.ok) throw new Error('rpc '+r.status); return r.json() });
}
function $(id){ return document.getElementById(id) }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]});
}

var S={
  es:{
    h1:'Mi equipo',
    lede:'Entra con tu código. En este teléfono queda guardado — no lo vas a escribir otra vez.',
    codeL:'Tu código', codeH:'El mismo que te dimos para tu equipo.',
    cert:'Entiendo que en el Fortress los puntos los registra el juego, y que en un juego de verdad el marcador que yo reporte es el que se usa para la cuenta de cada padrino.',
    needCert:'Marca la casilla para certificar los puntos.',
    go:'Entrar',
    bad:'Ese código no sirve.', net:'No entró. Inténtalo otra vez.',
    none:'Tu código no alcanza ningún equipo. Escríbenos.',
    teams:'Tus equipos', out:'Salir',
    todoL:'El día de juego',
    todo1:'{N} día de juego abierto.',
    todoN:'{N} días de juego abiertos.',
    todoP:'En el Fortress los cuartos entran solos según se juegan. En un juego de verdad, el marcador lo reportas tú en el tablero del equipo.',
    todoGo:'Ver el tablero',
    nPad:'padrinos',
    aBoard:'Ver el tablero',
    aRoster:'La plantilla',

    stuck:'¿Algo no sale? <a href="ayuda.html">Ayuda del entrenador →</a>',
    fAyuda:'Ayuda'
  },
  en:{
    h1:'My team',
    lede:'Sign in with your code. It stays on this phone — you will not type it again.',
    codeL:'Your code', codeH:'The same one we gave you for your team.',
    cert:'I understand that in the Fortress the game records the points, and that in a real game the score I report is the one each padrino\u2019s amount is worked out from.',
    needCert:'Check the box to certify the points.',
    go:'Enter',
    bad:'That code does not work.', net:'That did not go through. Try again.',
    none:'Your code does not reach any team. Write to us.',
    teams:'Your teams', out:'Sign out',
    todoL:'The game day',
    todo1:'{N} game day open.',
    todoN:'{N} game days open.',
    todoP:'In the Fortress quarters land on their own as they are played. For a real game, you report the score on the team board.',
    todoGo:'See the board',
    nPad:'padrinos',
    aBoard:'See the board',
    aRoster:'The roster',

    stuck:'Something will not work? <a href="ayuda.html">Coach help →</a>',
    fAyuda:'Help'
  }
};
var LANG='es';
try{ LANG=localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  localStorage.getItem('fc-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'); }catch(e){}
function T(k,v){
  var s=(S[LANG]&&S[LANG][k])||S.es[k]||'';
  if(v)Object.keys(v).forEach(function(x){ s=s.split('{'+x+'}').join(v[x]) });
  return s;
}
function toggleLang(){
  LANG=LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG);localStorage.setItem('cp-lang',LANG);
       localStorage.setItem('fc-lang',LANG); }catch(e){}
  paintStatic();
  if(CODE&&CAMPS.length) pintar();
}
function paintStatic(){
  $('tH1').textContent=T('h1');
  $('tLede').textContent=T('lede');
  $('tCodeL').textContent=T('codeL');
  $('tCodeH').textContent=T('codeH');
  $('tCert').textContent=T('cert');
  $('tGo').textContent=T('go');
  $('tTeams').textContent=T('teams');
  $('hout').textContent=T('out');
  $('tStuck').innerHTML=T('stuck');
  $('fAyuda').textContent=T('fAyuda');
  $('langBtn').textContent=LANG==='es'?'EN':'ES';
  document.documentElement.lang=LANG;
}

var CODE=null, BY=null, CAMPS=[], BOARDS={};

/* Acepta la sesión que ya tenga de cualquiera de las dos páginas
   viejas: el calendario guardaba cp_build y el marcador cp_code. Un
   entrenador que ya entró en una de ellas no vuelve a escribir nada. */
try{ CODE = localStorage.getItem('cp_build') || localStorage.getItem('cp_code') || null; }catch(e){}

/* El calendario lee cp_build. El marcador no se conforma con el código:
   quiere cp_code y cp_by juntos, y sólo los escribe después de que el
   entrenador marca la casilla de certificación. Así que esas dos sólo se
   escriben cuando aquí se marcó la casilla — o cuando ya estaban puestas
   de antes, porque entonces ya la marcó en el marcador. Entrar aquí sin
   certificar no debe certificar nada por la puerta de atrás. */
function recordar(k,by,cert){
  try{
    localStorage.setItem('cp_build',k);
    if(cert||localStorage.getItem('cp_by')){
      localStorage.setItem('cp_code',k);
      if(by) localStorage.setItem('cp_by',by);
    }
  }catch(e){}
}
function olvidar(){
  try{ localStorage.removeItem('cp_build'); localStorage.removeItem('cp_code');
       localStorage.removeItem('cp_by'); }catch(e){}
}
function salir(){ olvidar(); location.reload(); }

function say(t,c){ var e=$('gm'); if(e){ e.textContent=t||''; e.className='msg '+(c||'') } }

function entrar(auto){
  var k = auto ? CODE : ($('code').value||'').trim();
  if(!k || k.length<4) return say(T('bad'),'bad');
  var cert = auto ? false : !!($('cert')&&$('cert').checked);
  if(!auto && !cert) return say(T('needCert'),'bad');
  say('…');
  rpc('builder_check',{p_code:k})
    .then(function(r){
      if(!r||!r.ok){ if(auto) olvidar(); return say(T('bad'),'bad'); }
      CODE=k; BY=r.by; CAMPS=r.campaigns||[];
      recordar(k,BY,cert);
      say('');
      $('gate').className='gate hide';
      $('app').className='';
      $('hwho').className='who'; $('hwho').textContent=BY;
      $('hout').className='out';
      cargar();
    })
    .catch(function(e){ console.error(e); say(T('net'),'bad') });
}

/* Trae el tablero de cada equipo. Todo en paralelo: un entrenador con
   siete equipos no debe esperar siete veces. Lo de a dónde pagarle ya
   no se pregunta: no le pagamos nosotros. */
function cargar(){
  if(!CAMPS.length){ $('teams').innerHTML='<p class="help">'+T('none')+'</p>'; return }
  var jobs = CAMPS.map(function(c){
    return rpc('game_board',{p_campaign:c.id})
      .then(function(g){ BOARDS[c.id]=Array.isArray(g)?g:[] })
      .catch(function(){ BOARDS[c.id]=null });
  });
  Promise.all(jobs).then(pintar);
}

/* Una sola función decide si un juego ya pasó, para que las dos cuentas
   no se puedan contradecir. Si el juego tiene hora, se le dan dos horas
   desde el saque: el entrenador que entra a las diez de la noche ve el
   aviso esa misma noche, no al otro día. Si no tiene hora, no pasa hasta
   que cambie el día — mejor avisar tarde que apurar a alguien por un
   juego que es a las siete. */
function yaPaso(g){
  if(!g||!g.plays_on) return false;
  var ahora=new Date();
  if(g.tips_at){
    var hm=String(g.tips_at).split(':');
    var t=new Date(g.plays_on+'T00:00:00');
    if(!isNaN(t)){
      t.setHours((+hm[0]||0)+2,(+hm[1]||0),0,0);
      return ahora>t;
    }
  }
  var fin=new Date(g.plays_on+'T00:00:00');
  if(isNaN(fin)) return false;
  fin.setHours(23,59,59,0);
  return ahora>fin;
}
function pendiente(g){ return g.team_points===null||g.team_points===undefined }

/* Un juego pide marcador cuando ya se jugó y todavía no tiene puntos. */
function sinMarcador(games){
  if(!games) return [];
  return games.filter(function(g){ return pendiente(g)&&yaPaso(g) });
}
function porJugar(games){
  if(!games) return [];
  return games.filter(function(g){ return pendiente(g)&&!yaPaso(g) });
}
/* Cuidado aquí: g.pledges es por juego, no por campaña. Sumarlo cuenta
   al mismo padrino una vez por cada juego que apadrinó, y da un número
   que no cuadra con nada. Lo que sí es un número de verdad es cuántos
   padrinos tiene el próximo juego — y es el que al entrenador le
   importa: si hay gente con dinero puesto en el juego del jueves. */
function padrinos(games){
  var up=porJugar(games);
  if(!up.length) return 0;
  var next=up.slice().sort(function(a,b){
    return String(a.plays_on||'9999').localeCompare(String(b.plays_on||'9999'));
  })[0];
  return Number(next.pledges)||0;
}

function pintar(){
  paintStatic();

  /* Lo primero de la página: lo que cuesta dinero si se olvida. */
  var pend=0, uno=null;
  CAMPS.forEach(function(c){
    var s=sinMarcador(BOARDS[c.id]);
    pend+=s.length;
    if(s.length&&!uno) uno=c;
  });
  $('todo').innerHTML = pend ?
    '<div class="todo">'+
      '<b>'+T('todoL')+'</b>'+
      '<div class="big">'+(pend===1?T('todo1',{N:pend}):T('todoN',{N:pend}))+'</div>'+
      '<p>'+T('todoP')+'</p>'+
      '<a class="btn go" href="tablero.html?camp='+esc(uno.id)+'">'+T('todoGo')+'</a>'+
    '</div>' : '';

  $('teams').innerHTML = CAMPS.map(function(c){
    var g=BOARDS[c.id], sin=sinMarcador(g), up=porJugar(g), pad=padrinos(g);
    return '<div class="team">'+
      '<p class="nm">'+esc(c.name)+'</p>'+
      '<div class="nums uno">'+
        '<div class="num"><b>'+pad+'</b><span>'+T('nPad')+'</span></div>'+
      '</div>'+
      '<div class="acts">'+
        /* El tablero nuevo va por campaña: esta página tiene campañas,
           no retos, y tablero.html sabe buscar el reto que le toca. */
        '<a class="fill" href="tablero.html?camp='+esc(c.id)+'">'+T('aBoard')+'</a>'+
        '<a class="wide" href="plantilla.html">'+T('aRoster')+'</a>'+
      '</div>'+
    '</div>';
  }).join('');
}

$('code').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); entrar(false) }
});

paintStatic();
if(CODE) entrar(true);
</script>
</body>
</html>
