<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;
      --ball:#FF7A18;--good:#0B7A5A}
*{box-sizing:border-box}
html{background:#12202E}
/* El teclado del teléfono no achica la página, achica lo que se ve de
   ella. Con el alto clavado en 100dvh y el scroll metido en <main>, el
   campo enfocado se iba debajo del teclado. Rodando la página entera,
   el navegador sí puede subirlo. */
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#fff;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(720px,93vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:1px solid #0B1724;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:clamp(18px,4vw,30px) 0 28px}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
footer b{color:#fff;display:block;font-weight:800}

/* the running total, which is the point of the page */
.total{border:2px solid var(--ink);border-radius:4px;padding:clamp(18px,4vw,26px);
  text-align:center;margin-bottom:18px;background:var(--tint)}
.total .cap{font-size:.66rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.total .big{font-size:clamp(3rem,15vw,5.5rem);font-weight:900;line-height:1;letter-spacing:-.04em}
.total .sub{color:var(--mute);font-size:.94rem;margin-top:4px}
h1{font-size:clamp(1.35rem,4.2vw,1.85rem);letter-spacing:-.03em;margin:0 0 4px;font-weight:900}
/* Un escudo puede venir en cualquier forma, así que se le da una caja
   y se encaja dentro sin recortarlo. Si la dirección falla, desaparece
   en vez de dejar un icono roto. */
.crest{display:block;max-height:96px;max-width:200px;width:auto;height:auto;
  margin:0 auto 12px;object-fit:contain}
h1.withcrest{text-align:center}
h1.withcrest + .lede{text-align:center;margin-left:auto;margin-right:auto}
.lede{color:var(--mute);margin:0 0 18px}
h2{font-size:1.05rem;margin:24px 0 8px;font-weight:900;letter-spacing:-.02em}

.game{border:2px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:7px}
.game.next{border-color:var(--ink)}
.game.played{background:var(--tint)}

/* Una fila: a la izquierda quién y cuándo, a la derecha el botón o el
   marcador. La tarjeta alta se comía la pantalla. */
.game .row{display:flex;align-items:center;gap:12px}
.game .rl{flex:1 1 auto;min-width:0}
.game .rr{flex:0 0 auto}
.game .opp{font-weight:900;font-size:1rem;line-height:1.25}
/* El punto del próximo juego: una marca, no una etiqueta que ocupe línea. */
.game .opp .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--ball,#FF8A2B);margin-right:7px;vertical-align:1px}
.game .rsub{color:var(--mute);font-size:.8rem;line-height:1.35;margin-top:2px}
.game .when{color:var(--mute);font-size:.86rem;white-space:nowrap}
.game .meta{color:var(--mute);font-size:.86rem;margin-top:2px}
/* Dentro de la fila el botón se ajusta a su texto: ancho completo y
   margen de arriba son de los botones de página, no de éstos. */
.game .rr .btn{width:auto;margin-top:0;padding:10px 16px;white-space:nowrap}
/* Por debajo de esto el nombre del rival y el botón ya no caben juntos. */
@media(max-width:330px){
  .game .row{flex-wrap:wrap;gap:8px}
  .game .rr{flex:1 1 100%}
  .game .rr .btn{width:100%}
}

/* La división, marcada en la tarjeta: con seis escuadras hace falta
   saber de un vistazo cuál es la tuya. */
.dtag{display:inline-block;font-size:.56rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;background:var(--ink);color:#fff;border-radius:3px;
  padding:2px 6px;vertical-align:1px}
.game.played .dtag{background:var(--mute)}
.game.locked .dtag{background:#fff;color:var(--mute);border:1px solid var(--line)}

/* El filtro por escuadra */
.demo{border:2px dashed var(--accent);background:var(--tint);border-radius:4px;
  padding:13px 15px;margin:0 0 18px}
.demo b{display:block;font-size:.95rem}
.demo span{color:var(--mute);font-size:.9rem}

.divs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.dv{border:1.5px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.76rem;font-weight:800;cursor:pointer}
.dv:hover{border-color:var(--ink);color:var(--ink)}
.dv.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* El marcador de un juego jugado. El número del equipo es el que
   importa — es sobre el que prometieron los padrinos — así que va
   grande, y el del rival, si lo hay, al lado y en gris. */
.sb{text-align:right;line-height:1;white-space:nowrap}
.sb-n{font-size:2rem;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.sb-o{font-size:1rem;font-weight:800;color:var(--mute);margin-left:2px;letter-spacing:0}
.sb-c{font-size:.5rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-top:4px}
.sb.won .sb-n{color:var(--good)}
.game .score{font-size:1.3rem;font-weight:900;white-space:nowrap}
.game .score span{color:var(--mute);font-weight:800;font-size:1rem}
.game .score .w{color:var(--good)}
.game .shut{font-size:.8rem;font-weight:800;color:var(--mute);white-space:nowrap}

/* Un juego que todavía no existe: se ve, se entiende, y no se puede
   prometer en él. La línea de la izquierda lo ata al de arriba, que
   es lo que hace que se lea como un cuadro. */
.game.locked{border-style:dashed;border-color:var(--line);background:#fff;position:relative}
.game.tucked{display:none}
.game.tucked.shown{display:block}
.more{display:block;width:100%;margin-top:8px;padding:8px;border:1px dashed var(--line);
  border-radius:4px;background:#fff;color:var(--accent);font:inherit;font-size:.8rem;
  font-weight:800;cursor:pointer}
.more:hover{border-color:var(--accent)}
.more.open{color:var(--mute)}
.game.d1{margin-left:18px}
.game.d2{margin-left:34px}
.game.d3{margin-left:50px}
.game.d4{margin-left:62px}
@media(max-width:520px){
  /* en un teléfono no hay sitio para cuatro escalones */
  .game.d1{margin-left:12px}
  .game.d2{margin-left:22px}
  .game.d3{margin-left:30px}
  .game.d4{margin-left:36px}
}
.game.locked::before{
  content:'';position:absolute;left:-18px;top:-12px;bottom:50%;width:14px;
  border-left:2px dashed var(--line);border-bottom:2px dashed var(--line);
  border-bottom-left-radius:6px;
}
.game.locked .opp,.game.locked .when{color:var(--mute)}
.tagl{display:inline-block;font-size:.6rem;font-weight:900;letter-spacing:.16em;
  text-transform:uppercase;background:var(--tint);color:var(--accent);
  border:1px solid var(--line);border-radius:3px;padding:3px 8px;margin-bottom:6px}
/* La barra del anotador: un botón discreto que se abre a un campo. */
.unl{margin:0 0 12px}
.unl .unlb{background:none;border:0;padding:0;cursor:pointer;font:inherit;
  font-size:.56rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);text-decoration:underline}
.unl .unlf{display:none}
.unl.open .unlb{display:none}
.unl.open .unlf{display:flex;flex-direction:column;gap:8px;
  border:2px solid var(--ink);border-radius:4px;padding:10px 12px}
.unl.on{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);
  border-radius:4px;padding:8px 12px}
.unl.on span{flex:1 1 auto;font-size:.56rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase}
.unl .unlx{flex:0 0 auto;background:none;border:0;padding:0;cursor:pointer;font:inherit;
  font-size:.56rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);text-decoration:underline}
.unlf label{display:flex;flex-direction:column;gap:3px;
  font-size:.56rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.unlf input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-weight:800;
  font-size:1rem;padding:9px 10px;border:2px solid var(--line);border-radius:4px;
  background:#fff;color:var(--ink);letter-spacing:.06em}
/* Sin text-transform: el código se compara cifrado y distingue mayúsculas.
   Mostrarlo en caps mientras se envía en minúsculas es una trampa. */

/* Dentro de la tarjeta: dos números y Guardar, en una fila. */
.sline{display:flex;align-items:flex-end;gap:8px;margin-top:9px;
  border-top:2px solid var(--line);padding-top:9px;flex-wrap:wrap}
.sline label{flex:1 1 0;min-width:64px;display:flex;flex-direction:column;gap:3px;
  font-size:.56rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sline input{width:100%;box-sizing:border-box;font:inherit;font-weight:900;
  font-size:1.35rem;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;
  padding:7px 8px;border:2px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.sline .btn{flex:0 0 auto;width:auto;margin-top:0;padding:10px 14px;white-space:nowrap}
.sline .smsg{flex:1 1 100%}

.scert{flex-direction:row !important;align-items:flex-start;gap:8px !important;
  text-transform:none !important;letter-spacing:0 !important;font-size:.78rem !important;
  font-weight:600 !important;line-height:1.35;color:var(--ink) !important}
.scert input{flex:0 0 auto;width:18px;height:18px;margin:1px 0 0}
.unlf .btn{width:100%;margin-top:0}
.smsg{font-size:.78rem;font-weight:700;line-height:1.35;min-height:1px}
.smsg.bad{color:#b4231c}
.smsg.ok{color:var(--good)}

.game .need{margin-top:7px;font-size:.86rem;color:var(--mute)}
.btn.small.dead{background:#fff;color:#9AA8B5;border-color:var(--line);cursor:not-allowed}
/* Lo del jugador es una acción, no una nota al pie: caja propia,
   con su botón. Lo de abajo sigue siendo un enlace para leer. */
.playcard{border:2px solid var(--ink);border-radius:4px;padding:18px 20px;margin-top:26px;
  background:var(--tint)}
.pc-kick{font-size:.62rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px}
.pc-h{display:block;font-size:1.2rem;font-weight:900;letter-spacing:-.025em}
.pc-p{margin:6px 0 0;color:var(--mute);font-size:.93rem}
.pc-go{display:block;text-align:center;margin-top:16px;padding:14px;border:2px solid var(--ink);
  border-radius:4px;background:var(--ink);color:#fff;font-weight:800;text-decoration:none}
.pc-go:hover{background:#0B1724}

.readlink{display:block;border:2px dashed var(--line);border-radius:4px;padding:14px 16px;
  margin-top:18px;text-decoration:none;color:var(--ink)}
.readlink:hover{border-color:var(--ink);border-style:solid}
.readlink b{display:block}
.readlink span{color:var(--mute);font-size:.88rem}
.tagn{display:inline-block;font-size:.6rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  background:var(--ball);color:#1A0C00;border-radius:3px;padding:3px 8px;margin-bottom:6px}

.btn{display:block;width:100%;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;
  text-align:center;text-decoration:none;margin-top:10px}
.btn.line{background:#fff;color:var(--ink)}
.btn.small{padding:11px;font-size:.92rem;margin-top:8px}

label{display:block;font-size:.84rem;font-weight:700;margin:12px 0 5px}
input{width:100%;padding:13px 14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:1rem}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
select{width:100%;padding:13px 14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:1rem}
.rates{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.rate{flex:1 1 90px;padding:12px 8px;border:2px solid var(--line);border-radius:4px;background:#fff;
  font:inherit;font-weight:900;cursor:pointer;color:var(--ink);text-align:center}
.rate.on{border-color:var(--ink);background:var(--ink);color:#fff}
.rate small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;opacity:.75;margin-top:2px}
/* A quién se apoya, primero y en grande: antes el título era el
   nombre del contrario y la hoja parecía ser para ellos. */
.forwho{font-size:.64rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);text-align:center;margin-bottom:4px}
.whoteam{text-align:center;margin:0 0 10px}
.fixture{text-align:center;color:var(--mute);font-size:.95rem;margin:0 0 20px;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.fixture b{color:var(--ink);font-weight:800}
.fx-vs{text-transform:uppercase;font-size:.7rem;font-weight:900;letter-spacing:.14em}
.fx-when{display:block;font-size:.86rem;margin-top:3px}

.est{border-left:4px solid var(--accent);background:var(--tint);padding:13px 15px;margin:14px 0;font-size:.93rem}
.est b{display:block}
.es-l{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--mute)}
.es-l b{display:inline;color:var(--ink);font-variant-numeric:tabular-nums}
.es-l span{font-variant-numeric:tabular-nums}
.es-tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.es-tot b{font-size:1.05rem}
.es-note{display:block;color:var(--mute);font-size:.86rem;margin-top:8px;line-height:1.5}
.est b{display:block}
.msg{margin-top:10px;font-weight:700;font-size:.9rem;min-height:1.2em}
.msg.bad{color:#A8323F}
.msg.ok{color:var(--good)}
.fine{color:var(--mute);font-size:.82rem;margin-top:10px}
footer p{margin:0 0 7px}
footer .f-co{color:#fff;font-weight:700}
footer .f-legal{margin:7px 0 0;font-size:.78rem}
footer .f-dot{padding:0 7px;opacity:.5}
footer a{color:#8FA8C0;text-decoration:none}
</style>
</head>

// ══════════════════════════════════════════════════════
//  El camino completo de una cadena se guarda plegado: el
//  próximo juego se ve siempre, y lo que viene después está
//  a un toque. Una cadena de cuatro rondas ocupaba media
//  pantalla por escuadra.
// ══════════════════════════════════════════════════════
function moreRounds(btn, rootId){
  var opening = !btn.classList.contains('open');
  btn.classList.toggle('open', opening);

  // Quién cuelga de quién, leído del propio tablero.
  var cards = document.querySelectorAll('.game[data-id]');
  var parent = {};
  for (var i = 0; i < cards.length; i++){
    parent[cards[i].dataset.id] = cards[i].dataset.chain || null;
  }

  function descends(id){
    var up = parent[id], hops = 0;
    while (up && hops < 8){
      if (up === rootId) return true;
      up = parent[up];
      hops++;
    }
    return false;
  }

  for (var j = 0; j < cards.length; j++){
    if (!cards[j].classList.contains('tucked')) continue;
    if (descends(cards[j].dataset.id)) cards[j].classList.toggle('shown', opening);
  }

  btn.textContent = opening ? T('hidePath') : btn.dataset.label;
}


// ══════════════════════════════════════════════════════
//  Las divisiones salen de la nota de cada juego: lo que
//  hay antes del primer "·". Un programa con seis escuadras
//  manda un enlace, y cada familia filtra la suya.
// ══════════════════════════════════════════════════════
var DIV = null;        // null = todas

// Lo que queda de la nota después de la división, para no imprimir
// "Mini 9-10 · Mini 9-10" cuando la nota es sólo la división.
function notaExtra(g){
  var n = String(g.note || '');
  var i = n.indexOf('·');
  return i === -1 ? '' : n.slice(i + 1).replace(/^\s+|\s+$/g, '');
}

function divOf(g){
  var n = String(g.note || '').split('·')[0].trim();
  return n || null;
}

function divisions(games){
  var seen = [], out = [];
  games.forEach(function(g){
    if (g.status === 'cancelled') return;      // no se enseña, no se filtra
    var d = divOf(g);
    if (d && seen.indexOf(d) === -1){ seen.push(d); out.push(d); }
  });
  return out;
}

function setDiv(d){
  DIV = d || null;
  draw();
  try { var _m = document.querySelector('main'); if (_m) _m.scrollTop = 0; window.scrollTo(0, 0); } catch(e){}
}

function divBar(games){
  var ds = divisions(games);
  if (ds.length < 2) return '';      // con una sola no hace falta filtrar

  return '<div class="divs">' +
    '<button class="dv' + (DIV === null ? ' on' : '') + '" onclick="setDiv(null)">' +
      T('allDivs') + '</button>' +
    ds.map(function(d){
      return '<button class="dv' + (DIV === d ? ' on' : '') + '" ' +
             'onclick="setDiv(' + JSON.stringify(d).replace(/"/g, '&quot;') + ')">' +
             esc(d) + '</button>';
    }).join('') +
  '</div>';
}

function chainOrder(list){
  var kids = {}, roots = [];

  list.forEach(function(g){
    if (g.unlocks_from && list.some(function(x){ return x.id === g.unlocks_from; })){
      (kids[g.unlocks_from] = kids[g.unlocks_from] || []).push(g);
    } else {
      roots.push(g);
    }
  });

  var out = [];
  function walk(g, depth){
    if (depth > 8) return;                      // por si dos se apuntan entre sí
    out.push(g);
    (kids[g.id] || []).forEach(function(k){ walk(k, depth + 1); });
  }
  roots.forEach(function(r){ walk(r, 0); });

  // Por si algo quedó fuera, que no desaparezca.
  list.forEach(function(g){ if (out.indexOf(g) === -1) out.push(g); });
  return out;
}

// anota el equipo en un juego típico, y cuántos juegos le quedan por
// prometer. Antes decía los juegos jugados, que es mirar atrás en una
// página que vende lo que viene.
function boardSub(abiertos){
  var partes = [];
  // Un solo juego no es un promedio: decir "54 por juego" con un juego
  // jugado es repetir ese marcador y llamarlo tendencia. Desde dos.
  if (BOARD.played >= 2) partes.push(T('perGame', { P: typicalPoints() }));
  if (abiertos)          partes.push(T('toPledgeN', { N: abiertos }));
  if (partes.length) return partes.join(' · ');
  // Tablero recién abierto: que lo diga mirando adelante, no un cero más.
  if (!BOARD.played) return T('notStarted');
  return T(BOARD.played === 1 ? 'gamesPlayed1' : 'gamesPlayedN', { N: BOARD.played });
}

function sendScore(id){
  var ours = document.getElementById('o_' + id);
  var them = document.getElementById('t_' + id);
  var msg  = document.getElementById('m_' + id);
  function say(t, cls){ if (msg){ msg.className = 'smsg ' + (cls||''); msg.textContent = t; } }

  var b = parseInt((them && them.value) || '', 10);

  // dependía de éste.
  if (isNaN(a) || isNaN(b) || a < 0 || b < 0) return say(T('sScore'), 'bad');

  rpc('report_score', {
    p_campaign: CAMPAIGN, p_code: SCODE, p_game: id, p_team: a, p_opp: b

// ¿Se puede anotar este juego? 'started' lo calcula el servidor y exige
// hora de saque. Un juego sin hora nunca la tiene, así que quedaba sin
// casillas aunque la función sí lo aceptara. Sin hora manda la fecha.
function yaSeJugo(g){
  if (g.status === 'played') return true;
  if (g.started) return true;
  if (g.tips_at) return false;                 // tiene hora y no ha llegado
  if (!g.plays_on) return false;
  var h = new Date();
  var hoy = h.getFullYear() + '-' +
            ('0' + (h.getMonth() + 1)).slice(-2) + '-' +
            ('0' + h.getDate()).slice(-2);
  return String(g.plays_on).slice(0, 10) <= hoy;
}

function draw(){
  if (!BOARD) return;

  // Si vinieron desde el calendario del torneo pidiendo un juego, se
  // abre ése directamente. Una sola vez: después se navega normal.
  if (!JUMPED && WANT_ON && WANT_VS && !PICKED){
    JUMPED = true;
    var hit = (BOARD.games || []).filter(function(g){
      return g.status === 'scheduled' && !g.started &&
             g.plays_on === WANT_ON &&
             String(g.opponent || '').trim().toLowerCase() ===
               WANT_VS.trim().toLowerCase();
    })[0];
    if (hit){ PICKED = hit; }
  }

  if (PICKED) return drawPledge();

  var games = BOARD.games || [];
  // Un enlace de jugador trae su escuadra. Sólo se aplica si existe
  // de verdad en el calendario — si el jugador la escribió distinta,
  // mejor enseñarlo todo que una página vacía.
  if (!DIV_SET){
    DIV_SET = true;
    if (WANT_DIV){
      var match = divisions(games).filter(function(d){
        return d.toLowerCase() === WANT_DIV.trim().toLowerCase();
      })[0];
      if (match) DIV = match;
    }
  }

  var shown = DIV
    ? games.filter(function(g){ return divOf(g) === DIV; })
    : games;

  var upcoming = shown.filter(function(g){
    return g.status === 'scheduled' || g.status === 'conditional';
  });

  // Un juego del cuadro tiene que ir justo debajo del que depende, no
  // al final por su fecha — si no, la línea que los une apunta a otro
  // juego y no se entiende nada.
  upcoming = chainOrder(upcoming);
  var open = upcoming.filter(function(g){ return g.status === 'scheduled' && !g.started; });
  var results  = shown.filter(function(g){ return g.status === 'played'; }).reverse();

  // Qué tan adentro del cuadro está cada juego, para indentarlo.
  var byId = {};
  games.forEach(function(g){ byId[g.id] = g; });
  function depth(g, seen){
    seen = seen || {};
    if (!g.unlocks_from || seen[g.id]) return 0;
    seen[g.id] = 1;
    var parent = byId[g.unlocks_from];
    return parent ? 1 + depth(parent, seen) : 1;
  }
  games.forEach(function(g){ g._depth = Math.min(depth(g), 4); });

  // Cuántas rondas más hay colgando de cada juego, para poder decirlo
  // en el botón que las abre.
  var kidsOf = {};
  games.forEach(function(g){
    if (g.unlocks_from) (kidsOf[g.unlocks_from] = kidsOf[g.unlocks_from] || []).push(g);
  });
  function rounds(id, d){
    d = d || 0;
    if (d > 8) return 0;
    var k = kidsOf[id] || [];
    return k.reduce(function(n, c){ return n + 1 + rounds(c.id, d + 1); }, 0);
  }
  games.forEach(function(g){ g._rounds = rounds(g.id); });

  app.innerHTML =
    (BOARD.logo
      ? '<img class="crest" src="' + esc(BOARD.logo) + '" alt="" ' +
        'onerror="this.style.display=\'none\'">'
      : '') +
    '<h1' + (BOARD.logo ? ' class="withcrest"' : '') + '>' + esc(BOARD.campaign || '') + '</h1>' +
    '<p class="lede">' + T('lede') + '</p>' +

    '<div class="total">' +
      '<div class="cap">' + T('pointsCap') + '</div>' +
      '<div class="big">' + (BOARD.points || 0) + '</div>' +
      '<div class="sub">' + boardSub(open.length) + '</div>' +
    '</div>' +

    unlockBar() +

    (IS_DEMO
      ? '<div class="demo">' +
          '<b>' + T('demoH') + '</b>' +
          '<span>' + T('demoP') + '</span>' +
        '</div>'
      : '') +

    divBar(games) +

    (DIV && !upcoming.length && !results.length
      ? '<p style="color:var(--mute)">' + T('noneHere') + '</p>'
      : '') +

    (upcoming.length
      ? '<h2>' + (open.length ? T('toPledge') : T('next')) + '</h2>' +
        upcoming.map(function(g){
          var hidden = g._depth > 0;        // cualquier juego del cuadro va plegado
          return gameCard(g, g === open[0], hidden);
        }).join('')
      : '<p style="color:var(--mute)">' + T('noGames') + '</p>') +

    (results.length
      ? '<h2>' + T('results') + '</h2>' + results.map(function(g){ return gameCard(g, false); }).join('')
      : '') +

    // Para un jugador que llega aquí: su propio enlace está a un toque.
    // Para el jugador: lo que tiene que hacer, con su botón.
    '<div class="playcard">' +
      '<div class="pc-kick">' + T('iPlayKick') + '</div>' +
      '<b class="pc-h">' + T('iPlay') + '</b>' +
      '<p class="pc-p">' + T('iPlayP') + '</p>' +
      '<a class="pc-go" href="jugador.html?c=' + CAMPAIGN +
        (DIV ? '&d=' + encodeURIComponent(DIV) : '') + '">' + T('iPlayGo') + '</a>' +
    '</div>' +

    // Y lo otro es para leer, no para hacer.
    '<a class="readlink" href="programa.html?c=' + CAMPAIGN + '">' +
      '<b>' + T('howPaid') + '</b><span>' + T('howPaidP') + '</span>' +
    '</a>';
}

function pick(id){
  PICKED = (BOARD.games || []).filter(function(g){ return g.id === id; })[0] || null;
  RATE = 0.10;
  draw();
  try { var _m = document.querySelector('main'); if (_m) _m.scrollTop = 0; window.scrollTo(0, 0); } catch(e){}
}

function setRate(r){
  RATE = r;
  var est = document.getElementById('estLine');
  if (est) est.innerHTML = estimate(r);
  var btns = document.querySelectorAll('.rate');
  for (var i = 0; i < btns.length; i++){
    btns[i].className = 'rate' + (Number(btns[i].dataset.r) === r ? ' on' : '');
  }
}


// Lo que suele anotar este equipo. Si todavía no ha jugado, 60 sirve
// de ejemplo — pero en cuanto hay marcadores, se usan los suyos.
function typicalPoints(){
  var played = (BOARD.games || []).filter(function(g){
    return g.status === 'played' && g.team_points != null;
  });
  if (!played.length) return 60;
  var sum = played.reduce(function(n, g){ return n + Number(g.team_points || 0); }, 0);
  return Math.round(sum / played.length);
}

// El desglose: lo que recibe el programa, el cargo, y lo que paga
// el padrino. Tres líneas, antes de prometer nada.
function estimate(rate){
  var pts  = typicalPoints();
  var team = rate * pts;
  var fee  = team * 0.20;

  return '<span class="es-l"><span>' + T('esPoints', { N: pts }) + '</span>' +
           '<b>' + money(team) + '</b></span>' +
         '<span class="es-l"><span>' + T('esFee') + '</span>' +
           '<span>+' + money(fee) + '</span></span>' +
         '<span class="es-l es-tot"><b>' + T('esPay') + '</b>' +
           '<b>' + money(team + fee) + '</b></span>' +
         '<span class="es-note">' + T('esNote') + '</span>';
}

function drawPledge(){
  var g = PICKED;
  var team = esc(BOARD.campaign || '');

  app.innerHTML =
    (BOARD.logo
      ? '<img class="crest" src="' + esc(BOARD.logo) + '" alt="" ' +
        'onerror="this.style.display=\'none\'">'
      : '') +

    '<div class="forwho">' + T('pledgeFor') + '</div>' +
    '<h1 class="whoteam">' + team + '</h1>' +

    '<div class="fixture">' +
      '<span class="fx-vs">' + (g.home ? T('vsWord') : T('atWord')) + '</span> ' +
      '<b>' + esc(g.opponent) + '</b>' +
      '<span class="fx-when">' + when(g) + (g.note ? ' · ' + esc(g.note) : '') + '</span>' +
    '</div>' +

    '<label>' + T('pickRate') + '</label>' +
    '<div class="rates">' +
      [[0.10,'10¢'],[0.25,'25¢'],[0.50,'50¢'],[1.00,'$1']].map(function(r){
        return '<button class="rate' + (r[0] === RATE ? ' on' : '') + '" data-r="' + r[0] + '" ' +
               'onclick="setRate(' + r[0] + ')">' + r[1] +
               '<small>' + money(r[0] * typicalPoints() * 1.20) + '</small></button>';
      }).join('') +
    '</div>' +

    '<div class="est">' +
      '<b>' + T('estTitle', { N: typicalPoints() }) + '</b>' +
      '<span id="estLine">' + estimate(RATE) + '</span>' +
    '</div>' +

    '<label for="pn">' + T('yourName') + '</label>' +
    '<input id="pn" type="text" maxlength="60" autocomplete="name">' +
    '<label for="pe">' + T('yourEmail') + '</label>' +
    '<input id="pe" type="email" maxlength="80" autocomplete="email">' +
    '<label for="pc">' + T('capLabel') + '</label>' +
    '<input id="pc" type="number" step="1" min="5" placeholder="—">' +

    (ROSTER.length
      ? '<label for="pp">' + T('whoAsked') + '</label>' +
        '<select id="pp">' +
          '<option value="">' + T('nobody') + '</option>' +
          ROSTER.map(function(pl){
            return '<option value="' + pl.id + '"' +
                   (pl.id === FROM_PLAYER ? ' selected' : '') + '>' + esc(pl.name) + '</option>';
          }).join('') +
        '</select>'
      : '') +

    '<button class="btn" onclick="send()">' + T('send') + '</button>' +
    '<p class="msg" id="msg"></p>' +
    '<p class="fine">' + T('minNote') + ' ' + T('feeNote') + '</p>' +
    '<p class="fine">' + T('notDonation') + '</p>' +
    '<button class="btn line" onclick="PICKED=null;draw()">' + T('back') + '</button>';
}

function say(t, c){
  var el = document.getElementById('msg');
  if (el){ el.textContent = t; el.className = 'msg ' + (c || ''); }
}

function send(){
  var name = (document.getElementById('pn').value || '').trim();
  var email = (document.getElementById('pe').value || '').trim();
  var capEl = document.getElementById('pc').value;
  var cap = capEl ? Number(capEl) : null;
  var ppEl = document.getElementById('pp');
  var player = ppEl && ppEl.value ? ppEl.value : null;

  if (!name || !email || email.indexOf('@') === -1) return say(T('errWho'), 'bad');

  say('…');
  rpc('pledge_game', {
    p_game: PICKED.id, p_name: name, p_email: email, p_rate: RATE,
    p_cap: cap, p_player: player
  })
  .then(function(r){
    if (!r || !r.ok){
      if (r && r.reason === 'min')    return say(T('errMin'), 'bad');
      if (r && r.reason === 'closed')  return say(T('errClosed'), 'bad');
      if (r && r.reason === 'started') return say(T('errStarted'), 'bad');
      if (r && r.reason === 'who')    return say(T('errWho'), 'bad');
      return say(T('errGen'), 'bad');
    }
    say(T('thanks'), 'ok');
    setTimeout(function(){ PICKED = null; load(); }, 2200);
  })
  .catch(function(e){ console.error(e); say(T('errGen'), 'bad'); });
}

document.getElementById('langBtn').textContent = LANG === 'en' ? 'ES' : 'EN';
load();
</script>
