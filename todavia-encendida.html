<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Todavía encendida — Cada Punto</title>
<meta name="description" content="Una cancha vacía después de la lluvia, con la luz prendida. Por qué es ésta la foto de Cada Punto.">
<meta property="og:title" content="Todavía encendida">
<meta property="og:description" content="Paró de llover, todo el mundo se fue, y los focos siguen prendidos.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Una cancha de barrio en Puerto Rico de noche, vacía después de la lluvia">
<meta property="og:url" content="https://cadapunto.com/todavia-encendida.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cada Punto">
<meta property="og:locale" content="es_PR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Todavía encendida">
<meta name="twitter:description" content="Paró de llover, todo el mundo se fue, y los focos siguen prendidos.">
<meta name="twitter:image" content="https://cadapunto.com/coach-cancha-og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* Una página de una sola cosa: la foto, y por qué es ésta y no otra.
   No vende nada y no pide nada. Al final hay un enlace, y nada más.

   Usa la imagen que ya está subida (coach-cancha-1024.webp), sin
   srcset: los otros dos tamaños no llegaron a subir y una foto que no
   aparece es peor que una foto pequeña. */
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--accent:#A84200;--ball:#FF7A18}
*{box-sizing:border-box}
html{background:#07141E}
body{margin:0;font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);background:#07141E;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{width:min(640px,91vw);margin:0 auto}

header{background:#12202E;border-bottom:1px solid #0B1724;padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

/* La foto manda. Ocupa todo el ancho y buena parte de la pantalla, con
   el título sobre el cielo oscuro y el banco libre abajo. */
.shot{position:relative;overflow:hidden;min-height:62vh;
  display:flex;flex-direction:column;justify-content:flex-start;background:#12202E}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:30% 86%}
.shot .scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(18,32,46,.90) 0%, rgba(18,32,46,.78) 26%,
    rgba(18,32,46,.42) 52%, rgba(18,32,46,.08) 80%,
    rgba(18,32,46,0) 100%)}
.shot .t{position:relative;padding:26px 0 0}
.kick{font-size:.58rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ball);margin:0 0 7px}
h1{font-size:clamp(1.9rem,8vw,3rem);font-weight:900;letter-spacing:-.03em;
  color:#fff;margin:0;line-height:1.08}
.sub{color:#C8D6E2;font-size:.95rem;margin:9px 0 0;max-width:30ch}
@media (min-width:760px){ .shot{min-height:70vh} .shot .t{padding-top:40px} }

main{padding:34px 0 10px}
p.b{font-size:1.06rem;margin:0 0 20px}
p.b.lead{font-size:1.2rem;font-weight:700;line-height:1.5}
p.b.end{font-size:1.15rem;font-weight:700;margin-top:28px}
p.b em{font-style:italic}

.rule{border:0;border-top:1px solid var(--line);margin:30px 0}
.close{font-size:1.06rem;margin:0 0 22px}
.close b{font-weight:900}
.go{display:inline-block;background:var(--ball);color:#EAF2F7;text-decoration:none;
  font-weight:900;padding:13px 22px;border-radius:5px;font-size:1rem}
.wall{color:var(--mute);font-size:.9rem;margin:30px 0 0}
.wall a{color:var(--accent);font-weight:800;text-decoration:none}
.cap{color:var(--mute);font-size:.82rem;margin:0}
.cap a{color:var(--accent);font-weight:800;text-decoration:none}

footer{background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;margin-top:46px;
  padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-dot{padding:0 7px;opacity:.5}


/* ══════════════════════════════════════════════════════════════
   LA CANCHA DE NOCHE
   El mismo color que la portada, en todo el sitio. Va al final a
   propósito: las reglas de arriba se quedan como están y éstas
   mandan encima.
   ══════════════════════════════════════════════════════════════ */
:root{
  --noche:#07141E; --cancha:#0E2232; --linea:#1B3A4F;
  --viva:#4FD3F0;  --brasa:#FF8A2B;  --hueso:#EAF2F7; --humo:#7A96A9;
  /* Y las que ya usaba esta página, apuntando a lo mismo */
  --ink:#EAF2F7; --mute:#7A96A9; --line:#1B3A4F; --tint:#0E2232;
  --accent:#4FD3F0; --good:#3FD89A; --bad:#FF7B7B;
  --paper:#EAF2F7; --panel:#0E2232; --gold:#FF8A2B; --leather:#4FD3F0;
  --ball:#FF8A2B; --edge:#2E5570; --teal:#4FD3F0;
}
html, body{background:#07141E;color:#EAF2F7}

/* La cabecera y el pie ya eran oscuros, pero de otro azul. */
header, footer, .top{background:#07141E;border-color:#1B3A4F}
header{border-bottom:1px solid #1B3A4F}
footer{border-top:1px solid #1B3A4F;color:#7A96A9}
footer a{color:#4FD3F0}
.mark{color:#EAF2F7}
.mark i{color:#7A96A9}
.langb{border-color:#2E5570;color:#9DB6C7;background:none}
.langb:hover{color:#EAF2F7;border-color:#7A96A9}

/* Cajas, paneles y cualquier cosa que antes era un rectángulo claro
   sobre blanco. */
.how, .linkbox, .s, .w, .tal, .num, .team, .pl, .caja, .chat, .card,
.panel, .box, .waits, .pay, .cuadro, .m.me{
  background:#0E2232;border-color:#1B3A4F;color:#EAF2F7}
.how p, .s span, .w span, .num span, .tal span, .help, .hint, .lede,
.cp, .who, .sub, .nota{color:#7A96A9}

/* Lo que se escribe. Un campo blanco en una página oscura es un
   agujero de luz, y en un teléfono de noche duele. */
input, select, textarea{
  background:#07141E;border-color:#2E5570;color:#EAF2F7}
input::placeholder, textarea::placeholder{color:#5F7C91}
input:focus, select:focus, textarea:focus{
  border-color:#4FD3F0;box-shadow:0 0 0 3px rgba(79,211,240,.18)}

/* Los botones. Aquí es donde un cambio de variables a ciegas dejaba
   blanco sobre blanco: el relleno era var(--ink), que ahora es la
   tinta. Se dicen los dos colores, y ya. */
.btn, button.btn, a.btn{
  background:#4FD3F0;border:2px solid #4FD3F0;color:#07141E}
.btn:hover{background:#07141E;color:#4FD3F0}
.btn.line, .btn.ghost, .btn.sec{
  background:transparent;border:2px solid #EAF2F7;color:#EAF2F7}
.btn.line:hover{background:#EAF2F7;color:#07141E}
.btn.go, .btn.hot, .btn.naranja{background:#FF8A2B;border-color:#FF8A2B;color:#07141E}
[style*="#FF8A2B"], .btn[class*="go"]{color:#07141E}
.btn:disabled{opacity:.45}

/* Separadores y reglas */
hr, .sep, .div{border-color:#1B3A4F;background:#1B3A4F}
table, th, td{border-color:#1B3A4F}

/* Enlaces dentro del texto */
/* Cada :not() suma fuerza, asi que esta regla le ganaba a cosas
   como a.wa. Lo que es un boton se excluye por nombre. */
main a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go), .wrap a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go){color:#4FD3F0}
a.pedir{color:inherit}

/* Lo que estaba escrito a mano en blanco y ahora es un agujero */
[style*="background:#07141E"], [style*="background: #07141E"]{background:#0E2232 !important}


/* Los que estaban puestos a mano con otro blanco: #FFF8F3, #FFFFFF.
   No son var() de nadie, así que hay que nombrarlos. */
[class]{--ff8:#0E2232}
.ojo, .env-nota, .nota-ojo, .aviso, .warn, .tip{background:#0E2232 !important;color:#EAF2F7}
.ttl, .env-nota b{color:#EAF2F7}
.cta{background:#4FD3F0 !important;border-color:#4FD3F0 !important;color:#07141E !important}
.cta:hover{background:#07141E !important;color:#4FD3F0 !important}
h1,h2,h3,h4{color:#EAF2F7}


/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
.mark em, .wm em{font-style:normal;color:#FF8A2B !important}
.mark i,  .wm i {font-style:normal;color:#4FD3F0 !important}
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}

</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="index.html">cada&nbsp;<em>punto</em>&nbsp;<i>cuenta</i></a>
    <button class="langb" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</header>

<section class="shot">
  <img src="coach-cancha-1024.webp" width="1024" height="683" decoding="async" id="shotImg" alt="">
  <span class="scrim" aria-hidden="true"></span>
  <div class="wrap t">
    <p class="kick" id="kick"></p>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </div>
</section>

<main><div class="wrap" id="body"></div></main>

<footer>
  <div class="wrap">
    <a href="index.html">Cada Punto</a><span class="f-dot">·</span>
    <a href="ayuda.html">Coach Cada Punto</a>
  </div>
</footer>

<script>
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

var S={
  es:{
    kick:'Un cuento',
    h1:'Todavía encendida',
    sub:'El juego del martes se canceló a las seis y veinte.',
    alt:'Una cancha de barrio en Puerto Rico de noche, vacía después de la lluvia, con un teléfono encendido en el banco',
    body:[
      ['lead','El juego del martes se canceló a las seis y veinte, cuando empezó a llover de lado.'],
      ['','Para las ocho había parado. La cancha quedó brillando como si alguien la hubiera encerado.'],
      ['','El entrenador volvió por las bolas que había dejado en el banco. El teléfono también se le había quedado — boca arriba, encendido, cogiendo agua.'],
      ['','Tenía tres mensajes. El papá de un nene, preguntando si se juega el jueves. Una vecina que no tiene hijos en el equipo, preguntando lo mismo. Y una mamá que se mudó a Orlando en agosto, diciendo que ella sigue puesta: que si el nene anota, ella paga desde allá.'],
      ['','Se quedó un rato parado ahí, con el teléfono en la mano, debajo de dos focos encendidos sobre una cancha donde esa noche no jugó nadie.'],
      ['end','No se apagó nada. Ni los focos, ni el teléfono, ni la vecina.']
    ],
    go:'Cada Punto →',
    wall:'¿La quieres en tu teléfono?',
    wallGo:'Bájala ↓',
    cap:'Loíza, Puerto Rico.'
  },
  en:{
    kick:'A story',
    h1:'Still On',
    sub:'Tuesday\u2019s game was called off at twenty past six.',
    alt:'A neighbourhood basketball court in Puerto Rico at night, empty after rain, with a phone glowing on the bench',
    body:[
      ['lead','Tuesday’s game was called off at twenty past six, when the rain started coming in sideways.'],
      ['','By eight it had stopped. The court was left shining, like somebody had waxed it.'],
      ['','The coach came back for the balls he had left on the bench. His phone was still there too — face up, lit, taking on water.'],
      ['','Three messages. A boy’s father, asking whether they play on Thursday. A neighbour with no children on the team, asking the same thing. And a mother who moved to Orlando in August, saying she is still in: if the boy scores, she pays from there.'],
      ['','He stood there a while with the phone in his hand, under two floodlights burning over a court where nobody had played that night.'],
      ['end','Nothing got switched off. Not the lights, not the phone, not the neighbour.']
    ],
    go:'Cada Punto →',
    wall:'Want it on your phone?',
    wallGo:'Download it ↓',
    cap:'Loíza, Puerto Rico.'
  }
};

var LANG='es';
try{ LANG=localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  localStorage.getItem('fc-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'); }catch(e){}
function T(k){ var v=(S[LANG]&&S[LANG][k]); return v===undefined?S.es[k]:v }
function toggleLang(){
  LANG=LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG);localStorage.setItem('cp-lang',LANG);
       localStorage.setItem('fc-lang',LANG) }catch(e){}
  paint();
}

function paint(){
  document.documentElement.lang=LANG;
  document.getElementById('langBtn').textContent=LANG==='es'?'EN':'ES';
  document.title=(LANG==='es')
    ? 'Todavía encendida — Cada Punto' : 'Still On — Cada Punto';

  document.getElementById('kick').textContent=T('kick');
  document.getElementById('h1').textContent=T('h1');
  document.getElementById('sub').textContent=T('sub');
  document.getElementById('shotImg').setAttribute('alt',T('alt'));

  var out='';
  T('body').forEach(function(p){
    out+='<p class="b'+(p[0]?' '+p[0]:'')+'">'+esc(p[1])+'</p>';
  });
  /* Ni moraleja ni botón. El cuento termina y lo único que queda es de
     dónde es la cancha y un enlace pequeño por si alguien quiere seguir.
     Explicar lo que significa sería quitárselo al que lo leyó. */
  /* Un regalo, no una llamada a la acción: va en gris, en una línea, y
     se baja el archivo en vez de abrir otra página. */
  out+='<p class="wall">'+esc(T('wall'))+' '+
       '<a href="todavia-encendida-vertical.jpg" download>'+esc(T('wallGo'))+'</a></p>';
  out+='<hr class="rule">';
  out+='<p class="cap">'+esc(T('cap'))+' · <a href="index.html">'+esc(T('go'))+'</a></p>';
  document.getElementById('body').innerHTML=out;
}
paint();
</script>
</body>
</html>
