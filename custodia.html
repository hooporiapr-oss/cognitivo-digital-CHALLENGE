<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;
      --good:#0B7A5A;--bad:#A8323F}
*{box-sizing:border-box}
html{background:#07141E}
/* El teclado del teléfono no achica la página, achica lo que se ve de
   ella. Con el alto clavado en 100dvh y el scroll metido en <main>, el
   campo enfocado se iba debajo del teclado y el navegador no podía
   subirlo. Rodando la página entera, sí puede. */
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#07141E;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(600px,93vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:1px solid #0B1724;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:clamp(20px,5vw,34px) 0 32px}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
footer p{margin:0 0 7px}
footer .f-co{color:#fff;font-weight:700}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-legal{margin:7px 0 0;font-size:.78rem}
footer .f-dot{padding:0 7px;opacity:.5}

.kick{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(1.5rem,4.6vw,2rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 10px;font-weight:900}
.lede{color:var(--mute);margin:0 0 22px}

/* El por que de la custodia. Va en caja y sin numero: no es una de las
   siete clausulas, es la razon por la que existen las siete. */
.porque{margin:0 0 30px;padding:20px 22px;border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:8px;background:var(--tint)}
.porque h2{margin:0 0 12px;font-size:1.05rem;font-weight:900;letter-spacing:-.01em}
.porque p{margin:0 0 11px;line-height:1.55}
.porque p:last-child{margin-bottom:0}
.porque .golpe{font-size:1.12rem;font-weight:800;letter-spacing:-.015em;
  color:var(--ink)}
/* El cierre, separado por una raya: la caja abre con lo que sabemos
   nosotros y cierra con lo que pide el programa. */
.porque .cierre{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
@media print{ .porque{break-inside:avoid} }
h2{font-size:1.02rem;margin:26px 0 8px;font-weight:900;letter-spacing:-.02em}

.how{display:grid;gap:10px;margin:0 0 24px}
.how .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px}
.how .s b{display:block;font-size:.98rem}
.how .s span{color:var(--mute);font-size:.92rem}

label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}
input{width:100%;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#07141E;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
/* Cuando el navegador sube el campo enfocado, que no quede pegado al
   borde: se ve su etiqueta y el campo de antes. */
label,input{scroll-margin-top:64px;scroll-margin-bottom:24px}
.hint{font-size:.82rem;color:var(--mute);margin:4px 0 0}
.btn{display:block;width:100%;padding:16px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;
  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.line{background:#07141E;color:var(--ink);margin-top:10px}
.ok{display:flex;gap:10px;align-items:flex-start;margin-top:18px;
  font-size:.88rem;font-weight:400;color:var(--mute)}
.ok span{cursor:pointer}
.ok input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.ok a{color:var(--accent)}
.msg{margin-top:12px;font-weight:700;font-size:.92rem;min-height:1.2em}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--good)}

/* En el teléfono el pie es lo último que hace falta mientras se llena
   un formulario: que ocupe lo justo. */
@media(max-width:560px){
  footer{padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));font-size:.76rem}
  footer p{margin:0 0 4px}
  footer .f-legal{margin:4px 0 0}
  main .wrap{padding-bottom:20px}
}

.fine{border-left:4px solid var(--accent);background:var(--tint);padding:14px 16px;margin:22px 0 0}
.fine b{display:block;margin-bottom:3px}
.fine p{margin:0;color:var(--mute);font-size:.93rem}

.done{text-align:center}
.done .tick{font-size:2.8rem;line-height:1;margin-bottom:10px}
</style>
<style>
/* La portada de las reglas: el nombre una vez, en grande. */
.rtop{border-bottom:3px solid var(--ink);padding-bottom:16px;margin:0 0 24px}
.rtop h1{font-size:clamp(1.6rem,6vw,2.4rem);margin:0 0 6px}
.rtop .sub{color:var(--mute);margin:0;font-size:.95rem}

/* Cada regla numerada, para que un entrenador pueda decir
   "regla 3.2" en la cancha y todo el mundo busque lo mismo. */
.sec{margin:0 0 26px}
.sec h2{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;font-size:1.06rem}
.sec h2 .n{flex:0 0 auto;color:var(--accent);font-weight:900}
.sec .cab{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.sec ol,.sec ul{margin:0;padding-left:0;list-style:none;counter-reset:r}
.sec li{position:relative;padding:9px 0 9px 44px;border-top:1px solid var(--line);font-size:.95rem}
.sec li:first-child{border-top:none}
.sec li::before{counter-increment:r;content:attr(data-n);position:absolute;left:0;top:9px;
  font-weight:900;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.sec .cierre{margin:10px 0 0;font-size:.95rem;font-weight:700}

table.money{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:.95rem}
table.money th,table.money td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.money th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  border-bottom:2px solid var(--ink)}
table.money td:nth-child(2),table.money th:nth-child(2),
table.money td:nth-child(3),table.money th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}

.pie{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pie a,.pie button{flex:1 1 180px;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#07141E;color:var(--ink);font:inherit;font-weight:800;font-size:.95rem;
  text-align:center;text-decoration:none;cursor:pointer}
.pie a.solid{background:var(--ink);color:#fff}

/* Un entrenador la va a imprimir y pegarla en la pared del gimnasio. */
/* La hoja impresa tiene que decir de dónde salió. Alguien la pega en
   la pared del gimnasio, otro entrenador le saca una foto, y si no
   lleva la dirección esa foto no lleva a ningún sitio. */
.pie-print{display:none}
@media print{
  .heroart,.why,.num{display:none !important}
  header,footer,.pie,.langb{display:none !important}
  html,body{background:#07141E}
  main .wrap{width:100%;padding:0}
  .sec{break-inside:avoid;page-break-inside:avoid}
  .rtop{border-bottom:2px solid #000}
  a{text-decoration:none;color:#000}
  .pie-print{display:block;margin-top:22px;padding-top:12px;
    border-top:2px solid #000;font-size:.86rem;font-weight:700;
    text-align:center;break-inside:avoid}
  .pie-print span{display:block;font-weight:400;font-size:.8rem;margin-top:3px}
}

.heroart{display:block;width:100%;height:auto;margin:0 0 clamp(18px,4vw,26px);
  border-radius:6px;border:1px solid rgba(255,138,43,.30);
  box-shadow:0 14px 40px rgba(0,0,0,.28)}
.why{display:grid;gap:10px;margin:0 0 26px}
.why .w{border-left:4px solid var(--accent);background:var(--tint);padding:13px 15px}
.why .w b{display:block;font-size:.98rem}
.why .w span{color:var(--mute);font-size:.92rem}
.num{display:grid;gap:10px;margin:0 0 26px;counter-reset:paso}
.num .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px 13px 46px;position:relative}
.num .s::before{counter-increment:paso;content:counter(paso);position:absolute;left:14px;top:13px;
  width:21px;height:21px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.num .s b{display:block;font-size:.98rem}
.num .s span{color:var(--mute);font-size:.92rem}
.rulesH{margin-top:34px;padding-top:22px;border-top:3px solid var(--ink)}
.rulesH h2{font-size:1.25rem;margin:0}
.f-what{margin:7px 0 0;font-size:.74rem;line-height:1.5;opacity:.72;max-width:52ch;
  margin-left:auto;margin-right:auto}
</style>
<style>
.ackbox{border:3px solid var(--ink);border-radius:6px;padding:17px 19px;margin:30px 0 0}
.ackbox h2{margin:0 0 7px;font-size:1.08rem}
.ackbox p{margin:0;color:var(--mute);font-size:.96rem}

/* ══════════════════════════════════════════════════════════════
   LA CANCHA DE NOCHE
   El mismo color que la portada, en todo el sitio. Va al final a
   propósito: las reglas de arriba se quedan como están y éstas
   mandan encima.
   ══════════════════════════════════════════════════════════════ */
:root{
  --noche:#07141E; --cancha:#0E2232; --linea:#1B3A4F;
  --viva:#4FD3F0;  --brasa:#FF8A2B;  --hueso:#EAF2F7; --humo:#7A96A9;
  /* Y las que ya usaba esta página, apuntando a lo mismo */
  --ink:#EAF2F7; --mute:#7A96A9; --line:#1B3A4F; --tint:#0E2232;
  --accent:#4FD3F0; --good:#3FD89A; --bad:#FF7B7B;
  --paper:#EAF2F7; --panel:#0E2232; --gold:#FF8A2B; --leather:#4FD3F0;
  --ball:#FF8A2B; --edge:#2E5570; --teal:#4FD3F0;
}
html, body{background:#07141E;color:#EAF2F7}

/* La cabecera y el pie ya eran oscuros, pero de otro azul. */
header, footer, .top{background:#07141E;border-color:#1B3A4F}
header{border-bottom:1px solid #1B3A4F}
footer{border-top:1px solid #1B3A4F;color:#7A96A9}
footer a{color:#4FD3F0}
.mark{color:#EAF2F7}
.mark i{color:#7A96A9}
.langb{border-color:#2E5570;color:#9DB6C7;background:none}
.langb:hover{color:#EAF2F7;border-color:#7A96A9}

/* Cajas, paneles y cualquier cosa que antes era un rectángulo claro
   sobre blanco. */
.how, .linkbox, .s, .w, .tal, .num, .team, .pl, .caja, .chat, .card,
.panel, .box, .waits, .pay, .cuadro, .m.me{
  background:#0E2232;border-color:#1B3A4F;color:#EAF2F7}
.how p, .s span, .w span, .num span, .tal span, .help, .hint, .lede,
.cp, .who, .sub, .nota{color:#7A96A9}

/* Lo que se escribe. Un campo blanco en una página oscura es un
   agujero de luz, y en un teléfono de noche duele. */
input, select, textarea{
  background:#07141E;border-color:#2E5570;color:#EAF2F7}
input::placeholder, textarea::placeholder{color:#5F7C91}
input:focus, select:focus, textarea:focus{
  border-color:#4FD3F0;box-shadow:0 0 0 3px rgba(79,211,240,.18)}

/* Los botones. Aquí es donde un cambio de variables a ciegas dejaba
   blanco sobre blanco: el relleno era var(--ink), que ahora es la
   tinta. Se dicen los dos colores, y ya. */
.btn, button.btn, a.btn{
  background:#4FD3F0;border:2px solid #4FD3F0;color:#07141E}
.btn:hover{background:#07141E;color:#4FD3F0}
.btn.line, .btn.ghost, .btn.sec{
  background:transparent;border:2px solid #EAF2F7;color:#EAF2F7}
.btn.line:hover{background:#EAF2F7;color:#07141E}
.btn.go, .btn.hot, .btn.naranja{background:#FF8A2B;border-color:#FF8A2B;color:#07141E}
[style*="#FF8A2B"], .btn[class*="go"]{color:#07141E}
.btn:disabled{opacity:.45}

/* Separadores y reglas */
hr, .sep, .div{border-color:#1B3A4F;background:#1B3A4F}
table, th, td{border-color:#1B3A4F}

/* Enlaces dentro del texto */
/* Cada :not() suma fuerza, asi que esta regla le ganaba a cosas
   como a.wa. Lo que es un boton se excluye por nombre. */
main a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go), .wrap a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go){color:#4FD3F0}
a.pedir{color:inherit}

/* Lo que estaba escrito a mano en blanco y ahora es un agujero */
[style*="background:#07141E"], [style*="background: #07141E"]{background:#0E2232 !important}


/* Los que estaban puestos a mano con otro blanco: #FFF8F3, #FFFFFF.
   No son var() de nadie, así que hay que nombrarlos. */
[class]{--ff8:#0E2232}
.ojo, .env-nota, .nota-ojo, .aviso, .warn, .tip{background:#0E2232 !important;color:#EAF2F7}
.ttl, .env-nota b{color:#EAF2F7}
.cta{background:#4FD3F0 !important;border-color:#4FD3F0 !important;color:#07141E !important}
.cta:hover{background:#07141E !important;color:#4FD3F0 !important}
h1,h2,h3,h4{color:#EAF2F7}


/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
.mark em, .wm em{font-style:normal;color:#FF8A2B !important}
.mark i,  .wm i {font-style:normal;color:#4FD3F0 !important}
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}

</style>

ago del padrino no va directo al programa. Entra a una cuenta de Gostar Digital LLC y de ahí se le remite.", "s1": ["El cobro lo procesa Stripe, Inc. Nosotros no vemos ni guardamos números de tarjeta.", "El dinero cobrado queda en una cuenta de Gostar Digital LLC hasta que se remite.", "No somos un banco ni un fideicomiso. El dinero retenido no genera intereses para nadie y no está asegurado como un depósito bancario."], "s2h": "Cuándo le llega al programa", "s2c": "Dos veces al mes: el día 1 y el día 15. El 1 va lo cobrado del 16 al fin del mes anterior; el 15 va lo cobrado del 1 al 14.", "s2": ["Lo más que espera un pago son quince días. Uno que entra el 2 se remite el 15; uno que entra el 16 se remite el 1 del mes que viene.", "Se remite al método que el programa nos indique por escrito. Cambiarlo requiere avisarnos por escrito desde el correo de la campaña.", "Si el 1 o el 15 cae en feriado o fin de semana, se remite el próximo día laborable.", "Si por alguna razón no podemos remitir en esa fecha, se lo decimos al programa antes de que pase, con la razón y la fecha nueva."], "s3h": "Cuánto le llega", "s3c": "Todo lo que se le cobró a los padrinos. De ahí no sale nuestro cargo.", "s3": ["El programa recibe el 100% de lo cobrado. Lo prometido no es lo cobrado: una promesa es una promesa, el cobro tiene su cierre, y lo que entró para ese cierre es lo que se remite.", "Nuestro 20% se le sumó al pago del padrino, encima de la promesa. Nunca se descuenta de lo del programa.", "Los cargos de procesamiento de Stripe también se añaden al pago del padrino, no se restan de lo del programa."], "s4h": "Devoluciones y disputas", "s4c": "Un padrino puede disputar un cargo con su banco después de que ya le remitimos al programa.", "s4": ["Si un cuarto se registró mal, o el día de juego no se dio, devolvemos el dinero al padrino.", "Si un padrino disputa un cargo con su banco después de una remesa, ese monto se descuenta de la próxima remesa del programa.", "Si no hay próxima remesa de dónde descontarlo, se lo pedimos al programa por escrito, con el detalle del cargo disputado.", "Le avisamos al programa de cualquier disputa en cuanto la sepamos."], "s5h": "Lo que el programa puede ver", "s5c": "Nada de esto depende de que usted nos crea.", "s5": ["De dónde sale el marcador que se cobra depende del juego. En un juego de baloncesto de verdad lo reporta el entrenador con su código, o nosotros desde el calendario que nos dio — y queda en el tablero del equipo, a la vista de todo el que tenga el enlace. En el Fortress no lo escribe nadie: lo registra el juego, cuarto por cuarto, mientras se juega.", "El panel del programa enseña lo prometido, lo cobrado y lo pendiente, al día.", "Puede pedirnos por escrito un estado de cuenta de cualquier periodo y se lo mandamos.", "Guardamos el registro de cada promesa, cada cobro y cada remesa mientras corra la campaña y después por el tiempo que exijan las reglas de contabilidad."], "s6h": "Si algo se detiene", "s6c": "Programas cierran, cuentas cambian, campañas se abandonan.", "s6": ["Si el programa deja de existir o no podemos localizarlo, retenemos lo cobrado e intentamos comunicarnos al correo de la campaña.", "Si pasan seis meses sin poder remitir, lo tratamos según lo que exija la ley de Puerto Rico para fondos no reclamados.", "Si el programa cierra su campaña con dinero cobrado sin remitir, se remite en la próxima fecha normal."], "s7h": "Impuestos", "s7c": "Cada programa responde por su propia situación contributiva.", "s7": ["No hacemos ninguna afirmación sobre cómo se trata una promesa o un pago para efectos contributivos.", "No emitimos recibos para impuestos y no decimos que una promesa sea deducible.", "Lo que el programa le diga a sus padrinos sobre impuestos es del programa, y el programa responde por eso."], "ackH": "Lo que acepta el programa", "ackP": "Al inscribir un equipo, el programa marca que leyó y acepta esta divulgación, además de los Términos de Uso y la Política de Privacidad. yment, not subtracted from the program’s."], "s4h": "Refunds and disputes", "s4c": "A padrino can dispute a charge with their bank after we have already remitted to the program.", "s4": ["If a quarter was recorded wrongly, or the game day did not happen, we refund the padrino.", "If a padrino disputes a charge with their bank after a remittance, that amount is deducted from the program’s next remittance.", "If there is no next remittance to deduct it from, we ask the program for it in writing, with the detail of the disputed charge.", "We tell the program about any dispute as soon as we know of it."], "s5h": "What the program can see", "s5c": "None of this depends on taking our word for it.", "s5": ["Where the billed score comes from depends on the game. For a real basketball game the coach reports it with his code, or we do from the schedule he gave us — and it sits on the team board, visible to anyone with the link. In the Fortress nobody types it: the game records it, quarter by quarter, as it is played.", "The program’s panel shows what was pledged, what was collected and what is outstanding, up to date.", "The program can ask us in writing for a statement covering any period and we send it.", "We keep the record of every pledge, every payment and every remittance while the campaign runs and afterwards for as long as accounting rules require."], "s6h": "If something stops", "s6c": "Programs close, accounts change, campaigns get abandoned.", "s6": ["If a program ceases to exist or we cannot reach it, we hold what was collected and try the campaign’s email address.", "If six months pass without our being able to remit, we treat it as Puerto Rico law requires for unclaimed funds.", "If a program closes its campaign with money collected and not yet remitted, it is remitted on the next normal date."], "s7h": "Taxes", "s7c": "Each program is responsible for its own tax position.", "s7": ["We make no representation about how a pledge or a payment is treated for tax purposes.", "We do not issue tax receipts and we do not say a pledge is deductible.", "What a program tells its padrinos about taxes is the program’s own, and the program answers for it."], "ackH": "What the program accepts", "ackP": "When signing a team up, the program ticks that it has read and accepts this disclosure, along with the Terms of Use and the Privacy Policy. If any of this does not work for your program, do not sign up — write to us and we will talk it through first.", "verT": "Terms of Use →", "verP": "Privacy Policy →", "print": "Print", "back": "← Cada Punto", "pieP": "cadapunto.com/custodia.html", "pieS": "How the money is handled · Cada Punto · Gostar Digital LLC, Puerto Rico"}};
