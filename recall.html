<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Recall Challenge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:Arial,sans-serif;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}

#screen-intro{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#061524 0%,#000 70%);z-index:100;
  overflow-y:auto;overflow-x:hidden;padding:20px 16px 24px;
}
.vrr-sub{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:#38BDF8;margin-bottom:8px;text-align:center}
.vrr-title{font-size:2.4rem;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 40px rgba(56,189,248,.7);margin-bottom:16px;text-align:center}
.vrr-title span{color:#38BDF8}
.rule-t{font-size:.9rem;color:#c9b8a8;line-height:1.55;max-width:420px;margin-bottom:22px;text-align:center}
.rule-t b{color:#fff}
.big-btn{width:100%;max-width:420px;height:68px;border:none;border-radius:20px;background:linear-gradient(135deg,#38BDF8,#7DD3FC);color:#fff;font-size:1.2rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 40px rgba(56,189,248,.7);margin-bottom:14px}
.big-btn:hover{transform:scale(1.03)}
.big-btn.official{background:linear-gradient(135deg,#22D3EE,#0C7FC4);color:#04121A;box-shadow:0 0 40px rgba(34,211,238,.6)}
/* ---- the demonstration and the instructions, intro screen only ---- */
.demo-wrap{position:relative;margin:8px 0 18px}
.demo-label{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  background:#050A12;border:1px solid rgba(56,189,248,.35);color:#7DD3FC;
  padding:4px 12px;border-radius:999px;white-space:nowrap;z-index:2;transition:color .2s,border-color .2s;
}
.demo-label.recall{color:#38BDF8;border-color:rgba(56,189,248,.5)}
.demo-label.good{color:#00D9A5;border-color:rgba(0,217,165,.5)}
.demo-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;
  width:190px;height:190px;margin:0 auto;
  background:#0D1826;border:1px solid rgba(56,189,248,.25);border-radius:14px;
}
.demo-cell{
  border-radius:5px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.85rem;color:transparent;transition:all .15s;
}
.demo-cell.lit{background:#38BDF8;border-color:#7DD3FC;color:#04121A;box-shadow:0 0 14px rgba(56,189,248,.55);transform:scale(1.06)}
.demo-cell.ok{background:#00D9A5;border-color:#5EEAD4;color:#04211A}
.demo-grid.pulse{animation:demoPulse .5s ease-out}
@keyframes demoPulse{0%{box-shadow:0 0 0 0 rgba(56,189,248,.55)}60%{box-shadow:0 0 22px 7px rgba(56,189,248,.25)}100%{box-shadow:none}}

.htp{width:100%;max-width:420px;margin:0 0 16px}
.htp-toggle{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:12px 16px;border-radius:12px;cursor:pointer;font-family:inherit;
  background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.25);
}
.htp-toggle-text{font-size:.82rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7DD3FC}
.htp-arrow{color:#7DD3FC;font-size:.7rem;transition:transform .3s}
.htp-toggle.open .htp-arrow{transform:rotate(180deg)}
.htp-body{max-height:0;overflow:hidden;transition:max-height .45s ease-out}
.htp-body.open{max-height:900px}
.htp-card{background:#0D1826;border:1px solid #1E3550;border-radius:12px;padding:15px;margin-top:10px;text-align:left}
.htp-card-title{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#38BDF8;margin-bottom:11px}
.htp-step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.htp-step:last-child{margin-bottom:0}
.htp-step .n{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:#38BDF8;color:#04121A;font-size:.72rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.htp-step .tx{font-size:.8rem;color:#CFE3F2;line-height:1.5}
.htp-step .tx b{color:#7DD3FC}
.htp-tip{background:rgba(34,211,238,.07);border-left:3px solid #22D3EE;padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px}
.htp-tip-title{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#22D3EE;margin-bottom:4px}
.htp-tip-text{font-size:.75rem;color:#8AA4BD;line-height:1.45}

.name-input{width:100%;max-width:420px;padding:14px;border-radius:14px;border:2px solid rgba(56,189,248,.4);background:rgba(255,255,255,.05);color:#fff;font-family:Arial,sans-serif;font-size:1rem;text-align:center;margin-bottom:14px}
.name-input:focus{outline:none;border-color:#38BDF8;box-shadow:0 0 20px rgba(56,189,248,.35)}
.box-open-btn{width:100%;max-width:420px;height:52px;border:2px solid rgba(56,189,248,.5);background:rgba(56,189,248,.1);border-radius:14px;color:#7DD3FC;font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.best-line{margin-top:16px;font-size:.85rem;color:#a7adba}
.best-line b{color:#38BDF8}
.intro-back{position:fixed;top:16px;left:16px;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;z-index:60}
.lang-btn{position:fixed;top:16px;right:16px;padding:8px 14px;border:2px solid rgba(56,189,248,.45);background:rgba(0,0,0,.5);color:#7DD3FC;font-size:.72rem;font-weight:900;letter-spacing:.08em;border-radius:999px;cursor:pointer;z-index:60}

.official-banner{
  max-width:420px;width:100%;padding:14px 16px;border-radius:14px;
  border:2px solid rgba(34,211,238,.45);background:rgba(34,211,238,.08);
  margin-bottom:18px;text-align:center;
}
.official-banner .ob-kick{font-size:.6rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#22D3EE;margin-bottom:5px}
.official-banner .ob-name{font-size:1.05rem;font-weight:900;color:#fff}
.official-banner .ob-note{font-size:.78rem;color:#c9b8a8;margin-top:6px;line-height:1.45}

#countdown{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
#bigCount{font-size:7rem;font-weight:900;color:#38BDF8;text-shadow:0 0 40px #38BDF8,0 0 80px #22D3EE}

#screen-end{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#061524 0%,#000 70%);text-align:center;padding:20px;overflow-y:auto}
.final-num{font-size:6rem;font-weight:900;color:#38BDF8;line-height:1;text-shadow:0 0 60px rgba(56,189,248,.9)}
.final-label{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#a7adba;margin-top:10px}
.final-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;margin:18px auto}
.final-stat-cell{border-radius:12px;border:2px solid rgba(56,189,248,.35);background:rgba(56,189,248,.06);padding:12px 4px;text-align:center}
.final-stat-label{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#7DD3FC;margin-bottom:4px}
.final-stat-val{font-size:1.3rem;font-weight:900;color:#fff}
.points-cell{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.08)}
.points-cell .final-stat-label{color:#22D3EE}
.save-status{font-size:.78rem;font-weight:700;margin-top:14px;min-height:18px}
.next-player-btn{margin-top:24px;height:64px;padding:0 40px;border:none;border-radius:16px;background:linear-gradient(120deg,#38BDF8,#7DD3FC);color:#fff;font-size:1.15rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(56,189,248,.6)}

#screen-game{position:fixed;inset:0;display:none;flex-direction:column;background:#000;overflow:hidden}
.topbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:10px 10px 4px;flex-shrink:0}
.top-box{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);border-radius:10px;padding:5px 14px;text-align:center;min-width:72px}
.top-box.official{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
.top-label{font-size:.55rem;color:#a7adba;text-transform:uppercase;letter-spacing:.06em}
.top-val{font-size:1.3rem;font-weight:900}
#hLevel{color:#fff}#hPoints{color:#22D3EE}#hTime{color:#22D3EE}

#msg{text-align:center;padding:6px;font-size:1.05rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;min-height:32px}
#msg.watch{color:#22D3EE}#msg.go{color:#00D9A5}#msg.miss{color:#FF1493}

/* The court is square, so it fits a phone held upright and a desktop
   window equally — a 2:1 court forces one or the other to compromise. */
.court-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.court{
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
  gap:2.2%;padding:2.2%;
  border:2px solid rgba(56,189,248,.4);border-radius:16px;
  background:#0D1826;
  box-shadow:0 0 60px rgba(56,189,248,.22),inset 0 0 40px rgba(56,189,248,.05),0 20px 60px rgba(0,0,0,.8);
}
.cell{
  border-radius:10px;background:rgba(56,189,248,.05);border:2px solid rgba(56,189,248,.28);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:transparent;cursor:pointer;transition:all .08s;touch-action:manipulation;
}
.cell.lit{background:#38BDF8!important;border-color:#22D3EE!important;box-shadow:0 0 22px rgba(56,189,248,.9)!important;color:#fff!important;transform:scale(1.04)}
.cell.correct{background:#00D9A5!important;border-color:#00D9A5!important;box-shadow:0 0 16px rgba(0,217,165,.7)!important;color:#fff!important}
.cell.wrong{background:rgba(255,20,147,.35)!important;border-color:#FF1493!important;animation:shake .3s}
.cell.reveal{background:#38BDF8!important;border-color:#22D3EE!important;color:#fff!important;opacity:.55}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

#controls{display:flex;justify-content:center;gap:10px;padding:8px 16px 14px;flex-shrink:0}
.ctrl-btn{height:46px;flex:0 1 170px;max-width:200px;border:2px solid rgba(56,189,248,.5);background:rgba(0,0,0,.4);border-radius:12px;color:#fff;font-size:.92rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
</style>
</head>

  <div id="controls">

</div>

//  Deliberately simpler than the training version at memorybball:
//  no modes, no level select, no quarters. A challenge run is one
//  escalating sequence, so every player's score means the same
//  thing and can be compared.

    tryoutSaved:'✓ Guardado en la prueba de tu equipo.',
    tryoutFailed:'No se pudo guardar en la prueba — intenta otra vez.',
    recording:'Guardando tu corrida oficial…',
    recorded:'✓ Corrida oficial guardada — {P} puntos.',
    wasAlready:'Tu corrida oficial ya estaba guardada. Esta fue práctica.',
    wrongLink:'Este enlace no puede guardar una corrida oficial — pídele a tu entrenador tu propio enlace.',
    noServer:'No se pudo conectar al servidor — habla con tu entrenador antes de jugar otra vez.',
    bestLine:'Tu mejor práctica: <b>secuencia {L}</b> · {P} puntos'
  }
};

var LANG = 'en';
try { LANG = localStorage.getItem('fc-lang') || ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es' : 'en'); } catch(e){}

function T(key, vals){
  var out = (STR[LANG] && STR[LANG][key]) || STR.en[key] || key;
  if (vals) Object.keys(vals).forEach(function(k){ out = out.split('{'+k+'}').join(vals[k]); });
  return out;
}

function applyLang(){
  // the instruction cards and the demo label
  ['cObjective','cScoring','cs1','cs2','cs3','cp1','cp2','cp3','cTipTitle','cTip','htpText']
    .forEach(function(id){ var el=$(id); if(el) el.innerHTML = T(id); });
  document.documentElement.lang = LANG;
  $('introSub').textContent = T('sub');
  $('ruleText').innerHTML = T('rule');
  $('playerNameInputMain').placeholder = T('namePh');
  $('obKick').textContent = T('officialKick');
  $('lblLevel').textContent = T('lblLevel');
  $('lblPoints').textContent = T('lblPoints');
  $('lblTime').textContent = T('lblTime');
  $('statPointsLbl').textContent = T('statPoints');
  $('statTimeLbl').textContent = T('statTime');
  $('againBtn').textContent = T('playAgain');
  $('langBtn').textContent = LANG === 'en' ? 'ES' : 'EN';
  var linked = CHALLENGE_ID && PLAYER_ID;
  $('introBack').textContent = linked ? T('backToChallenge') : T('back');
  $('homeBtn').textContent = linked ? T('backToChallenge') : T('home');
  $('backToPledge').textContent = linked ? T('backToChallenge') : T('back');
  if (!$('bigStart').dataset.locked) $('bigStart').textContent = IS_OFFICIAL ? T('startOfficial') : T('start');
  if (!$('obNote').dataset.locked) $('obNote').textContent = T('officialNote');
}

function toggleLang(){
  LANG = LANG === 'en' ? 'es' : 'en';
  try { localStorage.setItem('fc-lang', LANG); } catch(e){}
  applyLang();
  loadBest();
}

// ══════════════════════════════════════════════════════
//  THE DEMONSTRATION
//
//  Runs on the intro screen only and shares nothing with the game —
//  its own grid, its own timers, its own cells. It stops the moment a
//  run starts, so it can never compete with the real thing for
//  attention or for the clock.
// ══════════════════════════════════════════════════════
var demoCells=[], demoTimers=[], demoOn=false;

function demoClearTimers(){ demoTimers.forEach(clearTimeout); demoTimers=[]; }
function demoLater(fn, ms){ demoTimers.push(setTimeout(fn, ms)); }

function buildDemo(){
  var g = $('demoGrid');
  if (!g) return;
  g.innerHTML=''; demoCells=[];
  for (var i=0;i<25;i++){
    var c=document.createElement('div');
    c.className='demo-cell';
    g.appendChild(c); demoCells.push(c);
  }
}

function demoPattern(n){
  var pool=[]; for(var i=0;i<25;i++)pool.push(i);
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var t=pool[j]; pool[j]=pool[k]; pool[k]=t;
  }
  return pool.slice(0,n);
}

function demoRound(){
  if (!demoOn) return;
  var pat = demoPattern(4);
  var lbl = $('demoLabel');

  demoCells.forEach(function(c){ c.className='demo-cell'; c.textContent=''; });
  lbl.textContent = T('demoWatch'); lbl.className='demo-label';

  demoLater(function(){
    if (!demoOn) return;
    pat.forEach(function(idx,n){
      demoCells[idx].classList.add('lit');
      demoCells[idx].textContent = n+1;
    });
  }, 500);

  demoLater(function(){
    if (!demoOn) return;
    pat.forEach(function(idx){
      demoCells[idx].classList.remove('lit');
      demoCells[idx].textContent='';
    });
    lbl.textContent = T('demoTap'); lbl.className='demo-label recall';
  }, 2600);

  pat.forEach(function(idx,i){
    demoLater(function(){
      if (!demoOn) return;
      demoCells[idx].classList.add('ok');
      demoCells[idx].textContent = i+1;
    }, 3100 + i*380);
  });

  demoLater(function(){
    if (!demoOn) return;
    lbl.textContent = T('demoPerfect'); lbl.className='demo-label good';
    $('demoGrid').classList.add('pulse');
    setTimeout(function(){ var g=$('demoGrid'); if(g) g.classList.remove('pulse'); }, 500);
  }, 3100 + 4*380 + 200);

  demoLater(demoRound, 6400);
}

function startDemo(){
  if (demoOn) return;
  demoOn = true;
  buildDemo();
  demoRound();
}
function stopDemo(){
  demoOn = false;
  demoClearTimers();
}

function toggleHtp(){
  $('htpToggle').classList.toggle('open');
  $('htpBody').classList.toggle('open');
}

// ---- the game ----
var GRID = 25;
var START_LENGTH = 2;
var SHOW_MS = 2400;      // how long the numbers stay visible
var BETWEEN_MS = 800;

var phase='idle';
var sequence=[];
var playerIdx=0;
var level=0;
var best=0;
var timers=[];
var cells=[];
var runStartTime=0;
var currentPlayerName='';

function clrT(){timers.forEach(clearTimeout);timers=[]}
function msg(t,c){var e=$('msg');e.textContent=t;e.className=c||'watch'}

// The court is square and sized to whatever space is available, so it
// fills a phone held upright and a desktop window equally well.
function resizeCourt(){
  var area=document.querySelector('.court-area');
  var court=$('court');
  if(!area||!court)return;
  var size=Math.min(area.clientWidth, area.clientHeight);
  if(size<80) { requestAnimationFrame(resizeCourt); return; }
  court.style.width=size+'px';
  court.style.height=size+'px';
  // Numbers scale with the cells rather than being fixed.
  cells.forEach(function(c){ c.style.fontSize=Math.round(size*0.062)+'px'; });
}
window.addEventListener('resize',resizeCourt);
window.addEventListener('orientationchange',function(){setTimeout(resizeCourt,220)});
document.addEventListener('fullscreenchange',function(){setTimeout(resizeCourt,220)});

function buildCourt(){
  var court=$('court');
  court.innerHTML='';cells=[];
  for(var i=0;i<GRID;i++){
    var c=document.createElement('div');
    c.className='cell';
    (function(idx){
      c.addEventListener('pointerdown',function(e){e.preventDefault();handleTap(idx)});
    })(i);
    court.appendChild(c);
    cells.push(c);
  }
  resizeCourt();
}

function clearCells(){
  cells.forEach(function(c){ c.className='cell'; c.textContent=''; });
}

var audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){} } }
function blip(freq){
  if(!audioCtx)return;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq||440;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.16,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.12);
    o.start(); o.stop(audioCtx.currentTime+.13);
  }catch(e){}
}

function pickCells(n){
  var pool=[];
  for(var i=0;i<GRID;i++)pool.push(i);
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var tmp=pool[j];pool[j]=pool[k];pool[k]=tmp;
  }
  return pool.slice(0,n);
}

function startRun(){
  if(phase==='running')return;
  stopDemo();
  ensureAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } }catch(e){}

  $('screen-intro').style.display='none';
  $('screen-end').style.display='none';
  $('screen-game').style.display='flex';
  buildCourt();

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      resizeCourt();
      countdownThen(function(){ resizeCourt(); beginRun(); });
    });
  });
}

function countdownThen(cb){
  $('countdown').style.display='flex';
  var n=3;$('bigCount').textContent=n;
  var iv=setInterval(function(){
    n--;
    if(n<=0){clearInterval(iv);$('countdown').style.display='none';cb()}
    else{$('bigCount').textContent=n}
  },800);
}

function beginRun(){
  phase='running';
  level=START_LENGTH-1;
  runStartTime=performance.now();
  $('hLevel').textContent='0';$('hPoints').textContent='0';$('hTime').textContent='0.0';
  msg(T('getReady'),'go');
  timers.push(setTimeout(nextLevel,900));
  requestAnimationFrame(tickTimer);
}

function tickTimer(){
  if(phase!=='running')return;
  $('hTime').textContent=((performance.now()-runStartTime)/1000).toFixed(1);
  requestAnimationFrame(tickTimer);
}

function nextLevel(){
  if(phase!=='running')return;
  level++;
  playerIdx=0;
  sequence=pickCells(level);
  $('hLevel').textContent=level;
  clearCells();

  // All the numbers appear at once — this is a memory test, not a
  // sequence-watching test, so the player chooses how to encode them.
  msg(T('memorize'),'watch');
  sequence.forEach(function(idx,n){
    cells[idx].classList.add('lit');
    cells[idx].textContent=n+1;
  });
  blip(660);

  timers.push(setTimeout(function(){
    if(phase!=='running')return;
    clearCells();
    msg(T('yourTurn'),'go');
  }, SHOW_MS));
}

function handleTap(idx){
  if(phase!=='running')return;
  if($('msg').textContent!==T('yourTurn'))return;   // still memorizing

  if(idx===sequence[playerIdx]){
    cells[idx].classList.add('correct');
    cells[idx].textContent=playerIdx+1;
    blip(880);
    playerIdx++;

    if(playerIdx>=sequence.length){
      $('hPoints').textContent=pointsFor(level);
      msg(T('nice'),'go');
      timers.push(setTimeout(nextLevel,BETWEEN_MS));
    }
  }else{
    cells[idx].classList.add('wrong');
    // Show what the answer was — a run that ends without explanation
    // teaches nothing.
    sequence.forEach(function(s,n){
      if(!cells[s].classList.contains('correct')){
        cells[s].classList.add('reveal');
        cells[s].textContent=n+1;
      }
    });
    endRun();
  }
}

function endRun(){
  if(phase==='done')return;
  phase='done';clrT();

  // The level being attempted was not completed, so the score is the
  // last sequence fully recalled.
  var finalLevel=Math.max(0, level-1);
  var finalTime=(performance.now()-runStartTime)/1000;

  msg(T('wrong'),'miss');
  timers.push(setTimeout(function(){ showFinal(finalLevel,finalTime); },1100));
}

function showFinal(finalLevel,finalTime){
  var points=pointsFor(finalLevel);

  if(finalLevel>best){best=finalLevel;saveBest()}

  $('endNum').textContent=finalLevel;
  $('endPoints').textContent=points;
  $('endTime').textContent=finalTime.toFixed(1)+'s';
  $('screen-game').style.display='none';
  $('screen-end').style.display='flex';

  var status=$('saveStatus');

  if(TRYOUT && PLAYER_ID){
    $('endLabel').textContent=T('labelPractice');
    status.style.color='#a7adba';
    recordTryout(finalLevel, status);
    return;
  }

  if(!IS_OFFICIAL){
    $('endLabel').textContent=T('labelPractice');
    status.style.color='#7d8ba3';
    status.textContent=T('practiceOnly');
    if(CHALLENGE_ID && PLAYER_ID) recordPractice(finalLevel);
    return;
  }

  $('endLabel').textContent=T('labelOfficial');
  status.style.color='#a7adba';
  status.textContent=T('recording');

  fetch(SB_URL+'/rest/v1/rpc/record_official_run',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({
      p_challenge:CHALLENGE_ID, p_player:PLAYER_ID, p_key:RUN_KEY,
      p_level:finalLevel, p_points:points, p_time:Number(finalTime.toFixed(2)),
      p_game:GAME
    })
  })
  .then(function(r){ if(!r.ok) throw new Error('failed'); return r.json(); })
  .then(function(out){
    if(out && out.ok){
      status.style.color='#00D9A5';
      status.textContent=T('recorded',{P:points});
      IS_OFFICIAL=false;
      return;
    }
    if(out && out.reason==='already'){
      status.style.color='#22D3EE';
      status.textContent=T('wasAlready');
      IS_OFFICIAL=false;
      return;
    }
    status.style.color='#ff6b35';
    status.textContent=T('wrongLink');
  })
  .catch(function(e){
    status.style.color='#ff6b35';
    status.textContent=T('noServer');
    console.error('Challenge run write:',e);
  });
}

function recordPractice(finalLevel){
  var base=SB_URL+'/rest/v1/challenge_practice';
  var headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
  var filter='?challenge_id=eq.'+encodeURIComponent(CHALLENGE_ID)
           +'&player_id=eq.'+encodeURIComponent(PLAYER_ID)
           +'&game=eq.'+GAME;

  fetch(base+filter+'&select=best_level,runs',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
  .then(function(r){return r.json()})
  .then(function(rows){
    if(rows && rows.length){
      var row=rows[0];
      return fetch(base+filter,{method:'PATCH',headers:headers,body:JSON.stringify({
        best_level:Math.max(row.best_level||0,finalLevel),
        runs:(row.runs||0)+1,
        updated_at:new Date().toISOString()
      })});
    }
    return fetch(base,{method:'POST',headers:headers,body:JSON.stringify({
      challenge_id:CHALLENGE_ID, player_id:PLAYER_ID, game:GAME,
      best_level:finalLevel, runs:1
    })});
  })
  .catch(function(e){console.error('Practice record:',e)});
}

// Keeps this player's best for this game in this campaign. Only ever
// moves upward, so a bad run never lowers what the team is judged on.
function recordTryout(finalLevel, status){
  var base = SB_URL + '/rest/v1/campaign_tryouts';
  var headers = {
    'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json', 'Prefer': 'return=representation'
  };
  var filter = '?campaign_id=eq.' + encodeURIComponent(TRYOUT)
             + '&player_id=eq.' + encodeURIComponent(PLAYER_ID)
             + '&game=eq.' + GAME;

  fetch(base + filter + '&select=best_level,runs', {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    if (rows && rows.length){
      var row = rows[0];
      return fetch(base + filter, { method:'PATCH', headers:headers, body:JSON.stringify({
        best_level: Math.max(row.best_level || 0, finalLevel),
        runs: (row.runs || 0) + 1,
        updated_at: new Date().toISOString()
      })});
    }
    return fetch(base, { method:'POST', headers:headers, body:JSON.stringify({
      campaign_id: TRYOUT, player_id: PLAYER_ID, game: GAME,
      best_level: finalLevel, runs: 1
    })});
  })
  .then(function(){
    status.style.color = '#00D9A5';
    status.textContent = T('tryoutSaved');
  })
  .catch(function(e){
    console.error('Tryout record:', e);
    status.style.color = '#ff6b35';
    status.textContent = T('tryoutFailed');
  });
}

var BEST_KEY='fc-recall-best';
function loadBest(){
  best=0;
  try{best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0}catch(e){}
  $('bestLine').innerHTML = best>0 ? T('bestLine',{L:best,P:pointsFor(best)}) : '';
}
function saveBest(){try{localStorage.setItem(BEST_KEY,String(best))}catch(e){}}

function handleStartClick(){
  if(IS_OFFICIAL){
    if(!confirm(T('confirmOfficial'))) return;
    startRun();
    return;
  }
  var nameField=$('playerNameInputMain');
  var name=nameField.value.trim();
  if(!name){
    nameField.focus();
    nameField.style.borderColor='#FF1493';
    setTimeout(function(){nameField.style.borderColor=''},600);
    return;
  }
  currentPlayerName=name.slice(0,20);
  startRun();
}

$('playerNameInputMain').addEventListener('keydown',function(e){
  if(e.key==='Enter')handleStartClick();
});

$('againBtn').addEventListener('click',function(){
  phase='idle';
  $('screen-end').style.display='none';
  $('screen-intro').style.display='flex';
  loadBest();
  startDemo();
});

applyLang();
loadBest();
startDemo();
</script>
