main{flex:1 1 auto;overflow-x:hidden}

.kick{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;

label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}

  background:#07141E;color:var(--ink);font:inherit;font-size:1.02rem}

label,input{scroll-margin-top:64px;scroll-margin-bottom:24px}

  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.line{background:#07141E;color:var(--ink);margin-top:10px}

   LA CANCHA DE NOCHE
   El mismo color que la portada, en todo el sitio. Va al final a
   propósito: las reglas de arriba se quedan como están y éstas
   mandan encima.
   ══════════════════════════════════════════════════════════════ */

  --ball:#FF8A2B; --edge:#2E5570; --teal:#4FD3F0;
}
html, body{background:#07141E;color:#EAF2F7}

/* La cabecera y el pie ya eran oscuros, pero de otro azul. */
header, footer, .top{background:#07141E;border-color:#1B3A4F}
header{border-bottom:1px solid #1B3A4F}
footer{border-top:1px solid #1B3A4F;color:#7A96A9}
footer a{color:#4FD3F0}
/* La marca es la marca: ni subrayada ni toda de un color. */
.mark{color:#EAF2F7 !important;text-decoration:none !important}
.mark em{color:#4FD3F0 !important}
.mark i{color:#7A96A9 !important}
.mark{color:#EAF2F7}
.mark i{color:#7A96A9}

/* Cajas, paneles y cualquier cosa que antes era un rectángulo claro
   sobre blanco. */
.how, .linkbox, .s, .w, .tal, .num, .team, .pl, .caja, .chat, .card,
.panel, .box, .waits, .pay, .cuadro, .m.me{

.how p, .s span, .w span, .num span, .tal span, .help, .hint, .lede,

/* Lo que se escribe. Un campo blanco en una página oscura es un
   agujero de luz, y en un teléfono de noche duele. */
input, select, textarea{

input::placeholder, textarea::placeholder{color:#5F7C91}
input:focus, select:focus, textarea:focus{
  border-color:#4FD3F0;box-shadow:0 0 0 3px rgba(79,211,240,.18)}

/* Los botones. Aquí es donde un cambio de variables a ciegas dejaba
   blanco sobre blanco: el relleno era var(--ink), que ahora es la
   tinta. Se dicen los dos colores, y ya. */
.btn, button.btn, a.btn{
  background:#4FD3F0;border:2px solid #4FD3F0;color:#07141E}
.btn:hover{background:#07141E;color:#4FD3F0}
.btn.line, .btn.ghost, .btn.sec{
  background:transparent;border:2px solid #EAF2F7;color:#EAF2F7}
.btn.line:hover{background:#EAF2F7;color:#07141E}
.btn.go, .btn.hot, .btn.naranja{background:#FF8A2B;border-color:#FF8A2B;color:#07141E}
[style*="#FF8A2B"], .btn[class*="go"]{color:#07141E}
.btn:disabled{opacity:.45}

/* Separadores y reglas */
hr, .sep, .div{border-color:#1B3A4F;background:#1B3A4F}
table, th, td{border-color:#1B3A4F}

/* Enlaces dentro del texto */
/* Cada :not() suma fuerza, asi que esta regla le ganaba a cosas
   como a.wa. Lo que es un boton se excluye por nombre. */
main a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go), .wrap a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go){color:#4FD3F0}
a.pedir{color:inherit}

/* Lo que estaba escrito a mano en blanco y ahora es un agujero */
[style*="background:#07141E"], [style*="background: #07141E"]{background:#0E2232 !important}


/* Los que estaban puestos a mano con otro blanco: #FFF8F3, #FFFFFF.
   No son var() de nadie, así que hay que nombrarlos. */

.cta{background:#4FD3F0 !important;border-color:#4FD3F0 !important;color:#07141E !important}
.cta:hover{background:#07141E !important;color:#4FD3F0 !important}
h1,h2,h3,h4{color:#EAF2F7}

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') || localStorage.getItem('fc-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function T(k,v){
  var s = (S[LANG] && S[LANG][k]) || S.es[k] || '';
  if (v) Object.keys(v).forEach(function(x){ s = s.split('{'+x+'}').join(v[x]); });
  return s;
}
function toggleLang(){
  LANG = LANG==='es' ? 'en':'es';
  try{ localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG), localStorage.setItem('fc-lang', LANG); }catch(e){}
  document.getElementById('langBtn').textContent = LANG==='es' ? 'EN':'ES';
  paintWhat();
  draw();
}

var app = document.getElementById('app');
var CODE = null;   /* el código, una vez que payout_check lo aceptó */
var INFO = null;   /* lo que payout_check devolvió de la campaña */
var SENT = null;   /* { org, tel } cuando ya se guardó */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"\']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

/* El teléfono se guarda en diez dígitos pelados; se lee mejor por partes. */
function tel(t){
  var d = String(t||'').replace(/[^0-9]/g,'');
  return d.length === 10 ? d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6) : (t||'');
}

function paintWhat(){
  var el = document.getElementById('fWhat');
  if (el) el.textContent = (LANG === 'es')
    ? 'Cada Punto es una plataforma de Gostar Digital LLC, una empresa con fines de lucro. El programa recauda y recibe lo suyo completo; nosotros cobramos por el uso de la herramienta.'
    : 'Cada Punto is a platform from Gostar Digital LLC, a for-profit company. The program raises the money and receives all of it; we charge for use of the tool.';
}

  /* Tres pantallas: el código, el formulario, y el recibo. */

        '<a class="btn line" href="index.html">' + T('back') + '</a>' +

    var cd = document.getElementById('cd');

      if (e.key === 'Enter'){ e.preventDefault(); checkCode(); }
    });
    return;
  }

  var now = '';
  if (INFO.already){
    now =
      '<div class="now">' +
        '<b>' + T('nowB') + '</b>' +

          '<dt>' + T('nowOrg') + '</dt><dd>' + esc(INFO.org || '—') + '</dd>' +

        '</dl>' +
      '</div>' +
      '<p class="lede">' + T('nowP') + '</p>';
  }

  app.innerHTML =
    '<div class="kick">' + T('kick') + '</div>' +
    '<h1>' + T('h1') + '</h1>' +
    '<div class="who">' +
      '<b>' + T('whoB', { N: esc(INFO.name || '—') }) + '</b>' +
      '<span>' + T('whoS', { B: esc(INFO.by || '—') }) + '</span>' +
    '</div>' +
    '<p class="lede">' + T('lede') + '</p>' +
    now +

    '<h2>' + T('formH') + '</h2>' +
    '<label for="og">' + T('orgL') + '</label>' +
    '<input id="og" type="text" maxlength="90" placeholder="' + T('orgPh') + '" ' +
      'value="' + esc(INFO.org || '') + '" autocapitalize="words" ' +
      'autocomplete="organization" enterkeyhint="next">' +
    '<p class="hint">' + T('orgHint') + '</p>' +
    '<label for="rg">' + T('regL') + '</label>' +
    '<input id="rg" type="text" maxlength="30" placeholder="' + T('regPh') + '" ' +
      'autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next">' +
    '<label for="an">' + T('nameL') + '</label>' +
    '<input id="an" type="text" maxlength="90" placeholder="' + T('namePh') + '" ' +
      'value="' + esc(INFO.ath || '') + '" autocapitalize="words" enterkeyhint="next">' +
    '<p class="hint">' + T('nameHint') + '</p>' +
    '<label for="ph">' + T('phoneL') + '</label>' +
    '<input id="ph" type="tel" maxlength="25" placeholder="' + T('phonePh') + '" ' +
      'value="' + esc(tel(INFO.phone)) + '" autocomplete="tel" enterkeyhint="next">' +
    '<p class="hint">' + T('phoneHint') + '</p>' +
    '<label for="wh">' + T('whoL') + '</label>' +
    '<input id="wh" type="text" maxlength="60" placeholder="' + T('whoPh') + '" ' +
      'autocapitalize="words" autocomplete="name" enterkeyhint="next">' +
    '<label for="ti">' + T('titleL') + '</label>' +
    '<input id="ti" type="text" maxlength="40" placeholder="' + T('titlePh') + '" ' +
      'autocapitalize="words" enterkeyhint="done">' +

    '<div class="ok">' +
      '<input id="io" type="checkbox">' +
      '<span onclick="document.getElementById(\'io\').click()">' + T('isorg') + '</span>' +
    '</div>' +
    '<button class="btn" onclick="save()">' + T('go') + '</button>' +
    '<p class="msg" id="msg"></p>' +

    '<div class="fine"><b>' + T('fineH') + '</b><p>' + T('fineP') + '</p></div>';
}

function say(t,c){
  var el = document.getElementById('msg');
  if (el){ el.textContent = t; el.className = 'msg ' + (c||''); }
}

function toTop(){
  try{ var m = document.querySelector('main'); if (m) m.scrollTop = 0; window.scrollTo(0,0); }catch(e){}
}

function checkCode(){
  var code = (document.getElementById('cd').value || '').trim();
  if (!code) return say(T('errCode'), 'bad');
  say('…');
  rpc('payout_check', { p_code: code })
    .then(function(r){
      if (!r || !r.ok){
        if (r && r.reason === 'scope') return say(T('errScope'), 'bad');
        return say(T('errCode'), 'bad');
      }
      CODE = code;
      INFO = r;
      draw();
      toTop();
    })
    .catch(function(e){ console.error(e); say(T('errGen'), 'bad'); });
}

function save(){
  var org   = (document.getElementById('og').value || '').trim();
  var regno = (document.getElementById('rg').value || '').trim();
  var name  = (document.getElementById('an').value || '').trim();
  var phone = (document.getElementById('ph').value || '').trim();
  var who   = (document.getElementById('wh').value || '').trim();
  var title = (document.getElementById('ti').value || '').trim();

  if (!org)  return say(T('errOrg'), 'bad');
  if (!name) return say(T('errName'), 'bad');
  if (!who || !title) return say(T('errWho'), 'bad');
  if (phone.replace(/[^0-9]/g,'').length !== 10) return say(T('errPhone'), 'bad');

  var io = document.getElementById('io');
  if (!io || !io.checked) return say(T('errIsorg'), 'bad');

  say('…');
  rpc('set_payout', {
    p_code: CODE, p_campaign: INFO.campaign,
    p_org: org, p_regno: regno, p_name: name, p_phone: phone,
    p_who: who, p_title: title, p_is_org: true
  })
    .then(function(r){
      if (!r || !r.ok){
        if (r && r.reason === 'scope') return say(T('errScope'), 'bad');
        if (r && r.reason === 'code')  return say(T('errCode'), 'bad');
        if (r && r.reason === 'phone') return say(T('errPhone'), 'bad');
        if (r && r.reason === 'isorg') return say(T('errIsorg'), 'bad');
        if (r && r.reason === 'org')   return say(T('errOrg'), 'bad');
        if (r && r.reason === 'name')  return say(T('errName'), 'bad');
        if (r && (r.reason === 'who' || r.reason === 'title')) return say(T('errWho'), 'bad');
        return say(T('errGen'), 'bad');
      }
      SENT = { org: r.org || org, tel: r.phone || phone };
      draw();
      toTop();
    })
    .catch(function(e){ console.error(e); say(T('errGen'), 'bad'); });
}

document.getElementById('langBtn').textContent = LANG==='es' ? 'EN':'ES';
paintWhat();
draw();
</script>
</body>
</html>
