<script>
var LANG='en';
try{ LANG = localStorage.getItem('cp-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function draw(){
  document.documentElement.lang = LANG;
  document.getElementById('app').innerHTML = BODY[LANG] || BODY.en;
  document.getElementById('langBtn').textContent = LANG==='en' ? 'ES':'EN';
  try{ document.querySelector('main').scrollTop = 0; }catch(e){}
}
function toggleLang(){
  LANG = LANG==='en' ? 'es':'en';
  try{ localStorage.setItem('cp-lang', LANG); }catch(e){}
  draw();
}
draw();
</script>
