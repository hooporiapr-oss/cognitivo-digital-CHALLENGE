<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* Las preguntas que de verdad hace un entrenador, y las respuestas que
   no se pueden equivocar. Dos cosas en una página, y a propósito:

   Las 24 preguntas están ABIERTAS. Alguien atascado a las nueve de la
   noche no debe tener que entrar con un código para poder leer cómo se
   destraba, y nada de lo que dicen es secreto.

   El chat PIDE CÓDIGO. Ahí sí, porque cuesta dinero por pregunta y
   porque el que pregunta tiene que ser un entrenador. La puerta de
   verdad no está aquí: está en el servidor, que vuelve a comprobar el
   código en cada pregunta. Si el chat está apagado o se cae, las 24
   preguntas siguen ahí — la página nunca depende de él.

   Nada aquí se inventa sobre dinero. Lo que dice de pagos, del 20% y
   de cuándo se cobra está escrito a mano y cuadra con terms.html y con
   custodia.html. Si una de esas cambia, esta cambia. */
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;
      --ball:#FF7A18}
*{box-sizing:border-box}
html{background:#07141E}
body{margin:0;font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);background:#07141E;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{width:min(680px,93vw);margin:0 auto}

header{background:#12202E;border-bottom:1px solid #0B1724;padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{padding:0 0 60px}

/* La cancha, arriba del todo. El que abre esto a las nueve de la noche
   está solo y atascado; que lo primero que vea sea una cancha
   encendida y no un formulario. La foto va en un <img> con srcset para
   que el teléfono se baje la pequeña. */
/* El título va ARRIBA, no abajo: arriba el cielo está oscuro y el texto
   blanco se lee solo, y abajo queda libre el banco mojado con el
   teléfono encendido, que es lo único que de verdad hay que ver. */
.hero{position:relative;margin:0 0 22px;border-radius:0 0 6px 6px;overflow:hidden;
  min-height:330px;display:flex;flex-direction:column;justify-content:flex-start}
/* Abajo del encuadre: el banco mojado y el teléfono encendido. Eso es
   lo que hay que ver, no el cielo. */
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:30% 86%}
.hero .scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(18,32,46,.93) 0%, rgba(18,32,46,.86) 28%,
    rgba(18,32,46,.52) 52%, rgba(18,32,46,.14) 78%,
    rgba(18,32,46,0) 100%)}
.hero .ht{position:relative;padding:20px}
.hero h1{color:#fff;margin:0 0 4px}
.hero .lede{color:#C8D6E2;margin:0}
@media (min-width:760px){ .hero{min-height:360px;border-radius:6px;margin-top:20px} }
h1{font-size:clamp(1.5rem,6vw,2.1rem);font-weight:900;letter-spacing:-.03em;margin:0 0 6px}
.lede{color:var(--mute);font-size:.95rem;margin:0 0 10px}
.hint{color:var(--mute);font-size:.85rem;margin:0 0 22px}
h2{font-size:.58rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin:30px 0 10px}

details{border:2px solid var(--line);border-radius:6px;margin:0 0 9px;background:#07141E}
details[open]{border-color:var(--ink)}
summary{cursor:pointer;padding:13px 15px;font-weight:800;font-size:.97rem;
  list-style:none;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';color:var(--accent);font-weight:900;flex:0 0 auto;
  font-size:1.05rem;line-height:1.35}
details[open] summary::before{content:'–'}
.a{padding:0 15px 15px 40px;font-size:.93rem;color:#9DB6C7}
.a p{margin:0 0 9px}
.a p:last-child{margin:0}
.a b{color:var(--ink)}
.a a{color:var(--accent);font-weight:800}
.a code{background:var(--tint);border:1px solid var(--line);border-radius:4px;
  padding:1px 6px;font-size:.88em;overflow-wrap:anywhere}

.ask{border:3px solid var(--ball);background:#0E2232;border-radius:6px;
  padding:15px 17px;margin:28px 0 0}
.ask b{display:block;font-size:.58rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.ask p{margin:0;font-size:.93rem}
.ask a{color:var(--accent);font-weight:800}

/* El chat. Pide código porque el entrenador que pregunta tiene que ser
   un entrenador — y porque el servidor lo vuelve a comprobar de todas
   formas. Las 24 preguntas de abajo siguen abiertas sin código: el que
   está atascado a las nueve de la noche puede leer igual. */
.chat{border:3px solid var(--ball);background:#0E2232;border-radius:6px;
  padding:15px 16px;margin:0 0 26px}
.chat>b{display:block;font-size:.58rem;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.chat .cp{margin:0 0 11px;font-size:.92rem}
.chat label{display:block;font-size:.72rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.chat input,.chat textarea{width:100%;border:2px solid var(--line);border-radius:5px;
  padding:11px 12px;font:inherit;font-size:1rem;background:#07141E;color:var(--ink)}
.chat textarea{min-height:66px;resize:vertical}
.chat input:focus,.chat textarea:focus{outline:none;border-color:var(--ink)}
.chat .btn{display:block;width:100%;margin-top:9px;border:none;border-radius:5px;
  background:var(--ball);color:#EAF2F7;font:inherit;font-size:1rem;font-weight:900;
  padding:12px;cursor:pointer}
.chat .btn[disabled]{opacity:.55;cursor:default}
.chat .who{font-size:.8rem;color:var(--mute);margin:0 0 10px}
.chat .m{border-radius:6px;padding:10px 12px;margin:0 0 8px;font-size:.93rem}
.chat .m.you{background:#12202E;color:#E8F0F6;margin-left:18%}
.chat .m.me{background:#07141E;border:1px solid var(--line);margin-right:8%}
.chat .m.me.fix{border-color:var(--accent);border-left-width:4px}
.chat .m .tag{display:block;font-size:.56rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.chat .m.bad{background:#07141E;border:1px solid var(--bad,#B4231C);color:#B4231C}
.chat .log{margin:0 0 11px}
.chat .msg{margin:9px 0 0;font-size:.85rem;font-weight:800;color:#B4231C}

footer{background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-dot{padding:0 7px;opacity:.5}


/* ══════════════════════════════════════════════════════════════
   LA CANCHA DE NOCHE
   El mismo color que la portada, en todo el sitio. Va al final a
   propósito: las reglas de arriba se quedan como están y éstas
   mandan encima.
   ══════════════════════════════════════════════════════════════ */
:root{
  --noche:#07141E; --cancha:#0E2232; --linea:#1B3A4F;
  --viva:#4FD3F0;  --brasa:#FF8A2B;  --hueso:#EAF2F7; --humo:#7A96A9;
  /* Y las que ya usaba esta página, apuntando a lo mismo */
  --ink:#EAF2F7; --mute:#7A96A9; --line:#1B3A4F; --tint:#0E2232;
  --accent:#4FD3F0; --good:#3FD89A; --bad:#FF7B7B;
  --paper:#EAF2F7; --panel:#0E2232; --gold:#FF8A2B; --leather:#4FD3F0;
  --ball:#FF8A2B; --edge:#2E5570; --teal:#4FD3F0;
}
html, body{background:#07141E;color:#EAF2F7}

/* La cabecera y el pie ya eran oscuros, pero de otro azul. */
header, footer, .top{background:#07141E;border-color:#1B3A4F}
header{border-bottom:1px solid #1B3A4F}
footer{border-top:1px solid #1B3A4F;color:#7A96A9}
footer a{color:#4FD3F0}
.mark{color:#EAF2F7}
.mark i{color:#7A96A9}
.langb{border-color:#2E5570;color:#9DB6C7;background:none}
.langb:hover{color:#EAF2F7;border-color:#7A96A9}

/* Cajas, paneles y cualquier cosa que antes era un rectángulo claro
   sobre blanco. */
.how, .linkbox, .s, .w, .tal, .num, .team, .pl, .caja, .chat, .card,
.panel, .box, .waits, .pay, .cuadro, .m.me{
  background:#0E2232;border-color:#1B3A4F;color:#EAF2F7}
.how p, .s span, .w span, .num span, .tal span, .help, .hint, .lede,
.cp, .who, .sub, .nota{color:#7A96A9}

/* Lo que se escribe. Un campo blanco en una página oscura es un
   agujero de luz, y en un teléfono de noche duele. */
input, select, textarea{
  background:#07141E;border-color:#2E5570;color:#EAF2F7}
input::placeholder, textarea::placeholder{color:#5F7C91}
input:focus, select:focus, textarea:focus{
  border-color:#4FD3F0;box-shadow:0 0 0 3px rgba(79,211,240,.18)}

/* Los botones. Aquí es donde un cambio de variables a ciegas dejaba
   blanco sobre blanco: el relleno era var(--ink), que ahora es la
   tinta. Se dicen los dos colores, y ya. */
.btn, button.btn, a.btn{
  background:#4FD3F0;border:2px solid #4FD3F0;color:#07141E}
.btn:hover{background:#07141E;color:#4FD3F0}
.btn.line, .btn.ghost, .btn.sec{
  background:transparent;border:2px solid #EAF2F7;color:#EAF2F7}
.btn.line:hover{background:#EAF2F7;color:#07141E}
.btn.go, .btn.hot, .btn.naranja{background:#FF8A2B;border-color:#FF8A2B;color:#07141E}
/* El del chat es naranja y de los suyos: sobre naranja, la noche. */
.chat .btn{background:#FF8A2B;color:#07141E}
.chat .btn:hover{background:#07141E;color:#FF8A2B}
[style*="#FF8A2B"], .btn[class*="go"]{color:#07141E}
.btn:disabled{opacity:.45}

/* Separadores y reglas */
hr, .sep, .div{border-color:#1B3A4F;background:#1B3A4F}
table, th, td{border-color:#1B3A4F}

/* Enlaces dentro del texto */
/* Cada :not() suma fuerza, asi que esta regla le ganaba a cosas
   como a.wa. Lo que es un boton se excluye por nombre. */
main a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go), .wrap a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go){color:#4FD3F0}
a.pedir{color:inherit}

/* Lo que estaba escrito a mano en blanco y ahora es un agujero */
[style*="background:#07141E"], [style*="background: #07141E"]{background:#0E2232 !important}


/* Los que estaban puestos a mano con otro blanco: #FFF8F3, #FFFFFF.
   No son var() de nadie, así que hay que nombrarlos. */
[class]{--ff8:#0E2232}
.ojo, .env-nota, .nota-ojo, .aviso, .warn, .tip{background:#0E2232 !important;color:#EAF2F7}
.ttl, .env-nota b{color:#EAF2F7}
.cta{background:#4FD3F0 !important;border-color:#4FD3F0 !important;color:#07141E !important}
.cta:hover{background:#07141E !important;color:#4FD3F0 !important}
h1,h2,h3,h4{color:#EAF2F7}


/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
.mark em, .wm em{font-style:normal;color:#FF8A2B !important}
.mark i,  .wm i {font-style:normal;color:#4FD3F0 !important}
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}

</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="index.html">cada&nbsp;<em>punto</em>&nbsp;<i>cuenta</i></a>
    <button class="langb" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</header>

<main>
  <div id="head"></div>
  <div class="wrap">
  <div id="chatbox"></div>
  <div id="app"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <a href="index.html">Cada Punto</a><span class="f-dot">·</span>
    <a href="terms.html" id="fTerms">Términos</a><span class="f-dot">·</span>
    <a href="custodia.html">Dinero</a>
  </div>
</footer>

<script>
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

/* Cada pregunta: [sección, pregunta, respuesta en HTML]. El HTML de la
   respuesta es nuestro, no de nadie de fuera, así que va tal cual. */
var S={
  es:{
    h1:'Coach Cada Punto',
    lede:'Lo que preguntan los entrenadores y los padrinos. Y si eres entrenador, un chat con tu código.',
    hint:'Si lo tuyo no está aquí, escríbenos — al final de la página.',
    askB:'¿No está aquí?',
    askP:'Escríbenos a <a href="mailto:gostardigital@gmail.com">gostardigital@gmail.com</a> y dinos tu división. Contestamos el mismo día.',
    terms:'Términos',
    alt:'Una cancha de barrio en Puerto Rico de noche, vacía después de la lluvia, con un teléfono encendido en el banco',
    chatB:'Pregúntame',
    chatP:'Esto es para entrenadores. Pon tu código y pregúntame lo que no te salga — a cualquier hora.',
    chatCode:'Tu código',
    chatGo:'Entrar',
    chatBad:'Ese código no sirve.',
    chatNet:'No entró. Inténtalo otra vez.',
    chatOff:'El chat todavía no está encendido. Las preguntas de abajo están completas, y si no está lo tuyo escríbenos a gostardigital@gmail.com.',
    chatWho:'Hola, {B}. Dime qué no te sale.',
    chatHi:'Sé del Fortress y de cómo se juega, del día de juego, de la plantilla, del tablero y del dinero. De baloncesto también, si te hace falta. Pregúntame como te salga.',
    chatPh:'Escribe tu pregunta',
    chatSend:'Mandar',
    chatWait:'Pensando…',
    chatFix:'Texto oficial',
    chatErr:'Algo falló de mi lado. Pregúntalo otra vez, o escríbenos.',
    secs:['Entrar','La plantilla','El día de juego','El tablero','El dinero','Si vas a prometer'],
    qs:[
      [0,'¿Dónde entro?',
       '<p>En <a href="mi-equipo.html">cadapunto.com/mi-equipo.html</a>, con el código que te dimos.</p>'+
       '<p>Lo escribes <b>una sola vez</b>. De ahí en adelante ese teléfono ya te conoce — para la plantilla, para el tablero, para todo.</p>'],
      [0,'¿Tengo que escribir el código en cada página?',
       '<p>No. Una vez, en Mi equipo, y listo.</p>'+
       '<p>Si te lo vuelve a pedir es porque estás en otro teléfono, en otro navegador, o en una ventana privada. Escríbelo otra vez y ya.</p>'],
      [0,'Perdí mi código.',
       '<p>Escríbenos y te hacemos uno nuevo. No lo podemos buscar: se guarda cifrado, así que ni nosotros lo sabemos.</p>'],
      [0,'Dice que mi código no sirve.',
       '<p>Fíjate que no tenga espacios al principio o al final — al copiarlo y pegarlo se arrastran solos.</p>'+
       '<p>Si sigue sin entrar, escríbenos. Puede que esté apagado.</p>'],

      [1,'¿Cómo apunto a mis jugadores?',
       '<p>De dos maneras, y las dos valen a la vez.</p>'+
       '<p><b>Tú:</b> en <a href="plantilla.html">La plantilla</a>, pegas los nombres, uno por línea.</p>'+
       '<p><b>Ellos:</b> mandas el enlace de apuntarse al grupo del equipo y cada familia se apunta sola. Ésa es la buena — cada nene recibe su propio enlace para sus padrinos, y tú no tecleas nada.</p>'],
      [1,'Un nene se apuntó y no lo veo en la plantilla.',
       '<p>Está esperando que tú digas que sí. Ábrela y lo verás arriba, en un recuadro anaranjado, con <b>Aprobar</b> y <b>Rechazar</b>.</p>'+
       '<p>Mientras no lo apruebes no sale en ningún sitio. Es a propósito: con el enlace del equipo cualquiera podría apuntar a quien sea.</p>'],
      [1,'Se fue un nene del equipo.',
       '<p>En La plantilla, <b>Sacar</b>. Baja al final de la lista en gris y deja de salir en el tablero.</p>'+
       '<p>No se borra, y vuelve con un toque si fue un error. Si de verdad quieres borrarlo, el botón <b>Borrar</b> sale después de sacarlo — menos si ya tiene promesas encima, que entonces no se puede y se queda fuera de la lista.</p>'],
      [1,'Escribí mal un nombre.',
       '<p><b>Arreglar</b>, en su fila. También puedes cambiarle la escuadra ahí mismo.</p>'],

      [2,'¿Qué es The Fortress?',
       '<p>Es el juego sobre el que se recauda. Cinco bolas puestas delante en 2-1-2. Se enciende una cadena en orden y hay que repetirla tocándolas. Cada ronda la cadena crece en una.</p>'+
       '<p>Los puntos de una cadena son 1+2+3 y así hasta el nivel que aguantó, o sea que cada ronda vale más que la anterior. Aguantar doce rondas son 78 puntos.</p>'+
       '<p>Se juega en <a href="fortress-vr.html">cadapunto.com/fortress-vr.html</a>, en el teléfono, la tableta o la computadora. No hay que instalar nada.</p>'],
      [2,'¿Cómo es el día de juego?',
       '<p>Es una ventana de horas — dos por defecto — y dentro de ella cada nene juega su partido desde donde esté. No hay que juntar a nadie ni prestar equipos.</p>'+
       '<p>El partido de un nene son <b>cuatro cuartos de cinco minutos</b>. Cuando termina el cuarto, ese cuarto queda puesto.</p>'+
       '<p>Para abrir uno, escríbenos con la fecha y la hora. No hay botón para eso: lo ponemos nosotros.</p>'],
      [2,'¿Cuánto dura todo esto?',
       '<p>De principio a fin, entre <b>30 y 45 días</b>.</p>'+
       '<p>Las semanas que te tomes juntando promesas — eso lo pones tú — más el día de juego, más los <b>treinta días</b> que corre el cobro desde que cierra la ventana, más la remesa del día 1 o del día 15.</p>'+
       '<p>Los treinta días son sólo del cobro, no del fundraiser completo. Lo decimos así porque un programa al que le prometemos treinta y le pagamos a los cincuenta no nos vuelve a llamar.</p>'+
       '<p>Y se acaba. Un Fortress no se queda abierto: se agenda, se juega, se cobra y se cierra.</p>'],
      [2,'¿Cómo se cuentan los puntos de un cuarto?',
       '<p>Un cuarto vale la <b>mejor</b> tirada que hubo dentro de él, no la suma de todas. Dentro de los cinco minutos se puede fallar y volver a empezar las veces que dé el tiempo.</p>'+
       '<p>Los cuatro cuartos se suman, y eso es lo que anotó el nene.</p>'],
      [2,'A un nene se le apagó el teléfono a mitad.',
       '<p>Que vuelva a abrir el mismo enlace. Los cuartos que ya puso siguen puestos y sigue donde iba, mientras la ventana esté abierta.</p>'+
       '<p>Un cuarto que no se termine antes de que cierre la ventana vale cero.</p>'],
      [2,'Nadie puede prometer.',
       '<p>Las promesas se cierran cuando <b>abre</b> el día de juego, no cuando cierra.</p>'+
       '<p>Es a propósito: prometer sabiendo lo que anotó el nene no es prometer. Los padrinos hay que buscarlos antes.</p>'],
      [2,'¿Se puede jugar con casco de realidad virtual?',
       '<p>Para practicar sí, y está bueno. Para el día de juego no: ése es sólo en pantalla.</p>'+
       '<p>Es a propósito, para no tener que repartirle un casco a nadie.</p>'+
       '<p>El modo de cabeza no sale en teléfonos ni computadoras — todos los teléfonos tienen giroscopio y el botón le aparecía a cualquiera. Va en su propia dirección, que es la que llevan puesta los cascos:<br><code>cadapunto.com/fortress-vr.html?casco=1</code></p>'],

      [3,'¿Cómo pongo el marcador?',
       '<p>Depende del juego.</p>'+
       '<p><b>Un juego de verdad:</b> el marcador final lo reportas tú en el tablero del equipo, con tu código. Eso cierra las promesas de ese juego y saca lo que debe cada padrino. Si prefieres mandárnoslo por el grupo, lo ponemos nosotros.</p>'+
       '<p><b>El Fortress:</b> no lo pones. El juego guarda cada cuarto según se juega, y después nadie puede cambiar un número — ni tú ni nosotros desde una pantalla.</p>'],
      [3,'¿Dónde veo cómo van?',

var LANG='es';
try{ LANG=localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||

  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'); }catch(e){}
function T(k,v){
  var t=(S[LANG]&&S[LANG][k]); if(t===undefined) t=S.es[k];
  if(v&&typeof t==='string') Object.keys(v).forEach(function(x){ t=t.split('{'+x+'}').join(v[x]) });
  return t;
}

   comprobar el código en cada pregunta — cualquiera puede llamar al
   endpoint a mano, así que lo que diga esta página no cuenta.

   Y lo de dinero no lo contesta el modelo: viene del servidor con
   fixed, palabra por palabra igual que la sección El dinero de esta
   misma página. */
var SB='https://sdaphocueugzfvjovuxd.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var API='https://basketball-money-payments.onrender.com';

var CODE=null, BY=null, MSGS=[], BUSY=false, ERR='';

/* Si ya entró en Mi equipo en este teléfono, no le pedimos el código
   otra vez. Las dos páginas viejas guardan en sitios distintos. */
try{ CODE=localStorage.getItem('cp_build')||localStorage.getItem('cp_code')||null }catch(e){}

function rpc(name,args){
  return fetch(SB+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  }).then(function(r){ if(!r.ok) throw new Error('rpc '+r.status); return r.json() });
}

function entrar(auto){
  var k=auto?CODE:(($('cCode')||{}).value||'').trim();
  if(!k) return;
  ERR=''; paintChat();
  rpc('builder_check',{p_code:k})
    .then(function(r){
      if(!r||!r.ok){ CODE=null; if(!auto){ ERR=T('chatBad'); } paintChat(); return; }
      CODE=k; BY=r.by||'';
      paintChat();
      var box=$('cAsk'); if(box&&!auto) box.focus();
    })
    .catch(function(e){ console.error(e); CODE=null; if(!auto) ERR=T('chatNet'); paintChat() });
}

function mandar(){
  var box=$('cAsk'); if(!box||BUSY) return;
  var q=(box.value||'').trim(); if(!q) return;
  box.value=''; ERR='';
  MSGS.push({role:'user',content:q});
  BUSY=true; paintChat();

  fetch(API+'/coach/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    /* El idioma va aquí: lo decide el botón de arriba, no la frase que
       escribió. Preguntar algo en inglés en medio de una conversación
       en español no debería cambiarle el idioma al que lee. */
    body:JSON.stringify({code:CODE,lang:LANG,messages:MSGS.map(function(m){
      return {role:m.role,content:m.content} })})
  })
  .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j} }) })
  .then(function(o){
    BUSY=false;
    if(o.s===503){ MSGS.push({role:'assistant',content:T('chatOff'),bad:true}) }
    else if(o.s===401){ CODE=null; ERR=T('chatBad') }
    else if(o.j&&o.j.reply){ MSGS.push({role:'assistant',content:o.j.reply,fixed:!!o.j.fixed}) }
    else { MSGS.push({role:'assistant',content:T('chatErr'),bad:true}) }
    paintChat();
  })
  .catch(function(e){
    console.error(e); BUSY=false;
    MSGS.push({role:'assistant',content:T('chatErr'),bad:true});
    paintChat();
  });
}

function paintChat(){
  var out='<b>'+esc(T('chatB'))+'</b>';
  if(!CODE){
    out+='<p class="cp">'+esc(T('chatP'))+'</p>'+
      '<label for="cCode">'+esc(T('chatCode'))+'</label>'+
      '<input id="cCode" type="text" autocapitalize="characters" autocorrect="off" '+
        'spellcheck="false" enterkeyhint="go">'+
      '<button class="btn" onclick="entrar(false)">'+esc(T('chatGo'))+'</button>'+
      (ERR?'<p class="msg">'+esc(ERR)+'</p>':'');
  } else {
    out+='<p class="who">'+esc(T('chatWho',{B:BY||''}))+'</p>';
    out+='<div class="log">';
    if(!MSGS.length) out+='<div class="m me">'+esc(T('chatHi'))+'</div>';
    MSGS.forEach(function(m){
      if(m.role==='user'){ out+='<div class="m you">'+esc(m.content)+'</div>'; return }
      out+='<div class="m me'+(m.fixed?' fix':'')+(m.bad?' bad':'')+'">'+
        (m.fixed?'<span class="tag">'+esc(T('chatFix'))+'</span>':'')+
        esc(m.content)+'</div>';
    });
    if(BUSY) out+='<div class="m me">'+esc(T('chatWait'))+'</div>';
    out+='</div>';
    out+='<textarea id="cAsk" placeholder="'+esc(T('chatPh'))+'"'+(BUSY?' disabled':'')+'></textarea>'+
      '<button class="btn" onclick="mandar()"'+(BUSY?' disabled':'')+'>'+esc(T('chatSend'))+'</button>'+
      (ERR?'<p class="msg">'+esc(ERR)+'</p>':'');
  }
  $('chatbox').innerHTML='<div class="chat">'+out+'</div>';

  var ask=$('cAsk');
  if(ask) ask.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); mandar() }
  });
  var cc=$('cCode');
  if(cc) cc.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); entrar(false) }
  });
}

       localStorage.setItem('fc-lang',LANG) }catch(e){}
  toda();
}

      out += '<details><summary>'+esc(q[1])+'</summary>'+
             '<div class="a">'+q[2]+'</div></details>';
    });
  });
