<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── El look nuevo: crema, navy y naranja ─────────────────────────
   El mismo de la portada, mi-equipo y equipo. Cambia la piel: el
   marcado, el acordeon y el chat se quedaron como estaban. */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{width:min(760px,calc(100% - 40px));margin:0 auto}

header{background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
@media(max-width:380px){ .mark{font-size:.92rem} }
.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.langb:hover{border-color:var(--orange);color:var(--orange)}

/* ── La foto de arriba, con el titular encima ─────────────────── */
.hero{position:relative;margin:0 0 30px;overflow:hidden;background:var(--navy)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.hero .scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,#101c2aaa 0%,#101c2aee 100%)}
.hero .ht{position:relative;width:min(760px,calc(100% - 40px));margin:0 auto;
  padding:clamp(34px,8vw,64px) 0}
.hero h1{color:#fff;font-size:clamp(1.9rem,5.4vw,2.9rem);line-height:1.08;
  letter-spacing:-.045em;margin:0 0 10px}
.hero .lede{color:#c8d2dd;margin:0;max-width:52ch;font-size:1.05rem}

main{padding-bottom:50px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px}
h2{font-size:1.1rem;letter-spacing:.01em;margin:38px 0 6px;
  color:var(--orange);text-transform:uppercase;font-weight:800;font-size:.78rem;
  letter-spacing:.14em}
.lede{color:var(--muted);margin:0 0 24px;max-width:56ch}
.hint,.cp,.who,.sub,.nota{color:var(--muted);font-size:.88rem}

/* ── El acordeón de preguntas ─────────────────────────────────── */
details{background:#fff;border:1px solid var(--linea);border-radius:14px;
  margin:0 0 10px;box-shadow:0 8px 25px #17243806;overflow:hidden}
details[open]{border-color:#d7dbd7}
summary{cursor:pointer;list-style:none;padding:17px 20px 17px 46px;position:relative;
  font-weight:750;font-size:1rem;letter-spacing:-.01em}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";position:absolute;left:19px;top:50%;transform:translateY(-50%);
  color:var(--orange);font-weight:900;font-size:1.15rem;line-height:1}
details[open] summary::before{content:"–"}
details[open] summary{color:var(--navy)}
.a{padding:0 20px 18px 46px}
.a p{margin:0 0 11px;color:var(--muted);font-size:.97rem}
.a p:last-child{margin-bottom:0}
.a b{color:var(--ink);font-weight:750}
.a a{color:var(--navy);font-weight:700}
.a code{background:var(--cream);border:1px solid var(--linea);border-radius:5px;
  padding:1px 6px;font-size:.9em}

/* ── El chat del coach ────────────────────────────────────────── */
.chat{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:22px 24px;margin:0 0 30px;box-shadow:0 8px 25px #17243808}
.chat>b{display:block;font-size:.78rem;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.chat .who{display:block;margin-bottom:12px}
.chat label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 6px}
.chat input,.chat textarea{width:100%;padding:13px 14px;border:1px solid #d6d9d6;
  border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:1rem}
.chat textarea{min-height:84px;resize:vertical}
.chat input:focus,.chat textarea:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,122,24,.18)}
.chat .btn{width:100%;margin-top:11px}
.chat .log{display:grid;gap:10px;margin:16px 0 0}
.chat .m{padding:12px 14px;border-radius:12px;font-size:.96rem;line-height:1.5}
.chat .m.me{background:var(--navy);color:#fff;justify-self:end;max-width:85%}
.chat .m.you{background:var(--cream);border:1px solid var(--linea);max-width:92%}
.chat .m.bad{background:#fff3f2;border:1px solid #f0c9c5;color:var(--bad)}
.chat .m.me.fix{background:var(--navy2)}
.chat .m .tag{display:block;font-size:.66rem;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;opacity:.65;margin-bottom:4px}
.chat .msg{margin:10px 0 0;font-weight:700;font-size:.88rem;min-height:1.2em}
.chat .cp{margin-top:10px}

/* ── Si no encuentras lo tuyo ─────────────────────────────────── */
.ask{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--navy);
  border-radius:16px;padding:20px 22px;margin:32px 0 0;box-shadow:0 8px 25px #17243808}
.ask b{display:block;font-size:.76rem;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.ask p{margin:0;color:var(--muted);font-size:.95rem}
.ask a{color:var(--navy);font-weight:750}

/* ── Botones ──────────────────────────────────────────────────── */
.btn,.cta{display:inline-block;border:0;border-radius:9px;padding:14px 22px;
  background:var(--orange);color:#111a24;font:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;text-decoration:none;text-align:center}
.btn.line{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn.line:hover{background:var(--navy);color:#fff}
.btn:hover,.cta:hover{opacity:.92}
.btn:disabled,.btn[disabled]{opacity:.5;cursor:default}

footer{background:#0a1420;color:#aeb9c6;padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
footer .f-dot{padding:0 8px;opacity:.45}
</style>
</head>

      [1,'I spelled a name wrong.',

      [2,'How does a campaign work?',

      [2,'How long does all this take?',

       '<p>Our part ends there: each pledge total comes out the same day the score goes in. After that the calendar is yours, because the collecting is yours.</p>'+
       '<p>And it ends. An event does not stay open: it is scheduled, played, reported and closed.</p>'],
      [2,'Nobody can pledge.',
       '<p>Pledging closes when the game <b>starts</b>.</p>'+
       '<p>That is on purpose: pledging while knowing the score is not pledging. Padrinos have to be found beforehand — that is what the fourteen days are for.</p>'],
      [2,'Can I run more than one game?',
       '<p>Yes, but each game is its own event: its own padrinos, its own license.</p>'+

      [3,'How do I post the score?',
       '<p>You report the final score on the team board, with your code. That closes that game\u2019s pledges and works out each padrino\u2019s total.</p>'+

      [3,'Where do I see how they are doing?',
       '<p>On the team board. The link can be shared: families open it and see what you see.</p>'+
       '<p>Your game is there, the pledges already in, and the score once it is played.</p>'],
      [3,'When does each pledge total come out?',
       '<p>When the final score goes in. Right there pledging closes, each padrino\u2019s total is calculated with his cap applied if it bit, and each one gets a notice with the result.</p>'+
       '<p>You are left with the list: every padrino with his name and his amount, to print or download. The collecting you do yourself, wherever you already talk to those people.</p>'],
      [3,'I think a score is wrong.',
       '<p>Tell us the same day. We look, correct it if it needs correcting, and the padrinos are told.</p>'+
       '<p>This matters: a padrino pays on a number they did not see.</p>'],
      [3,'What if we lose?',
       '<p>You raise on the points your team scored, win or lose. What the opponent scored changes nothing.</p>'],

      [4,'Do you write to my padrinos?',
       '<p>Once, when the game closes: each padrino gets the result and what their pledge came to. It goes out on its own, with nobody pressing anything.</p>'+
       '<p>That notice carries no payment link, and after it nobody writes again: no reminders, no collection notices, nothing.</p>'+
       '<p>The full list goes to you, and the collecting you take up with your people wherever you already talk to them.</p>'],
      [4,'When does the money reach me?',
       '<p>When your padrinos pay you. It goes straight from them to you.</p>'+
       '<p>We do not receive it, we do not hold it and we do not remit it to you, so there is no date of ours to wait for.</p>'],
      [4,'Do I have to give you an account?',

      [4,'How much do you keep?',

       '<p>Cada Punto is licensed <b>per event</b>: $49 per team, per game — $29 if the roster is under eight. It is not a percentage of anything, it does not come out of any pledge, and we charge your padrinos nothing.</p>'+'<p>It is invoiced when the event closes, and due within seven days. Nothing up front.</p>'+
       '<p>One thing to keep straight, because it is different: <b>pledged is not collected</b>. We record what was pledged; what comes in, and when, depends on your collecting.</p>'],
      [4,'Could a padrino end up owing a fortune?',
       '<p>No. The padrino sets their own cap when they pledge, and the cap wins, however high the score goes.</p>'+
       '<p>The other way round: if the rate times the points comes to less than fifty cents, the pledge is closed out and nothing is owed.</p>'],
      [4,'A padrino asked me something I cannot answer.',
       '<p>Scroll down to <b>If you are pledging</b>, at the end of this page: what they ask is answered there — how much they will pay, when the amount is known, the cap, and where the money goes.</p>'+
       '<p>Sending them this same page answers better than explaining from memory. And if it is not in there, pass it to us and we will answer it.</p>'],
      [4,'Is this tax deductible?',
       '<p>We do not say that it is. Gostar Digital LLC is a for-profit company, not a non-profit, and we do not issue tax receipts.</p>'+
       '<p>If how their payment is treated matters to a padrino, they should ask their own advisor.</p>'],

      [5,'When do I have to pay?',
       '<p>After the game, never before. You pledge an amount per point, the game is played, and when it closes you get a notice with the result and your amount.</p>'+
       '<p>You pay the program directly, however they tell you. Cada Punto charges nothing and processes no payments.</p>'],
      [5,'How much exactly will I pay?',
       '<p>Your rate times the points <b>the team</b> scored in that game. At ten cents a point, a 68-point game is $6.80.</p>'+

      [5,'Can I set a limit?',
       '<p>Yes. When you pledge you set the most you are willing to pay, and the amount never works out above it, however much they score.</p>'],
      [5,'What if they do badly?',
       '<p>You pay on the points the team scored, whatever those are. It makes no difference who won: your pledge is on the points, not on the result.</p>'],
      [5,'Where does the money go?',
       '<p>To the program you chose, directly. Your payment does not pass through Cada Punto: we do not receive it and we keep none of it.</p>'+
       '<p>What that program does with what it raises is theirs, like any other contribution: sometimes they share part of it with their league or with the program that brought them in. That is between them.</p>'+
       '<p>Nothing is won and nothing is raffled: it is a voluntary contribution whose amount depends on the scoreboard.</p>']
    ]
  }
};

var LANG='es';
try{ LANG=localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  localStorage.getItem('fc-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'); }catch(e){}
function T(k,v){
  var t=(S[LANG]&&S[LANG][k]); if(t===undefined) t=S.es[k];
  if(v&&typeof t==='string') Object.keys(v).forEach(function(x){ t=t.split('{'+x+'}').join(v[x]) });
  return t;
}
function $(id){ return document.getElementById(id) }

/* ── El chat ────────────────────────────────────────────

   La puerta de aquí es para que el entrenador no vea una caja que no va
   a funcionar. La puerta de verdad está en el servidor, que vuelve a
   comprobar el código en cada pregunta — cualquiera puede llamar al
   endpoint a mano, así que lo que diga esta página no cuenta.

   Y lo de dinero no lo contesta el modelo: viene del servidor con
   fixed, palabra por palabra igual que la sección El dinero de esta
   misma página. */
var SB='https://sdaphocueugzfvjovuxd.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var API='https://basketball-money-payments.onrender.com';

var CODE=null, BY=null, MSGS=[], BUSY=false, ERR='';

/* Si ya entró en Mi equipo en este teléfono, no le pedimos el código
   otra vez. Las dos páginas viejas guardan en sitios distintos. */
try{ CODE=localStorage.getItem('cp_build')||localStorage.getItem('cp_code')||null }catch(e){}

function rpc(name,args){
  return fetch(SB+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  }).then(function(r){ if(!r.ok) throw new Error('rpc '+r.status); return r.json() });
}

function entrar(auto){
  var k=auto?CODE:(($('cCode')||{}).value||'').trim();
  if(!k) return;
  ERR=''; paintChat();
  rpc('builder_check',{p_code:k})
    .then(function(r){
      if(!r||!r.ok){ CODE=null; if(!auto){ ERR=T('chatBad'); } paintChat(); return; }
      CODE=k; BY=r.by||'';
      paintChat();
      var box=$('cAsk'); if(box&&!auto) box.focus();
    })
    .catch(function(e){ console.error(e); CODE=null; if(!auto) ERR=T('chatNet'); paintChat() });
}

function mandar(){
  var box=$('cAsk'); if(!box||BUSY) return;
  var q=(box.value||'').trim(); if(!q) return;
  box.value=''; ERR='';
  MSGS.push({role:'user',content:q});
  BUSY=true; paintChat();

  fetch(API+'/coach/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    /* El idioma va aquí: lo decide el botón de arriba, no la frase que
       escribió. Preguntar algo en inglés en medio de una conversación
       en español no debería cambiarle el idioma al que lee. */
    body:JSON.stringify({code:CODE,lang:LANG,messages:MSGS.map(function(m){
      return {role:m.role,content:m.content} })})
  })
  .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j} }) })
  .then(function(o){
    BUSY=false;
    if(o.s===503){ MSGS.push({role:'assistant',content:T('chatOff'),bad:true}) }
    else if(o.s===401){ CODE=null; ERR=T('chatBad') }
    else if(o.j&&o.j.reply){ MSGS.push({role:'assistant',content:o.j.reply,fixed:!!o.j.fixed}) }
    else { MSGS.push({role:'assistant',content:T('chatErr'),bad:true}) }
    paintChat();
  })
  .catch(function(e){
    console.error(e); BUSY=false;
    MSGS.push({role:'assistant',content:T('chatErr'),bad:true});
    paintChat();
  });
}

function paintChat(){
  var out='<b>'+esc(T('chatB'))+'</b>';
  if(!CODE){
    out+='<p class="cp">'+esc(T('chatP'))+'</p>'+
      '<label for="cCode">'+esc(T('chatCode'))+'</label>'+
      '<input id="cCode" type="text" autocapitalize="characters" autocorrect="off" '+
        'spellcheck="false" enterkeyhint="go">'+
      '<button class="btn" onclick="entrar(false)">'+esc(T('chatGo'))+'</button>'+
      (ERR?'<p class="msg">'+esc(ERR)+'</p>':'');
  } else {
    out+='<p class="who">'+esc(T('chatWho',{B:BY||''}))+'</p>';
    out+='<div class="log">';
    if(!MSGS.length) out+='<div class="m me">'+esc(T('chatHi'))+'</div>';
    MSGS.forEach(function(m){
      if(m.role==='user'){ out+='<div class="m you">'+esc(m.content)+'</div>'; return }
      out+='<div class="m me'+(m.fixed?' fix':'')+(m.bad?' bad':'')+'">'+
        (m.fixed?'<span class="tag">'+esc(T('chatFix'))+'</span>':'')+
        esc(m.content)+'</div>';
    });
    if(BUSY) out+='<div class="m me">'+esc(T('chatWait'))+'</div>';
    out+='</div>';
    out+='<textarea id="cAsk" placeholder="'+esc(T('chatPh'))+'"'+(BUSY?' disabled':'')+'></textarea>'+
      '<button class="btn" onclick="mandar()"'+(BUSY?' disabled':'')+'>'+esc(T('chatSend'))+'</button>'+
      (ERR?'<p class="msg">'+esc(ERR)+'</p>':'');
  }
  $('chatbox').innerHTML='<div class="chat">'+out+'</div>';

  var ask=$('cAsk');
  if(ask) ask.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); mandar() }
  });
  var cc=$('cCode');
  if(cc) cc.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); entrar(false) }
  });
}
function toggleLang(){
  LANG=LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG);localStorage.setItem('cp-lang',LANG);
       localStorage.setItem('fc-lang',LANG) }catch(e){}
  toda();
}

function paint(){
  document.documentElement.lang=LANG;
  document.getElementById('langBtn').textContent=LANG==='es'?'EN':'ES';
  document.getElementById('fTerms').textContent=T('terms');
  document.title='Coach Cada Punto';

  var secs=T('secs'), qs=T('qs'), out='';
  secs.forEach(function(name, i){
    out += '<h2>'+esc(name)+'</h2>';
    qs.filter(function(q){ return q[0]===i }).forEach(function(q){
      out += '<details><summary>'+esc(q[1])+'</summary>'+
             '<div class="a">'+q[2]+'</div></details>';
    });
  });

  /* El título va arriba del chat, y las preguntas abajo. Están en
     contenedores distintos a propósito: cambiar de idioma repinta
     estos dos y la conversación se queda donde estaba. */
  $('head').innerHTML =
    '<div class="hero">'+
      /* Un solo archivo a propósito. El srcset pedía tres tamaños y
         Render sólo dejó subir éste; con los otros dos ausentes la foto
         no salía ni en teléfono ni en escritorio. 62 KB sirven en todas
         partes. Cuando los otros dos estén arriba se vuelve a poner el
         srcset y el teléfono baja 40 KB en vez de 62. */
      '<img src="coach-cancha-1024.webp" '+
        'width="1024" height="683" '+
        'decoding="async" alt="'+esc(T('alt'))+'">'+
      '<span class="scrim" aria-hidden="true"></span>'+
      '<div class="ht">'+
        '<h1>'+esc(T('h1'))+'</h1>'+
        '<p class="lede">'+esc(T('lede'))+'</p>'+
      '</div>'+
    '</div>'+
    '<p class="hint">'+esc(T('hint'))+'</p>';

  $('app').innerHTML =
    out+
    '<div class="ask"><b>'+esc(T('askB'))+'</b><p>'+T('askP')+'</p></div>';
}

function toda(){ paint(); paintChat() }
toda();
if(CODE) entrar(true);
</script>
</body>
