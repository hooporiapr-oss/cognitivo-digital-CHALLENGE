footer .f-co{color:#fff;font-weight:700}

footer .f-legal{margin:7px 0 0;font-size:.78rem}

<h1>Privacy Policy</h1>
<p class="updated">Last updated 3 October 2026</p>

<p class="lead">This explains what Cada Punto collects, why, and what we do with it. Cada Punto is
operated by Gostar Digital LLC in Puerto Rico.</p>

<h2>What we collect</h2>
<p><strong>From a padrino.</strong> Your name, your email address, the rate you pledge and the
game you pledged on. If you pay, Stripe handles the payment and tells us only that it succeeded
and for how much.</p>
<p><strong>From a program.</strong> The program's name, the coach's email, the schedule, the

<p><strong>From anyone visiting.</strong> Nothing beyond what your browser sends in the ordinary
course. We do not use advertising trackers and we do not sell anything about you.</p>

<h2>What we never see</h2>
<p>Card numbers. Payments are processed by <strong>Stripe, Inc.</strong>, and card details go
straight to them. We never receive them and they are never stored on our systems.</p>

<h2>Why we hold it</h2>
<ul>
  <li>To bill a pledge after a game is scored, and to email you the amount and a payment link.</li>
  <li>To show a program what it has raised, and to pay it out.</li>
  <li>To show the public scoreboard: the schedule, the scores and the team's running points.</li>
  <li>To answer you when you write to us.</li>
</ul>

<h2>What is public</h2>
<p>The scoreboard shows the program's name, its schedule, its scores and its points total. It
shows how many padrinos have pledged on a game. <strong>It does not show a padrino's name, email
or amount.</strong> A program's coach can see the pledges on their own campaign; nobody else can.</p>

<h2>Players and minors</h2>
<p>A roster holds a player's name, and nothing else — no address, no date of birth, no contact
details. Players do not pledge and do not pay. A program decides who appears on its roster and is
responsible for having any permission required to name a child. A program or a parent may ask us

<h2>Who else handles it</h2>
<ul>
  <li><strong>Supabase</strong> — stores the database.</li>
  <li><strong>Stripe</strong> — processes payments.</li>
  <li><strong>Resend</strong> — sends the emails.</li>
  <li><strong>Render</strong> — hosts the site and the payment server.</li>
</ul>
<p>Each holds data only to do that job. We do not sell, rent or trade personal information to
anyone, for any purpose.</p>

<h2>Email</h2>
<p>We email a padrino about their own pledge: the score, the amount, a payment link, and a
thank-you once paid. We do not send marketing email and we do not add anyone to a list.</p>

<h2>How long we keep it</h2>
<p>Pledge and payment records are kept while a campaign runs and afterwards for as long as
accounting and tax rules require. A roster is kept while the program's campaign exists. You may
ask for your own records to be deleted, subject to records we must keep for tax.</p>

<h2>Your choices</h2>
<p>Write to us and you may ask what we hold about you, ask for it to be corrected, or ask for it
to be deleted. We will answer.</p>

<h2>What is stored on your device</h2>
<p>We keep a small amount in your browser's own storage: your language choice, and — on a
program's pages — who is signed in on that device. These are not advertising cookies and they are
not shared with anyone. Clearing your browser data removes them.</p>

<h2>Security</h2>
<p>Connections are encrypted. Payment data never reaches us. Access to pledge records requires a
sign-in. No system is perfect, and we will tell affected people promptly if something goes wrong.</p>

<h2>Changes</h2>
<p>We may update this policy. The date at the top says when it last changed.</p>

<h2>Contact</h2>
<p>Gostar Digital LLC<br>
PO Box 1980-345, Loíza, Puerto Rico 00772<br>

<script>
var LANG='en';
try{ LANG = localStorage.getItem('cp-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function draw(){
  document.documentElement.lang = LANG;
  document.getElementById('app').innerHTML = BODY[LANG] || BODY.en;
  document.getElementById('langBtn').textContent = LANG==='en' ? 'ES':'EN';
  try{ document.querySelector('main').scrollTop = 0; }catch(e){}
}
function toggleLang(){
  LANG = LANG==='en' ? 'es':'en';
  try{ localStorage.setItem('cp-lang', LANG); }catch(e){}
  draw();
}
draw();
</script>
