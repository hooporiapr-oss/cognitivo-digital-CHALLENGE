<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;
      --good:#0B7A5A;--bad:#A8323F}
*{box-sizing:border-box}
html{background:#12202E}
/* El teclado del teléfono no achica la página, achica lo que se ve de
   ella. Con el alto clavado en 100dvh y el scroll metido en <main>, el
   campo enfocado se iba debajo del teclado y el navegador no podía
   subirlo. Rodando la página entera, sí puede. */
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#fff;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(600px,93vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:1px solid #0B1724;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:clamp(20px,5vw,34px) 0 32px}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
footer p{margin:0 0 7px}
footer .f-co{color:#fff;font-weight:700}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-legal{margin:7px 0 0;font-size:.78rem}
footer .f-dot{padding:0 7px;opacity:.5}

.kick{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(1.5rem,4.6vw,2rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 10px;font-weight:900}
.lede{color:var(--mute);margin:0 0 22px}
h2{font-size:1.02rem;margin:26px 0 8px;font-weight:900;letter-spacing:-.02em}

.how{display:grid;gap:10px;margin:0 0 24px}
.how .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px}
.how .s b{display:block;font-size:.98rem}
.how .s span{color:var(--mute);font-size:.92rem}

label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}
input{width:100%;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
/* Cuando el navegador sube el campo enfocado, que no quede pegado al
   borde: se ve su etiqueta y el campo de antes. */
label,input{scroll-margin-top:64px;scroll-margin-bottom:24px}
.hint{font-size:.82rem;color:var(--mute);margin:4px 0 0}
.btn{display:block;width:100%;padding:16px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;
  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.line{background:#fff;color:var(--ink);margin-top:10px}
.ok{display:flex;gap:10px;align-items:flex-start;margin-top:18px;
  font-size:.88rem;font-weight:400;color:var(--mute)}
.ok span{cursor:pointer}
.ok input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.ok a{color:var(--accent)}
.msg{margin-top:12px;font-weight:700;font-size:.92rem;min-height:1.2em}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--good)}

/* En el teléfono el pie es lo último que hace falta mientras se llena
   un formulario: que ocupe lo justo. */
@media(max-width:560px){
  footer{padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));font-size:.76rem}
  footer p{margin:0 0 4px}
  footer .f-legal{margin:4px 0 0}
  main .wrap{padding-bottom:20px}
}

.fine{border-left:4px solid var(--accent);background:var(--tint);padding:14px 16px;margin:22px 0 0}
.fine b{display:block;margin-bottom:3px}
.fine p{margin:0;color:var(--mute);font-size:.93rem}

.done{text-align:center}
.done .tick{font-size:2.8rem;line-height:1;margin-bottom:10px}
</style>
<style>
/* La portada de las reglas: el nombre una vez, en grande. */
.rtop{border-bottom:3px solid var(--ink);padding-bottom:16px;margin:0 0 24px}
.rtop h1{font-size:clamp(1.6rem,6vw,2.4rem);margin:0 0 6px}
.rtop .sub{color:var(--mute);margin:0;font-size:.95rem}

/* Cada regla numerada, para que un entrenador pueda decir
   "regla 3.2" en la cancha y todo el mundo busque lo mismo. */
.sec{margin:0 0 26px}
.sec h2{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;font-size:1.06rem}
.sec h2 .n{flex:0 0 auto;color:var(--accent);font-weight:900}
.sec .cab{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.sec ol,.sec ul{margin:0;padding-left:0;list-style:none;counter-reset:r}
.sec li{position:relative;padding:9px 0 9px 44px;border-top:1px solid var(--line);font-size:.95rem}
.sec li:first-child{border-top:none}
.sec li::before{counter-increment:r;content:attr(data-n);position:absolute;left:0;top:9px;
  font-weight:900;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.sec .cierre{margin:10px 0 0;font-size:.95rem;font-weight:700}

table.money{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:.95rem}
table.money th,table.money td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.money th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  border-bottom:2px solid var(--ink)}
table.money td:nth-child(2),table.money th:nth-child(2),
table.money td:nth-child(3),table.money th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}

.pie{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pie a,.pie button{flex:1 1 180px;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:.95rem;
  text-align:center;text-decoration:none;cursor:pointer}
.pie a.solid{background:var(--ink);color:#fff}

/* Un entrenador la va a imprimir y pegarla en la pared del gimnasio. */
@media print{
  header,footer,.pie,.langb{display:none !important}
  html,body{background:#fff}
  main .wrap{width:100%;padding:0}
  .sec{break-inside:avoid;page-break-inside:avoid}
  .rtop{border-bottom:2px solid #000}
  a{text-decoration:none;color:#000}
}
</style>
</head>

<script>
var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') || localStorage.getItem('fc-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

var S = {"es":{"kick": "Reglas oficiales", "h1": "Casa Contra Casa", "sub": "El formato, completo. Gostar Digital LLC · Cada Punto · octubre 2026", "lede": "Un juego entre dos escuadras del mismo programa, a 21 puntos, en la cancha de siempre. No hace falta rival, ni liga, ni temporada — y las dos escuadras recaudan por los puntos que anotan.", "s1h": "Las escuadras", "s1c": "Las dos escuadras salen de la misma matrícula. No se invita a nadie de afuera.", "s1": ["El entrenador arma las dos y decide cuán parejas van.", "Cada jugador pertenece a una sola escuadra y la escoge antes de sacar su enlace.", "Un jugador no puede estar en las dos. Un jugador en las dos tumba el juego.", "Mínimo cuatro por escuadra, para que haya relevo.", "Todo jugador inscrito juega. Nadie se queda en el banco en el juego de su propio equipo."], "s2h": "El juego", "s2c": "Gana la primera escuadra que llegue a 21. No hace falta reloj, ni mesa, ni árbitros.", "s2": ["Canastas de 1 punto. Desde la línea de tres, 2 puntos.", "Hay que ganar por dos. Si llegan 20–20, sigue hasta que una saque dos de ventaja, con tope en 25: a 24–24, la próxima canasta gana.", "La posesión alterna después de cada canasta. No se juega “la mete, la saca” — las dos escuadras cobran por sus propios puntos, y una racha de una sola deja a la otra sin anotar.", "Las faltas las canta el entrenador o el anotador. Bola muerta y la ofensiva mantiene la posesión. No hay tiros libres.", "Fuera de línea y después de falta se repone desde la banda, con bola chequeada.", "Cambios libres en cualquier bola muerta."], "s2n": "Un juego dura entre veinte y cuarenta minutos. Dos escuadras pueden jugar dos o tres seguidos en una noche.", "s3h": "El marcador y la hoja", "s3c": "El marcador que se publica es el que se jugó. No se redondea, no se ajusta, no se mejora.", "s3": ["Una persona lleva la hoja de anotación, y no es un jugador. Un padre sirve.", "Al terminar, el entrenador firma la hoja. Si hay dos entrenadores, firman los dos.", "El marcador se publica el mismo día desde el tablero, con el código del entrenador. Dos marcadores: uno por escuadra.", "Al publicarlo se certifica contra la hoja. Esa marca es la que responde si un padrino pregunta.", "Una corrección se hace el mismo día y se le avisa a los padrinos afectados."], "s3n": "Las familias estaban en las gradas. Si una escuadra anotó 6, el tablero dice 6.", "s4h": "El dinero", "s4c": "Cada escuadra recauda por los puntos que ella anota, y las dos al mismo valor por punto. El resultado decide quién celebra, no quién recauda.", "s4": ["Tarifa mínima: 50¢ por punto. El padrino puede prometer más.", "Cobro mínimo: $5 por padrino. Si la cuenta da menos, se cobra $5.", "El padrino puede poner su propio tope, y el tope manda.", "No se cobra nada antes de que se juegue.", "El 20% de Cada Punto se le suma al padrino. Al programa no se le descuenta nada: una promesa de $10.50 le llega completa."], "s4t": "Lo que deja cada padrino, a 50¢ el punto:", "s4th": ["Escuadra", "Puntos", "Por padrino"], "s4tr": [["Gana", "21", "$10.50"], ["Pierde", "14", "$7.00"], ["Pierde", "10", "$5.00"], ["Pierde", "6", "$5.00"]], "s4n": "Los 6 puntos también dejan $5 porque el piso es del cobro, no del marcador. El tablero sigue diciendo 6.", "s5h": "Si el juego no se termina", "s5c": "Un juego que no se da no se cobra. Esa es la regla de la que no se sale.", "s5": ["Si una escuadra ya llegó a 11, vale el marcador al momento de parar y se publica así.", "Si ninguna llegó a 11, no hubo juego. Se repone y no se cobra nada.", "Un juego cancelado no cobra. Para recaudar en la fecha nueva hay que montarla y volver a pedir las promesas — no pasan solas de un juego al otro.", "Lluvia, luz, una lesión: se para. Ningún juego de estos vale una discusión."], "s6h": "Lo que invalida un juego", "s6c": "Tres cosas lo tumban, y en las tres no se cobra:", "s6": ["Un marcador publicado que no concuerda con la hoja firmada.", "Un jugador anotando para las dos escuadras.", "Un marcador cambiado después de publicado sin avisarle a los padrinos."], "s6n": "La razón es una sola. El padrino paga por un número que no vio — confió en que el programa lo iba a decir como fue. Un programa que infla un marcador se gasta eso de una vez y no lo recupera.", "print": "Imprimir", "back": "← Casa Contra Casa", "go": "Inscribe tu equipo"},"en":{"kick": "Official rules", "h1": "Casa Contra Casa", "sub": "The format, in full. Gostar Digital LLC · Cada Punto · October 2026", "lede": "A game between two squads from the same program, first to 21, in your own gym. No opponent to find, no league, no season — and both squads raise on the points they score.", "s1h": "The squads", "s1c": "Both squads come off the same roster. Nobody is brought in from outside.", "s1": ["The coach picks both and decides how even they are.", "Each player belongs to one squad and picks it before taking their link.", "A player cannot be on both. A player on both voids the game.", "Four per squad minimum, so there is someone to sub in.", "Every rostered player plays. Nobody sits out their own team’s game."], "s2h": "The game", "s2c": "The first squad to 21 wins. No clock, no scorer’s table, no officials.", "s2": ["Baskets are 1 point. From the three-point line, 2 points.", "You must win by two. At 20–20 play continues until one squad leads by two, capped at 25: at 24–24, the next basket wins.", "Possession alternates after every basket. No make-it-take-it — both squads bill on their own points, and a run by one leaves the other with nothing to collect on.", "Fouls are called by the coach or the scorekeeper. Dead ball, and the offense keeps possession. No free throws.", "Out of bounds and after a foul, the ball comes in from the sideline, checked.", "Substitutions are free on any dead ball."], "s2n": "A game runs twenty to forty minutes. Two squads can play two or three in one night.", "s3h": "The score and the sheet", "s3c": "The score that gets posted is the score that was played. It is not rounded, adjusted, or improved.", "s3": ["One person keeps the scoresheet, and it is not a player. A parent works.", "At the end the coach signs the sheet. If there are two coaches, both sign.", "The score is posted the same day from the board, with the coach’s code. Two scores: one per squad.", "Posting it certifies it against the sheet. That certification is what answers a padrino who asks.", "A correction is made the same day, and the affected padrinos are told."], "s3n": "The families were in the bleachers. If a squad scored 6, the board says 6.", "s4h": "The money", "s4c": "Each squad raises on the points it scores, and both at the same value per point. The result decides who celebrates, not who raises.", "s4": ["Minimum rate: 50¢ a point. A padrino can always pledge more.", "Minimum charge: $5 a padrino. If the total comes to less, it is $5.", "A padrino can set their own cap, and the cap wins.", "Nothing is charged before the game is played.", "Cada Punto’s 20% is added to the padrino’s payment. Nothing is taken out of the program’s: a $10.50 pledge arrives whole."], "s4t": "What each padrino leaves, at 50¢ a point:", "s4th": ["Squad", "Points", "Per padrino"], "s4tr": [["Wins", "21", "$10.50"], ["Loses", "14", "$7.00"], ["Loses", "10", "$5.00"], ["Loses", "6", "$5.00"]], "s4n": "The 6 points also leave $5, because the floor is on the charge, not on the score. The board still says 6.", "s5h": "If the game does not finish", "s5c": "A game that is not played is not charged. That rule does not bend.", "s5": ["If one squad already reached 11, the score at the stoppage stands and is posted that way.", "If neither reached 11, there was no game. It is replayed and nothing is charged.", "A cancelled game charges nothing. To raise on the new date you set it up and ask for the pledges again — they do not carry over on their own.", "Rain, lights, an injury: you stop. None of these games is worth an argument."], "s6h": "What voids a game", "s6c": "Three things void it, and in all three nothing is charged:", "s6": ["A posted score that does not match the signed sheet.", "A player scoring for both squads.", "A score changed after posting without telling the padrinos."], "s6n": "The reason is one. The padrino pays on a number they did not see — they trusted the program to say it the way it happened. A program that inflates a score spends that trust once and does not get it back.", "print": "Print", "back": "← Casa Contra Casa", "go": "Sign up my team"}};

function T(k){ return (S[LANG] && S[LANG][k]) !== undefined ? S[LANG][k] : (S.en[k]||''); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleLang(){
  LANG = (LANG === 'es') ? 'en' : 'es';
  try{ localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG),
       localStorage.setItem('fc-lang', LANG); }catch(e){}
  paint();
}

/* Numeradas 1.1, 1.2 ... para que se puedan citar en la cancha. */
function reglas(n, items){
  var h = '<ol>';
  for (var i=0; i<items.length; i++){
    h += '<li data-n="' + n + '.' + (i+1) + '">' + esc(items[i]) + '</li>';
  }
  return h + '</ol>';
}
function seccion(n, h, c, items, nota){
  return '<section class="sec">' +
    '<h2><span class="n">' + n + '.</span> ' + esc(h) + '</h2>' +
    '<p class="cab">' + esc(c) + '</p>' +
    reglas(n, items) +
    (nota ? '<p class="cierre">' + esc(nota) + '</p>' : '') +
    '</section>';
}
function tabla(){
  var th = T('s4th'), tr = T('s4tr'), h = '<table class="money"><thead><tr>';
  for (var i=0;i<th.length;i++) h += '<th>' + esc(th[i]) + '</th>';
  h += '</tr></thead><tbody>';
  for (var r=0;r<tr.length;r++){
    h += '<tr>';
    for (var c=0;c<tr[r].length;c++) h += '<td>' + esc(tr[r][c]) + '</td>';
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

function paint(){
  document.documentElement.lang = LANG;
  document.getElementById('langBtn').textContent = (LANG === 'es') ? 'EN' : 'ES';
  document.title = (LANG === 'es')
    ? 'Reglas de Casa Contra Casa \u2014 Cada Punto'
    : 'Casa Contra Casa Rules \u2014 Cada Punto';

  var dinero = '<section class="sec">' +
    '<h2><span class="n">4.</span> ' + esc(T('s4h')) + '</h2>' +
    '<p class="cab">' + esc(T('s4c')) + '</p>' +
    reglas(4, T('s4')) +
    '<p class="cierre" style="margin-top:16px;font-weight:400;color:var(--mute)">' + esc(T('s4t')) + '</p>' +
    tabla() +
    '<p class="cierre">' + esc(T('s4n')) + '</p>' +
    '</section>';

  document.getElementById('app').innerHTML =
    '<div class="rtop">' +
      '<p class="kick">' + esc(T('kick')) + '</p>' +
      '<h1>' + esc(T('h1')) + '</h1>' +
      '<p class="sub">' + esc(T('sub')) + '</p>' +
    '</div>' +
    '<p class="lede">' + esc(T('lede')) + '</p>' +
    seccion(1, T('s1h'), T('s1c'), T('s1'), '') +
    seccion(2, T('s2h'), T('s2c'), T('s2'), T('s2n')) +
    seccion(3, T('s3h'), T('s3c'), T('s3'), T('s3n')) +
    dinero +
    seccion(5, T('s5h'), T('s5c'), T('s5'), '') +
    seccion(6, T('s6h'), T('s6c'), T('s6'), T('s6n')) +
    '<div class="pie">' +
      '<a class="solid" href="equipo.html">' + esc(T('go')) + '</a>' +
      '<button type="button" onclick="window.print()">' + esc(T('print')) + '</button>' +
      '<a href="casa-contra-casa.html">' + esc(T('back')) + '</a>' +
    '</div>';
}

paint();
</script>
