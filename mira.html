<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#A84200;
      --good:#0B7A5A;--bad:#A8323F}
*{box-sizing:border-box}
html{background:#12202E}
/* El teclado del teléfono no achica la página, achica lo que se ve de
   ella. Con el alto clavado en 100dvh y el scroll metido en <main>, el
   campo enfocado se iba debajo del teclado y el navegador no podía
   subirlo. Rodando la página entera, sí puede. */
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#fff;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(600px,93vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:1px solid #0B1724;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff;text-decoration:none}
.mark em{font-style:normal;color:#FF8A2B}
.mark i{font-style:normal;color:#6FD83C}
.langb{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:clamp(20px,5vw,34px) 0 32px}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
footer p{margin:0 0 7px}
footer .f-co{color:#fff;font-weight:700}
footer a{color:#8FA8C0;text-decoration:none}
footer .f-legal{margin:7px 0 0;font-size:.78rem}
footer .f-dot{padding:0 7px;opacity:.5}

.kick{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(1.5rem,4.6vw,2rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 10px;font-weight:900}
.lede{color:var(--mute);margin:0 0 22px}
h2{font-size:1.02rem;margin:26px 0 8px;font-weight:900;letter-spacing:-.02em}

.how{display:grid;gap:10px;margin:0 0 24px}
.how .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px}
.how .s b{display:block;font-size:.98rem}
.how .s span{color:var(--mute);font-size:.92rem}

label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}
input{width:100%;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
/* Cuando el navegador sube el campo enfocado, que no quede pegado al
   borde: se ve su etiqueta y el campo de antes. */
label,input{scroll-margin-top:64px;scroll-margin-bottom:24px}
.hint{font-size:.82rem;color:var(--mute);margin:4px 0 0}
.btn{display:block;width:100%;padding:16px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;
  cursor:pointer;text-align:center;text-decoration:none;margin-top:18px}
.btn.line{background:#fff;color:var(--ink);margin-top:10px}
.ok{display:flex;gap:10px;align-items:flex-start;margin-top:18px;
  font-size:.88rem;font-weight:400;color:var(--mute)}
.ok span{cursor:pointer}
.ok input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.ok a{color:var(--accent)}
.msg{margin-top:12px;font-weight:700;font-size:.92rem;min-height:1.2em}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--good)}

/* En el teléfono el pie es lo último que hace falta mientras se llena
   un formulario: que ocupe lo justo. */
@media(max-width:560px){
  footer{padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));font-size:.76rem}
  footer p{margin:0 0 4px}
  footer .f-legal{margin:4px 0 0}
  main .wrap{padding-bottom:20px}
}

.fine{border-left:4px solid var(--accent);background:var(--tint);padding:14px 16px;margin:22px 0 0}
.fine b{display:block;margin-bottom:3px}
.fine p{margin:0;color:var(--mute);font-size:.93rem}

.done{text-align:center}
.done .tick{font-size:2.8rem;line-height:1;margin-bottom:10px}
</style>
<style>
/* La portada de las reglas: el nombre una vez, en grande. */
.rtop{border-bottom:3px solid var(--ink);padding-bottom:16px;margin:0 0 24px}
.rtop h1{font-size:clamp(1.6rem,6vw,2.4rem);margin:0 0 6px}
.rtop .sub{color:var(--mute);margin:0;font-size:.95rem}

/* Cada regla numerada, para que un entrenador pueda decir
   "regla 3.2" en la cancha y todo el mundo busque lo mismo. */
.sec{margin:0 0 26px}
.sec h2{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;font-size:1.06rem}
.sec h2 .n{flex:0 0 auto;color:var(--accent);font-weight:900}
.sec .cab{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.sec ol,.sec ul{margin:0;padding-left:0;list-style:none;counter-reset:r}
.sec li{position:relative;padding:9px 0 9px 44px;border-top:1px solid var(--line);font-size:.95rem}
.sec li:first-child{border-top:none}
.sec li::before{counter-increment:r;content:attr(data-n);position:absolute;left:0;top:9px;
  font-weight:900;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.sec .cierre{margin:10px 0 0;font-size:.95rem;font-weight:700}

table.money{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:.95rem}
table.money th,table.money td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.money th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  border-bottom:2px solid var(--ink)}
table.money td:nth-child(2),table.money th:nth-child(2),
table.money td:nth-child(3),table.money th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}

.pie{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pie a,.pie button{flex:1 1 180px;padding:14px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:.95rem;
  text-align:center;text-decoration:none;cursor:pointer}
.pie a.solid{background:var(--ink);color:#fff}

/* Un entrenador la va a imprimir y pegarla en la pared del gimnasio. */
/* La hoja impresa tiene que decir de dónde salió. Alguien la pega en
   la pared del gimnasio, otro entrenador le saca una foto, y si no
   lleva la dirección esa foto no lleva a ningún sitio. */
.pie-print{display:none}
@media print{
  .heroart,.why,.num{display:none !important}
  header,footer,.pie,.langb{display:none !important}
  html,body{background:#fff}
  main .wrap{width:100%;padding:0}
  .sec{break-inside:avoid;page-break-inside:avoid}
  .rtop{border-bottom:2px solid #000}
  a{text-decoration:none;color:#000}
  .pie-print{display:block;margin-top:22px;padding-top:12px;
    border-top:2px solid #000;font-size:.86rem;font-weight:700;
    text-align:center;break-inside:avoid}
  .pie-print span{display:block;font-weight:400;font-size:.8rem;margin-top:3px}
}

.heroart{display:block;width:100%;height:auto;margin:0 0 clamp(18px,4vw,26px);
  border-radius:6px;border:1px solid rgba(255,138,43,.30);
  box-shadow:0 14px 40px rgba(0,0,0,.28)}
.why{display:grid;gap:10px;margin:0 0 26px}
.why .w{border-left:4px solid var(--accent);background:var(--tint);padding:13px 15px}
.why .w b{display:block;font-size:.98rem}
.why .w span{color:var(--mute);font-size:.92rem}
.num{display:grid;gap:10px;margin:0 0 26px;counter-reset:paso}
.num .s{border:1.5px solid var(--line);border-radius:4px;padding:13px 15px 13px 46px;position:relative}
.num .s::before{counter-increment:paso;content:counter(paso);position:absolute;left:14px;top:13px;
  width:21px;height:21px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.num .s b{display:block;font-size:.98rem}
.num .s span{color:var(--mute);font-size:.92rem}
.rulesH{margin-top:34px;padding-top:22px;border-top:3px solid var(--ink)}
.rulesH h2{font-size:1.25rem;margin:0}
</style>
<style>

.f-what{margin:7px 0 0;font-size:.74rem;line-height:1.5;opacity:.72;max-width:52ch;margin-left:auto;margin-right:auto}
</style>
