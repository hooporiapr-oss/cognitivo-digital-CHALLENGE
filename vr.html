<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de VR — Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* Una página de diagnóstico, no un producto. Abre en el navegador que
   tenga el casco y dice qué hay dentro: si habla WebXR, si el casco se
   mueve en el espacio o sólo gira, si hay mandos o manos.

   Nada de esto necesita instalar nada. Es una dirección.

   Escrita a la defensiva a propósito: el Firefox Reality de un Pico
   viejo está congelado en 2022, así que aquí no hay módulos, ni
   import maps, ni nada moderno — y la parte que informa es HTML puro,
   para que funcione aunque el 3D no arranque. */
*{box-sizing:border-box}
body{margin:0;background:#12202E;color:#EAF4FB;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.55}
.wrap{width:min(640px,92vw);margin:0 auto;padding:22px 0 60px}
h1{font-size:1.5rem;font-weight:900;margin:0 0 4px}
.sub{color:#93AAC2;font-size:.9rem;margin:0 0 20px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:9px 6px;border-bottom:1px solid #20395C;vertical-align:top}
td:first-child{color:#93AAC2;width:42%}
td:last-child{font-weight:700;overflow-wrap:anywhere}
.si{color:#6FD83C}.no{color:#FF6B6B}.quiz{color:#FF8A2B}
button{display:block;width:100%;margin:22px 0 0;padding:17px;border:none;border-radius:6px;
  background:#FF7A18;color:#12202E;font:inherit;font-size:1.05rem;font-weight:900;cursor:pointer}
button[disabled]{opacity:.4;cursor:default}
pre{background:#0A1830;border:1px solid #20395C;border-radius:6px;padding:11px;
  font-size:.72rem;overflow-wrap:anywhere;white-space:pre-wrap;margin:18px 0 0;color:#93AAC2}
.nota{margin:18px 0 0;font-size:.85rem;color:#93AAC2}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prueba de VR</h1>
  <p class="sub">Qué puede hacer este casco, sin instalar nada.</p>

  <table id="t"></table>

  <button id="go" disabled>Comprobando…</button>
  <p class="nota">Dentro no se ve esta tabla. Para volver a ella, el botón de
     atrás del casco — y si se queda trabada, recarga la página.</p>
  <p class="nota" id="nota"></p>

  <pre id="ua"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=document.getElementById('t');
function fila(k,v,cls){
  var tr=document.createElement('tr');
  var a=document.createElement('td'); a.textContent=k;
  var b=document.createElement('td'); b.textContent=v; if(cls) b.className=cls;
  tr.appendChild(a); tr.appendChild(b); T.appendChild(tr);
  return b;
}
function si(v){ return v?'si':'no' }

document.getElementById('ua').textContent=navigator.userAgent;

/* Qué casco es, sacado de lo que dice el navegador de sí mismo. Si no
   se reconoce, el texto de abajo lo dice igual y con eso basta. */
var ua=navigator.userAgent;
var casco='no lo sé — mira el texto gris del final';
if(/Pico ?4/i.test(ua)) casco='Pico 4';
else if(/Neo ?3/i.test(ua)) casco='Pico Neo 3';
else if(/G2 ?4K/i.test(ua)) casco='Pico G2 4K';
else if(/Pico/i.test(ua)) casco='Pico (modelo sin identificar)';
else if(/Quest ?3/i.test(ua)) casco='Meta Quest 3';
else if(/Quest ?2/i.test(ua)) casco='Meta Quest 2';
else if(/OculusBrowser|Quest/i.test(ua)) casco='Meta Quest';
fila('Casco', casco);

var nav=/Wolvic/i.test(ua) ? 'Wolvic'
      : /Firefox/i.test(ua) ? 'Firefox Reality (o Firefox)'
      : /OculusBrowser/i.test(ua) ? 'Navegador de Meta'
      : /Chrome/i.test(ua) ? 'Chrome o derivado' : 'otro';
fila('Navegador', nav);

/* Sin WebGL no hay nada que hacer, y conviene saber si es WebGL 2. */
var gl=null, glv='no';
try{
  var cv=document.createElement('canvas');
  if(cv.getContext('webgl2')) glv='WebGL 2';
  else if(cv.getContext('webgl')||cv.getContext('experimental-webgl')) glv='WebGL 1';
}catch(e){}
fila('Dibujo 3D', glv, glv==='no'?'no':'si');
fila('three.js', (typeof THREE!=='undefined')? ('cargado ('+THREE.REVISION+')') : 'NO cargó',
     (typeof THREE!=='undefined')?'si':'no');

var celdaXR=fila('WebXR', navigator.xr? 'sí lo tiene':'NO lo tiene',
                 navigator.xr?'si':'no');
var celdaVR=fila('Modo inmersivo', 'comprobando…','quiz');
var celdaSuelo=fila('Se mueve en el espacio', 'se sabe al entrar','quiz');
var celdaMando=fila('Mandos o manos', 'se sabe al entrar','quiz');

var boton=document.getElementById('go');
var nota=document.getElementById('nota');

/* three.js viene de fuera. Si no llegó no es culpa del casco, es la red
   — y conviene decirlo aquí para no andar buscando donde no es. */
if(typeof THREE==='undefined'){
  nota.textContent='Aviso: three.js no se descargó. Eso es la red de este '+
    'casco, no el casco. La tabla de arriba vale igual; lo que no va a '+
    'poder es entrar a la escena.';
}

if(!navigator.xr){
  celdaVR.textContent='no hay WebXR'; celdaVR.className='no';
  boton.textContent='Este navegador no puede';
  nota.textContent='Sin WebXR no entra en modo inmersivo. Si es un Pico con '+
    'Firefox Reality viejo, el siguiente paso es probar Wolvic por ADB. '+
    'Enséñame el texto gris de abajo y te digo.';
  return;
}

navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
  celdaVR.textContent = ok? 'sí, puede entrar' : 'no lo admite';
  celdaVR.className = ok? 'si':'no';
  if(ok){
    boton.disabled=false;
    boton.textContent='Entrar — cinco defensas en un 2-1-2';
    nota.textContent='Al entrar verás cinco balones en la forma de un 2-1-2. '+
      'Uno se enciende. Apunta y dispara, o mira y espera. Para salir, el '+
      'botón de atrás del casco.';
  }else{
    boton.textContent='No admite modo inmersivo';
    nota.textContent='Tiene WebXR pero no VR inmersiva. Pasa en navegadores '+
      'de escritorio sin casco conectado.';
  }
}).catch(function(e){
  celdaVR.textContent='falló al preguntar'; celdaVR.className='no';
  nota.textContent=String(e);
});

// ── La escena, lo más sencilla que se puede ───────────────────────
// Un suelo, cinco balones en un 2-1-2 y uno que se enciende. No es el
// juego: es la prueba de que el juego cabe aquí.
var renderer,scene,camera,balls=[],lit=-1,raycaster,tmpM;

// El 2-1-2 visto desde el base: dos arriba, uno en el medio, dos abajo.
// En metros, con el jugador en el origen mirando hacia -Z.
var POS=[[-1.6,1.3,-3.2],[1.6,1.3,-3.2],[0,1.3,-4.6],[-2.1,1.3,-6.0],[2.1,1.3,-6.0]];
var COLS=[0xff1e3c,0xffd35a,0x00D9A5,0x3b82f6,0xff6b35];

function construir(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0A1830);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,50);

  scene.add(new THREE.HemisphereLight(0xffffff,0x334455,1.1));

  var suelo=new THREE.Mesh(
    new THREE.PlaneGeometry(14,14),
    new THREE.MeshBasicMaterial({color:0x123049,wireframe:true}));
  suelo.rotation.x=-Math.PI/2; suelo.position.y=0; scene.add(suelo);

  for(var i=0;i<5;i++){
    var m=new THREE.Mesh(new THREE.SphereGeometry(.34,20,16),
          new THREE.MeshLambertMaterial({color:COLS[i]}));
    m.position.set(POS[i][0],POS[i][1],POS[i][2]);
    m.userData.i=i; m.userData.base=COLS[i];
    scene.add(m); balls.push(m);
  }
  raycaster=new THREE.Raycaster(); tmpM=new THREE.Matrix4();
}

function encender(){
  var n; do{ n=Math.floor(Math.random()*5) }while(n===lit);
  lit=n;
  balls.forEach(function(b,i){
    b.material.color.setHex(b.userData.base);
    b.scale.setScalar(i===lit?1.45:1);
  });
  balls[lit].material.color.setHex(0xffffff);
}

function acertar(i){
  if(i===lit){ balls[i].material.color.setHex(0x00D9A5); setTimeout(encender,420); }
  else { balls[i].material.color.setHex(0x111111); setTimeout(function(){
    balls[i].material.color.setHex(balls[i].userData.base) },320); }
}

function apuntar(ctrl){
  if(ctrl){
    tmpM.identity().extractRotation(ctrl.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).applyMatrix4(tmpM);
  }else{
    // Sin mando se apunta con la cabeza, que es lo que queda en un
    // casco de tres grados de libertad.
    raycaster.ray.origin.setFromMatrixPosition(camera.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).applyQuaternion(camera.quaternion);
  }
  var hit=raycaster.intersectObjects(balls);
  if(hit.length) acertar(hit[0].object.userData.i);
}

boton.onclick=function(){
  if(typeof THREE==='undefined'){ nota.textContent='three.js no cargó — sin red o bloqueado.'; return; }
  try{
    if(renderer){                      // ya se montó antes: sólo re-entrar
      navigator.xr.requestSession('immersive-vr',
        {optionalFeatures:['local-floor','bounded-floor','hand-tracking']}
      ).then(function(se){
        renderer.xr.setSession(se);
        se.addEventListener('end',function(){
          boton.disabled=false; boton.textContent='Entrar otra vez';
        });
        renderer.setAnimationLoop(function(){ renderer.render(scene,camera) });
        boton.disabled=true; boton.textContent='Estás dentro — sal con el botón de atrás';
      }).catch(function(e){ nota.textContent='No entró: '+e });
      return;
    }
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth,innerHeight);
    renderer.xr.enabled=true;
    document.body.appendChild(renderer.domElement);
    construir();

    navigator.xr.requestSession('immersive-vr',
      {optionalFeatures:['local-floor','bounded-floor','hand-tracking']}
    ).then(function(session){

      // 'local-floor' quiere decir que el casco sabe dónde está el
      // suelo y que te mueves de verdad. 'local' a secas suele ser un
      // casco que sólo gira.
      session.requestReferenceSpace('local-floor').then(function(){
        renderer.xr.setReferenceSpaceType('local-floor');
        celdaSuelo.textContent='sí — seis grados, te mueves';
        celdaSuelo.className='si';
      }).catch(function(){
        renderer.xr.setReferenceSpaceType('local');
        celdaSuelo.textContent='no — tres grados, sólo gira';
        celdaSuelo.className='quiz';
      });

      renderer.xr.setSession(session);

      var ctrls=[];
      for(var c=0;c<2;c++){
        var g=renderer.xr.getController(c);
        g.addEventListener('selectstart',(function(gg){ return function(){ apuntar(gg) } })(g));
        scene.add(g); ctrls.push(g);
      }
      session.addEventListener('select',function(){ apuntar(null) });

      session.addEventListener('inputsourceschange',function(){
        var n=0,manos=0;
        session.inputSources.forEach(function(s){ n++; if(s.hand) manos++; });
        celdaMando.textContent = n? (n+' mando'+(n>1?'s':'')+(manos?' + manos':'')) : 'ninguno — se apunta con la cabeza';
        celdaMando.className = n?'si':'quiz';
      });

      encender();
      renderer.setAnimationLoop(function(){ renderer.render(scene,camera) });
      boton.textContent='Estás dentro — sal con el botón de atrás del casco';
      boton.disabled=true;

      /* Al salir hay que devolver el botón a como estaba. Sin esto, el
         que sale se queda mirando un botón muerto que dice "estás
         dentro" cuando ya no lo está, y la única salida es recargar. */
      session.addEventListener('end', function(){
        try{ renderer.setAnimationLoop(null) }catch(e){}
        boton.disabled=false;
        boton.textContent='Entrar otra vez';
        nota.textContent='Saliste. Las dos últimas filas de la tabla ya dicen '+
          'lo que se vio dentro.';
      });
    }).catch(function(e){
      nota.textContent='No entró: '+e;
    });
  }catch(e){
    nota.textContent='Falló al montar la escena: '+e;
  }
};
})();
</script>
</body>
</html>
