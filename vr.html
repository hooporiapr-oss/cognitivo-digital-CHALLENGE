<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR check — Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* Una página de diagnóstico, no un producto. Abre en el navegador que
   tenga el casco y dice qué hay dentro: si habla WebXR, si el casco se
   mueve en el espacio o sólo gira, si hay mandos o manos.

   Nada de esto necesita instalar nada. Es una dirección.

   Escrita a la defensiva a propósito: el Firefox Reality de un Pico
   viejo está congelado en 2022, así que aquí no hay módulos, ni
   import maps, ni nada moderno — y la parte que informa es HTML puro,
   para que funcione aunque el 3D no arranque. */
*{box-sizing:border-box}
body{margin:0;background:#12202E;color:#EAF4FB;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.55}
.wrap{width:min(640px,92vw);margin:0 auto;padding:22px 0 60px}
h1{font-size:1.5rem;font-weight:900;margin:0 0 4px}
.sub{color:#93AAC2;font-size:.9rem;margin:0 0 20px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:9px 6px;border-bottom:1px solid #20395C;vertical-align:top}
td:first-child{color:#93AAC2;width:42%}
td:last-child{font-weight:700;overflow-wrap:anywhere}
.si{color:#6FD83C}.no{color:#FF6B6B}.quiz{color:#FF8A2B}
button{display:block;width:100%;margin:22px 0 0;padding:17px;border:none;border-radius:6px;
  background:#FF7A18;color:#12202E;font:inherit;font-size:1.05rem;font-weight:900;cursor:pointer}
button[disabled]{opacity:.4;cursor:default}
/* El lienzo del 3D va fijo y por encima, NO dentro del flujo de la
   página. Metido en el flujo hacía el documento el doble de alto, y
   dentro del casco cualquier roce del mando ponía la página a rodar
   arriba y abajo sin parar por detrás de la escena. */
canvas{position:fixed!important;top:0;left:0;width:100%!important;height:100%!important;
  z-index:5;touch-action:none}
/* Mientras se está dentro no hay nada que desplazar. */
body.dentro{overflow:hidden;height:100%;position:fixed;width:100%}
body.dentro .wrap{display:none}
html,body{overscroll-behavior:none}

pre{background:#0A1830;border:1px solid #20395C;border-radius:6px;padding:11px;
  font-size:.72rem;overflow-wrap:anywhere;white-space:pre-wrap;margin:18px 0 0;color:#93AAC2}
.nota{margin:18px 0 0;font-size:.85rem;color:#93AAC2}
</style>
</head>
<body>
<div class="wrap">
  <h1>VR check</h1>
  <p class="sub">What this headset can do, with nothing installed.</p>

  <table id="t"></table>

  <button id="go" disabled>Checking…</button>
  <p class="nota">This table is not visible from inside. To get back to it, use
     the headset's back button — and if it sticks, reload the page.</p>
  <p class="nota" id="nota"></p>

  <pre id="ua"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=document.getElementById('t');
function fila(k,v,cls){
  var tr=document.createElement('tr');
  var a=document.createElement('td'); a.textContent=k;
  var b=document.createElement('td'); b.textContent=v; if(cls) b.className=cls;
  tr.appendChild(a); tr.appendChild(b); T.appendChild(tr);
  return b;
}
function si(v){ return v?'si':'no' }

document.getElementById('ua').textContent=navigator.userAgent;

/* Qué casco es, sacado de lo que dice el navegador de sí mismo. Si no
   se reconoce, el texto de abajo lo dice igual y con eso basta. */
var ua=navigator.userAgent;
var casco='unknown — see the grey text at the bottom';
if(/Pico ?4/i.test(ua)) casco='Pico 4';
else if(/Neo ?3/i.test(ua)) casco='Pico Neo 3';
else if(/G2 ?4K/i.test(ua)) casco='Pico G2 4K';
else if(/Pico/i.test(ua)) casco='Pico (model not identified)';
else if(/Quest ?3/i.test(ua)) casco='Meta Quest 3';
else if(/Quest ?2/i.test(ua)) casco='Meta Quest 2';
else if(/OculusBrowser|Quest/i.test(ua)) casco='Meta Quest';
fila('Headset', casco);

var nav=/Wolvic/i.test(ua) ? 'Wolvic'
      : /Firefox/i.test(ua) ? 'Firefox Reality (o Firefox)'
      : /OculusBrowser/i.test(ua) ? 'Meta Browser'
      : /Chrome/i.test(ua) ? 'Chrome or similar' : 'other';
fila('Browser', nav);

/* Sin WebGL no hay nada que hacer, y conviene saber si es WebGL 2. */
var gl=null, glv='no';
try{
  var cv=document.createElement('canvas');
  if(cv.getContext('webgl2')) glv='WebGL 2';
  else if(cv.getContext('webgl')||cv.getContext('experimental-webgl')) glv='WebGL 1';
}catch(e){}
fila('3D drawing', glv, glv==='no'?'no':'si');
fila('three.js', (typeof THREE!=='undefined')? ('loaded (r'+THREE.REVISION+')') : 'did NOT load',
     (typeof THREE!=='undefined')?'si':'no');

var celdaXR=fila('WebXR', navigator.xr? 'yes, present':'NOT present',
                 navigator.xr?'si':'no');
var celdaVR=fila('Immersive mode', 'checking…','quiz');
var celdaSuelo=fila('Moves through space', 'known once inside','quiz');
var celdaMando=fila('Controllers or hands', 'known once inside','quiz');

var boton=document.getElementById('go');
var nota=document.getElementById('nota');

/* three.js viene de fuera. Si no llegó no es culpa del casco, es la red
   — y conviene decirlo aquí para no andar buscando donde no es. */
if(typeof THREE==='undefined'){
  nota.textContent='Heads up: three.js did not download. That is this '+
    'headset\u2019s network, not the headset. The table above still counts; '+
    'what it will not be able to do is enter the scene.';
}

if(!navigator.xr){
  celdaVR.textContent='no WebXR'; celdaVR.className='no';
  boton.textContent='This browser cannot';
  nota.textContent='Without WebXR there is no immersive mode. If this is a Pico '+
    'on an old Firefox Reality, the next step is trying Wolvic over ADB. '+
    'Show me the grey text below and I will tell you.';
  return;
}

navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
  celdaVR.textContent = ok? 'yes, it can enter' : 'not supported';
  celdaVR.className = ok? 'si':'no';
  if(ok){
    boton.disabled=false;
    boton.textContent='Enter — five defenders in a 2-1-2';
    nota.textContent='Inside you will see five balls in the shape of a 2-1-2. '+
      'One turns white. LOOK at it and hold your gaze for a second \u2014 no '+
      'controller needed. It fills with light while you hold. To leave, the '+
      'headset\u2019s back button.';
  }else{
    boton.textContent='No immersive mode';
    nota.textContent='It has WebXR but not immersive VR. That happens on desktop '+
      'browsers with no headset attached.';
  }
}).catch(function(e){
  celdaVR.textContent='the check itself failed'; celdaVR.className='no';
  nota.textContent=String(e);
});

// ── La escena, lo más sencilla que se puede ───────────────────────
// Un suelo, cinco balones en un 2-1-2 y uno que se enciende. No es el
// juego: es la prueba de que el juego cabe aquí.
var renderer,scene,camera,balls=[],lit=-1,raycaster,tmpM;

// El 2-1-2 visto desde el base: dos arriba, uno en el medio, dos abajo.
// En metros, con el jugador en el origen mirando hacia -Z.
var POS=[[-1.6,1.3,-3.2],[1.6,1.3,-3.2],[0,1.3,-4.6],[-2.1,1.3,-6.0],[2.1,1.3,-6.0]];
var COLS=[0xff1e3c,0xffd35a,0x00D9A5,0x3b82f6,0xff6b35];

function construir(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0A1830);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,50);

  scene.add(new THREE.HemisphereLight(0xffffff,0x334455,1.1));

  var suelo=new THREE.Mesh(
    new THREE.PlaneGeometry(14,14),
    new THREE.MeshBasicMaterial({color:0x123049,wireframe:true}));
  suelo.rotation.x=-Math.PI/2; suelo.position.y=0; scene.add(suelo);

  for(var i=0;i<5;i++){
    var m=new THREE.Mesh(new THREE.SphereGeometry(.34,20,16),
          new THREE.MeshLambertMaterial({color:COLS[i]}));
    m.position.set(POS[i][0],POS[i][1],POS[i][2]);
    m.userData.i=i; m.userData.base=COLS[i];
    scene.add(m); balls.push(m);
  }
  raycaster=new THREE.Raycaster(); tmpM=new THREE.Matrix4();
  hacerPanel();
}

/* Un casco de tres grados pone los ojos en el origen: altura cero. Yo
   había puesto las bolas a 1,30 m como si midiera desde el suelo, así
   que la mirada les pasaba por debajo y no tocaba ninguna. Esto las
   sube o las baja a la altura real de los ojos de este casco. */
function alturaOjos(y){
  balls.forEach(function(b,i){ b.position.y = POS[i][1] + y; });
}

/* ═════════════════════════════════════════════════════
   UN PANEL DENTRO

   Desde fuera estoy adivinando. Esto pinta los números de verdad en un
   cartel flotando delante, para ver qué dice el casco: cuántos cuadros
   van, dónde pone los ojos, hacia dónde cree que miras, y qué bola
   está tocando el rayo.
   ═════════════════════════════════════════════════════ */
var panelCv,panelCtx,panelTex,panel,cuadros=0;
function hacerPanel(){
  panelCv=document.createElement('canvas');
  panelCv.width=768; panelCv.height=448;
  panelCtx=panelCv.getContext('2d');
  panelTex=new THREE.CanvasTexture(panelCv);
  /* Pequeño y abajo. A metro y medio de ancho y a dos metros tapaba
     media cancha, así que para mirar una bola había que mirar a través
     del cartel. Ahora se baja la vista para leerlo y se sube para
     jugar. */
  /* Grande y cerca para que se lea, pero abajo y echado hacia atrás
     para que no tape la cancha: se baja la vista y está ahí. */
  panel=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.88),
        new THREE.MeshBasicMaterial({map:panelTex,transparent:true}));
  panel.position.set(0,-0.62,-1.35);
  panel.rotation.x=0.5;
  panel.userData.noTocar=true;
  scene.add(panel);
}
function pintarPanel(lineas){
  if(!panelCtx) return;
  panelCtx.fillStyle='rgba(0,0,0,.9)';
  panelCtx.fillRect(0,0,768,448);
  panelCtx.fillStyle='#6FD83C';
  panelCtx.font='bold 46px monospace';
  for(var i=0;i<lineas.length;i++) panelCtx.fillText(lineas[i],22,62+i*62);
  panelTex.needsUpdate=true;
}

/* La altura de los ojos no se adivina: se mide. El primer cuadro dice
   dónde está la cámara de verdad y las bolas se colocan ahí, valga lo
   que valga el espacio de referencia. */
var colocadas=false;
function colocarAlaAltura(cam){
  if(colocadas) return;
  var y=new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld).y;
  balls.forEach(function(b,i){ b.position.y = y + (POS[i][1]-1.3); });
  if(panel) panel.position.y = y - 0.62;
  colocadas=true;
}

function encender(){
  var n; do{ n=Math.floor(Math.random()*5) }while(n===lit);
  lit=n;
  balls.forEach(function(b,i){
    b.material.color.setHex(b.userData.base);
    b.scale.setScalar(i===lit?1.45:1);
  });
  balls[lit].material.color.setHex(0xffffff);
}

function acertar(i){
  if(i===lit){ balls[i].material.color.setHex(0x00D9A5); setTimeout(encender,420); }
  else { balls[i].material.color.setHex(0x111111); setTimeout(function(){
    balls[i].material.color.setHex(balls[i].userData.base) },320); }
}

/* ═════════════════════════════════════════════════════
   MIRAR Y AGUANTAR

   El gatillo del mando no llega a la escena en este casco — un Pico
   viejo con un WebXR de 2020 no entrega la entrada como la entrega uno
   de hoy, y three.js no la encuentra.

   Así que esto no depende de ningún mando: miras una bola, la aguantas
   mirando un segundo, y cuenta. Es lo único que funciona seguro en
   cualquier casco, con mando o sin él, y para leer una zona tampoco
   hace falta más — lo que se entrena es la mirada.

   La bola que se está mirando se enciende por dentro y se va llenando,
   para que se vea que el casco te está siguiendo la cabeza.
   ═════════════════════════════════════════════════════ */
var DWELL_MS=1000;
var mirando=-1, mirandoDesde=0, selects=0;

/* La cámara que de verdad mira es la del casco, no la que yo creé.
   three.js le copia la matriz a la mía en cada cuadro, pero NO le
   actualiza el quaternion — así que sacar la dirección de camera.quaternion
   daba siempre el mismo rayo hacia adelante, mirara uno donde mirara.
   De la matriz sí sale bien. */
function camaraReal(){
  try{
    if(renderer.xr && renderer.xr.isPresenting && renderer.xr.getCamera){
      var c=renderer.xr.getCamera(camera);
      if(c && c.matrixWorld) return c;
    }
  }catch(e){}
  return camera;
}

/* three.js no le está sacando el giro de la cabeza a este WebXR de
   2020: el rayo salía siempre recto hacia adelante mirara uno donde
   mirara. Así que no le preguntamos a three.js — se lee la pose
   directamente del cuadro que manda el casco, que es la fuente.

   mPose guarda esa matriz; de ella salen el origen y la dirección. Si
   el casco no diera pose, se vuelve a la cámara de antes y el panel lo
   dice, para no volver a quedarnos a oscuras. */
/* three.js no nos da ni el cuadro del casco ni su espacio de
   referencia en esta versión de WebXR, así que no contamos con ello.
   Pedimos nuestro propio espacio al abrir la sesión, y corremos nuestro
   propio bucle contra la sesión — session.requestAnimationFrame — que
   SÍ entrega el cuadro. De ahí sale la pose, y la guardamos en mPose
   para que el dibujo la use. Dos bucles conviviendo: el de three.js
   pinta, el nuestro mira. */
var mPose=new THREE.Matrix4(), deDonde='-';
var miEspacio=null, miSesion=null, poseViva=false;

function bucleDelCasco(t, frame){
  if(!miSesion) return;
  try{
    var p = (frame && miEspacio && frame.getViewerPose)
          ? frame.getViewerPose(miEspacio) : null;
    if(p && p.transform && p.transform.matrix){
      mPose.fromArray(p.transform.matrix);
      poseViva=true;
    }
  }catch(e){}
  try{ miSesion.requestAnimationFrame(bucleDelCasco) }catch(e){}
}
function mirada(xrFrame){
  cuadros++;
  var cam=camaraReal();
  colocarAlaAltura(cam);

  var o=new THREE.Vector3(), d=new THREE.Vector3();
  if(poseViva){
    o.setFromMatrixPosition(mPose);
    d.set(0,0,-1).transformDirection(mPose);
    deDonde='casco';
  }else{
    o.setFromMatrixPosition(cam.matrixWorld);
    d.set(0,0,-1).transformDirection(cam.matrixWorld);
    deDonde='camara';
  }
  raycaster.ray.origin.copy(o);
  raycaster.ray.direction.copy(d);
  var hit=raycaster.intersectObjects(balls);
  var sobre = hit.length ? hit[0].object.userData.i : -1;

  var r1=function(v){ return Math.round(v*100)/100 };
  pintarPanel([
    'cuadros '+cuadros,
    'ojos  x'+r1(o.x)+' y'+r1(o.y)+' z'+r1(o.z),
    'mira  x'+r1(d.x)+' y'+r1(d.y)+' z'+r1(d.z),
    'bola0 y'+r1(balls[0].position.y),
    'tocando '+(sobre<0?'ninguna':('bola '+sobre)),
    'blanca  bola '+lit,
    'pose de '+deDonde
  ]);

  if(sobre!==mirando){
    if(mirando>=0 && balls[mirando]) balls[mirando].material.emissive.setHex(0x000000);
    mirando=sobre; mirandoDesde=performance.now();
  }
  if(mirando<0) return;

  var t=(performance.now()-mirandoDesde)/DWELL_MS;
  if(t>=1){
    var i=mirando;
    balls[i].material.emissive.setHex(0x000000);
    mirando=-1;
    acertar(i);
    return;
  }
  // se va llenando de luz mientras aguantas
  var v=Math.round(t*120);
  balls[mirando].material.emissive.setRGB(v/255,v/255,v/255);
}

function apuntar(ctrl){
  if(ctrl){
    tmpM.identity().extractRotation(ctrl.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).applyMatrix4(tmpM);
  }else{
    // Sin mando se apunta con la cabeza, que es lo que queda en un
    // casco de tres grados de libertad.
    var cam=camaraReal();
    raycaster.ray.origin.setFromMatrixPosition(cam.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).transformDirection(cam.matrixWorld);
  }
  var hit=raycaster.intersectObjects(balls);
  if(hit.length) acertar(hit[0].object.userData.i);
}

/* El casco manda eventos de desplazamiento por su cuenta — del trackpad
   del mando, o de la cabeza — y con esconder la barra no bastaba. Esto
   los corta en seco y, por si alguno se cuela, devuelve la página a cero
   en cada cuadro. */
var dentro=false;
function cortaScroll(e){ if(dentro){ e.preventDefault(); e.stopPropagation(); } }
window.addEventListener('wheel',cortaScroll,{passive:false});
window.addEventListener('touchmove',cortaScroll,{passive:false});
window.addEventListener('scroll',function(){ if(dentro) window.scrollTo(0,0) },{passive:true});

function entrarModo(on){
  dentro=on;
  document.body.classList.toggle('dentro',on);
  document.documentElement.style.overflow = on? 'hidden':'';
  if(on) window.scrollTo(0,0);
}

boton.onclick=function(){
  if(typeof THREE==='undefined'){ nota.textContent='three.js did not load — no network, or blocked.'; return; }
  try{
    if(renderer){                      // ya se montó antes: sólo re-entrar
      navigator.xr.requestSession('immersive-vr',
        {optionalFeatures:['local-floor','bounded-floor','hand-tracking']}
      ).then(function(se){
        renderer.xr.setSession(se);
        se.addEventListener('end',function(){
          entrarModo(false);
          try{ renderer.setAnimationLoop(null) }catch(e){}
          boton.disabled=false; boton.textContent='Enter again';
        });
        renderer.setAnimationLoop(function(t,frame){ if(window.scrollY) window.scrollTo(0,0); mirada(frame); renderer.render(scene,camera) });
        entrarModo(true);
        boton.disabled=true; boton.textContent='You are inside — leave with the back button';
      }).catch(function(e){ nota.textContent='Could not enter: '+e });
      return;
    }
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth,innerHeight);
    renderer.xr.enabled=true;
    document.body.appendChild(renderer.domElement);
    construir();

    navigator.xr.requestSession('immersive-vr',
      {optionalFeatures:['local-floor','bounded-floor','hand-tracking']}
    ).then(function(session){

      // 'local-floor' quiere decir que el casco sabe dónde está el
      // suelo y que te mueves de verdad. 'local' a secas suele ser un
      // casco que sólo gira.
      miSesion=session;
      session.addEventListener('end',function(){ miSesion=null; poseViva=false; colocadas=false; });

      session.requestReferenceSpace('local-floor').then(function(sp){
        miEspacio=sp;
        try{ session.requestAnimationFrame(bucleDelCasco) }catch(e){}
        renderer.xr.setReferenceSpaceType('local-floor');
        alturaOjos(0);               // ya se mide desde el suelo
        celdaSuelo.textContent='yes — six degrees, you move';
        celdaSuelo.className='si';
      }).catch(function(){
        // sin suelo: se pide el de toda la vida
        session.requestReferenceSpace('local').then(function(sp){
          miEspacio=sp;
          try{ session.requestAnimationFrame(bucleDelCasco) }catch(e){}
        }).catch(function(){
          session.requestReferenceSpace('viewer').then(function(sp){
            miEspacio=sp;
            try{ session.requestAnimationFrame(bucleDelCasco) }catch(e){}
          }).catch(function(){});
        });
        renderer.xr.setReferenceSpaceType('local');
        alturaOjos(-1.3);            // los ojos están en el origen
        celdaSuelo.textContent='no — three degrees, it only turns';
        celdaSuelo.className='quiz';
      });

      renderer.xr.setSession(session);

      var ctrls=[];
      for(var c=0;c<2;c++){
        var g=renderer.xr.getController(c);
        g.addEventListener('selectstart',(function(gg){ return function(){ selects++; apuntar(gg) } })(g));
        scene.add(g); ctrls.push(g);
      }
      session.addEventListener('select',function(){ selects++; apuntar(null) });

      session.addEventListener('inputsourceschange',function(){
        var n=0,manos=0;
        session.inputSources.forEach(function(s){ n++; if(s.hand) manos++; });
        celdaMando.textContent = n? (n+' controller'+(n>1?'s':'')+(manos?' + hands':'')) : 'none — aim with your head';
        celdaMando.className = n?'si':'quiz';
      });

      encender();
      renderer.setAnimationLoop(function(t,frame){ if(window.scrollY) window.scrollTo(0,0); mirada(frame); renderer.render(scene,camera) });
      entrarModo(true);
      boton.textContent='You are inside — leave with the back button';
      boton.disabled=true;

      /* Al salir hay que devolver el botón a como estaba. Sin esto, el
         que sale se queda mirando un botón muerto que dice "estás
         dentro" cuando ya no lo está, y la única salida es recargar. */
      session.addEventListener('end', function(){
        try{ renderer.setAnimationLoop(null) }catch(e){}
        entrarModo(false);
        boton.disabled=false;
        boton.textContent='Enter again';
        nota.textContent='You are out. The last two rows now say what was found '+
          'inside. Trigger presses that reached the scene: '+selects+
          (selects? '' : ' — none, so gaze is the only input that works here.');
      });
    }).catch(function(e){
      nota.textContent='Could not enter: '+e;
    });
  }catch(e){
    nota.textContent='Failed to build the scene: '+e;
  }
};
})();
</script>
</body>
</html>
