<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Salida — Cada Punto</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
/* ══════════════════════════════════════════════════════════════════
   FORTRESS, CON LA CABEZA

   La defensa que te quita el mapa. No te roba el balón: te quita el
   poder ver dónde ponerlo. Buscas una salida, la encuentras tarde, y
   para entonces se cerró.

   Y una cosa que hay que decir clara: AQUÍ NO HAY WEBXR. Nada de
   "entrar en VR". El casco que tenemos no le da al navegador ni la
   pose de la cabeza ni dos ojos, así que la sesión inmersiva no
   aportaba nada y era justo la parte que se rompía. Lo que sí
   funciona es el giroscopio, que Android publica por su cuenta. Así
   que esto es una página a pantalla completa que se mira con la
   cabeza. Sin instalar nada, desde un enlace, en los 21 cascos.

   De paso, como no depende del casco, corre igual en un teléfono —
   se mueve el teléfono y se apunta — y en una computadora con el
   ratón. Eso quiere decir que se puede probar sin casco.
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0B1724;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}

/* La portada. Una sola pantalla y un solo botón: en un casco no se
   navega, se empieza. */
#tapa{position:fixed;inset:0;z-index:10;background:#0B1724;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:14px}
#tapa h1{font-size:clamp(1.8rem,7vw,3rem);font-weight:900;letter-spacing:-.02em}
#tapa h1 em{font-style:normal;color:#FF7A18}
#tapa p{color:#C8D6E2;font-size:1rem;max-width:34ch;line-height:1.55}
#tapa small{color:#7F93A6;font-size:.8rem}
#go{background:#FF7A18;color:#0B1724;border:0;border-radius:6px;
  font:inherit;font-weight:900;font-size:1.1rem;padding:16px 30px;cursor:pointer}
#lang{position:fixed;top:12px;right:12px;z-index:11;
  border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<button id="lang">EN</button>

<div id="tapa">
  <h1>Sa<em>lida</em></h1>
  <p id="tapaP"></p>
  <button id="go"></button>
  <small id="tapaS"></small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* Sello a la vista en el panel de dentro. Este navegador se guarda la
   página con ganas y ya nos costó una tarde. SUBIRLO en cada cambio. */
var SELLO='s1';

// ──────────────────────────────────────────────────────────────────
//  IDIOMA
// ──────────────────────────────────────────────────────────────────
var S={
  es:{
    p:'Tú traes el balón. Alguien se destapa, pero sólo por un momento — y no puedes verlos a todos a la vez. Encuéntralo y pásala antes de que se cierre. Si la mandas a uno que está marcado, te la roban.',
    go:'Empezar',
    s:'Se juega con la cabeza. Gira para buscar.',
    busca:'BUSCA',
    pases:'pases',
    reloj:'reloj',
    robada:'TE LA ROBARON',
    atrapado:'TE ATRAPARON',
    fin:'Pases seguidos',
    otra:'Mira aquí para otra',
    puntos:'puntos'
  },
  en:{
    p:'You bring the ball up. Someone gets open, but only for a moment — and you cannot see them all at once. Find him and pass before it closes. Pass to a covered man and it is stolen.',
    go:'Start',
    s:'You play with your head. Turn to look.',
    busca:'FIND HIM',
    pases:'passes',
    reloj:'clock',
    robada:'STOLEN',
    atrapado:'TRAPPED',
    fin:'Passes in a row',
    otra:'Look here to play again',
    puntos:'points'
  }
};
var LANG='es';
try{ LANG=localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en') }catch(e){}
function T(k){ return (S[LANG]&&S[LANG][k])||S.es[k] }
function pintarTapa(){
  document.documentElement.lang=LANG;
  document.getElementById('lang').textContent=LANG==='es'?'EN':'ES';
  document.getElementById('tapaP').textContent=T('p');
  document.getElementById('go').textContent=T('go');
  document.getElementById('tapaS').textContent=T('s');
}
document.getElementById('lang').onclick=function(){
  LANG=LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG);localStorage.setItem('cp-lang',LANG) }catch(e){}
  pintarTapa();
};
pintarTapa();

// ══════════════════════════════════════════════════════════════════
//  LA ZONA SE MUEVE COMO SE MUEVE DE VERDAD
//
//  El 2-1-2: dos arriba (0 y 1), uno en el medio (2), dos abajo (3 y 4).
//  El balón pasa al de al lado o al del medio; lo único que no pasa
//  nunca es el salto en diagonal. Y la primera bola sale de arriba,
//  donde sube el balón. Igual que en fortress.html, para que una
//  cadena signifique lo mismo en los dos sitios.
// ══════════════════════════════════════════════════════════════════
var ROTATION={ 0:[1,2,3], 1:[0,2,4], 2:[0,1,3,4], 3:[0,2,4], 4:[1,2,3] };
var BALL_UP=[0,1];
function nextInRotation(prev){
  if(prev===undefined||prev===null) return BALL_UP[Math.floor(Math.random()*BALL_UP.length)];
  var opts=ROTATION[prev]||[0,1,2,3,4];
  return opts[Math.floor(Math.random()*opts.length)];
}

// Puntos triangulares: llegar a 7 vale mucho más que siete veces 1.
function pointsFor(level){ return level>0 ? (level*(level+1))/2 : 0 }

// Las notas de corneta. La posición manda, no el color: una esquina
// canta siempre la misma nota, que es lo que convierte un patrón en
// una tonada. 110 × 2,3,4,5,6 — serie armónica, sin choques.
var TONES=[220,330,440,550,660];
var audioCtx=null;
function abrirAudio(){
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){}
}
function playTone(i){
  if(!audioCtx)return;
  var f=TONES[i%TONES.length], now=audioCtx.currentTime;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(f,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.3,now+0.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+0.30);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+0.32);
  }catch(e){}
}
function playThump(){
  if(!audioCtx)return;
  var now=audioCtx.currentTime;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(90,now);
    o.frequency.exponentialRampToValueAtTime(42,now+0.13);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.45,now+0.008);
    g.gain.exponentialRampToValueAtTime(.0001,now+0.16);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+0.18);
  }catch(e){}
}

// ──────────────────────────────────────────────────────────────────
//  LA ESCENA
// ──────────────────────────────────────────────────────────────────
var scene,camera,renderer,raycaster;
var balls=[],panelMesh,panelCtx,panelTex;
var OJO=1.55;                       // altura de los ojos, de pie

/* Las cinco posiciones del 2-1-2, puestas donde se ven de un vistazo
   girando la cabeza y no el cuerpo: las de arriba a los lados, la del
   medio al frente y un poco baja, las de abajo más abiertas y más
   cerca. Las coordenadas son lo que se ve, no un plano a escala. */
/* ══════════════════════════════════════════════════════════════════
   LOS CINCO, REPARTIDOS MÁS ANCHO QUE LA VISTA

   Aquí está la diferencia con Fortress, y es toda la diferencia. En
   Fortress las cinco caben delante: se ven de un vistazo y el trabajo
   es acordarse. Aquí NO CABEN. Van en un arco de doscientos grados, y
   el casco enseña unos setenta — o sea que en cualquier momento ves
   dos, como mucho tres, y los demás están donde no estás mirando.

   Eso no es una limitación del casco que haya que disimular: ES EL
   JUEGO. El que se destapa puede estar a tu espalda, y mientras lo
   buscas se cierra. En una pantalla plana se ven los cinco a la vez y
   esto no se puede sentir — por eso Salida sólo existe aquí.

        0                                        4
             1                            3
                          2
                        (tú)
   ══════════════════════════════════════════════════════════════════ */
var GRADOS_SALIDA=[-95,-48,0,48,95];
var POS=(function(){
  var R=5.5, p=[];
  for(var i=0;i<5;i++){
    var a=GRADOS_SALIDA[i]*Math.PI/180;
    // Todos a la altura de los ojos: así se alcanzan girando, que es
    // lo que todo casco de tres grados sabe hacer.
    p.push([R*Math.sin(a), 1.55, -R*Math.cos(a)]);
  }
  return p;
})();
var RADIO=0.42;   // más lejos, así que más grandes

function construir(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0B1724);
  scene.fog=new THREE.Fog(0x0B1724, 10, 20);

  /* 68 y no 75: con el ángulo muy abierto las bolas de los lados se
     estiran en óvalos contra el borde de la pantalla y parecen otra
     cosa. */
  camera=new THREE.PerspectiveCamera(80, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,OJO,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xbfe3ff,0x16222f,0.95));
  var key=new THREE.DirectionalLight(0xffffff,0.55);
  key.position.set(2,6,1); scene.add(key);

  dibujarCancha();

  /* Las bolas. Naranja Cada Punto; la luz propia (emissive) es la que
     sube mientras aguantas la vista, así que empieza apagada. */
  var geo=new THREE.SphereGeometry(RADIO,28,20);
  for(var i=0;i<5;i++){
    var mat=new THREE.MeshStandardMaterial({
      color:0xFF7A18, roughness:.45, metalness:.05, emissive:0x000000
    });
    var m=new THREE.Mesh(geo,mat);
    m.position.set(POS[i][0],POS[i][1],POS[i][2]);
    m.userData.i=i;
    scene.add(m); balls.push(m);
  }

  colocarBolas();
  hacerPanel();
  hacerPunto();
  raycaster=new THREE.Raycaster();
  /* Un pelo de margen: con la cabeza no se apunta tan fino como con el
     dedo, y una bola que se escapa por dos grados se siente como un
     fallo del juego y no del nene. */
  raycaster.params.Points.threshold=0.1;

  addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

/* Algo debajo y detrás, para que las bolas estén EN un sitio. Sin esto
   son cinco puntos flotando en negro y se pierde la idea de la zona:
   el suelo y las líneas son la mitad de lo que se está entrenando. */
/* Las bolas van a un sitio o a otro según lo que dé el casco, y se
   pueden recolocar cuando la medida conteste. */
function colocarBolas(){
  for(var i=0;i<balls.length;i++) balls[i].position.set(POS[i][0],POS[i][1],POS[i][2]);
}

function dibujarCancha(){
  var suelo=new THREE.Mesh(
    new THREE.PlaneGeometry(26,26),
    new THREE.MeshStandardMaterial({color:0x123047, roughness:.95})
  );
  suelo.rotation.x=-Math.PI/2;
  scene.add(suelo);

  var tinta=new THREE.LineBasicMaterial({color:0x2E5C7E});
  function linea(pts){
    var g=new THREE.BufferGeometry().setFromPoints(
      pts.map(function(p){ return new THREE.Vector3(p[0],0.02,p[1]) }));
    scene.add(new THREE.Line(g,tinta));
  }
  // La botella y el fondo, lo justo para leer dónde estás.
  linea([[-2.45,-7.6],[2.45,-7.6],[2.45,-2.2],[-2.45,-2.2],[-2.45,-7.6]]);
  linea([[-7.5,-7.6],[7.5,-7.6]]);
  // El semicírculo del tiro libre.
  var arco=[];
  for(var a=0;a<=Math.PI;a+=Math.PI/24) arco.push([Math.cos(a)*1.8,-2.2+Math.sin(a)*1.8]);
  linea(arco);

  /* El aro, detrás y arriba: da el "hacia dónde" que convierte cinco
     posiciones en una zona con frente y fondo. */
  var aro=new THREE.Mesh(
    new THREE.TorusGeometry(0.52,0.04,10,36),
    new THREE.MeshStandardMaterial({color:0xE8622A, roughness:.5})
  );
  aro.rotation.x=Math.PI/2;
  aro.position.set(0,4.55,-8.6);
  scene.add(aro);
  var tablero=new THREE.Mesh(
    new THREE.PlaneGeometry(2.2,1.3),
    new THREE.MeshStandardMaterial({color:0xDCE8F2, roughness:.8,
      transparent:true, opacity:.13})
  );
  tablero.position.set(0,5.05,-9.0);
  scene.add(tablero);
}

/* El panel. Es texto dentro de la escena porque el HTML de fuera no se
   ve con el casco puesto. Grande y en monoespaciada: se lee de un
   vistazo y sin enfocar. */
function hacerPanel(){
  var c=document.createElement('canvas');
  c.width=768; c.height=320;
  panelCtx=c.getContext('2d');
  panelTex=new THREE.CanvasTexture(c);
  panelMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(2.0,0.84),
    new THREE.MeshBasicMaterial({map:panelTex, transparent:true})
  );
  panelMesh.position.set(0, OJO-1.08, -2.25);
  panelMesh.rotation.x=0.42;
  scene.add(panelMesh);
}
/* ══════════════════════════════════════════════════════════════════
   EL PUNTO DE MIRA

   Faltaba esto y por eso el juego parecía muerto: con la cabeza no se
   ve dónde se está apuntando. El rayo sale del centro de la vista,
   pero el centro de la vista no está dibujado en ningún sitio, así que
   acertar una bola era cuestión de suerte y parecía que no respondía.

   Dos piezas: un aro fino siempre visible, que dice dónde estás
   apuntando, y dentro un disco que se va llenando mientras aguantas la
   vista — el tiempo que falta para que cuente. Va colgado de la
   cámara, así que se queda clavado en el centro mire uno donde mire.
   ══════════════════════════════════════════════════════════════════ */
var punto, puntoRelleno;
function hacerPunto(){
  punto=new THREE.Mesh(
    new THREE.RingGeometry(0.013,0.017,28),
    new THREE.MeshBasicMaterial({color:0xFFFFFF, transparent:true, opacity:.75,
      depthTest:false})
  );
  punto.position.set(0,0,-1);
  punto.renderOrder=999;
  camera.add(punto);

  puntoRelleno=new THREE.Mesh(
    new THREE.CircleGeometry(0.011,28),
    new THREE.MeshBasicMaterial({color:0x6FD83C, transparent:true, opacity:.95,
      depthTest:false})
  );
  puntoRelleno.position.set(0,0,-1);
  puntoRelleno.renderOrder=1000;
  puntoRelleno.scale.setScalar(0.001);
  camera.add(puntoRelleno);

  // La cámara tiene hijos, así que tiene que estar en la escena.
  scene.add(camera);
}
/* t va de 0 a 1 mientras se aguanta la vista; -1 quiere decir que no
   hay nada debajo del punto. */
/* Con la cabeza, el rayo sale del centro de la vista y el punto está
   en el centro: coinciden sin hacer nada. Con el ratón o el dedo no —
   el rayo va donde está el puntero y el punto se quedaría clavado en
   el medio, enseñando una puntería que no es la de verdad. Como las
   pruebas sin casco se hacen así, el punto se mueve con el puntero. */
function ponerPuntoEnPuntero(){
  if(!punto) return;
  var mediaAlto=Math.tan(camera.fov*GRADO/2);
  var mediaAncho=mediaAlto*camera.aspect;
  var x=punteroX*mediaAncho, y=punteroY*mediaAlto;
  punto.position.set(x,y,-1);
  puntoRelleno.position.set(x,y,-1);
}
function pintarPunto(t, sobreBola){
  if(!punto) return;
  punto.material.opacity = sobreBola ? 1 : .5;
  punto.scale.setScalar(sobreBola ? 1.35 : 1);
  puntoRelleno.scale.setScalar(t>0 ? Math.max(0.001, t) : 0.001);
}

/* En abanico uno juega girado hasta 36 grados, así que el panel fijo
   al frente se queda fuera de la vista — y con él el "mírame para
   jugar otra vez", que entonces no hay manera de alcanzar. Al acabar
   una tirada el panel se pone donde esté mirando. */
function ponerPanelDelante(){
  if(!panelMesh) return;
  var f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  f.y=0;
  if(f.lengthSq()<1e-6) f.set(0,0,-1);
  f.normalize();
  panelMesh.position.set(f.x*2.25, OJO-1.08, f.z*2.25);
  panelMesh.rotation.set(0.42, Math.atan2(-f.x,-f.z), 0, 'YXZ');
}

function pintarPanel(grande, chica, color){
  if(!panelCtx) return;
  panelCtx.clearRect(0,0,768,320);
  panelCtx.fillStyle='rgba(5,14,24,.82)';
  panelCtx.fillRect(0,0,768,320);
  panelCtx.textAlign='center';
  panelCtx.fillStyle=color||'#6FD83C';
  panelCtx.font='bold 92px Archivo, monospace';
  panelCtx.fillText(grande||'',384,150);
  panelCtx.fillStyle='#9FB3C4';
  panelCtx.font='bold 42px monospace';
  panelCtx.fillText(chica||'',384,232);
  panelCtx.fillStyle='#44586B';
  panelCtx.font='26px monospace';
  panelCtx.fillText(SELLO+'   '+crudo,384,296);

  panelTex.needsUpdate=true;
}

// ══════════════════════════════════════════════════════════════════
//  LA CABEZA
//
//  El giroscopio por debajo de WebXR: deviceorientation, como en la
//  época del Cardboard. Da giro y no posición, que para esto es todo
//  lo que hace falta.
//
//  Y su cero es hacia donde apuntaba el casco al despertar, que puede
//  ser la pared de atrás. Por eso hay una cuenta al empezar: durante
//  esos segundos el frente va siguiendo a la cabeza, y al acabar queda
//  donde estés mirando.
// ══════════════════════════════════════════════════════════════════
var GRADO=Math.PI/180;
var giroVivo=false, girosN=0;
var crudoA=0, crudoB=0, crudoG=0, crudo='-';

/* ══════════════════════════════════════════════════════════════════
   EL BASE: SE MIDE LA CABEZA, NO SE ADIVINA

   Cinco intentos con el punto de mira y los cinco fallados. Pero el
   punto nunca tuvo la culpa: está clavado en el centro y lo que gira
   es el mundo, así que cuando el mundo gira mal, el que parece roto
   es el punto.

   Lo que fallaba es de dónde salía ese giro. La cuenta de siempre
   (alfa, beta, gamma → cuaternión, más una corrección por cómo está
   puesta la pantalla) da por buenas unas convenciones que este
   navegador de 2020 no cumple: dice que la pantalla está de pie
   cuando en el casco está apaisada. Con eso, el cabeceo se va al eje
   del balanceo — miras arriba y el mundo se tuerce — y no hay manera
   de acertar desde fuera cuál de las cuatro correcciones es.

   Así que no se adivina: se MIDE, en el casco, una vez.

     1. Mira al frente       →  el cero
     2. Mira arriba          →  cuál de los tres números es el cabeceo,
                                y hacia dónde crece
     3. Mira a la izquierda  →  hacia dónde crece el giro

   Con eso se arma el giro a mano: guiñada y cabeceo, y el balanceo
   SIEMPRE a cero. Eso último es la mitad del arreglo — un casco de
   tres grados no necesita inclinar el horizonte, y era justo lo que
   hacía que esto se sintiera a la deriva.

   Y se guarda. Cada casco se mide una vez y ya: los otros veinte se
   configuran solos la primera vez que alguien se los pone.
   ══════════════════════════════════════════════════════════════════ */

// Lo medido. Si ya está guardado, no se vuelve a preguntar.
var ejeCabeceo='beta', signoCabeceo=1, signoGiro=1, hayCabeceo=true;
var ceroGiro=0, ceroCabeceo=0, calHecha=false;
try{
  var gg=JSON.parse(localStorage.getItem('fvr-cal')||'null');
  if(gg && gg.e){ ejeCabeceo=gg.e; signoCabeceo=gg.s; signoGiro=gg.g;
                  hayCabeceo=(gg.c!==false); calHecha=true }
}catch(e){}
function guardarCal(){
  try{ localStorage.setItem('fvr-cal',
    JSON.stringify({e:ejeCabeceo,s:signoCabeceo,g:signoGiro,c:hayCabeceo})) }catch(e){}
}
/* Para volver a medir sin tener que borrar nada: ?medir en la
   dirección. Útil cuando un casco viene de otra persona. */
try{ if(/[?&]medir/.test(location.search)) calHecha=false }catch(e){}

// Diferencia de ángulos por el camino corto, que alfa da la vuelta en 360.
function difAng(a,b){
  var d=(a-b)%360;
  if(d>180) d-=360;
  if(d<-180) d+=360;
  return d;
}
function valorCabeceo(){ return ejeCabeceo==='beta' ? crudoB : crudoG }

function alLlegarElGiro(ev){
  if(ev.alpha===null||ev.alpha===undefined) return;
  crudoA=ev.alpha; crudoB=ev.beta; crudoG=ev.gamma;
  if(!giroVivo && !calHecha && fase!=='tapa' && !medir.activo) arrancarMedida=true;
  giroVivo=true; girosN++;
  crudo=Math.round(crudoA)+' '+Math.round(crudoB)+' '+Math.round(crudoG);
}
try{
  addEventListener('deviceorientationabsolute', alLlegarElGiro, true);
  addEventListener('deviceorientation', alLlegarElGiro, true);
}catch(e){}

/* ── La medición, de tres pasos ──────────────────────────────────── */
var PASO_MS=2300;
var medir={activo:false, paso:0, t0:0, a0:0, b0:0, g0:0};
var arrancarMedida=false;
function empezarMedida(){
  medir.activo=true; medir.paso=0; medir.t0=performance.now();
}
function textoMedida(){
  var n=['1','2','3'][medir.paso]||'';
  var q=Math.max(0,Math.ceil((PASO_MS-(performance.now()-medir.t0))/1000));
  if(medir.paso===0) return [LANG==='es'?'MIRA AL FRENTE':'LOOK STRAIGHT AHEAD', n+'/3   '+q+'    '+crudo];
  if(medir.paso===1) return [LANG==='es'?'MIRA ARRIBA':'LOOK UP', n+'/3   '+q+'    '+crudo];
  return [LANG==='es'?'MIRA A LA IZQUIERDA':'LOOK LEFT', n+'/3   '+q+'    '+crudo];
}
function pasoDeMedida(){
  if(performance.now()-medir.t0 < PASO_MS) return;
  if(medir.paso===0){
    medir.a0=crudoA; medir.b0=crudoB; medir.g0=crudoG;
  }else if(medir.paso===1){
    /* Cuál de los dos se movió al mirar arriba, y hacia dónde. Y antes
       de eso, la pregunta que llevábamos sin hacer: ¿SE MOVIÓ ALGUNO?
       Hay cascos de tres grados cuyo navegador publica el giro y nada
       más — ni cabeceo ni balanceo. Si es el caso, no hay corrección
       que valga y seguir buscándola es perder la tarde. Se dice y se
       juega de otra manera. */
    var dB=difAng(crudoB,medir.b0), dG=difAng(crudoG,medir.g0);
    var mayor=Math.max(Math.abs(dB),Math.abs(dG));
    if(mayor<6){
      hayCabeceo=false;                 // este casco sólo gira
    }else{
      hayCabeceo=true;
      if(Math.abs(dB)>=Math.abs(dG)){ ejeCabeceo='beta';  signoCabeceo = dB>0?1:-1 }
      else                          { ejeCabeceo='gamma'; signoCabeceo = dG>0?1:-1 }
    }
  }else{
    // Hacia dónde crece alfa al girar a la izquierda. En three.js,
    // girar a la izquierda es Y positiva.
    var dA=difAng(crudoA,medir.a0);
    signoGiro = dA>0 ? 1 : -1;
    ceroGiro=medir.a0;
    ceroCabeceo = (ejeCabeceo==='beta') ? medir.b0 : medir.g0;
    calHecha=true; guardarCal();
    colocarBolas();          // la cancha se adapta a lo que dé el casco
    medir.activo=false;
    /* NADA de cuenta de centrado después de medir. El paso 1 ya fue
       "mira al frente": ese es el cero y ya está tomado. Encadenar
       luego una cuenta era pedir el mismo dato dos veces, y además la
       cuenta vieja — la que arrancó al pulsar Empezar, antes de que
       hubiera sensor — caducaba justo al acabar la medida y cogía como
       frente el último paso, que es MIRAR A LA IZQUIERDA. El frente
       quedaba 35 grados torcido. Un dato, una vez, del paso que lo
       midió. */
    centrando=0;
    temporizadores.push(setTimeout(siguienteNivel, 700));
    return;
  }
  medir.paso++; medir.t0=performance.now();
}

/* Poner el frente donde está la cara: el cero pasa a ser lo que marca
   el sensor ahora mismo. */
function recentrar(){
  if(!giroVivo) return false;
  ceroGiro=crudoA; ceroCabeceo=valorCabeceo();
  return true;
}

var CENTRADO_MS=3500, centrando=0;
function empezarCentrado(){ centrando=performance.now() }

/* Perderse tiene salida y no hace falta mando — en este casco el
   gatillo no llega a la página. Unos segundos sin tocar ninguna bola y
   se centra otra vez sola. Jugando no salta, porque jugando se mira a
   las bolas. */
var PERDIDO_MS=8000, sinBolaDesde=0;

/* Sin giroscopio (una computadora, o un casco que no lo publique) se
   apunta con el ratón o el dedo. Así esto se puede probar sin casco,
   que es media hora menos cada vez que hay que mirar algo. */
var punteroX=0, punteroY=0, hayPuntero=false;
function alMoverPuntero(x,y){
  punteroX=(x/innerWidth)*2-1;
  punteroY=-(y/innerHeight)*2+1;
  hayPuntero=true;
}
addEventListener('mousemove',function(e){ alMoverPuntero(e.clientX,e.clientY) });
addEventListener('touchmove',function(e){
  if(e.touches&&e.touches[0]) alMoverPuntero(e.touches[0].clientX,e.touches[0].clientY);
  e.preventDefault();
},{passive:false});

var dirMirada=new THREE.Vector3(0,0,-1);
var eulerVista=new THREE.Euler();
function ponerRayo(){
  if(giroVivo && calHecha){

    /* Guiñada y cabeceo, cada uno de su número medido, y el balanceo a
       cero SIEMPRE. El horizonte no se tuerce nunca: un casco que sólo
       gira no tiene por qué inclinar el mundo, y era eso lo que hacía
       que la puntería se sintiera a la deriva. */
    var gir = signoGiro   * difAng(crudoA, ceroGiro)        * GRADO;
    var cab = hayCabeceo
      ? signoCabeceo * difAng(valorCabeceo(), ceroCabeceo) * GRADO
      : 0;   // este casco no da arriba/abajo: ni se intenta
    // Sin esto, un tropiezo del sensor te manda boca abajo.
    if(cab> 1.30) cab= 1.30;
    if(cab<-1.30) cab=-1.30;

    eulerVista.set(cab, gir, 0, 'YXZ');
    camera.quaternion.setFromEuler(eulerVista);

    dirMirada.set(0,0,-1).applyQuaternion(camera.quaternion).normalize();
    raycaster.ray.origin.set(0,OJO,0);
    raycaster.ray.direction.copy(dirMirada);
    return 'giro';
  }
  if(hayPuntero){
    /* Sin giroscopio el puntero NO mueve un cursor: mueve la cabeza.
       Tiene que ser así, porque los cinco están repartidos más ancho
       que la vista — con un cursor sólo se alcanza al del medio y los
       otros cuatro quedan fuera para siempre. Probado: con cursor se
       completaba UN pase y se acababa el reloj.
       Así el ratón y el casco se juegan igual: el punto de mira
       siempre en el centro, y el mundo girando detrás. */
    var girP = -punteroX * 105 * GRADO;   // a los lados, como el arco
    var cabP =  punteroY * 28  * GRADO;
    eulerVista.set(cabP, girP, 0, 'YXZ');
    camera.quaternion.setFromEuler(eulerVista);
    dirMirada.set(0,0,-1).applyQuaternion(camera.quaternion).normalize();
    raycaster.ray.origin.set(0,OJO,0);
    raycaster.ray.direction.copy(dirMirada);
    return 'puntero';
  }
  /* NI GIROSCOPIO NI PUNTERO TODAVÍA.
     Esto no es un caso raro: es el primer instante de cada partida, y
     en el casco dura hasta que llega la primera lectura del sensor.
     El rayo recto desde los ojos cae justo encima del hombre del
     medio, así que si se dejara apuntar, el juego pasaría solo en
     cuanto ése se destapara. Mientras no haya una mirada de verdad,
     no se apunta a nada. */
  raycaster.ray.origin.set(0,OJO,0);
  raycaster.ray.direction.set(0,1,0);
  return 'quieto';
}

// ══════════════════════════════════════════════════════════════════
//  EL JUEGO: ENCONTRAR LA SALIDA
//
//  Esto no es acordarse. Es BUSCAR, con el reloj corriendo y sin
//  poder ver toda la cancha.
//
//  Uno de los cinco se destapa. No sabes cuál hasta que lo encuentras,
//  y no puedes verlos a todos a la vez — así que giras. Mientras
//  giras, la ventana se cierra. Si la pasas al que estaba abierto,
//  sigues y el reloj te devuelve un poco de aire. Si la mandas a uno
//  marcado, te la roban. Si no la pasas a tiempo, te atrapan.
//
//  Dos cosas la hacen aprendible en vez de cruel:
//
//  1. El balón sólo va a ciertos sitios desde donde está — las mismas
//     rotaciones del 2-1-2. El que aprende por dónde sale el balón
//     mira primero donde debe, y encuentra antes. El que no, gira a
//     ciegas. Esa diferencia es el producto entero.
//
//  2. Al principio te llaman: el que se destapa toca su nota. Eso
//     enseña dónde está cada uno sin tener que explicarlo. Pasados
//     unos cuantos pases dejan de llamarte y hay que verlo. Es el
//     momento en que el juego se vuelve el de verdad.
// ══════════════════════════════════════════════════════════════════
/* DOS TIEMPOS, Y LA DIFERENCIA ES EL JUEGO.

   Primer intento: un solo tiempo para todos. La prueba lo tumbó en
   cuatro segundos — para BUSCAR hay que girar, girar pasa la mirada
   por encima de los que están marcados, y a medio segundo cada uno
   se la robaba. O sea que mirar, que es lo único que este juego pide,
   era perder. Imposible de ver sin probarlo.

   Al que está destapado se la pasas rápido: medio segundo, porque
   verlo ya fue el trabajo. Al que está marcado hace falta quedarse
   MUCHO más — así un barrido no cuenta, pero plantarse delante de un
   hombre marcado y mandársela sí, que eso es un error de verdad y
   tiene que doler. */
var DWELL_MS=520;              // al destapado: verlo ya fue el trabajo
var DWELL_MARCADO=1150;        // al marcado: un barrido no, una decisión sí
var VENTANA_MAX=2400;          // lo que un hombre aguanta abierto, al principio
var VENTANA_MIN=900;
var RELOJ_INICIO=10.0;         // segundos de posesión
var RELOJ_PREMIO=1.5;          // lo que devuelve cada pase completado
var CALLAN_DESDE=8;            // a partir de aquí ya no te llaman

var fase='tapa';               // tapa | juego | fin
var bolaEn=2;                  // dónde está el balón ahora
var abierto=-1, abiertoDesde=0, ventana=VENTANA_MAX;
var pases=0, reloj=RELOJ_INICIO, ultimoCuadro=0;
var comoAcabo='';              // 'robada' | 'atrapado'
var mirando=-1, mirandoDesde=0, bloqueada=-1;

/* ARMAR LA MIRADA — otra vez, y por las dos razones a la vez.

   Al arrancar la posesión, lo que ya tuvieras debajo llevaba segundos
   ahí parado: la cuenta estaba cumplida desde antes de empezar y la
   bola salía sola, sin que nadie decidiera. (Pasó igual en Fortress y
   costó dos intentos verlo.)

   El primer arreglo fue poner la cuenta a cero cada vez que alguien se
   destapaba — y eso tapó un agujero abriendo otro: como las ventanas
   se cierran cada dos segundos y pico, quedarse mirando fijo a un
   hombre MARCADO casi nunca llegaba a costar nada. Y mandársela a uno
   marcado tiene que doler, que es media lección del juego.

   Lo que sirve es más sencillo: la mirada se arma en cuanto se MUEVE.
   Mientras no te hayas movido desde que empezó la posesión, no se pasa
   nada; en cuanto buscas, ya cuenta todo normal — y la cuenta sólo se
   reinicia al cambiar de hombre, así que plantarse delante de un
   marcado sí se acumula y sí se paga. */
var armado=false;
var temporizadores=[];
var mejor=0;
try{ mejor=parseInt(localStorage.getItem('salida-best')||'0',10)||0 }catch(e){}

function limpiarT(){ temporizadores.forEach(clearTimeout); temporizadores=[] }

/* Marcado: apagado y algo encogido. Abierto: verde y crecido — se ve
   de reojo, que es como se ve a un compañero destapado. */
function pintarHombres(){
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(i===abierto){
      b.material.emissive.setHex(0x1E7A2E);
      b.material.color.setHex(0x7CE86B);
      b.scale.setScalar(1.22);
    }else{
      b.material.emissive.setHex(0x000000);
      b.material.color.setHex(0x8A5A33);   // marcado: apagado, de barro
      b.scale.setScalar(0.92);
    }
  }
}

/* Quién puede recibir desde donde está el balón. Las mismas
   rotaciones: nunca la diagonal, nunca a sí mismo. */
function abrirOtro(){
  var opciones=ROTATION[bolaEn]||[0,1,2,3,4];
  var antes=abierto;
  var e=opciones[Math.floor(Math.random()*opciones.length)];
  // Que no se repita el mismo dos veces seguidas: parecería que nunca
  // se cerró y el nene no aprende a buscar.
  if(e===antes && opciones.length>1){
    var otras=opciones.filter(function(x){ return x!==antes });
    e=otras[Math.floor(Math.random()*otras.length)];
  }
  abierto=e;
  abiertoDesde=performance.now();
  pintarHombres();
  // Te llaman... hasta que dejan de llamarte.
  if(pases<CALLAN_DESDE) playTone(abierto);
}

function empezarTirada(){
  limpiarT();
  pases=0; reloj=RELOJ_INICIO; comoAcabo='';
  bolaEn=BALL_UP[Math.floor(Math.random()*BALL_UP.length)];
  abierto=-1; mirando=-1; bloqueada=-1;
  ventana=VENTANA_MAX;
  ultimoCuadro=performance.now();
  fase='juego';

  /* Si este casco no se ha medido nunca, primero se mide. Ocho
     segundos, una sola vez en la vida del casco. */
  if(!calHecha && giroVivo){ empezarMedida(); return }
  empezarCentrado();
  temporizadores.push(setTimeout(siguienteNivel, CENTRADO_MS+400));
}

/* El nombre lo hereda de Fortress porque la medición lo llama al
   acabar; aquí quiere decir "arranca la posesión". */
function siguienteNivel(){
  if(fase!=='juego') return;
  ultimoCuadro=performance.now();
  reloj=RELOJ_INICIO;
  armado=false;             // hasta que la mirada se mueva, no se pasa
  abrirOtro();
}

function pasar(i){
  if(i===abierto){
    playThump(); playTone(i);
    pases++;
    bolaEn=i;
    reloj=Math.min(RELOJ_INICIO, reloj+RELOJ_PREMIO);
    // Cada pase cierra un poco más la siguiente ventana.
    ventana=Math.max(VENTANA_MIN, VENTANA_MAX-pases*110);
    abrirOtro();
  }else{
    comoAcabo='robada';
    acabar();
  }
}

function acabar(){
  if(fase==='fin') return;
  fase='fin'; limpiarT();
  if(pases>mejor){ mejor=pases; try{ localStorage.setItem('salida-best',String(mejor)) }catch(e){} }
  abierto=-1; mirando=-1;
  pintarHombres();
  ponerPanelDelante();
}

// ──────────────────────────────────────────────────────────────────
//  EL BUCLE
// ──────────────────────────────────────────────────────────────────
function bucle(){
  requestAnimationFrame(bucle);
  if(!renderer) return;

  if(arrancarMedida){ arrancarMedida=false; limpiarT(); empezarMedida() }
  if(medir.activo){
    var tx=textoMedida();
    pintarPanel(tx[0], tx[1], '#FFC247');
    pasoDeMedida();
    renderer.render(scene,camera);
    return;
  }

  var fuente=ponerRayo();

  if(centrando){
    var queda=Math.ceil((CENTRADO_MS-(performance.now()-centrando))/1000);
    if(queda<=0){ recentrar(); centrando=0 }
    else{
      pintarPanel(LANG==='es'?'CENTRANDO':'CENTERING',
                  (LANG==='es'?'mira al frente':'look straight ahead')+'  '+queda, '#FFC247');
      renderer.render(scene,camera);
      return;
    }
  }

  var hit = fuente==='quieto' ? [] : raycaster.intersectObjects(balls);
  var sobre = hit.length ? hit[0].object.userData.i : -1;

  if(fase==='fin'){
    pintarPanel(String(pases),
      (comoAcabo==='robada'?T('robada'):T('atrapado'))+'  ·  '+
      pointsFor(pases)+' '+T('puntos'), '#C2261B');
    // Mirar el panel un rato empieza otra.
    if(sobre<0 && fuente!=='quieto'){
      var pp=raycaster.intersectObject(panelMesh);
      if(pp.length){
        if(!mirandoDesde) mirandoDesde=performance.now();
        else if(performance.now()-mirandoDesde>1200){ mirandoDesde=0; empezarTirada() }
      }else mirandoDesde=0;
    }
    pintarPunto(-1, false);
    renderer.render(scene,camera);
    return;
  }

  /* El reloj corre de verdad, en segundos, no en cuadros: en un casco
     lento iría más despacio y el juego sería más fácil por ser peor el
     aparato, que es la clase de injusticia que no se nota y arruina
     una puntuación. */
  var ahora=performance.now();
  var dt=(ahora-ultimoCuadro)/1000;
  ultimoCuadro=ahora;
  if(fase==='juego' && abierto>=0){
    reloj-=dt;
    if(reloj<=0){ reloj=0; comoAcabo='atrapado'; acabar();
                  renderer.render(scene,camera); return }
    // La ventana se cierra sola: se destapa otro y el anterior ya no.
    if(ahora-abiertoDesde>ventana) abrirOtro();
  }

  // Soltar la que se acaba de pasar la desbloquea.
  if(sobre!==bloqueada) bloqueada=-1;
  if(sobre!==mirando){
    mirando=sobre; mirandoDesde=ahora;
    armado=true;            // se movió: ya es una decisión suya
  }

  var prog=-1;
  if(armado && mirando>=0 && mirando!==bloqueada && abierto>=0){
    var cuanto = (mirando===abierto) ? DWELL_MS : DWELL_MARCADO;
    var t=(ahora-mirandoDesde)/cuanto;
    if(t>=1){
      var i=mirando;
      mirando=-1; bloqueada=i; prog=-1;
      pasar(i);
    }else prog=t;
  }
  pintarPunto(prog, sobre>=0);

  /* El panel dice lo justo: cuántos llevas y cuánto aire queda. Nada
     de decirte dónde mirar — eso es el juego. */
  /* El panel va pegado a la vista, no clavado en la cancha. En
     Fortress daba igual — se juega de frente. Aquí te pasas la
     partida girando, y un reloj que desaparece en cuanto buscas a la
     izquierda no sirve de nada: lo que más aprieta es justo lo que
     dejabas de ver. */
  ponerPanelDelante();

  var segs=Math.max(0,reloj).toFixed(1);
  var color = reloj<3 ? '#C2261B' : (reloj<6 ? '#FFC247' : '#6FD83C');
  pintarPanel(String(pases), T('busca')+'   ·   '+T('reloj')+' '+segs, color);

  renderer.render(scene,camera);
}

// ──────────────────────────────────────────────────────────────────
//  ARRANQUE
// ──────────────────────────────────────────────────────────────────
document.getElementById('go').onclick=function(){
  if(typeof THREE==='undefined'){
    document.getElementById('tapaP').textContent=
      'three.js did not load — no network, or blocked.';
    return;
  }
  abrirAudio();                       // el audio sólo abre con un toque
  document.getElementById('tapa').style.display='none';
  document.getElementById('lang').style.display='none';
  if(!renderer){ construir(); bucle() }
  /* A pantalla completa si se puede: en el casco quita la barra del
     navegador, que se come un trozo de la vista. */
  try{ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen() }catch(e){}
  empezarTirada();
};
})();
</script>
